<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyss:DUEL - Connexion</title>
    <link rel="stylesheet" href="static/style_yugiquiz.css">
</head>
<body>
    
    <header>
        <a class="back" href="http://localhost:8000/" title="Retour à Abyss" aria-label="Retour à Abyss">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
        </a>
        <h1>
            <span class="title-main">Abyss:DUEL</span>
            <span class="title-sub">Connexion</span>
        </h1>
    </header>
    
    <div class="container">
        <div class="login-card">
            <div class="card-border-glow"></div>
            <div class="card-content">
                <div class="icon-container">
                    <div class="millennium-symbol">
                        <div class="eye-center"></div>
                    </div>
                </div>
                
                <div class="input-wrapper">
                    <label for="username-input" class="input-label">Pseudo du Duelliste</label>
                    <input 
                        type="text" 
                        maxlength="10" 
                        id="username-input" 
                        class="user-input" 
                        placeholder="Entrez votre pseudo"
                        autocomplete="off"
                    >
                    <div class="input-border"></div>
                </div>
                
                <button id="button" onclick="connexion()" class="button">
                    <span class="button-text">Commencer le Duel</span>
                    <div class="button-glow"></div>
                </button>
            </div>
        </div>
    </div>

    <script>
        function connexion() {
            const pseudo = document.getElementById('username-input').value;
            
            if (!pseudo.trim()) {
                const input = document.getElementById('username-input');
                input.classList.add('shake');
                setTimeout(() => input.classList.remove('shake'), 500);
                return;
            }
            
            const formData = new FormData();
            formData.append('pseudo', pseudo);

            fetch('/connexion', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (response.ok) {
                    document.querySelector('.login-card').classList.add('fade-out');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else {
                    console.error('Erreur lors de la connexion');
                }
            })
            .catch(error => console.error('Erreur lors de la requête :', error));
        }
        
        document.getElementById('username-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                connexion();
            }
        });
    </script>
</body>
</html>
