<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau mot de passe - Abyss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Eczar:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style_abyss.css">
</head>
<body>
<canvas id="neige" aria-hidden="true"></canvas>

<!-- Le .voile sert ici de simple centreur plein ecran (deja position:fixed) :
     pas de page derriere a estomper, juste la carte au milieu de l'abysse. -->
<div class="voile">
  <div class="modale" role="dialog" aria-modal="true" aria-labelledby="titre">
    <h2 class="titre-modale" id="titre">Nouveau mot de passe</h2>

    <form id="formReset" hidden>
      <label class="champ">
        <span>Nouveau mot de passe</span>
        <input id="rMdp" type="password" autocomplete="new-password" required minlength="8">
        <small>8 caractères au minimum.</small>
      </label>
      <label class="champ">
        <span>Répéter le nouveau mot de passe</span>
        <input id="rMdp2" type="password" autocomplete="new-password" required minlength="8">
      </label>
      <p class="explication">Les autres appareils connectés à ton compte seront déconnectés.</p>
      <p class="erreur" id="rErr" hidden></p>
      <button class="valider" type="submit" id="rGo">Changer le mot de passe</button>
    </form>

    <div id="rInvalide" hidden>
      <p class="explication">Ce lien n'est plus valide - il a peut-être déjà servi,
        ou plus d'une heure a passé depuis la demande.</p>
      <a class="lien" href="/abyss">Retourne sur Abyss pour en redemander un.</a>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
const el = (id) => document.getElementById(id);

async function api(chemin, methode, charge) {
  const options = { method: methode || "GET", credentials: "same-origin" };
  if (charge !== undefined) {
    options.headers = { "Content-Type": "application/json" };
    options.body = JSON.stringify(charge);
  }
  const r = await fetch(chemin, options);
  let data = null;
  try { data = await r.json(); } catch (e) { /* reponse illisible */ }
  if (!r.ok || !data || data.ok === false) {
    throw new Error((data && data.message) || `Erreur ${r.status}.`);
  }
  return data;
}

function erreur(id, message) {
  const p = el(id);
  p.textContent = message;
  p.hidden = false;
}

let minuteurToast;
function toast(message, mauvais) {
  const t = el("toast");
  t.textContent = message;
  t.className = "toast montre" + (mauvais ? " mauvais" : "");
  t.hidden = false;
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => { t.className = "toast"; t.hidden = true; }, 3600);
}

/* =========================================================
   Afficher / masquer un mot de passe — meme bouton qu'Abyss.html
   ========================================================= */
document.querySelectorAll(".champ input[type=password]").forEach((input) => {
  const wrap = document.createElement("div");
  wrap.className = "mdp-wrap";
  input.replaceWith(wrap);
  wrap.appendChild(input);

  const bouton = document.createElement("button");
  bouton.type = "button";
  bouton.className = "mdp-oeil";
  bouton.setAttribute("aria-pressed", "false");
  bouton.setAttribute("aria-label", "Afficher le mot de passe");
  bouton.innerHTML = `
    <svg class="oeil-ouvert" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1.4 12S5.2 4.8 12 4.8 22.6 12 22.6 12 18.8 19.2 12 19.2 1.4 12 1.4 12Z"/>
      <circle cx="12" cy="12" r="3.15"/>
    </svg>
    <svg class="oeil-barre" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.85 5.15A11.6 11.6 0 0 1 12 4.8c6.8 0 11.4 7.2 11.4 7.2a15.4 15.4 0 0 1-3.35 4.02M6.62 6.63C3.32 8.72 1.4 12 1.4 12s4.6 7.2 11.4 7.2a10.9 10.9 0 0 0 4.4-.92"/>
      <path d="M9.6 9.6a3.15 3.15 0 0 0 4.42 4.42"/>
      <path d="M2 2l20 20"/>
    </svg>`;
  wrap.appendChild(bouton);

  bouton.addEventListener("click", () => {
    const clair = input.type !== "text";
    input.type = clair ? "text" : "password";
    bouton.classList.toggle("on", clair);
    bouton.setAttribute("aria-pressed", String(clair));
    bouton.setAttribute("aria-label", clair ? "Masquer le mot de passe" : "Afficher le mot de passe");
  });
});

/* =========================================================
   Le jeton vient de l'adresse : sans lui, inutile de montrer un
   formulaire qui ne pourra de toute facon pas aboutir.
   ========================================================= */
const JETON = new URLSearchParams(location.search).get("jeton") || "";
if (JETON) {
  el("formReset").hidden = false;
} else {
  el("rInvalide").hidden = false;
}

el("formReset").addEventListener("submit", async (e) => {
  e.preventDefault();
  el("rErr").hidden = true;
  if (el("rMdp").value !== el("rMdp2").value) {
    erreur("rErr", "Les deux saisies ne sont pas identiques.");
    return;
  }
  const bouton = el("rGo");
  bouton.disabled = true;
  try {
    await api("/api/mot-de-passe-oublie/confirmer", "POST", {
      jeton: JETON,
      nouveau: el("rMdp").value
    });
    toast("Mot de passe changé. Direction Abyss...");
    setTimeout(() => { location.href = "/abyss"; }, 1200);
  } catch (err) {
    erreur("rErr", err.message);
    bouton.disabled = false;
  }
});

/* ---------- Neige marine ---------- */
(function () {
  const reduit = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const c = document.getElementById("neige");
  if (reduit || !c.getContext) { c.style.display = "none"; return; }
  const ctx = c.getContext("2d");
  let w = 0, h = 0, grains = [];

  const halo = (function () {
    const t = 40, s = document.createElement("canvas");
    s.width = s.height = t;
    const g = s.getContext("2d");
    const d = g.createRadialGradient(t / 2, t / 2, 0, t / 2, t / 2, t / 2);
    d.addColorStop(0, "rgba(232,247,255,1)");
    d.addColorStop(.16, "rgba(188,230,250,.62)");
    d.addColorStop(.42, "rgba(130,198,232,.2)");
    d.addColorStop(1, "rgba(110,185,225,0)");
    g.fillStyle = d;
    g.fillRect(0, 0, t, t);
    return s;
  })();

  function init() {
    const d = window.devicePixelRatio || 1;
    w = window.innerWidth; h = window.innerHeight;
    c.width = w * d; c.height = h * d;
    c.style.width = w + "px"; c.style.height = h + "px";
    ctx.setTransform(d, 0, 0, d, 0, 0);
    const n = Math.min(210, Math.round((w * h) / 20000));
    grains = Array.from({ length: n }, () => {
      const p = Math.random();
      return {
        x: Math.random() * w,
        y: Math.random() * h,
        r: .5 + p * 2,
        v: .035 + p * .21,
        a: .1 + p * .42,
        ph: Math.random() * Math.PI * 2,
        sp: .006 + Math.random() * .016,
        d: Math.random() * Math.PI * 2
      };
    });
  }

  function boucle() {
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = "lighter";
    for (const g of grains) {
      g.y += g.v;
      g.d += .004;
      g.ph += g.sp;
      if (g.y > h + 8) { g.y = -8; g.x = Math.random() * w; }
      const x = g.x + Math.sin(g.d) * 10;
      const taille = g.r * 9;
      ctx.globalAlpha = g.a * (.7 + .3 * Math.sin(g.ph));
      ctx.drawImage(halo, x - taille / 2, g.y - taille / 2, taille, taille);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(boucle);
  }

  init();
  let redim;
  window.addEventListener("resize", () => {
    clearTimeout(redim);
    redim = setTimeout(init, 150);
  });
  boucle();
})();
</script>
</body>
</html>
