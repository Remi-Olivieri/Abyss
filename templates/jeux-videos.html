<script>
/* Les journaux disponibles, remplis par l'annuaire au démarrage. Plus
   aucune adresse en dur : le serveur sait qui a un journal public, et les
   pseudos changent sans qu'on touche à ce fichier.
   L'`url` est le chemin de l'API : tout le reste de la page (cache local,
   mémoire du dernier classeur ouvert) continue de s'en servir comme clé. */
let SOURCES = [];

const CONFIG = { // Configs pour les covers
  imageDir: "/static/Cover/",
  imageExt: "webp",
  coverRatio: "3 / 4",
};

/* ---------- Utilitaires ---------- */
const EUR = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const norm = s => (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/[’'`.:]/g,' ').replace(/\s+/g,' ').trim();
const clean = s => (s||'').toString().replace(/\u00a0/g,' ').trim();
const $ = id => document.getElementById(id);
/* Ferme une fenêtre au clic sur son fond, mais pas quand ce clic est en
   fait la fin d'une sélection de texte commencée dans la fenêtre : le
   mousedown part du contenu, la souris dérape pendant le geste, et le
   'click' qui suit atterrit sur le fond — sans ce garde-fou ça fermait la
   fenêtre en pleine modification. On ne ferme que si le clic ET le
   mousedown qui le précède visaient tous les deux le fond lui-même. */
function fermeSurFond(id, ferme){
  const fond = $(id);
  let surFond = false;
  fond.addEventListener('mousedown', e=>{ surFond = e.target.id === id; });
  fond.addEventListener('click', e=>{
    if(surFond && e.target.id === id) ferme();
    surFond = false;
  });
}
const esc = s => (s===null||s===undefined?'':String(s))
  .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fr = (n,d=1) => n.toFixed(d).replace('.',',');

function money(v){ return (v===null||v===undefined||v==='') ? '—' : EUR.format(v); }
function hoursFmt(h){
  if(h===null||h===undefined) return '—';
  const H = Math.floor(h), M = Math.round((h-H)*60);
  return M ? `${H} h ${String(M).padStart(2,'0')}` : `${H} h`;
}
function toNum(v){
  if(v===null||v===undefined) return null;
  const s = clean(v).replace(/[€\s]/g,'').replace(',','.');
  if(s==='') return null;
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function toHours(v){
  const s = clean(v);
  if(!s) return null;
  let m = s.match(/^PT(\d+)H(?:(\d+)M)?/i);
  if(m) return +m[1] + (+(m[2]||0))/60;
  m = s.match(/^(\d+)\s*[h:]\s*(\d+)?/i);
  if(m) return +m[1] + (+(m[2]||0))/60;
  const n = parseFloat(s.replace(',','.'));
  return isNaN(n) ? null : n;
}
function toDate(v){
  const s = clean(v);
  if(!s) return null;
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return s.slice(0,10);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); // DD/MM/YYYY
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  return s;
}
function dateFmt(d){
  const m=(d||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return d || '—';
  return `${+m[3]} ${MONTHS[+m[2]-1]} ${m[1]}`;
}
function yearOf(d){ const m=(d||'').match(/(\d{4})/); return m ? +m[1] : null; }

/* ---------- compte à rebours d'une sortie ----------
   Ce qu'on veut lire d'un jeu convoité : dans combien de temps il sort, ou
   depuis combien de temps il est sorti. Renvoie null quand la date est
   inconnue ou illisible — une wishlist contient des jeux sans date
   annoncée, et « dans NaN jours » vaut moins que rien.

   Le calcul porte sur des dates à minuit et pas sur des millisecondes :
   sinon un jeu qui sort demain matin afficherait « dans 0 jour » dès qu'on
   ouvre la page en fin d'après-midi. */
function compteARebours(iso){
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return null;
  const t = new Date();
  const jours = Math.round(
    (new Date(+m[1], +m[2] - 1, +m[3]) - new Date(t.getFullYear(), t.getMonth(), t.getDate()))
    / 86400000);
  if(jours === 0) return { avant:true, txt:"sort aujourd'hui" };

  const n = Math.abs(jours);
  let duree;
  if(n < 31)       duree = `${n} jour${n > 1 ? 's' : ''}`;
  else if(n < 365) duree = `${Math.round(n / 30.44)} mois`;
  else { const a = Math.round(n / 365.25); duree = `${a} an${a > 1 ? 's' : ''}`; }

  return jours > 0
    ? { avant:true,  txt:`dans ${duree}` }
    : { avant:false, txt:`sorti depuis ${duree}` };
}

/* Neuf fenêtres peuvent se recouvrir : la fiche, le formulaire, le choix de
   jaquette, le bilan en image, la mise à jour depuis IGDB, la recherche de
   journal, l'export, le détail d'un jeu et une capture en grand. Chacune
   décidait du défilement de la page pour son propre compte, donc en fermer
   une pendant qu'une autre est encore ouverte rendait la page défilable
   derrière. Un seul endroit regarde maintenant l'état des neuf. */
/* =======================================================================
   Rattrapage automatique des fiches IGDB.

   Les classeurs remplis avant l'arrivée des fiches détaillées n'ont ni
   identifiant IGDB ni plateforme/développeur/genres. Demander à chacun
   d'aller lancer la mise à jour à la main ne marche pas : personne ne le
   fait. La page s'en charge donc seule, une fois, à la première ouverture
   qui suit — le serveur dit quand (voir contenu(), journal.py).

   Deux garde-fous, parce que ça écrit dans le classeur de quelqu'un sans
   qu'il l'ait demandé :

     - seules les correspondances SÛRES sont écrites. « plusieurs fiches »
       et « à vérifier » sont précisément les cas où l'on risque d'attacher
       le mauvais jeu — et un mauvais identifiant renomme aussi la jaquette.
       Ceux-là restent pour la mise à jour manuelle, qui les montre.
     - seul l'identifiant part. Ni date, ni prix : ces colonnes-là ont pu
       être corrigées à la main, et rien ne justifie de les écraser au dos
       de leur propriétaire. Les trois autres colonnes sont relues par le
       serveur à partir de l'identifiant.
   ======================================================================= */
let RATTRAPAGE_FAIT = false;
let RATTRAPAGE_STOP = false;
const RATTRAPAGE_ABANDON = 8;    // échecs d'affilée = le serveur ne suit plus

function rattrapageBanniere(texte, fini){
  let b = $('rattrapage');
  if(!b){
    b = document.createElement('div');
    b.id = 'rattrapage';
    b.className = 'rattrapage';
    document.body.appendChild(b);
  }
  b.innerHTML = `<span class="rattrapage-txt">${esc(texte)}</span>` +
    (fini ? '' : '<button class="rattrapage-x" type="button">Plus tard</button>');
  const x = b.querySelector('.rattrapage-x');
  if(x) x.onclick = ()=>{ RATTRAPAGE_STOP = true; };
  return b;
}
function rattrapageFerme(){
  const b = $('rattrapage');
  if(b) b.remove();
}
/* Que la passe aille au bout, soit interrompue ou tombe en panne, la
   question a été posée : on ne la reposera pas à chaque ouverture. Ce qui
   reste sans fiche demeure accessible par la mise à jour manuelle. */
async function rattrapageClos(){
  try{ await envoyer('POST', '/api/journal/rattrapage', {}); }catch(e){}
}

async function rattrapageIgdb(){
  const aFaire = GAMES.filter(g => !g.idIgdb);
  if(!aFaire.length){ rattrapageClos(); return; }

  RATTRAPAGE_STOP = false;
  let vus = 0, surs = 0, echecs = 0, ecrits = 0, abandon = false;
  let file = [];
  rattrapageBanniere(`Mise à jour de ton classeur… 0/${aFaire.length}`);

  // les écritures partent par paquets : une relecture du journal pour
  // vingt jeux au lieu d'une par jeu, comme la mise à jour manuelle
  const vide = async ()=>{
    if(!file.length) return;
    const paquet = file.splice(0, file.length);
    try{
      const rep = await envoyer('PUT', '/api/journal/lot', {modifs: paquet});
      const refuses = ((rep.fait || {}).echecs) || [];
      ecrits += paquet.length - refuses.length;
      if(rep.jeux) applyData(rep, true);
    }catch(e){ /* le paquet est perdu, la passe continue */ }
  };

  for(const g of aFaire){
    if(RATTRAPAGE_STOP) break;
    let data;
    try{
      data = await apiPatient('/api/jeu/maj', {
        nom: g.name,
        sortie: g.release || '',
        prix: false,           // le prix payé est une donnée personnelle
        detail: true,
        jaquettes: 'aucune',   // une jaquette se choisit, ça ne s'automatise pas
      });
      echecs = 0;
    }catch(e){
      // le serveur ne répond plus : s'acharner ne ferait qu'empirer
      if(++echecs >= RATTRAPAGE_ABANDON){ abandon = true; break; }
      continue;
    }finally{
      vus++;
      rattrapageBanniere(`Mise à jour de ton classeur… ${vus}/${aFaire.length}`);
    }
    if(data.etat === 'ok' && data.fiche && data.surete === 'sure'){
      surs++;
      file.push({id: g.id, values: {id_igdb: data.fiche.id}});
      if(file.length >= IGDB_LOT) await vide();
    }
  }
  await vide();
  /* Une passe qui s'arrête parce que le serveur ne répondait plus n'a rien
     tranché du tout : la marquer « faite » brûlerait l'unique chance du
     rattrapage sur une panne passagère. On ne clôt que si on est allé au
     bout, ou si la personne a écarté la bannière elle-même. */
  if(!abandon) await rattrapageClos();

  render();
  if(ecrits){
    rattrapageBanniere(`${ecrits} jeu${ecrits > 1 ? 'x' : ''} complété${
      ecrits > 1 ? 's' : ''} depuis IGDB.`, true);
    setTimeout(rattrapageFerme, 6000);
  }else{
    rattrapageFerme();
  }
}

const FENETRES = ['sheet','form','jaq','bilan','igdb','recherche','export','detail','zoom'];
function verrouFond(){
  const ouverte = FENETRES.some(id => { const e = $(id); return e && !e.hidden; });
  document.body.style.overflow = ouverte ? 'hidden' : '';
}

/* ---------- Jeux en cours ---------- */

const EN_COURS = 'En cours';
const estEnCoursNom = nom => norm(nom) === norm(EN_COURS);
const estEnCours = g => estEnCoursNom(g.bucket);
/* le nom exact de l'onglet s'il existe déjà, sinon celui qu'on créera */
function ongletEnCours(){
  return BUCKETS.find(estEnCoursNom) || EN_COURS;
}

/* ---------- Wishlist ---------- */
const WISHLIST = 'Wishlist';
const estWishlistNom = nom => norm(nom) === norm(WISHLIST);
const estWishlist = g => estWishlistNom(g.bucket);
function ongletWishlist(){
  return BUCKETS.find(estWishlistNom) || WISHLIST;
}

const estStatutNom = nom => estEnCoursNom(nom) || estWishlistNom(nom);
const estStatut = g => estStatutNom(g.bucket);

function statutDe(g){
  return estWishlist(g) ? WISHLIST : (estEnCours(g) ? EN_COURS : '');
}

const TRIS = [
  ['note',        'Note ↓'],
  ['note_asc',    'Note ↑'],
  ['chrono',      'Ordre où je les ai faits'],
  ['solde',       'Solde ↓'],
  ['release',     'Date de sortie ↓'],
  ['release_asc', 'Date de sortie ↑'],
  ['time',        'Temps de jeu ↓'],
  ['az',          'A → Z'],
];
/* Les tris proposés selon la famille d'onglets. La wishlist a la sienne
   parce qu'elle ne se lit pas comme le reste : c'est un calendrier, la
   prochaine sortie doit être en haut, donc la date croissante — celle qui
   ailleurs n'aurait aucun intérêt. Le solde encore moins : un jeu déjà
   terminé ou en cours n'est plus à vendre, ce tri n'a de sens que là où
   les prix bougent encore. */
const TRIS_PAR_FAMILLE = {
  periode:  TRIS.map(([k]) => k).filter(k => k !== 'solde'),
  statut:   ['release', 'az'],
  wishlist: ['solde', 'release_asc', 'release', 'az'],
};
const TRI_MEMO = { periode: 'note', statut: 'release', wishlist: 'solde' };

/* ---------- Jaquettes ---------- */

// Le titre en minuscules, sans accents, les mots reliés par des underscores -> nom_du_jeu.webp
function slug(n){
  return n.normalize('NFD').replace(/[̀-ͯ]/g,'')
          .toLowerCase().replace(/[^a-z0-9]+/g,'_')
          .replace(/^_+|_+$/g,'');
}

const IMG_DIR = CONFIG.imageDir.endsWith('/') ? CONFIG.imageDir : CONFIG.imageDir + '/';
/* ---------- manifeste des jaquettes ----------
   { slug: horodatage } pour chaque fichier réellement présent dans Cover/,
   servi par /api/jaquettes. Il évite de demander une image qui n'existe pas :
   sans lui, chaque jeu sans jaquette valait un 404 par rendu, et sa case
   d'initiales n'arrivait qu'après l'échec réseau — d'où le clignotement.

   Gardé en localStorage pour être là dès le premier pixel : la requête, si
   rapide soit-elle, arrive après le premier rendu, et c'est ce rendu-là
   qu'on veut juste.

   null tant qu'on n'a jamais rien reçu. On tente alors l'adresse comme
   avant, plutôt que de décréter qu'aucun jeu n'a de jaquette : le manifeste
   est une amélioration, pas une dépendance. */
const CLE_JAQUETTES = 'journal-de-jeu:jaquettes';
let JAQUETTES = null;
try{ JAQUETTES = JSON.parse(localStorage.getItem(CLE_JAQUETTES) || 'null'); }catch(e){}
function retientManifeste(){
  try{ localStorage.setItem(CLE_JAQUETTES, JSON.stringify(JAQUETTES)); }catch(e){}
}
/* Relit le disque et redessine si quelque chose y a bougé depuis la
   dernière visite. En silence : si Flask ne répond pas, on garde ce qu'on
   avait — au pire on retombe sur le comportement d'avant, un 404 par
   jaquette manquante, ce qui reste une page qui marche. */
async function chargeManifeste(){
  let data;
  try{
    const r = await fetch('/api/jaquettes');
    if(!r.ok) return;
    data = await r.json();
  }catch(e){ return; }
  if(!data || data.etat !== 'ok' || !data.jaquettes) return;
  const avant = JSON.stringify(JAQUETTES);
  JAQUETTES = data.jaquettes;
  retientManifeste();
  if(JSON.stringify(JAQUETTES) === avant) return;   // le disque n'a pas bougé
  /* Redessiner ne coûte presque rien : les tuiles sont réutilisées, seules
     celles dont l'adresse de jaquette a changé sont refaites. */
  renderWall();
  if(!document.getElementById('sheet').hidden && S.open !== null) paintSheet();
}
/* ---------- prix du jour des jeux convoités ----------
   { nom: {plein, actuel, remise} }. Rien de tout ça ne peut vivre dans le
   classeur : une promotion change tous les jours, et c'est précisément
   celle du moment qu'on veut voir. La page demande donc à Flask, qui
   demande à Steam.

   Gardé en localStorage pour que les pastilles soient là dès l'ouverture,
   et rafraîchi derrière — les deux caches côté serveur, l'appid un mois et
   le tarif six heures, rendent ce rafraîchissement quasi gratuit. */
const CLE_TARIFS = 'journal-de-jeu:tarifs';
let TARIFS = {};
try{ TARIFS = JSON.parse(localStorage.getItem(CLE_TARIFS) || '{}') || {}; }catch(e){}

const TARIFS_PAQUET = 8;    // assez petit pour voir les pastilles arriver
let tarifsEnVol = false, tarifsVus = 0;
async function majTarifs(){
  if(tarifsEnVol || Date.now() - tarifsVus < 600000) return;   // déjà demandé
  const jeux = GAMES.filter(estWishlist).map(x => ({nom:x.name, sortie:x.release || ''}));
  if(!jeux.length) return;
  tarifsEnVol = true;
  try{
    /* Par paquets, et redessiné après chacun : la première visite paie la
       recherche IGDB pour chaque jeu, autant voir les pastilles apparaître
       au fur et à mesure plutôt que rien pendant vingt secondes. */
    for(let i = 0; i < jeux.length; i += TARIFS_PAQUET){
      let data;
      try{ data = await api('/api/wishlist/prix', {jeux: jeux.slice(i, i + TARIFS_PAQUET)}); }
      catch(e){ return; }        // Flask muet : on garde ce qu'on avait
      if(!data || data.etat !== 'ok' || !data.tarifs) return;
      Object.assign(TARIFS, data.tarifs);
      try{ localStorage.setItem(CLE_TARIFS, JSON.stringify(TARIFS)); }catch(e){}
      renderWall();              // seules les tuiles concernées se refont
      // la fiche ouverte affiche le même prix : elle aussi
      if(!document.getElementById('sheet').hidden && S.open !== null) paintSheet();
    }
    tarifsVus = Date.now();
  } finally { tarifsEnVol = false; }
}
/* La promotion fait partie de ce que la tuile montre : sans elle dans la
   signature, une pastille arrivée après coup ne s'afficherait jamais. */
function sigPromo(x){
  const t = estWishlist(x) && TARIFS[x.name];
  return t && t.remise > 0 ? t.remise + '@' + t.actuel : '';
}
/* Le pourcentage de remise, 0 quand il n'y en a pas ou qu'on ne sait pas
   encore. Sert au tri « Solde », d'où le 0 plutôt que null : un jeu dont
   Steam ne dit rien se range avec ceux qui ne sont pas soldés, pas devant. */
function remiseDe(x){
  const t = estWishlist(x) && TARIFS[x.name];
  return t && t.remise > 0 ? t.remise : 0;
}

/* Le nom de fichier d'une jaquette : l'identifiant IGDB quand le jeu en a
   un, son nom sinon. Deux jeux au titre identique — « God of War » de 2005
   et celui de 2018, « Doom », « Tomb Raider » — tombaient jusqu'ici sur le
   même fichier, donc sur une seule image pour les deux.

   Doit dire exactement la même chose que cle_jaquette() en Python : c'est
   le serveur qui écrit les fichiers, la page qui les demande. */
function cleJaquette(g){
  return g && g.idIgdb ? String(g.idIgdb) : slug(g ? g.name : '');
}
function coverURL(cle){
  const f = cle;
  if(!f) return '';
  // le manifeste dit ce qui existe : on ne demande jamais un fichier absent
  if(JAQUETTES && !(f in JAQUETTES)) return '';
  const url = IMG_DIR + encodeURIComponent(f) + '.' + CONFIG.imageExt;
  /* l'horodatage du fichier fait office de numéro de version : une jaquette
     remplacée sous le même nom change de date, donc d'adresse, et le cache
     du navigateur ne peut pas renvoyer l'ancienne */
  const v = JAQUETTES && JAQUETTES[f];
  return v ? url + '?v=' + v : url;
}
function initials(n){
  return n.replace(/[^\p{L}\p{N} ]/gu,' ').split(/\s+/).filter(Boolean).slice(0,2)
          .map(w=>w[0].toUpperCase()).join('');
}
/* Les jaquettes du premier écran, celles qu'on voit avant d'avoir fait quoi
   que ce soit. Six, c'est la première rangée du mur : .wall tient six
   colonnes de 158 px dans les 1120 px de la page. */
const PRIORITAIRES = 6;
function coverTag(g, cls, prioritaire){
  /* Les premières partent tout de suite et en priorité haute. « lazy »
     n'aurait pas retardé leur affichage — elles sont dans le champ — mais
     leur requête, que le navigateur ne lance qu'une fois la mise en page
     connue. Les suivantes restent paresseuses : un mur de trois cents jeux
     chargé d'un bloc saturerait les connexions, et les premières
     attendraient derrière les autres. */
  const charge = prioritaire
    ? 'loading="eager" fetchpriority="high"'
    : 'loading="lazy"';
  return `<img class="cov ${cls}" alt="" ${charge} decoding="async"
    data-name="${esc(g.name)}" data-release="${esc(g.release || '')}"
    data-cle="${esc(cleJaquette(g))}" data-igdb="${esc(g.idIgdb || '')}"
    data-color="${noteColor(g.rating)}">`;
}

// Un bouton dans le coin de la cover pour télécharger l'image
function boutonJaquette(nom, sortie, idIgdb){
  const b = document.createElement('span');
  b.className = 'cov-get';
  b.setAttribute('role', 'button');
  b.setAttribute('tabindex', '0');
  b.title = 'Chercher une jaquette';
  b.setAttribute('aria-label', `Chercher une jaquette pour ${nom}`);
  b.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg>`;
  const lance = e=>{
    e.stopPropagation(); e.preventDefault();
    if(b.classList.contains('busy')) return;
    b.classList.add('busy');
    // force : le fichier existe peut-être déjà, mais le navigateur garde un vieil échec en cache
    jaquetteAuto(nom, sortie, true, idIgdb).finally(()=> b.classList.remove('busy'));
  };
  b.addEventListener('click', lance);
  b.addEventListener('keydown', e=>{ if(e.key === 'Enter' || e.key === ' ') lance(e); });
  return b;
}
function hydrateCovers(root){
  root.querySelectorAll('img.cov').forEach(img=>{
    const url = coverURL(img.dataset.cle);
    const initiales = ()=>{
      const d = document.createElement('div');
      d.className = Array.from(img.classList).filter(c=>c!=='chargement').join(' ') + ' ph';
      d.style.setProperty('--c', img.dataset.color);
      d.textContent = initials(img.dataset.name);
      d.appendChild(boutonJaquette(img.dataset.name, img.dataset.release, img.dataset.igdb));
      img.replaceWith(d);
    };
    if(!url){ initiales(); return; }
    /* le temps que la jaquette arrive, la case miroite doucement au lieu
       de rester un rectangle mort : on sait que quelque chose est en route */
    img.classList.add('chargement');
    img.addEventListener('load', ()=>{ img.classList.remove('chargement'); }, {once:true});
    img.addEventListener('error', ()=>{ if(!img.dataset.off) initiales(); });
    img.src = url;
  });
}

/* ---------- Échelle de couleur des notes ---------- */
const SCALE = [[0,'#B4295C'],[3,'#DD5A3C'],[5,'#E9A13C'],[7,'#A8C24A'],[9,'#35C98D'],[10,'#22CFA8']];
function hex2rgb(h){ return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); }
function noteColor(n){
  if(n===null||n===undefined) return '#6E6480';
  const v = Math.max(0,Math.min(10,n));
  for(let i=0;i<SCALE.length-1;i++){
    const [a,ca]=SCALE[i], [b,cb]=SCALE[i+1];
    if(v>=a && v<=b){
      const t=(v-a)/(b-a), A=hex2rgb(ca), B=hex2rgb(cb);
      return `rgb(${A.map((x,j)=>Math.round(x+(B[j]-x)*t)).join(',')})`;
    }
  }
  return SCALE[SCALE.length-1][1];
}

/* ---------- Lecture d'un onglet ---------- */
/* Le serveur envoie des jeux tout faits. Les fonctions qui devinaient les
   colonnes d'une feuille (HEAD, mapHeaders, guessMonthColumn, noteFor,
   readSheet) n'ont plus d'objet : un jeu arrive avec ses champs nommés, et
   son `id` remplace le couple « onglet + numéro de ligne ». */

/* Plus de jeton : l'autorisation d'écrire vient de la session Abyss, et le
   cookie part tout seul avec chaque requête. Le serveur répond `write: true`
   quand le journal demandé est celui du visiteur connecté. */

try{
  if(localStorage.getItem('journal-de-jeu:version') !== 'abyss-4'){
    /* le cache d'avant est indexé par adresse Apps Script, et contient des
       feuilles au lieu de jeux : illisible pour la nouvelle version.
       Les jetons partent avec, ils ne servent plus à rien. */
    Object.keys(localStorage)
      .filter(k => k.startsWith('journal-de-jeu:'))
      .forEach(k => localStorage.removeItem(k));
    localStorage.setItem('journal-de-jeu:version', 'abyss-4');
  }
}catch(e){}

/* ---------- dernière réponse connue : affichée tout de suite au chargement,
   le temps que la vraie requête reparte en arrière-plan ---------- */
const cacheStore = {
  cle(url){ return 'journal-de-jeu:data:' + url; },
  get(url){ try{ return JSON.parse(localStorage.getItem(this.cle(url)) || 'null'); }catch(e){ return null; } },
  set(url, v){ try{ localStorage.setItem(this.cle(url), JSON.stringify(v)); }catch(e){} },
};

let GAMES = [], BUCKETS = [], CAN_WRITE = false, SRC = 0, PREMIERE_FOIS = true, TITRE = '';
/* L'onglet sur lequel le classeur affiché s'ouvre, choisi par son auteur.
   Vide = aucun choix, on retombe sur l'année la plus récente. */
let ONGLET_DEFAUT = '';
/* Les onglets qui ne rangent aucun jeu : ce sont des vues sur le classeur,
   pas des tiroirs. Ils ne figurent donc jamais dans BUCKETS, et tout ce qui
   valide un nom d'onglet doit les connaître à part. */
const ONGLETS_VUE = ['all', 'stats'];
/* le journal affiché, ou null si SOURCES est vide */
const source = () => SOURCES[SRC] || null;

/* Le classeur ouvert la dernière fois : on retient l'adresse, pas le rang,
   pour que réordonner SOURCES ne rouvre pas le journal de quelqu'un d'autre. */
const CLE_CLASSEUR = 'journal-de-jeu:classeur';
function memoriseClasseur(){
  try{ localStorage.setItem(CLE_CLASSEUR, source() ? source().url : ''); }catch(e){}
}
/* L'année la plus récente : la plus grande parmi les onglets, et à défaut
   d'onglet nommé comme une année, le dernier de la liste.

   Ne sert plus qu'à proposer une catégorie au formulaire d'ajout — un jeu
   qu'on vient de finir appartient presque toujours à l'année en cours.
   L'ouverture du classeur, elle, se fait sur « Tout » ou sur l'onglet que
   son auteur a désigné (voir ONGLET_DEFAUT). */
function derniereAnnee(){
  const annees = BUCKETS.filter(b => /^\d{4}$/.test(String(b).trim()));
  if(annees.length) return annees.reduce((a,b) => +String(b).trim() > +String(a).trim() ? b : a);
  // « En cours » et « Wishlist » ne sont pas des périodes : on ne range pas
  // un jeu terminé dans un statut, ils sont donc écartés d'office
  const autres = BUCKETS.filter(b => !estStatutNom(b));
  return autres[autres.length - 1] || BUCKETS[BUCKETS.length - 1] || 'all';
}

async function charger(opts = {}){
  const s = source();
  if(!s || !s.url){ showGate(null); return; }
  // silencieux : rafraîchissement en arrière-plan pendant qu'on affiche déjà le cache
  const silencieux = !!opts.silencieux;

  /* Plus de jeton dans l'adresse : le cookie de session part tout seul,
     même origine oblige, et c'est le serveur qui décide de `write`. */
  let data = null, pourquoi = '';
  try{
    const r = await fetch(s.url, {credentials: 'same-origin'});
    if(r.ok) data = await r.json();
    else{
      try{ data = await r.json(); }catch(e){}
      pourquoi = (data && data.message) || ('réponse HTTP ' + r.status);
      data = null;
    }
  }catch(e){ pourquoi = 'serveur injoignable'; }

  if(!data || !data.ok){
    if(silencieux){ majEtat('erreur', 'actualisation impossible'); return; }
    showGate(pourquoi ? `<b>Impossible de charger le journal.</b> ${esc(pourquoi)}.` : null);
    return;
  }

  cacheStore.set(s.url, data);
  applyData(data, true);
  showApp();
  render();
}

/* L'état de la connexion tient dans la pastille de l'engrenage — verte quand
   les données viennent du script, ambrée pendant une actualisation, rouge
   quand celle-ci a échoué, éteinte quand rien n'a pu être joint. */
function majEtat(mode, txt){
  const c = document.getElementById('cog');
  c.dataset.etat = mode;
  c.setAttribute('aria-label', 'Paramètres — ' + txt);
}

/* Range la réponse dans GAMES / BUCKETS. Appelée aussi après chaque
   écriture : le serveur renvoie le journal relu, comme le faisait le script.
   frais=false : c'est le cache local qui vient d'être affiché, la vraie
   requête est encore en vol — on le dit au lieu d'annoncer une synchro. */
function applyData(data, frais){
  /* Les jeux arrivent tout faits, avec les mêmes noms de champs que
     produisait readSheet. Seul `id` est nouveau, et il remplace le couple
     « onglet + numéro de ligne » qui servait à retrouver la bonne case. */
  GAMES = (data.jeux || []).map(j => Object.assign({}, j, {
    review: Array.isArray(j.review) ? j.review : [],
  }));
  BUCKETS = (data.periodes || []).slice();
  CAN_WRITE = data.write === true;
  TITRE = data.titre || '';
  oublieTuiles();   // le mur garde ses tuiles : celles des jeux partis s'en vont
  // à l'ouverture seulement : on se place sur l'année la plus récente
  ONGLET_DEFAUT = data.ongletDefaut || '';
  /* Sans choix de l'auteur, on ouvre sur « Tout » : c'est la vue qui montre
     le classeur entier, donc celle qui ne cache rien à qui arrive. Ouvrir
     sur l'année en cours, comme avant, donnait un classeur presque vide en
     janvier et laissait croire qu'il n'y avait que ça.
     derniereAnnee() reste utilisée à l'ajout d'un jeu, où « Tout » n'est
     pas une catégorie où ranger quoi que ce soit.

     Le choix de l'auteur passe devant, à condition qu'il existe encore : un
     onglet vidé de ses jeux disparaît de BUCKETS, et s'ouvrir sur un onglet
     absent afficherait une page vide sans que rien n'explique pourquoi. */
  if(PREMIERE_FOIS && BUCKETS.length){
    const voulu = ONGLETS_VUE.includes(ONGLET_DEFAUT)
      || BUCKETS.indexOf(ONGLET_DEFAUT) >= 0 ? ONGLET_DEFAUT : '';
    S.bucket = voulu || 'all';
    PREMIERE_FOIS = false;
  }
  /* « stats » et « all » ne sont pas des tiroirs du classeur : ils
     n'apparaissent pas dans BUCKETS et ce garde-fou les effacerait. */
  if(!ONGLETS_VUE.includes(S.bucket) && BUCKETS.indexOf(S.bucket) < 0) S.bucket = 'all';
  majEntete();
  if(frais) majEtat('live', CAN_WRITE ? 'modifiable' : 'lecture seule');
  else majEtat('stale', 'actualisation...');
  majVerrou();
  /* Le serveur ne dit « rattrapage » qu'au propriétaire d'un classeur
     rempli avant que les fiches IGDB existent. On laisse la page finir de
     s'afficher avant de lancer quoi que ce soit : le rattrapage est long
     et secondaire, il n'a aucune raison de retarder le premier écran. */
  if(frais && data.rattrapage && CAN_WRITE && !RATTRAPAGE_FAIT){
    RATTRAPAGE_FAIT = true;
    setTimeout(rattrapageIgdb, 1200);
  }
}

/* ---------- écritures ----------
   Une requête JSON vers Flask, cookie de session compris. Le serveur répond
   le journal entier relu : la page se repose dessus au lieu de recoller à la
   main ce qu'elle vient d'envoyer. */
async function envoyer(methode, chemin, charge){
  if(!CAN_WRITE) throw new Error('lecture seule : connecte-toi sur Abyss');
  const opts = {method: methode, credentials: 'same-origin'};
  if(charge !== undefined){
    // application/json : un formulaire posté depuis un autre site ne peut
    // pas produire ce type sans pré-vol CORS. C'est la parade CSRF.
    opts.headers = {'Content-Type': 'application/json'};
    opts.body = JSON.stringify(charge);
  }
  let data = null, pourquoi = '';
  try{
    const r = await fetch(chemin, opts);
    try{ data = await r.json(); }catch(e){}
    if(!r.ok) pourquoi = (data && data.message) || ('réponse HTTP ' + r.status);
  }catch(e){ pourquoi = 'serveur injoignable'; }
  if(!data || data.ok === false) throw new Error(pourquoi || 'erreur inconnue');
  return data;
}

function closeMenu(){
  document.getElementById('menu').hidden = true;
  document.getElementById('cog').setAttribute('aria-expanded', 'false');
}
function toggleMenu(){
  const m = document.getElementById('menu'), ouvert = m.hidden;
  if(ouvert){ fermerRecherche(); closePer(); }   // un seul menu ouvert à la fois
  m.hidden = !ouvert;
  document.getElementById('cog').setAttribute('aria-expanded', ouvert ? 'true' : 'false');
}
document.getElementById('cog').addEventListener('click', e=>{ e.stopPropagation(); toggleMenu(); });
/* Une sélection de texte commencée dans un de ces menus et relâchée dehors
   ne doit pas le fermer : on ne ferme que si le clic ET le mousedown qui
   l'a précédé visaient tous les deux en dehors, comme fermeSurFond(). */
let HORS_COG = false, HORS_TAB = false;
document.addEventListener('mousedown', e=>{
  HORS_COG = !e.target.closest('.cog-wrap');
  HORS_TAB = !e.target.closest('.tab-wrap');
});
document.addEventListener('click', e=>{
  if(HORS_COG && !document.getElementById('menu').hidden && !e.target.closest('.cog-wrap')) closeMenu();
  if(HORS_TAB && !e.target.closest('.tab-wrap')) closePer();
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    if(!document.getElementById('menu').hidden) closeMenu();
    closePer();
  }
});

/* ---------- changer de classeur ----------
   Plus un menu déroulant sous le titre, mais une recherche façon réseau
   social : le bouton loupe ouvre #recherche, où taper un nom filtre les
   journaux connus (le sien, et les journaux publics de l'annuaire). */
function majEntete(){
  const s = source();
  document.getElementById('brand-title').textContent =
    s && s.nom ? `Journal de ${s.nom}` : 'Journal de jeu';
}

/* Une teinte stable par pseudo, pour que l'avatar d'une même personne ne
   change pas de couleur d'une recherche à l'autre. */
function teinteAvatar(nom){
  let h = 0;
  for(const c of (nom || '?')) h = (h * 31 + c.codePointAt(0)) % 360;
  return h;
}
function rechercheHTML(){
  return `<div class="sheet recherche-sheet" role="dialog" aria-modal="true" aria-label="Rechercher un journal">
    <div class="sheet-tools">
      <span class="grp"><b class="fhead">Rechercher un journal</b></span>
      <span class="grp"><button class="sbtn rsearch-x" aria-label="Fermer">×</button></span>
    </div>
    <div class="rsearch-in">
      <label class="rsearch-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        <input class="rsearch-input" id="rsearchInput" type="text" placeholder="Nom du joueur..." autocomplete="off" spellcheck="false">
      </label>
      <div class="rsearch-list" id="rsearchList"></div>
    </div>
  </div>`;
}
function renderRechercheListe(){
  const brut = document.getElementById('rsearchInput').value;
  const q = norm(brut);
  const liste = document.getElementById('rsearchList');
  const items = SOURCES.map((s,i)=>({s,i})).filter(({s}) => !q || norm(s.nom).includes(q));
  if(!items.length){
    liste.innerHTML = `<p class="rsearch-vide">Aucun journal ne correspond à « ${esc(brut)} ».</p>`;
    return;
  }
  liste.innerHTML = items.map(({s,i})=>{
    const compte = typeof s.jeux === 'number' ? `${s.jeux} jeu${s.jeux>1?'x':''} terminé${s.jeux>1?'s':''}` : 'journal public';
    const sous = s.moi ? `Ton journal - ${compte}` : compte.charAt(0).toUpperCase() + compte.slice(1);
    const avatar = s.avatar
      ? `<img class="rsearch-avatar" src="${esc(s.avatar)}" alt="">`
      : `<span class="rsearch-avatar" style="--h:${teinteAvatar(s.nom)}">${esc(initials(s.nom || '?'))}</span>`;
    /* La bannière tapisse la ligne, très en retrait : elle dit à qui
       appartient le journal d'un coup d'œil sans rendre le texte illisible.
       L'adresse n'est pas écrite dans le HTML mais posée juste après, en
       JavaScript : esc() n'échappe pas l'apostrophe, qui suffirait à sortir
       d'un url('...') et à injecter du CSS. Rien à échapper, rien à oublier. */
    return `<button class="rsearch-item${i===SRC?' on':''}${
        s.banniere ? ' rsearch-orne' : ''}" data-i="${i}">
      ${avatar}
      <span class="rsearch-meta"><b>${esc(s.nom || '?')}</b><i>${esc(sous)}</i></span>
      ${i===SRC?'<span class="tick">✓</span>':''}
    </button>`;
  }).join('');
  liste.querySelectorAll('.rsearch-item').forEach(b=>{
    b.onclick = ()=> choisirClasseur(+b.dataset.i);
    const s = SOURCES[+b.dataset.i];
    if(s && s.banniere) b.style.setProperty('--banniere', `url("${s.banniere}")`);
  });
}
function fermerRecherche(){
  const host = document.getElementById('recherche');
  if(host.hidden) return;
  host.hidden = true; host.innerHTML = '';
  verrouFond();
}
function ouvrirRecherche(){
  closeMenu(); closePer();
  const host = document.getElementById('recherche');
  host.innerHTML = rechercheHTML();
  host.hidden = false;
  verrouFond();
  host.querySelector('.rsearch-x').onclick = fermerRecherche;
  const champ = document.getElementById('rsearchInput');
  champ.addEventListener('input', renderRechercheListe);
  champ.addEventListener('keydown', e=>{
    if(e.key !== 'Enter') return;
    const premier = document.querySelector('#rsearchList .rsearch-item');
    if(premier) premier.click();
  });
  renderRechercheListe();
  champ.focus();
}
fermeSurFond('recherche', fermerRecherche);
document.getElementById('jnlSearchBtn').addEventListener('click', e=>{ e.stopPropagation(); ouvrirRecherche(); });

function choisirClasseur(i){
  fermerRecherche();
  if(i === SRC || !SOURCES[i]) return;
  SRC = i; memoriseClasseur();
  GAMES = []; BUCKETS = []; CAN_WRITE = false;
  /* on change de journal : la fiche ouverte parle d'un jeu qui n'est plus
     dans le classeur affiché. render() ne ferme plus rien de lui-même, donc
     c'est ici que ça se dit. */
  closeSheet();
  PREMIERE_FOIS = true; S.bucket = 'all'; S.q = ''; S.range = null; S.open = null;
  document.getElementById('q').value = '';
  majEntete();
  majEtat('offline', 'connexion...');
  const s = source();
  const cache = cacheStore.get(s.url);
  if(cache && cache.jeux && cache.jeux.length){
    applyData(cache, false); showApp(); render();
    charger({silencieux:true});
  } else {
    // rien en cache : le mur de l'autre classeur ne doit pas rester à l'écran,
    // et l'attente est la même qu'au tout premier chargement
    squelette();
    charger();
  }
}

/* ---------- squelette du premier chargement ----------
   Sans cache local il n'y a rien à montrer tant que le script n'a pas
   répondu, et une page vide pendant deux secondes ressemble à une panne
   plutôt qu'à une attente. On dresse donc la page entière en gris —
   onglets, stats, histogramme, mur — à la forme exacte de ce qui va
   arriver : les vraies données se posent dessus sans rien faire sauter.

   Deux choses ne sont pas des fantômes, parce qu'elles n'ont pas besoin
   des données pour être justes : le titre « Répartition des notes », déjà
   dans le HTML, et la liste des tris, qui ne dépend que de l'onglet. Les
   deux champs sont seulement désactivés — une recherche lancée maintenant
   remplacerait le squelette par « aucun jeu trouvé ».

   Tous les fantômes portent aria-hidden : ils ne décrivent rien. */
const FANTOMES = 12;
/* Hauteurs des barres, en % de la case. Volontairement irrégulières : une
   belle courbe en cloche se lirait comme une vraie mesure. */
const FANTOMES_HIST = [22,34,30,46,58,72,66,88,74,60,44,36,26,18];
/* Largeurs des pastilles : « Tout », le menu des années, puis les deux
   onglets de statut. */
const FANTOMES_TABS = [46,84,92,98];

function squelette(){
  document.getElementById('gate').hidden = true;
  document.getElementById('invite').hidden = true;
  document.getElementById('app').hidden = false;
  document.getElementById('cog').hidden = false;
  document.getElementById('tabs').hidden = false;
  document.getElementById('statsWrap').hidden = false;
  document.getElementById('dist').hidden = false;
  document.querySelector('.tools').hidden = false;

  renderSort();
  document.getElementById('q').disabled = true;
  document.getElementById('sort').disabled = true;

  // le retard repart à zéro toutes les six cases : au-delà, la dernière
  // scintillerait une demi-seconde après la première
  const retard = i => `--d:${(i % 6) * 90}ms`;
  const pose = (id, html) => { document.getElementById(id).innerHTML = html; };

  pose('tabs', FANTOMES_TABS.map((w,i)=>
    `<span class="fantome-tab" aria-hidden="true" style="width:${w}px;${retard(i)}"></span>`).join(''));

  pose('stats', Array.from({length:4}, (_,i)=>
    `<div class="stat" aria-hidden="true" style="${retard(i)}">
       <span class="fantome-l f-u"></span>

       <span class="fantome-l f-i"></span>
     </div>`).join(''));

  pose('hist', FANTOMES_HIST.map((h,i)=>
    `<span class="fantome-bar" aria-hidden="true" style="height:${h}%;${retard(i)}"></span>`).join(''));
  pose('haxis', '');   // la graduation n'a pas de forme sans les notes

  pose('out', `<div class="wall" aria-hidden="true">${
    Array.from({length: FANTOMES}, (_, i) =>
      `<div class="tile fantome" style="${retard(i)}">
         <span class="cov big chargement"></span>
         <span class="tcap">
           <span class="fantome-l"></span>
           <span class="fantome-l court"></span>
         </span>
       </div>`).join('')}</div>`);
}

/* ---------- verrou : lecture seule / modification ----------
   Il n'y a plus rien à déverrouiller. Le serveur répond `write: true` quand
   le journal affiché est celui du visiteur connecté, et `false` sinon. Le
   bouton mène donc à Abyss au lieu d'ouvrir une boîte à jeton. */
function majVerrou(){
  const chezMoi = CAN_WRITE;

  document.getElementById('relock').hidden = true;   // plus de retour arrière à faire
  document.getElementById('addBtn').hidden = !chezMoi;
  // la mise à jour de masse écrit dans le journal : en lecture seule elle
  // n'aurait rien à proposer d'autre qu'un refus, autant ne pas la montrer

  document.getElementById('unlock').textContent =
    MOI.connecte ? 'Ouvrir mon journal' : 'Se connecter sur Abyss';
}

document.getElementById('gRetry').addEventListener('click', ()=> charger());
document.getElementById('unlock').addEventListener('click', ()=>{
  closeMenu();
  /* Connecté sans journal : on lui en crée un et on l'y emmène. Connecté
     avec un journal : on l'ouvre. Pas connecté : direction Abyss. */
  if(!MOI.connecte){ location.href = '/abyss'; return; }
  if(MOI.pseudo){ ouvrirLeMien(); return; }
  creerMonJournal();
});
document.getElementById('inviteCreate').addEventListener('click', creerMonJournal);

/* ---------- état ----------
   range : tranche de notes choisie dans l'histogramme, ou null.
   On y garde le découpage exact (lo / step / n) qui a servi à dessiner
   les barres, pour que le filtre range exactement les mêmes jeux.
   Déclaré avant demarrer() : le rendu du cache s'exécute tout de suite,
   avant même que le reste du script ait fini de s'exécuter. */
const S = { bucket:'all', q:'', sort:'note', open:null, range:null };

/* Les jeux dans l'ordre où la fiche ouverte les feuillette — figé à
   l'ouverture, relu par render() qui y retrouve la fiche après un
   rafraîchissement. Sa place ici, loin de la fiche à laquelle il sert, est
   dictée par la même règle que S juste au-dessus : demarrer() appelle
   render(), et un let lu avant sa ligne de déclaration lève une
   ReferenceError. */
let SHEET_LIST = [];

/* ---------- identité et cache des tuiles du mur ----------
   Ici plutôt qu'auprès de renderWall(), pour la raison déjà donnée deux
   fois au-dessus : demarrer() rend le mur avant que le script ait fini de
   s'exécuter, et le premier rendu appelle cleTuile() pour chaque jeu.
   Toute nouvelle liaison lue pendant ce premier rendu doit se déclarer
   dans ce bloc, pas à côté du code qui s'en sert.

   Les tuiles déjà construites, retrouvées par clé d'un rendu à l'autre. */
const TUILES = new Map();
// séparateur invisible entre les morceaux d'une clé : ni un nom d'onglet
// ni un nom de jeu ne peut le contenir, donc aucune collision possible
const SEP = '\u0001';
/* La clé d'une tuile : l'id du jeu, stable et unique — ce que `row`
   donnait avant que la base remplace les feuilles (voir journal.py). */
const cleTuile = x => String(x.id);
/* Tout ce que la tuile donne à voir. Si rien n'a bougé là-dedans, le nœud
   existant fait l'affaire tel quel. L'adresse de la jaquette en fait partie
   plutôt que le seul nom : elle change quand l'image arrive, quand elle est
   remplacée, ou quand le manifeste apprend qu'elle n'existe pas — trois cas
   où la tuile doit être refaite, et un seul terme pour les couvrir. */
const sigTuile = x => [x.name, x.rating, x.hours, x.bucket, x.release,
                       coverURL(cleJaquette(x)), sigPromo(x)].join(SEP);

/* Suggestions IGDB (voir « Découverte par similarité » plus bas). Déclarées
   ici pour la même raison que tout ce bloc : render() appelle désormais
   renderDecouverte(), et render() s'exécute depuis demarrer(), quelques
   lignes plus bas, avant que le script ait fini de se dérouler. */
const DECOUVERTE_GRAINES = 8;
let DECOUVERTE = null;          // null = jamais demandé, [] = rien à proposer
let decouverteEnVol = false;
/* Les titres déjà proposés dans cette session. Ils partent en exclusion
   avec la demande suivante : c'est ce qui fait que « Rafraîchir » montre
   autre chose, même quand le tirage retombe sur les mêmes jeux de départ. */
const DECOUVERTE_VUS = new Set();

/* ---------- qui suis-je, et quels journaux existent ----------
   Un seul appel au démarrage : l'annuaire des journaux publics, plus l'état
   de la session. C'est lui qui remplit SOURCES, jusqu'ici écrit en dur. */
let MOI = { connecte: false, pseudo: null };

async function chargeAnnuaire(){
  const r = await fetch('/api/journal', {credentials: 'same-origin'});
  const d = await r.json();
  if(!d.ok) throw new Error(d.message || 'annuaire illisible');
  MOI = { connecte: !!d.connecte, pseudo: d.moi ? d.moi.pseudo : null };
  SOURCES = (d.journaux || []).map(j => ({
    nom: j.pseudo,
    titre: j.titre,
    jeux: j.jeux,
    avatar: j.avatar,
    banniere: j.banniere,
    url: '/api/journal/' + encodeURIComponent(j.pseudo),
  }));
  /* Le sien d'abord : c'est celui qu'on vient consulter neuf fois sur dix,
     et c'est le seul qu'on puisse modifier. Un journal prive n'apparait pas
     dans cet annuaire, qui ne liste que les journaux publics : on l'ajoute
     nous-memes plutot que de laisser la page par defaut retomber sur
     n'importe qui d'autre. `moi` sert à la recherche : c'est ce qui lui
     fait dire « Ton journal » — avec son nombre de jeux, connu même quand
     le journal est privé et absent de l'annuaire ci-dessus. */
  if(MOI.pseudo){
    const i = SOURCES.findIndex(x => x.nom === MOI.pseudo);
    if(i > 0) SOURCES.unshift(SOURCES.splice(i, 1)[0]);
    else if(i < 0) SOURCES.unshift({nom: MOI.pseudo,
                                     url: '/api/journal/' + encodeURIComponent(MOI.pseudo)});
    SOURCES[0].moi = true;
    SOURCES[0].jeux = d.moi.jeux;
    SOURCES[0].avatar = d.moi.avatar;
    SOURCES[0].banniere = d.moi.banniere;
  }
}

function ouvrirLeMien(){
  const i = SOURCES.findIndex(x => x.nom === MOI.pseudo);
  if(i >= 0 && i !== SRC) choisirClasseur(i);
  else if(i >= 0) charger();
}

/* Créer son journal : une seule requête, et le serveur renvoie la page vide
   toute prête. Rejouable sans dégât, il rend l'existant s'il y en a un. */
async function creerMonJournal(){
  try{
    const data = await (async ()=>{
      const r = await fetch('/api/journal', {
        method: 'POST', credentials: 'same-origin',
        headers: {'Content-Type': 'application/json'}, body: '{}',
      });
      const d = await r.json();
      if(!r.ok || d.ok === false) throw new Error(d.message || 'création impossible');
      return d;
    })();
    MOI.pseudo = data.pseudo;
    SOURCES.unshift({nom: data.pseudo, titre: data.titre, moi: true, jeux: 0,
                     url: '/api/journal/' + encodeURIComponent(data.pseudo)});
    SRC = 0; memoriseClasseur();
    PREMIERE_FOIS = true;
    applyData(data, true); showApp(); render();
    toast('Ton journal est prêt. Ajoute ton premier jeu.');
  }catch(e){
    toast('Création impossible — ' + (e.message || 'erreur inconnue'), true);
  }
}

(async function demarrer(){
  document.documentElement.style.setProperty('--cov-ratio', CONFIG.coverRatio);
  /* Part avant tout le reste, et sans qu'on l'attende : le rendu se fait
     avec le manifeste de la dernière visite, celui-ci le corrige derrière
     s'il a changé. Attendre sa réponse retarderait l'affichage du cache,
     qui est justement ce qu'on veut instantané. */
  chargeManifeste();
  majEtat('offline', 'connexion...');

  /* L'annuaire vient avant tout : sans lui on ne sait même pas quel journal
     ouvrir. C'est le seul temps d'attente incompressible de la page. */
  try{ await chargeAnnuaire(); }
  catch(e){ showGate('<b>Serveur injoignable.</b> Le hub Abyss ne répond pas.'); return; }

  /* Connecté sans journal : plutôt que d'atterrir par défaut sur celui d'un
     inconnu, on propose tout de suite d'en créer un. */
  if(MOI.connecte && !MOI.pseudo){ showInvite(); return; }

  /* Le sien avant tout le reste : chargeAnnuaire() l'a placé en tête de
     SOURCES, donc c'est toujours lui qui s'ouvre en arrivant depuis Abyss,
     peu importe le dernier classeur consulté. Ce souvenir ne sert donc plus
     qu'à qui n'a pas de journal à soi — pour retomber sur le même journal
     public d'une visite à l'autre. */
  if(MOI.pseudo){
    SRC = 0;
  } else {
    try{
      const vu = localStorage.getItem(CLE_CLASSEUR);
      const i = vu ? SOURCES.findIndex(x => x.url === vu) : -1;
      if(i >= 0) SRC = i;
    }catch(e){}
  }

  majEntete();
  const s = source();
  if(!s || !s.url){ showGate(null); return; }

  // le cache s'affiche tout de suite, quitte à ne pas être à jour : la vraie
  // requête part en même temps, en silence, et remplace dès qu'elle répond
  const cache = cacheStore.get(s.url);
  if(cache && cache.jeux && cache.jeux.length){
    applyData(cache, false);
    showApp();
    render();
    charger({silencieux:true});
  } else {
    squelette();
    charger();
  }
})();


function current(){
  let g = GAMES.slice();
  if(S.bucket!=='all') g = g.filter(x=>x.bucket===S.bucket);
  return g;
}
function binOf(note, R){
  return Math.max(0, Math.min(R.n-1, Math.floor((note - R.lo) / R.step)));
}
function dansTranche(x){
  const R = S.range;
  if(!R) return true;
  if(x.rating===null) return false;
  return binOf(x.rating, R) === R.i;
}
function chronoKey(g){
  // un jeu en cours n'a pas de date de fin : il se range après tout le reste,
  // sinon sa date de sortie l'éparpillerait au milieu des années terminées.
  // La wishlist vient encore après : elle n'a même pas de date de début.
  if(estWishlist(g)) return 9.1e9;
  if(estEnCours(g)) return 9e9;
  return (g.year ?? yearOf(g.release) ?? 0)*100 + (g.month ?? 0);
}
function filtered(){
  let g = current();
  // « Tout » mélangerait des jeux finis avec des jeux en cours ou convoités,
  // sans note ni temps de jeu : ils restent visibles dans leur propre onglet,
  // mais pas ici
  if(S.bucket==='all') g = g.filter(x=>!estStatut(x));
  if(S.range) g = g.filter(dansTranche);
  if(S.q){
    const q = norm(S.q);
    g = g.filter(x=>norm(x.name).includes(q));
  }
  const by = {
    note:      (a,b)=>(b.rating??-1)-(a.rating??-1),
    note_asc:  (a,b)=>(a.rating??99)-(b.rating??99),
    chrono:    (a,b)=>chronoKey(a)-chronoKey(b) || (b.rating??0)-(a.rating??0),
    release:   (a,b)=>String(b.release||'').localeCompare(String(a.release||'')),
    /* Solde : la plus forte remise en tête. Les jeux sans promotion valent
       tous 0 et se départagent par date de sortie, pour que le bas de la
       liste reste le calendrier qu'on y attend. */
    solde:     (a,b)=>remiseDe(b) - remiseDe(a)
                   || String(a.release||'9999').localeCompare(String(b.release||'9999')),
    /* Croissant : la prochaine sortie en tête. Un jeu sans date annoncée n'a
       pas sa place dans un calendrier — le 9999 le renvoie à la fin, au lieu
       de le laisser squatter le haut avec une chaîne vide. */
    release_asc: (a,b)=>String(a.release||'9999').localeCompare(String(b.release||'9999')),
    time:      (a,b)=>(b.hours??-1)-(a.hours??-1),
    az:        (a,b)=>a.name.localeCompare(b.name,'fr'),
  }[S.sort];
  return g.sort(by);
}

/* ---------- rendu : onglets ----------
   « Tout », puis un menu déroulant qui regroupe les périodes, puis « En cours »
   et « Wishlist » en boutons séparés : ce sont des statuts, pas des périodes,
   et on veut y aller d'un seul clic. Regrouper les années évite aussi que la
   barre s'allonge sans fin à chaque nouvelle année. */
function choisirOnglet(k){
  closePer();
  S.bucket = k;
  S.range = null;   // l'histogramme est recalculé : la tranche choisie ne vaut plus
  render();
}
function closePer(){
  const m = document.getElementById('perMenu');
  if(!m || m.hidden) return;
  m.hidden = true;
  const b = document.getElementById('perBtn');
  if(b) b.setAttribute('aria-expanded', 'false');
}
function togglePer(periodes){
  const m = document.getElementById('perMenu');
  if(!m) return;
  const ouvert = m.hidden;
  if(ouvert){
    closeMenu(); fermerRecherche();               // un seul menu ouvert à la fois
    m.innerHTML = periodes.map(b=>
      `<button class="menu-item${b===S.bucket?' on':''}${
         b===ONGLET_DEFAUT?' defaut':''}" role="menuitem" data-b="${esc(b)}">
         ${esc(b)}${b===S.bucket?'<span class="tick">✓</span>':''}</button>`).join('');
    m.querySelectorAll('.menu-item').forEach(x=>{
      x.onclick = ()=> choisirOnglet(x.dataset.b);
      x.oncontextmenu = e => menuOnglet(e, x.dataset.b);
    });
  }
  m.hidden = !ouvert;
  document.getElementById('perBtn').setAttribute('aria-expanded', ouvert ? 'true' : 'false');
}
/* ---------- clic droit sur un onglet ----------
   Un seul choix pour l'instant, mais un vrai menu contextuel plutôt qu'une
   bascule directe : un clic droit qui agit tout seul, sans rien montrer,
   est impossible à découvrir et impossible à annuler.

   Réservé au propriétaire : le réglage s'écrit dans son classeur. Chez
   quelqu'un d'autre, le clic droit rend la main au navigateur — son menu
   habituel vaut mieux que le nôtre, qui n'aurait rien à proposer. */
function fermeMenuOnglet(){
  const m = document.getElementById('ongletMenu');
  if(m) m.remove();
}
function menuOnglet(e, onglet){
  if(!CAN_WRITE || !onglet) return;      // pas chez moi : menu du navigateur
  e.preventDefault();
  e.stopPropagation();
  fermeMenuOnglet();
  const actuel = onglet === ONGLET_DEFAUT;
  const m = document.createElement('div');
  m.id = 'ongletMenu';
  m.className = 'menu onglet-menu';
  m.innerHTML = `<button class="menu-item" type="button">${
    actuel ? 'Ne plus ouvrir sur cet onglet' : 'Définir comme onglet par défaut'}</button>`;
  document.body.appendChild(m);
  /* posé après l'insertion : sa taille n'est connue qu'une fois dans la
     page, et sans elle on ne peut pas l'empêcher de déborder à droite */
  const l = Math.min(e.clientX, innerWidth - m.offsetWidth - 8);
  const t = Math.min(e.clientY, innerHeight - m.offsetHeight - 8);
  m.style.left = Math.max(8, l) + 'px';
  m.style.top  = Math.max(8, t) + 'px';
  m.querySelector('.menu-item').onclick = ()=>{
    fermeMenuOnglet();
    poseOngletDefaut(actuel ? null : onglet);
  };
}
document.addEventListener('click', fermeMenuOnglet);
document.addEventListener('scroll', fermeMenuOnglet, true);
window.addEventListener('resize', fermeMenuOnglet);

async function poseOngletDefaut(onglet){
  try{
    const data = await envoyer('POST', '/api/journal/onglet-defaut', {onglet: onglet});
    cacheStore.set(source().url, data);
    /* applyData remet PREMIERE_FOIS à false depuis longtemps : l'onglet
       affiché ne bouge donc pas sous les doigts. On ne fait que réafficher
       la barre pour que la puce suive. */
    applyData(data, true);
    renderTabs();
    toast(onglet ? `Ton classeur s'ouvrira sur « ${onglet} ».`
                 : "Ton classeur s'ouvrira de nouveau sur l'année la plus récente.");
  }catch(err){ toast(err.message || 'Enregistrement impossible', true); }
}

function renderTabs(){
  const t = document.getElementById('tabs');
  const periodes = BUCKETS.filter(b => !estStatutNom(b));
  const statuts  = BUCKETS.filter(estStatutNom);   // garde l'ordre de la feuille
  const surPeriode = periodes.indexOf(S.bucket) >= 0;
  /* Pas de compteur sur les onglets : le chiffre alourdissait une barre
     qu'on parcourt du regard. Il est allé dans le bandeau juste en dessous,
     où « Jeux terminés » le donnait déjà pour les années. */
  /* L'onglet d'ouverture porte une puce. Un titre l'explique au survol :
     une pastille muette laisserait deviner, et personne ne devine. */
  const marque = k => k && k === ONGLET_DEFAUT
    ? ' data-defaut="1" title="S\'ouvre sur cet onglet"' : '';
  const bouton = (k, l) =>
    `<button class="tab" role="tab" data-b="${esc(k)}"${marque(k)
      } aria-selected="${S.bucket===k}">${esc(l)}</button>`;

  t.innerHTML = bouton('all', 'Tout')
    + (periodes.length ? `<span class="tab-wrap">
        <button class="tab tab-menu" id="perBtn" role="tab" aria-haspopup="true"${
          periodes.indexOf(ONGLET_DEFAUT) >= 0
            ? ' data-defaut="1" title="S\'ouvre sur un onglet de cette liste"' : ''}
                aria-expanded="false" aria-selected="${surPeriode}">
          <span>${esc(surPeriode ? S.bucket : 'Catégories')}</span>
          <svg class="tab-chev" width="10" height="10" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        <div class="menu per-menu" id="perMenu" hidden role="menu"></div>
      </span>` : '')
    + statuts.map(b => bouton(b, b)).join('');

  t.querySelectorAll('.tab[data-b]').forEach(b=>{
    b.onclick = ()=> choisirOnglet(b.dataset.b);
    b.oncontextmenu = e => menuOnglet(e, b.dataset.b);
  });
  const pb = document.getElementById('perBtn');
  if(pb) pb.addEventListener('click', e=>{ e.stopPropagation(); togglePer(periodes); });
}

/* ---------- rendu : le tri ---------- */
function familleTri(){
  if(estWishlistNom(S.bucket)) return 'wishlist';
  return estStatutNom(S.bucket) ? 'statut' : 'periode';
}
function renderSort(){
  const famille = familleTri();
  const permis = TRIS_PAR_FAMILLE[famille];
  const dispo = TRIS.filter(([k]) => permis.indexOf(k) >= 0);
  // on reprend le tri retenu pour cette famille d'onglets
  let tri = TRI_MEMO[famille];
  if(!dispo.some(([k]) => k === tri)) tri = 'az';   // garde-fou
  S.sort = TRI_MEMO[famille] = tri;
  document.getElementById('sort').innerHTML = dispo.map(([k,l]) =>
    `<option value="${esc(k)}"${k === tri ? ' selected' : ''}>${esc(l)}</option>`).join('');

/* ---------- rendu : stats ---------- */

/* « En cours » et « Wishlist » n'ont ni jeu terminé, ni note, ni temps de
   jeu : les quatre grandes cases n'y montreraient que des tirets. Une seule
   ligne de chiffres à la place — et c'est elle qui porte désormais le nombre
   de jeux, que les onglets n'affichent plus. */
function renderStatsStatut(){
  const jeux = current();
  const wish = estWishlistNom(S.bucket);
  // « jeu » fait « jeux », pas « jeus » : les noms en -eu prennent un x.
  // « en wishlist » et « en cours » ne s'accordent pas, ce sont des états.
  const pluriel = jeux.length > 1 ? 'x' : '';
  const lignes = [[String(jeux.length),
    `jeu${pluriel} ${wish ? 'en wishlist' : 'en cours'}`]];

  if(wish){
    // les soldes ne sont connus qu'une fois les tarifs Steam arrivés : la
    // ligne se complète d'elle-même au rendu suivant
    const soldes = jeux.filter(x => remiseDe(x) > 0).length;
    if(soldes) lignes.push([String(soldes), `en solde`]);
    const fort = jeux.reduce((a,x)=> a + (x.base || 0), 0);
    if(fort) lignes.push([EUR.format(fort), 'au prix fort']);
    /* Ce que la liste coûterait aujourd'hui : le tarif du jour quand on le
       connaît, le prix du classeur sinon. Affiché seulement s'il diffère du
       prix fort, sinon la ligne répéterait deux fois la même somme. */
    const jour = jeux.reduce((a,x)=>{
      const tarif = TARIFS[x.name];
      return a + ((tarif && tarif.actuel != null) ? tarif.actuel : (x.base || 0));
    }, 0);
    if(jour && Math.abs(jour - fort) >= 0.005) lignes.push([EUR.format(jour), "aujourd'hui"]);
  }else{
    const paye = jeux.reduce((a,x)=> a + (x.paid || 0), 0);
    if(paye) lignes.push([EUR.format(paye), 'déjà payés']);
  }

  document.getElementById('statsWrap').hidden = false;
  const boite = document.getElementById('stats');
  boite.className = 'stats ligne';
  boite.innerHTML = lignes.map(([b,u]) =>
    `<span><b>${esc(b)}</b>${esc(u)}</span>`).join('');
}

function renderStats(){
  if(estStatutNom(S.bucket)) return renderStatsStatut();
  document.getElementById('statsWrap').hidden = false;
  document.getElementById('stats').className = 'stats';
  // un jeu de la wishlist n'est pas acheté : il ne pèse nulle part, pas même
  // dans les prix — sinon « Payé » compterait de l'argent jamais sorti
  const tout = current().filter(x=>!estWishlist(x));
  // un jeu en cours ne compte pas comme terminé, mais il est bien acheté :
  // il sort de la moyenne et du temps de jeu, il reste dans les prix
  const g = tout.filter(x=>!estEnCours(x));
  const nEnCours = tout.length - g.length;
  const rated = g.filter(x=>x.rating!==null);
  const avg = rated.length ? rated.reduce((s,x)=>s+x.rating,0)/rated.length : null;
  const base = tout.reduce((s,x)=>s+(x.base||0),0);
  const paid = tout.reduce((s,x)=>s+(x.paid||0),0);
  const hrs  = g.reduce((s,x)=>s+(x.hours||0),0);
  const cards = [
    ['Jeux terminés', g.length, nEnCours ? `+ ${nEnCours} en cours` : ''],
    ['Note moyenne', avg!==null?fr(avg,2):'—', ''],
    ['Temps de jeu', hrs?hoursFmt(hrs):'—', hrs?`≈ ${Math.round(hrs/24)} jours`:''],
    ['Payé', paid?EUR.format(paid):'—', base?`sur ${EUR.format(base)} de prix fort`:''],
  ];
  document.getElementById('stats').innerHTML = cards.map(([u,b,i])=>
    `<div class="stat"><u>${u}</u><b>${b}</b><i>${i||''}</i></div>`).join('');
}

/* ---------- rendu : répartition des notes ---------- */
function renderDist(){
  const sec  = document.getElementById('dist');
  const rated = current().filter(x=>x.rating!==null);
  if(rated.length < 3){ sec.hidden = true; S.range = null; return; }
  sec.hidden = false;

  const notes = rated.map(x=>x.rating).sort((a,b)=>a-b);
  let lo = Math.floor(notes[0]), hi = Math.ceil(notes[notes.length-1]);
  if(hi - lo < 3){ hi = Math.min(10, lo + 3); lo = Math.max(0, hi - 3); }
  const span = hi - lo;
  // pas de 0,5 (ou 0,2 sur une plage courte) : un multiple exact du dixième,
  // sinon les barres alternent haut/bas juste à cause du découpage
  const STEP = span <= 4 ? 0.2 : 0.5;
  const n = Math.round(span / STEP);
  // le découpage a bougé (autre onglet, jeu ajouté...) : la tranche choisie ne veut plus rien dire
  if(S.range && (S.range.lo !== lo || S.range.step !== STEP || S.range.n !== n)) S.range = null;
  const bins = new Array(n).fill(0);
  notes.forEach(r=>{
    const i = Math.floor((r - lo) / STEP);
    bins[Math.max(0, Math.min(n-1, i))]++;
  });
  const max = Math.max(...bins);
  const avg = notes.reduce((s,x)=>s+x,0) / notes.length;
  const mid = notes.length % 2
    ? notes[(notes.length-1)/2]
    : (notes[notes.length/2 - 1] + notes[notes.length/2]) / 2;
  const pos = v => ((v - lo) / span) * 100;

  document.getElementById('distHint').textContent =
    `moyenne ${fr(avg,2)} · médiane ${fr(mid,2)}`;

  const barsHTML = bins.map((c,i)=>{
    const a = lo + i*STEP, b = a + STEP;
    const h = c ? Math.max(3, c/max*100) : 0;
    return `<button class="bar" type="button"
      data-i="${i}" data-c="${c}" data-a="${fr(a,2)}" data-b="${fr(b,2)}"
      aria-label="${c} jeu${c>1?'x':''} entre ${fr(a,2)} et ${fr(b,2)}${c?" — n'afficher que ceux-là":''}">
      <i style="height:${h}%;background:${noteColor(a + STEP/2)}"></i></button>`;
  }).join('');
  const avgP = pos(avg);
  document.getElementById('hist').innerHTML = barsHTML +
    `<div class="avg${avgP > 70 ? ' flip' : ''}" style="left:${avgP.toFixed(2)}%"><span>moy. ${fr(avg,2)}</span></div>`;

  const stepTick = span <= 8 ? 1 : 2;
  const ticks = [];
  for(let t = lo; t <= hi; t += stepTick) ticks.push(t);
  if(ticks[ticks.length-1] !== hi) ticks.push(hi);
  document.getElementById('haxis').innerHTML = ticks.map(t=>
    `<span style="left:${pos(t).toFixed(2)}%">${t}</span>`).join('');

  const tip = document.getElementById('tip');
  document.getElementById('hist').querySelectorAll('.bar').forEach(bar=>{
    const show = ()=>{
      const c = +bar.dataset.c;
      tip.innerHTML = `<b>${c}</b> jeu${c>1?'x':''} · ${bar.dataset.a} → ${bar.dataset.b}`;
      const box = tip.parentElement.getBoundingClientRect();
      const fill = bar.querySelector('i').getBoundingClientRect();
      const x = fill.left - box.left + fill.width/2;
      tip.style.left   = Math.round(Math.min(Math.max(x, 80), Math.max(80, box.width - 80))) + 'px';
      tip.style.bottom = Math.round(box.bottom - fill.top + 8) + 'px';   // juste au-dessus de la barre
      tip.classList.add('show');
    };
    const hide = ()=> tip.classList.remove('show');
    bar.addEventListener('pointerenter', show);
    bar.addEventListener('pointerleave', hide);
    bar.addEventListener('click', ()=>{
      if(!+bar.dataset.c) return;               // tranche vide : rien à filtrer
      const i = +bar.dataset.i;
      // reclic sur la même tranche : on enlève le filtre
      S.range = (S.range && S.range.i === i)
        ? null
        : { lo, step:STEP, n, i, a: lo + i*STEP, b: lo + (i+1)*STEP };
      majDist(); renderWall();
    });
  });
  majDist();
}
/* Reflète S.range sur l'histogramme sans le redessiner. */
function majDist(){
  const hist = document.getElementById('hist');
  hist.classList.toggle('picked', !!S.range);
  hist.querySelectorAll('.bar').forEach(b=>{
    const on = !!S.range && +b.dataset.i === S.range.i;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  const c = document.getElementById('distClear');
  c.hidden = !S.range;
  if(S.range) c.innerHTML = `notes ${fr(S.range.a,2)} → ${fr(S.range.b,2)}<span>×</span>`;
}
function viderTranche(){
  if(!S.range) return;
  S.range = null; majDist(); renderWall();
}
document.getElementById('distClear').addEventListener('click', viderTranche);

/* ---------- rendu : mur ---------- */
function groupLabel(g){
  if(estStatut(g)) return statutDe(g);
  if(g.year && g.month) return `${MONTHS[g.month-1]} ${g.year}`;
  if(g.year) return `${g.year} · mois non noté`;
  return g.bucket;
}
/* L'intérieur d'une tuile, sans son <button> : celui-ci est réutilisé d'un
   rendu à l'autre, seul son contenu est réécrit quand le jeu a changé. */
function tileInner(x, i){
  const statut = statutDe(x);
  /* Sous le titre : le temps de jeu pour un jeu terminé, le compte à rebours
     pour un jeu convoité. Les deux ne se rencontrent jamais — un jeu de la
     wishlist n'a pas d'heures au compteur — donc une seule ligne suffit. */
  const attente = estWishlist(x) ? compteARebours(x.release) : null;
  const meta = attente
    ? `<span class="tmeta${attente.avant ? ' avant' : ''}">${esc(attente.txt)}</span>`
    : x.hours ? `<span class="tmeta">${hoursFmt(x.hours)}</span>` : '';
  /* La promotion du jour, dans le coin opposé à la pastille de statut. Le
     prix exact tient dans l'infobulle : sur une vignette de 158 px, le
     pourcentage est ce qui se lit d'un coup d'œil, pas « 23,99 € ». */
  const t = estWishlist(x) ? TARIFS[x.name] : null;
  const promo = t && t.remise > 0
    ? `<span class="tpromo" title="${esc(money(t.actuel))} au lieu de ${esc(money(t.plein))}">−${t.remise}&#8239;%</span>`
    : '';
  return `${promo}${statut
      ? `<span class="tnote ${estWishlist(x) ? 'wish' : 'encours'}">${esc(statut)}</span>`
      : `<span class="tnote" style="color:${noteColor(x.rating)}">${x.rating!==null?fr(x.rating,1):'—'}</span>`}
    ${coverTag(x, 'big', i < PRIORITAIRES)}
    <span class="tcap">
      <span class="tn">${esc(x.name)}</span>
      ${meta}
    </span>`;
}
/* pixel transparent : réaffecter src coupe net un téléchargement en cours */
const PIXEL = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
/* Coupe les jaquettes encore en vol et renvoie combien. Une image déjà
   arrivée n'est pas touchée : elle ne coûte plus rien et resservira telle
   quelle. data-off dit au gestionnaire d'erreur d'ignorer le pixel — sans
   lui il prendrait l'annulation pour un échec et poserait des initiales. */
function annuleCovers(root){
  let coupees = 0;
  root.querySelectorAll('img.cov[src]').forEach(im=>{
    if(im.complete) return;
    im.dataset.off = '1';
    im.src = PIXEL;
    coupees++;
  });
  return coupees;
}

/* La tuile de ce jeu : celle qui existe déjà, ou une neuve. */
function tuilePour(cle, x, i){
  const sig = sigTuile(x);
  let el = TUILES.get(cle);
  if(!el){
    el = document.createElement('button');
    el.type = 'button';
    el.className = 'tile';
    TUILES.set(cle, el);
  }
  // refaire l'intérieur seulement si le jeu a changé, ou si sa jaquette a
  // été coupée en route pendant qu'il était hors écran
  if(el.dataset.sig !== sig || el.dataset.coupee){
    /* Le rang sert à la priorité de chargement de la jaquette. Il n'est pas
       dans la signature exprès : une tuile qui change simplement de place
       n'a pas à être refaite, et son image est de toute façon déjà là. */
    el.innerHTML = tileInner(x, i);
    delete el.dataset.coupee;
    el.dataset.sig = sig;
    /* Le liseré de note du bas de la jaquette. Posé sur la tuile et hérité
       par la case, plutôt que sur l'image : hydrateCovers() remplace
       celle-ci par une case d'initiales quand le fichier manque, et ne
       recopie pas ses styles — la variable, elle, s'hérite. */
    if(x.rating === null || x.rating === undefined) el.style.removeProperty('--note');
    else el.style.setProperty('--note', noteColor(x.rating));
    hydrateCovers(el);
  }
  el.dataset.i = i;   // le rang dans filtered(), que la fiche relit au clic
  el.dataset.id = x.id;
  return el;
}

/* Le mur est réordonné, pas reconstruit. Réécrire innerHTML coûtait deux
   fois : le navigateur rebâtissait tout, et surtout chaque jaquette
   repartait de zéro alors qu'elle était déjà là et déjà décodée. Trier,
   taper dans la recherche ou recevoir un rafraîchissement de fond ne fait
   donc plus clignoter le mur. appendChild() déplace un nœud déjà dans le
   document, il ne le recrée pas : c'est ce qui rend l'opération gratuite. */
function renderWall(){
  const out = document.getElementById('out');
  const g = filtered();

  const vues = new Set();
  const frag = document.createDocumentFragment();
  let mur = null, groupe = null;
  const nouveauMur = ()=>{
    mur = document.createElement('div');
    mur.className = 'wall';
    frag.appendChild(mur);
  };
  if(g.length && S.sort !== 'chrono') nouveauMur();

  g.forEach((x, i)=>{
    // en tri chronologique le mur est coupé par des intertitres de mois
    if(S.sort === 'chrono'){
      const nom = groupLabel(x);
      if(nom !== groupe){
        const titre = document.createElement('div');
        titre.className = 'grouphead';
        titre.textContent = nom;
        frag.appendChild(titre);
        groupe = nom;
        nouveauMur();
      }
    }
    const cle = cleTuile(x);
    vues.add(cle);
    mur.appendChild(tuilePour(cle, x, i));
  });

  /* Les jaquettes des tuiles qui quittent l'écran libèrent leur connexion,
     comme avant — le mur qui arrive en a besoin. La tuile est marquée pour
     qu'un retour à l'écran la reconstruise plutôt que d'afficher le pixel
     transparent qu'on vient de lui mettre. */
  TUILES.forEach((el, cle)=>{
    if(vues.has(cle) || el.dataset.coupee) return;
    if(annuleCovers(el)) el.dataset.coupee = '1';
  });

  if(!g.length){ out.innerHTML = emptyHTML(); return; }
  out.replaceChildren(frag);
}
/* Les tuiles des jeux qui ont quitté le classeur : sans ce ménage la Map
   enflerait à chaque relecture. Appelée quand GAMES est reconstruit. */
function oublieTuiles(){
  const vivantes = new Set(GAMES.map(cleTuile));
  TUILES.forEach((_, cle)=>{ if(!vivantes.has(cle)) TUILES.delete(cle); });
}
/* Un seul gestionnaire pour tout le mur, posé une fois : réattacher un
   onclick par tuile à chaque rendu annulerait le bénéfice de les garder.
   Le bouton de téléchargement d'une jaquette arrête la propagation de son
   côté, il ne remonte donc jamais jusqu'ici. */
document.getElementById('out').addEventListener('click', e=>{
  const t = e.target.closest('.tile');
  if(!t) return;
  if(t.dataset.i !== undefined) ouvreFiche(+t.dataset.i, t);
});

function emptyHTML(){
  if(S.q || S.range){
    return `<div class="empty"><h3>Aucun jeu trouvé...</h3>`
  }
  return `<div class="empty">
    <h3>Cet onglet est vide</h3>
  </div>`;
}

/* =======================================================================
   Découverte par similarité — wishlist seulement

   IGDB tient un champ similar_games sur chaque fiche. On lui donne
   quelques-uns des jeux qu'on a le mieux notés, il répond ce qu'il juge
   proche, et on retire ce qui est déjà au classeur.

   La section ne vit que dans l'onglet Wishlist, jamais sur le mur
   principal : le mur raconte ce qu'on a joué, et y glisser des jeux qu'on
   ne possède pas brouillerait la seule chose qu'il sait bien faire. La
   wishlist, elle, est exactement l'endroit où l'on se demande à quoi jouer
   ensuite.

   Chaque suggestion garde le jeu qui l'a amenée. « Parce que tu as mis 9,5
   à Hollow Knight » est le cœur de la fonction : sans cette phrase, ce
   n'est qu'une liste de jeux de plus.
   ======================================================================= */
/* Les jeux qui servent de point de départ : tirés au sort parmi ceux notés
   8 ou plus. Au hasard et non les meilleurs, pour que la section change
   d'une visite à l'autre au lieu de ressasser les trois mêmes préférés. */
function grainesDecouverte(){
  const bons = GAMES.filter(x => !estStatut(x) && x.rating !== null && x.rating >= 8);
  const melange = bons.slice();
  for(let i = melange.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = melange[i]; melange[i] = melange[j]; melange[j] = t;
  }
  return melange.slice(0, DECOUVERTE_GRAINES)
    .map(x => ({nom:x.name, sortie:x.release || '', note:x.rating}));
}

/* Un tour de demande. Ce qu'on possède ET ce qu'on a déjà proposé partent
   ensemble comme exclusions : c'est le serveur qui écarte, pour qu'il puisse
   puiser plus loin au lieu de renvoyer douze jeux dont dix seraient jetés
   ici. C'est aussi ce qui fait que « Rafraîchir » montre autre chose même
   quand le tirage retombe sur les mêmes jeux de départ. */
async function demandeDecouverte(graines){
  const data = await api('/api/decouverte', {
    jeux: graines,
    connus: GAMES.map(x => x.name).concat(Array.from(DECOUVERTE_VUS)),
  });
  return (data && data.etat === 'ok' && data.suggestions) ? data.suggestions : [];
}

async function chargeDecouverte(relance){
  if(decouverteEnVol) return;
  if(DECOUVERTE && !relance) return;      // déjà fait, sauf demande explicite
  const graines = grainesDecouverte();
  if(!graines.length){ DECOUVERTE = []; renderDecouverte(); return; }
  decouverteEnVol = true;
  DECOUVERTE = null;
  renderDecouverte();                     // affiche l'attente
  try{
    let trouve = await demandeDecouverte(graines);
    /* Rien de neuf : on a fait le tour de ce qu'IGDB rapproche de ces
       jeux-là. On oublie ce qui a déjà été montré et on repart du début,
       plutôt que de laisser la section vide après un clic explicite. */
    if(!trouve.length && DECOUVERTE_VUS.size){
      DECOUVERTE_VUS.clear();
      trouve = await demandeDecouverte(graines);
    }
    trouve.forEach(s => DECOUVERTE_VUS.add(s.titre));
    DECOUVERTE = trouve;
  }catch(e){
    DECOUVERTE = [];
  }finally{
    decouverteEnVol = false;
  }
  renderDecouverte();
}

function carteDecouverte(s, i){
  const visuel = s.apercu
    ? `<img class="deco-img" src="${esc(s.apercu)}" alt="" loading="lazy" decoding="async">`
    : `<span class="deco-img deco-nue">${esc(initials(s.titre))}</span>`;
  const note = (s.note === null || s.note === undefined) ? '' : fr(s.note, 1);
  return `<article class="deco-carte">
    <a class="deco-lien" href="${esc(s.lien || '#')}" target="_blank" rel="noopener"
       aria-label="Voir ${esc(s.titre)} sur IGDB">${visuel}</a>
    <div class="deco-corps">
      <b class="deco-nom">${esc(s.titre)}</b>
      <i class="deco-date">${esc(s.date || 'date inconnue')}</i>
      <span class="deco-parce">Parce que tu as mis
        <b>${esc(note)}</b> à ${esc(s.parce_que)}</span>
      <button class="deco-plus" type="button" data-i="${i}">+ Wishlist</button>
    </div>
  </article>`;
}

/* Y a-t-il seulement de quoi suggérer ? Sans un jeu noté 8 ou plus, la
   section n'a rien sur quoi s'appuyer et ne s'affiche pas du tout. */
function aDesGraines(){
  return GAMES.some(x => !estStatut(x) && x.rating !== null && x.rating >= 8);
}

function renderDecouverte(){
  const hote = document.getElementById('deco');
  if(!hote) return;
  if(!estWishlistNom(S.bucket) || !aDesGraines()){
    hote.hidden = true; hote.innerHTML = '';
    return;
  }
  /* L'en-tête et son bouton restent en place dans tous les cas : c'est ce
     qui permet de relancer même quand la dernière tentative n'a rien donné,
     et ça évite que la section saute d'une hauteur à l'autre. */
  const corps = decouverteEnVol
    ? `<p class="deco-note"></p>`
    : !DECOUVERTE ? ''
    : DECOUVERTE.length
      ? `<div class="deco-grille">${DECOUVERTE.map(carteDecouverte).join('')}</div>`
      : `<p class="deco-note">Rien de plus à proposer pour l'instant — retente un tirage.</p>`;

  hote.hidden = false;
  hote.innerHTML = `<div class="deco-tete">
      <h2 class="deco-titre">Découvertes</h2>
      <button class="deco-neuf" type="button" id="decoNeuf"${decouverteEnVol ? ' disabled' : ''}
        >${decouverteEnVol ? 'Recherche...' : 'Rafraîchir'}</button>
    </div>${corps}`;

  const neuf = document.getElementById('decoNeuf');
  if(neuf) neuf.onclick = ()=> chargeDecouverte(true);
  hote.querySelectorAll('.deco-plus').forEach(b=>{
    b.onclick = ()=> ajouteWishlist(+b.dataset.i, b);
  });
}

/* Ajout en un clic : la même écriture que le formulaire, avec le nom, la
   date de sortie et rien d'autre — un jeu convoité n'a ni note, ni temps de
   jeu, ni prix payé. La jaquette suit dans la foulée, puisqu'IGDB vient de
   nous dire laquelle c'est. */
async function ajouteWishlist(i, btn){
  const s = DECOUVERTE && DECOUVERTE[i];
  if(!s) return;
  if(!CAN_WRITE){ toast('Passe en mode éditeur pour ajouter un jeu.', true); return; }
  const cible = ongletWishlist();

  btn.disabled = true;
  const texte = btn.textContent;
  btn.textContent = 'Ajout...';

  /* Le prix de base, par le même chemin que le formulaire : la suggestion
     porte déjà son identifiant IGDB, qui donne le lien Steam, qui donne le
     tarif. Demandé au clic et pas dans la liste des suggestions — les faire
     toutes aurait coûté deux appels par jeu pour un prix qu'on n'utilise
     qu'une fois sur douze.

     Un échec ne bloque rien : « pas sur Steam » est une réponse, pas une
     panne, et la case reste vide plutôt que de recevoir un chiffre inventé. */
  let base = null;
  try{
    const p = await api('/api/jeu/prix', {id: s.id});
    if(p && p.etat === 'ok' && p.prix !== null && p.prix !== undefined) base = p.prix;
  }catch(e){}

  try{
    const data = await envoyer('POST', '/api/journal/jeu', {
      periode: cible, review: '',
      values: {
        name: s.titre, rating: null, month: null, hours: null,
        base: base, paid: null, release: s.iso || null, id_igdb: s.id || null,
      },
    });
    cacheStore.set(source().url, data);
    applyData(data, true);
    // il est au classeur : il n'a plus rien à faire dans les suggestions
    DECOUVERTE = DECOUVERTE.filter((_, k) => k !== i);
    render();
    toast(`« ${s.titre} » ajouté à la wishlist`);
    if(s.image) poseJaquetteChoisie(s.titre, s.image, s.id);
  }catch(e){
    toast('Ajout impossible — ' + (e.message || 'erreur inconnue'), true);
    btn.disabled = false; btn.textContent = texte;
  }
}

/* ---------- la fiche, par-dessus le mur ----------
   Le classement est calculé sur l'onglet affiché, comme les stats et
   l'histogramme : « 3e sur 42 en 2026 ». Les jeux en cours, ceux de la
   wishlist et ceux sans note n'en font pas partie, et en dessous de trois
   jeux notés la position ne veut rien dire — on ne l'affiche pas. */
function rangJeu(g){
  if(!g || estStatut(g) || g.rating === null || g.rating === undefined) return null;
  const lot = current().filter(x => !estStatut(x) && x.rating !== null);
  if(lot.length < 3) return null;
  // ex aequo : deux 8,5 partagent le même rang, aucun ne passe devant l'autre
  const rang = lot.filter(x => x.rating > g.rating).length + 1;
  /* Le podium ne compte pas les rangs, il compte les notes : si trois jeux
     sont à 10, ils sont tous dorés — et celui qui vient juste après reste
     « argenté », même si son rang affiché saute à la 4e place. */
  const notes = Array.from(new Set(lot.map(x => x.rating))).sort((a,b)=>b-a);
  const palier = notes.indexOf(g.rating) + 1;
  return { rang, total: lot.length, palier, ou: S.bucket === 'all' ? 'au total' : 'en ' + S.bucket };
}
/* Le podium, comme sur un vrai podium : deux jeux à égalité sont tous les
   deux premiers, et le suivant est troisième — il n'y a pas d'argent cette
   année-là. */
const MEDAILLES = ['or','argent','bronze'];
function medailleDe(r){ return (r && r.palier && r.palier <= 3) ? MEDAILLES[r.palier - 1] : ''; }
function rangHTML(r, med){
  if(!r) return '';
