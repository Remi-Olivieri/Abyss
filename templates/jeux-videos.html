/* ---------- une capture en grand ----------
   La dernière fenêtre de la pile, et la plus simple : une image, deux
   flèches, rien à charger d'autre. On garde la liste entière plutôt que
   l'image seule, pour passer de l'une à l'autre sans revenir en arrière. */
const ZOOM = {images: [], i: 0};
function ouvrirZoom(images, i){
  if(!images || !images.length) return;
  ZOOM.images = images;
  ZOOM.i = Math.max(0, Math.min(i || 0, images.length - 1));
  const host = $('zoom');
  host.innerHTML = `<div class="zoom-boite" role="dialog" aria-modal="true" aria-label="Capture d'écran">
      <img id="zoomImg" alt="">
      <button class="sbtn zoom-x" aria-label="Fermer">×</button>
      ${images.length > 1 ? `<button class="sbtn zoom-prev" aria-label="Capture précédente">‹</button>
        <button class="sbtn zoom-next" aria-label="Capture suivante">›</button>
        <span class="zoom-rang"></span>` : ''}
    </div>`;
  host.hidden = false;
  verrouFond();
  host.querySelector('.zoom-x').onclick = fermerZoom;
  const prev = host.querySelector('.zoom-prev'), next = host.querySelector('.zoom-next');
  if(prev) prev.onclick = ()=> zoomBouge(-1);
  if(next) next.onclick = ()=> zoomBouge(1);
  peintZoom();
}
function peintZoom(){
  const img = $('zoomImg');
  if(!img) return;
  img.src = ZOOM.images[ZOOM.i];
  const rang = document.querySelector('#zoom .zoom-rang');
  if(rang) rang.textContent = `${ZOOM.i + 1} / ${ZOOM.images.length}`;
}
function zoomBouge(sens){
  if(ZOOM.images.length < 2) return;
  // on boucle : arrivé au bout, la suivante est la première
  ZOOM.i = (ZOOM.i + sens + ZOOM.images.length) % ZOOM.images.length;
  peintZoom();
}
function fermerZoom(){
  const host = $('zoom');
  if(host.hidden) return;
  host.hidden = true; host.innerHTML = '';
  verrouFond();
}
fermeSurFond('zoom', fermerZoom);

/* =======================================================================
   Bilan en image
   L'onglet affiché est redessiné sur un canvas de 1080 px de large, prêt
   à partager. Rien ne sort du navigateur : l'image est composée ici, à
   partir des jeux déjà chargés et des jaquettes déjà servies par Flask
   (même origine, donc le canvas n'est pas « teinté » et toBlob marche).
   ======================================================================= */
const BIL = {
  L: 1080, M: 72,
  texte:'#F2EDE4', doux:'#A79CB4', or:'#E5C46B', bleu:'#8FB8E8',
  trait:'rgba(242,237,228,.13)',
  display:'"Bricolage Grotesque",system-ui,sans-serif',
  corps:'"Karla",system-ui,sans-serif',
  mono:'"Azeret Mono",ui-monospace,monospace',
};
BIL.W = BIL.L - BIL.M*2;

/* Le reste du site écrit "300 h 15" (hoursFmt) : lisible dans une phrase.
   Le bilan, plus dense, resserre en "300h15" — pas d'espace autour du h. */
function bilHeures(h){
  if(h===null||h===undefined) return '—';
  const H = Math.floor(h), Min = Math.round((h-H)*60);
  return Min ? `${H}h${String(Min).padStart(2,'0')}` : `${H}h`;
}

/* --- petits outils de dessin --- */
function bilEcrire(c, t, x, y, o){
  c.save();
  c.font = o.f;
  if('letterSpacing' in c) c.letterSpacing = o.ls || '0px';
  c.fillStyle = o.c || BIL.texte;
  c.textAlign = o.a || 'left';
  c.textBaseline = o.b || 'alphabetic';
  c.fillText(t, x, y);
  c.restore();
}
/* toujours mesurer via save/restore : sinon un letterSpacing posé pour un
   texte reste actif et fausse toutes les mesures suivantes */
function bilLargeur(c, t, f, ls){
  c.save();
  c.font = f;
  if('letterSpacing' in c) c.letterSpacing = ls || '0px';
  const w = c.measureText(t).width;
  c.restore();
  return w;
}
function bilArrondi(c, x, y, w, h, r){
  r = Math.max(0, Math.min(r, w/2, h/2));
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y,   x+w, y+h, r);
  c.arcTo(x+w, y+h, x,   y+h, r);
  c.arcTo(x,   y+h, x,   y,   r);
  c.arcTo(x,   y,   x+w, y,   r);
  c.closePath();
}
function bilTrait(c, x, y, w){
  c.fillStyle = BIL.trait;
  c.fillRect(x, y, w, 1);
}
function bilFilet(c, y){ bilTrait(c, BIL.M, y, BIL.W); }
/* La proportion des jaquettes est réglée une seule fois, dans CONFIG :
   « 3 / 4 » vaut 0,75, donc une jaquette large de 348 px fait 464 px de haut. */
/* noteColor() rend « rgb(r,g,b) » quand il y a une note, et le gris « #6E6480»
   quand il n'y en a pas : les deux formes doivent se lire, sinon un jeu sans
   note repeint sa case d'initiales avec une couleur invalide. */
function bilRVB(couleur){
  const t = String(couleur).trim();
  if(t[0] === '#' && t.length >= 7) return hex2rgb(t);
  const m = t.match(/\d+/g);
  return (m && m.length >= 3) ? m.slice(0,3).map(Number) : [110,100,128];
}
/* Le métal d'une médaille, c'est la bande claire qui traverse : un aplat
   doré ne se lit que comme du jaune. Mêmes arrêts que le CSS de la fiche. */
const BIL_METAL = {
  or:     [[0,'#A9761E'],[.20,'#E7C46B'],[.38,'#FFF6D0'],[.52,'#E9C871'],[.72,'#B8862A'],[1,'#F6E2A4']],
  argent: [[0,'#6E7683'],[.20,'#C8CFD9'],[.38,'#FFFFFF'],[.52,'#CBD2DB'],[.72,'#8A929F'],[1,'#E8EDF3']],
  bronze: [[0,'#7A421F'],[.20,'#C87F4E'],[.38,'#F5C79B'],[.52,'#C9814F'],[.72,'#8E5228'],[1,'#E3A778']],
};
function bilMedaille(c, nom, x, y, w, h){
  const arrets = BIL_METAL[nom];
  if(!arrets) return null;
  const d = c.createLinearGradient(x, y, x + Math.max(40, w), y + h);
  arrets.forEach(([p, col])=> d.addColorStop(p, col));
  return d;
}
function bilRatio(){
  const m = String(CONFIG.coverRatio || '').match(/([\d.]+)\s*\/\s*([\d.]+)/);
  const r = m ? (+m[1]) / (+m[2]) : 0;
  return r > 0 ? r : 3/4;
}
/* Découpe un titre sur au plus maxLignes, en abrégeant la dernière. */
function bilCouper(c, t, largeur, maxLignes, f, ls){
  c.save();
  c.font = f;
  if('letterSpacing' in c) c.letterSpacing = ls || '0px';
  const mots = String(t).split(/\s+/).filter(Boolean);
  const lignes = [];
  let cur = '', i = 0;
  for(; i < mots.length; i++){
    const essai = cur ? cur + ' ' + mots[i] : mots[i];
    if(!cur || c.measureText(essai).width <= largeur){ cur = essai; continue; }
    lignes.push(cur); cur = mots[i];
    if(lignes.length >= maxLignes){ cur = ''; break; }
  }
  if(cur) lignes.push(cur);
  if(lignes.length){
    const trop = i < mots.length;
    let d = lignes[lignes.length-1];
    if(trop || c.measureText(d).width > largeur){
      while(d.length > 1 && c.measureText(d + '…').width > largeur) d = d.slice(0, -1);
      lignes[lignes.length-1] = d.replace(/\s+$/, '') + '…';
    }
  }
  c.restore();
  return lignes.length ? lignes : [''];
}

/* Comme bilCouper, mais sans limite : toutes les lignes sont rendues.
   C'est ce qu'il faut pour un avis, dont on ne veut couper aucun mot. */
function bilLignes(c, t, largeur, f, ls){
  c.save();
  c.font = f;
  if('letterSpacing' in c) c.letterSpacing = ls || '0px';
  const mots = String(t).split(/\s+/).filter(Boolean);
  const out = [];
  let cur = '';
  mots.forEach(m=>{
    const essai = cur ? cur + ' ' + m : m;
    if(!cur || c.measureText(essai).width <= largeur){ cur = essai; return; }
    out.push(cur); cur = m;
  });
  if(cur) out.push(cur);
  c.restore();
  return out.length ? out : [''];
}

/* --- ressources --- */
/* Canvas ne sait dessiner qu'avec les polices déjà chargées : sans ça, la
   première image sort en Arial. On les demande explicitement. */
async function bilPolices(){
  if(!document.fonts || !document.fonts.load) return;
  const l = [
    `800 128px ${BIL.display}`, `700 30px ${BIL.display}`, `500 17px ${BIL.display}`,
    `400 27px ${BIL.corps}`, `400 22px ${BIL.corps}`, `400 18px ${BIL.corps}`,
    `500 44px ${BIL.mono}`, `700 26px ${BIL.mono}`, `500 16px ${BIL.mono}`,
  ];
  try{ await Promise.all(l.map(f => document.fonts.load(f, 'AÉ0123456789'))); }catch(e){}
  try{ await document.fonts.ready; }catch(e){}
}
/* coverURL() porte déjà le paramètre ?v= de cache-buster une fois qu'une
   jaquette a été récupérée automatiquement : le bilan en profite tel quel. */
function bilCover(g){
  return new Promise(res=>{
    const url = coverURL(cleJaquette(g));
    if(!url) return res(null);
    const im = new Image();
    let fini = false;
    const stop = v => { if(!fini){ fini = true; res(v); } };
    im.onload  = ()=> stop(im);
    im.onerror = ()=> stop(null);
    // une jaquette qui ne répond pas ne doit pas bloquer l'image entière
    setTimeout(()=> stop(null), 8000);
    im.src = url;
  });
}
/* Jaquette recadrée, ou les initiales du jeu comme sur le mur. */
function bilJaquette(c, g, im, x, y, w, h){
  const r = 10;
  c.save();
  bilArrondi(c, x, y, w, h, r);
  c.clip();
  if(im && im.naturalWidth){
    const s = Math.max(w/im.naturalWidth, h/im.naturalHeight);
    const dw = im.naturalWidth*s, dh = im.naturalHeight*s;
    c.drawImage(im, x + (w-dw)/2, y + (h-dh)/2, dw, dh);
  } else {
    const [R,G,B] = bilRVB(noteColor(g.rating));
    const m = (a,b) => Math.round(a*.16 + b*.84);   // même mélange que .cov.ph
    c.fillStyle = `rgb(${m(R,38)},${m(G,31)},${m(B,51)})`;
    c.fillRect(x, y, w, h);
    bilEcrire(c, initials(g.name), x + w/2, y + h/2, {
      f:`800 ${Math.round(w*.34)}px ${BIL.display}`, c:noteColor(g.rating),
      a:'center', b:'middle', ls:'-.04em' });
  }
  c.restore();
  c.save();
  c.strokeStyle = 'rgba(242,237,228,.14)';
  c.lineWidth = 1;
  bilArrondi(c, x+.5, y+.5, w-1, h-1, r);
  c.stroke();
  c.restore();
}
function bilFond(o, H){
  const L = BIL.L;
  const d = o.createLinearGradient(0, 0, 0, H);
  d.addColorStop(0, '#241D31');
  d.addColorStop(.5, '#17131F');
  d.addColorStop(1, '#100D17');
  o.fillStyle = d;
  o.fillRect(0, 0, L, H);
  const h = o.createRadialGradient(L*.84, -40, 0, L*.84, -40, 660);
  h.addColorStop(0, 'rgba(229,196,107,.16)');
  h.addColorStop(1, 'rgba(229,196,107,0)');
  o.fillStyle = h;
  o.fillRect(0, 0, L, 700);
  o.fillStyle = BIL.or;
  o.fillRect(0, 0, L, 7);
}

/* --- composition --- */
/* On dessine sur un brouillon transparent en suivant un curseur vertical,
   puis on recopie le tout sur un canvas exactement à la bonne hauteur.
   C'est ce qui permet d'enchaîner les sections sans calculer la hauteur
   finale à l'avance : une année sans jaquettes sort simplement plus courte. */
async function bilanCanvas(){
  await bilPolices();
  const { L, M, W } = BIL;

  // la wishlist est hors sujet dans un bilan : ces jeux-là ne sont ni faits,
  // ni achetés — ils ne comptent donc dans aucun des chiffres ci-dessous
  const tout    = current().filter(x => !estWishlist(x));
  const jeux    = tout.filter(x => !estEnCours(x));
  const enCours = tout.length - jeux.length;
  const notes   = jeux.filter(x => x.rating !== null);
  const avg  = notes.length ? notes.reduce((s,x)=>s+x.rating, 0)/notes.length : null;
  const base = tout.reduce((s,x)=>s+(x.base||0), 0);
  const paid = tout.reduce((s,x)=>s+(x.paid||0), 0);
  const hrs  = jeux.reduce((s,x)=>s+(x.hours||0), 0);

  // le top 10 complet : les 5 premiers en grand avec jaquette, les 5 suivants
  // en simple liste titre + note juste en dessous
  const classement = notes.slice().sort((a,b)=>b.rating-a.rating);
  const top = classement.slice(0, 5);
  const suivants = classement.slice(5, 10);
  const jaquettes = await Promise.all(top.map(x => bilCover(x)));

  const brouillon = document.createElement('canvas');
  brouillon.width = L; brouillon.height = 2600;
  const c = brouillon.getContext('2d');
  let y = 104;

  /* --- en-tête --- */
  const src = source();
  const entete = src && src.nom ? `Journal de ${src.nom}` : 'Journal de jeu';
  bilEcrire(c, entete, M, y, {f:`800 19px ${BIL.display}`, c:BIL.or, ls:'-.02em'});
  y += 30;

  const titre = S.bucket === 'all' ? 'Tout' : String(S.bucket);
  let ts = 130;
  while(ts > 52 && bilLargeur(c, titre, `800 ${ts}px ${BIL.display}`, '-.035em') > W) ts -= 4;
  y += Math.round(ts * .78);
  bilEcrire(c, titre, M, y, {f:`800 ${ts}px ${BIL.display}`, ls:'-.035em'});
  /* les jambages du chiffre descendent sous la ligne de base : sans cette
     marge, le sous-titre vient se coller au titre */
  y += 54;

  const bandeau = ["Résumé gaming"];
  bilEcrire(c, bandeau.join('   ·   '), M, y, {f:`400 27px ${BIL.corps}`, c:BIL.doux});
  y += 42;
  bilFilet(c, y); y += 46;

  /* --- les mieux notés --- */
  if(top.length){
    bilEcrire(c, 'LES MIEUX NOTÉS', M, y, {f:`500 16px ${BIL.mono}`, c:BIL.doux, ls:'.22em'});
    y += 32;
    const n = top.length, ecart = 18;
    const cw = Math.min(200, Math.floor((W - ecart*(n-1)) / n));
    const ch = Math.round(cw * 4/3);
    /* alignées à gauche, sur la même colonne que les titres, les filets et
       les chiffres : une année à deux jeux laisse du vide à droite plutôt
       qu'un bloc centré qui ne s'accroche à rien */
    const x0 = M;
    top.forEach((g,i)=>{
      const x = x0 + i*(cw+ecart);
      bilJaquette(c, g, jaquettes[i], x, y, cw, ch);
      /* le rang est l'information que porte cette section : il est sur la
         jaquette, pas relégué dans la légende */
      const p = 30;
      c.fillStyle = 'rgba(10,8,14,.86)';
      bilArrondi(c, x+9, y+9, p, p, 9); c.fill();
      c.strokeStyle = 'rgba(229,196,107,.5)'; c.lineWidth = 1;
      bilArrondi(c, x+9.5, y+9.5, p-1, p-1, 9); c.stroke();
      bilEcrire(c, String(i+1), x+9+p/2, y+9+p/2+1,
        {f:`700 16px ${BIL.mono}`, c:BIL.or, a:'center', b:'middle'});
    });
    const yb = y + ch + 30;
    top.forEach((g,i)=>{
      const x = x0 + i*(cw+ecart);
      bilEcrire(c, fr(g.rating,1), x, yb, {f:`700 26px ${BIL.mono}`, c:noteColor(g.rating), ls:'-.03em'});
      bilCouper(c, g.name, cw, 2, `500 17px ${BIL.display}`)
        .forEach((l,k)=> bilEcrire(c, l, x, yb + 28 + k*22, {f:`500 17px ${BIL.display}`}));
    });
    y = yb + 28 + 2*22 + 12;

    /* rangs 6 à 10 : plus de jaquette, juste le nom et la note, une ligne
       chacun — le podium a déjà montré la couverture, pas la peine de
       répéter cinq fois le même traitement pour des jeux moins en avant */
    if(suivants.length){
      y += 14;
      suivants.forEach((g,i)=>{
        const rang = i + 6;
        bilEcrire(c, String(rang), M, y, {f:`500 15px ${BIL.mono}`, c:BIL.doux});
        const note = fr(g.rating,1);
        const noteW = bilLargeur(c, note, `700 17px ${BIL.mono}`, '-.02em');
        const titreX = M + 36;
        const dispo = W - 36 - noteW - 16;
        const ligne = bilCouper(c, g.name, dispo, 1, `500 16px ${BIL.display}`)[0];
        bilEcrire(c, ligne, titreX, y, {f:`500 16px ${BIL.display}`});
        bilEcrire(c, note, M+W, y, {f:`700 17px ${BIL.mono}`, c:noteColor(g.rating), a:'right', ls:'-.02em'});
        y += 31;
      });
      y += 15;
    }
    bilFilet(c, y); y += 46;
  }

  /* --- les chiffres, les mêmes qu'en haut de la page --- */
  const cellules = [
    ['Jeux terminés', String(jeux.length), enCours ? `+ ${enCours} en cours` : ''],
    ['Note moyenne', avg !== null ? fr(avg,2) : '—',
      notes.length ? `sur ${notes.length} noté${notes.length>1?'s':''}` : ''],
    ['Temps de jeu', hrs ? bilHeures(hrs) : '—', hrs ? `≈ ${Math.round(hrs/24)} jours` : ''],
    ['Payé', paid ? EUR.format(paid) : '—', base ? `sur ${EUR.format(base)} de prix fort` : ''],
  ];
  const cl = W/4;
  cellules.forEach(([u,b,i2],k)=>{
    const x = M + k*cl;
    bilEcrire(c, u.toUpperCase(), x, y, {f:`500 14px ${BIL.mono}`, c:BIL.doux, ls:'.18em'});
    let f = 42;
    while(f > 22 && bilLargeur(c, b, `500 ${f}px ${BIL.mono}`, '-.03em') > cl - 18) f -= 2;
    bilEcrire(c, b, x, y + 52, {f:`500 ${f}px ${BIL.mono}`, ls:'-.03em'});
    if(i2) bilEcrire(c, i2, x, y + 80, {f:`400 17px ${BIL.corps}`, c:BIL.doux});
  });
  y += 104;
  bilFilet(c, y); y += 46;

  /* --- répartition des notes, le même histogramme que sur la page ---
     Mêmes règles de découpage que renderDist() : un pas de 0,2 sur une
     plage courte, 0,5 sinon, toujours un multiple exact du dixième pour
     que les barres ne sautent pas juste à cause de l'arrondi. */
  if(notes.length >= 3){
    const valeurs = notes.map(x=>x.rating).sort((a,b)=>a-b);
    let lo = Math.floor(valeurs[0]), hi = Math.ceil(valeurs[valeurs.length-1]);
    if(hi - lo < 3){ hi = Math.min(10, lo + 3); lo = Math.max(0, hi - 3); }
    const span = hi - lo;
    const STEP = span <= 4 ? 0.2 : 0.5;
    const nBins = Math.round(span / STEP);
    const bins = new Array(nBins).fill(0);
    valeurs.forEach(r=>{
      const i = Math.floor((r - lo) / STEP);
      bins[Math.max(0, Math.min(nBins-1, i))]++;
    });
    const maxBin = Math.max(...bins) || 1;
    const mid = valeurs.length % 2
      ? valeurs[(valeurs.length-1)/2]
      : (valeurs[valeurs.length/2 - 1] + valeurs[valeurs.length/2]) / 2;
    const pos = v => ((v - lo) / span) * W;

    bilEcrire(c, 'RÉPARTITION DES NOTES', M, y, {f:`500 16px ${BIL.mono}`, c:BIL.doux, ls:'.22em'});
    bilEcrire(c, `moyenne ${fr(avg,2)} · médiane ${fr(mid,2)}`, M+W, y,
      {f:`400 16px ${BIL.corps}`, c:BIL.doux, a:'right'});
    y += 34;

    const HB = 168, sol = y + HB;
    const gap = nBins > 26 ? 3 : (nBins > 14 ? 5 : 8);
    const bw = Math.max(4, (W - gap*(nBins-1)) / nBins);
    bins.forEach((cnt,i)=>{
      if(!cnt) return;
      const a = lo + i*STEP;
      const bh = Math.max(5, (cnt/maxBin)*HB);
      const bx = M + i*(bw+gap);
      c.fillStyle = noteColor(a + STEP/2);
      bilArrondi(c, bx, sol-bh, bw, bh, Math.min(4, bw/2));
      c.fill();
    });
    /* Même correction que sur l'histogramme de la page (.avg dans le CSS) :
       le repère se dessinait en or sur des barres claires — #E9A13C vers 5,
       #A8C24A vers 7 — où l'or ne se détache pas, et c'est précisément là
       qu'une moyenne tombe. Il porte donc son propre fond : un trait sombre
       posé sous le trait doré, une pastille sombre sous le chiffre.
       L'ordre compte, le sombre d'abord. */
    if(avg !== null){
      const xa = Math.round(M + pos(avg)) + .5;
      c.save();
      c.setLineDash([5,5]);
      c.lineWidth = 3;
      c.strokeStyle = 'rgba(10,8,14,.7)';
      c.beginPath(); c.moveTo(xa, y-4); c.lineTo(xa, sol); c.stroke();
      c.lineWidth = 1;
      c.strokeStyle = BIL.or;
      c.beginPath(); c.moveTo(xa, y-4); c.lineTo(xa, sol); c.stroke();
      c.restore();

      const etiquette = `moy. ${fr(avg,2)}`;
      const police = `500 15px ${BIL.mono}`;
      const flip = xa > W - 90;
      const lg = bilLargeur(c, etiquette, police);
      const tx = xa + (flip ? -8 : 8);
      c.save();
      c.fillStyle = 'rgba(10,8,14,.82)';
      bilArrondi(c, (flip ? tx - lg : tx) - 6, y - 4, lg + 12, 21, 6);
      c.fill();
      c.restore();
      bilEcrire(c, etiquette, tx, y + 10,
        {f: police, c: BIL.or, a: flip ? 'right' : 'left'});
    }

    y = sol + 1;
    c.fillStyle = 'rgba(242,237,228,.22)';
    c.fillRect(M, y, W, 1);
    y += 24;
    const stepTick = span <= 8 ? 1 : 2;
    const ticks = [];
    for(let t = lo; t <= hi; t += stepTick) ticks.push(t);
    if(ticks[ticks.length-1] !== hi) ticks.push(hi);
    ticks.forEach(t=>{
      const x = M + pos(t);
      const a = (x < M + 14) ? 'left' : (x > M + W - 14 ? 'right' : 'center');
      bilEcrire(c, String(t), x, y, {f:`400 14px ${BIL.mono}`, c:BIL.doux, a});
    });
    y += 40;
    bilFilet(c, y); y += 46;
  }

  /* --- ce qui ressort de l'année --- */
  const faits = [];
  const long = jeux.filter(x=>x.hours).sort((a,b)=>b.hours-a.hours)[0];
  if(long) faits.push(['Le plus long', `${long.name} - ${bilHeures(long.hours)}`]);
  // le jeu le plus vieux joué cette période : celui qui vient le plus du
  // backlog, à l'opposé des sorties de l'année qui composent le reste
  const ancien = jeux.filter(x=>x.release).sort((a,b)=>a.release.localeCompare(b.release))[0];
  if(ancien) faits.push(['Le plus ancien', `${ancien.name} - sorti en ${yearOf(ancien.release)}`]);
  const bas = notes.slice().sort((a,b)=>a.rating-b.rating)[0];
  if(bas && notes.length > 3) faits.push(['La note la plus basse', `${bas.name} - ${fr(bas.rating,1)}`]);

  if(faits.length){
    const cg = 300;
    faits.forEach(([u,v])=>{
      bilEcrire(c, u.toUpperCase(), M, y, {f:`500 14px ${BIL.mono}`, c:BIL.doux, ls:'.18em'});
      bilEcrire(c, bilCouper(c, v, W - cg, 1, `400 22px ${BIL.corps}`)[0],
        M + cg, y, {f:`400 22px ${BIL.corps}`});
      y += 42;
    });
    y += 6;
    bilFilet(c, y); y += 46;
  }

  /* --- pied --- */
  bilEcrire(c, 'ABYSS · JEUX VIDÉOS', M, y, {f:`500 15px ${BIL.mono}`, c:BIL.or, ls:'.22em'});
  bilEcrire(c, new Date().toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'}),
    M+W, y, {f:`400 18px ${BIL.corps}`, c:BIL.doux, a:'right'});
  y += 56;

  const H = Math.min(Math.round(y), brouillon.height);
  const sortie = document.createElement('canvas');
  sortie.width = L; sortie.height = H;
  const o = sortie.getContext('2d');
  bilFond(o, H);
  o.drawImage(brouillon, 0, 0);
  return sortie;
}

/* =======================================================================
   La carte d'un seul jeu — même moteur, une seule fiche.
   C'est l'image qu'on envoie à quelqu'un pour dire « joue à ça » sans lui
   faire ouvrir le journal : jaquette, note, place au classement, et ce
   qu'on en a pensé.
   ======================================================================= */
async function ficheCanvas(g){
  await bilPolices();
  const { L, M, W } = BIL;
  const im = await bilCover(g);
  const statut = statutDe(g), wish = estWishlist(g);
  const enCours = !!statut;   // en cours ou convoité : pas de note à afficher

  const brouillon = document.createElement('canvas');
  brouillon.width = L; brouillon.height = 2600;
  const c = brouillon.getContext('2d');
  let y = 104;

  /* --- en-tête ---
     La période (mois/année) figure déjà dans les faits plus bas, sous
     « Terminé » : pas besoin de la répéter ici. */
  const src = source();
  bilEcrire(c, src && src.nom ? `Journal de ${src.nom}` : 'Journal de jeu', M, y,
    {f:`800 19px ${BIL.display}`, c:BIL.or, ls:'-.02em'});
  y += 30;

  /* --- jaquette à gauche, identité à droite --- */
  const cw = 348, ch = Math.round(cw / bilRatio());
  bilJaquette(c, g, im, M, y, cw, ch);

  const rx = M + cw + 44, rw = W - cw - 44;
  let ry = y;

  if(enCours){
    const t = statut.toUpperCase();
    const teinte = wish ? BIL.bleu : BIL.or;
    const tw = bilLargeur(c, t, `500 17px ${BIL.mono}`, '.2em') + 42;
    c.save();
    c.strokeStyle = wish ? 'rgba(143,184,232,.5)' : 'rgba(229,196,107,.5)'; c.lineWidth = 1;
    bilArrondi(c, rx+.5, ry+.5, tw, 42, 21); c.stroke();
    c.restore();
    bilEcrire(c, t, rx+21, ry+27, {f:`500 17px ${BIL.mono}`, c:teinte, ls:'.2em'});
    ry += 72;
  } else {
    bilEcrire(c, g.rating !== null ? fr(g.rating,1) : '—', rx, ry+62,
      {f:`700 80px ${BIL.mono}`, c:noteColor(g.rating), ls:'-.05em'});
    ry += 88;
  }

  /* le titre rétrécit jusqu'à tenir sur trois lignes : « Nier Automata »
     et « The Legend of Zelda: Tears of the Kingdom » doivent tous les deux
     tenir dans la même colonne */
  const r = rangJeu(g), med = medailleDe(r);
  const fTitre = t => `800 ${t}px ${BIL.display}`;
  let ts = 44, lignes = [];
  while(true){
    lignes = bilLignes(c, g.name, rw, fTitre(ts), '-.03em');
    if(lignes.length <= 3 || ts <= 24) break;
    ts -= 3;
  }
  lignes.slice(0, 3).forEach(l=>{
    ry += Math.round(ts * 1.04);
    /* le dégradé est refait pour chaque ligne, sur sa largeur à elle :
       sinon un titre court n'en montrerait que le premier centimètre */
    const w = bilLargeur(c, l, fTitre(ts), '-.03em');
    bilEcrire(c, l, rx, ry, {f:fTitre(ts), ls:'-.03em',
      c: med ? bilMedaille(c, med, rx, ry - ts*.78, w, ts*.86) : BIL.texte});
  });

  if(r){
    ry += 30;
    const t = `${r.rang}${r.rang === 1 ? 'er' : 'e'} sur ${r.total} ${r.ou}`;
    const w = bilLargeur(c, t, `500 15px ${BIL.mono}`, '.1em');
    bilEcrire(c, t, rx, ry, {f:`500 15px ${BIL.mono}`, ls:'.1em',
      c: med ? bilMedaille(c, med, rx, ry - 13, w, 15) : BIL.doux});
  }

  const faits = [
    ['Sortie', dateFmt(g.release)],
    enCours ? null : ['Terminé', g.month ? `${MONTHS[g.month-1]} ${g.year || ''}`.trim()
                                         : String(g.year || g.bucket || '—')],
    (!enCours && g.hours) ? ['Temps de jeu', bilHeures(g.hours)] : null,
    g.base ? ['Prix du jeu', EUR.format(g.base)] : null,
  ].filter(Boolean);

  if(faits.length){
    ry += 34;
    bilTrait(c, rx, ry, rw);
    ry += 12;
    faits.forEach(([u,v])=>{
      ry += 22;
      bilEcrire(c, u.toUpperCase(), rx, ry, {f:`500 13px ${BIL.mono}`, c:BIL.doux, ls:'.16em'});
      bilEcrire(c, bilCouper(c, v, rw - 190, 1, `400 20px ${BIL.corps}`)[0], rx+rw, ry,
        {f:`400 20px ${BIL.corps}`, a:'right'});
      ry += 14;
    });
  }

  /* la colonne la plus haute décide où reprend la page : une fiche sans
     prix est plus courte que sa jaquette, une fiche complète la dépasse */
  y = Math.max(y + ch, ry) + 48;

  /* --- ce que j'en ai pensé --- */
  const points = enCours ? [] : (g.review || []).filter(Boolean);
  if(points.length){
    bilFilet(c, y); y += 46;
    bilEcrire(c, 'AVIS', M, y, {f:`500 16px ${BIL.mono}`, c:BIL.doux, ls:'.22em'});
    y += 42;
    const limite = brouillon.height - 240;
    for(const p of points){
      if(y > limite) break;                      // avis fleuve : on s'arrête avant le bas
      const t = String(p).trim();
      const plus = t.startsWith('+'), moins = t.startsWith('-');
      const signe = plus ? '+' : (moins ? '–' : '·');
      // le point entier prend la couleur, pas seulement son signe
      const coul  = plus ? '#9BE3BE' : (moins ? '#F0A29C' : null);
      const texte = (plus || moins) ? t.slice(1).trim() : t;
      if(!texte) continue;
      const ls = bilLignes(c, texte, W - 40, `400 23px ${BIL.corps}`);
      bilEcrire(c, signe, M+3, y, {f:`700 23px ${BIL.mono}`, c: coul || BIL.doux});
      ls.forEach((l,k)=> bilEcrire(c, l, M+40, y + k*33,
        {f:`400 23px ${BIL.corps}`, c: coul || BIL.texte}));
      y += ls.length*33 + 14;
    }
    y += 4;
  }
  bilFilet(c, y); y += 46;

  /* --- pied --- */
  bilEcrire(c, 'ABYSS · JEUX VIDÉOS', M, y, {f:`500 15px ${BIL.mono}`, c:BIL.or, ls:'.22em'});
  bilEcrire(c, new Date().toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'}),
    M+W, y, {f:`400 18px ${BIL.corps}`, c:BIL.doux, a:'right'});
  y += 56;

  const H = Math.min(Math.round(y), brouillon.height);
  const sortie = document.createElement('canvas');
  sortie.width = L; sortie.height = H;
  const o = sortie.getContext('2d');
  bilFond(o, H);
  o.drawImage(brouillon, 0, 0);
  return sortie;
}

/* --- la fenêtre --- */
/* Une seule fenêtre pour les deux images : le bilan d'un onglet et la carte
   d'un jeu. Elle ne sait rien de ce qu'elle montre, on lui passe le titre,
   le nom du fichier et la fonction qui compose le canvas. */
let BILAN_BLOB = null, BILAN_URL = null, BILAN_JETON = 0;

function libererBilan(){
  if(BILAN_URL){ URL.revokeObjectURL(BILAN_URL); BILAN_URL = null; }
  BILAN_BLOB = null;
}
function ouvrirBilan(){
  if(!current().length){ toast("Cet onglet est vide : rien à mettre en image.", true); return; }
  const nom = S.bucket === 'all' ? 'complet' : S.bucket;
  ouvrirImage({
    titre: `Bilan ${nom}`,
    fichier: 'bilan-' + (slug(nom) || 'journal') + '.png',
    partage: 'Bilan ' + nom,
    composer: bilanCanvas,
  });
}
function partagerJeu(g){
  if(!g) return;
  ouvrirImage({
    titre: `« ${g.name} » en image`,
    fichier: 'jeu-' + (slug(g.name) || 'fiche') + '.png',
    partage: g.name,
    composer: ()=> ficheCanvas(g),
  });
}
function ouvrirImage(opt){
  closeMenu();
  const host = $('bilan');
  host.innerHTML = `<div class="sheet bilan-sheet" role="dialog" aria-modal="true" aria-label="${esc(opt.titre)}">
    <div class="sheet-tools">
      <span class="grp"><b class="fhead">${esc(opt.titre)}</b></span>
      <span class="grp"><button class="sbtn bilan-x" aria-label="Fermer">×</button></span>
    </div>
    <div class="bilan-in">
      <div class="bilan-apercu" id="bilanApercu"><span class="bilan-attente">Composition de l'image...</span></div>
      <div class="bilan-actions">
        <button class="ghost" id="bilanFermer">Fermer</button>
        <button class="ghost" id="bilanPartager" hidden>Partager</button>
        <button class="cta auto" id="bilanTelecharger" disabled>Télécharger</button>
      </div>
    </div>
  </div>`;
  host.hidden = false;
  verrouFond();
  host.querySelector('.bilan-x').onclick = fermerBilan;
  $('bilanFermer').onclick = fermerBilan;
  host.querySelector('.bilan-x').focus();
  composerImage(opt);
}
async function composerImage(opt){
  /* le jeton dit si la fenêtre a été fermée pendant la composition :
     dans ce cas on jette le résultat au lieu d'écrire dans le vide */
  const jeton = ++BILAN_JETON;
  let toile;
  try{
    toile = await opt.composer();
  }catch(e){
    if(jeton !== BILAN_JETON) return;
    const a = $('bilanApercu');
    if(a) a.innerHTML = '<span class="bilan-attente">L\'image n\'a pas pu être composée.</span>';
    return;
  }
  if(jeton !== BILAN_JETON) return;
  const apercu = $('bilanApercu');
  if(!apercu) return;
  apercu.innerHTML = '';
  apercu.appendChild(toile);

  const fichier = opt.fichier;
  toile.toBlob(b=>{
    if(jeton !== BILAN_JETON || !b) return;
    libererBilan();
    BILAN_BLOB = b;
    const dl = $('bilanTelecharger');
    if(dl){
      dl.disabled = false;
      dl.onclick = ()=>{
        // l'adresse n'est libérée qu'à la fermeture, ou au clic suivant :
        // la révoquer aussitôt annulerait le téléchargement en cours
        if(BILAN_URL) URL.revokeObjectURL(BILAN_URL);
        BILAN_URL = URL.createObjectURL(BILAN_BLOB);
        const a = document.createElement('a');
        a.href = BILAN_URL;
        a.download = fichier;
        document.body.appendChild(a);
        a.click();
        a.remove();
      };
    }
    /* partage direct quand le navigateur sait le faire — surtout utile
       depuis le téléphone, où « télécharger » finit dans un dossier perdu */
    try{
      const f = new File([b], fichier, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[f]})){
        const p = $('bilanPartager');
        if(p){
          p.hidden = false;
          p.onclick = ()=> navigator.share({files:[f], title: opt.partage}).catch(()=>{});
        }
      }
    }catch(e){}
  }, 'image/png');
}
function fermerBilan(){
  const host = $('bilan');
  if(host.hidden) return;
  BILAN_JETON++;
  host.hidden = true;
  host.innerHTML = '';
  libererBilan();
  verrouFond();
}
fermeSurFond('bilan', fermerBilan);
/* Les statistiques sont une lecture à part du classeur, pas un tiroir de
   plus : elles vivent dans les réglages, à côté du résumé et de l'export,
   avec lesquels elles ont plus à voir qu'avec les onglets. La barre
   d'onglets reste affichée pendant qu'on les consulte — c'est par elle
   qu'on en ressort. */
$('statsBtn').addEventListener('click', ()=>{

/* =======================================================================
   Mise à jour depuis IGDB — tout le journal d'un coup

   Le classeur vieillit : une date de sortie saisie de mémoire, un prix noté
   avant une baisse, une jaquette jamais récupérée. Ce module repasse sur
   chaque ligne, demande à Flask ce qu'IGDB en dit (/api/jeu/maj), et montre
   la liste des écarts.

   Trois précautions, parce qu'écrire trois cents lignes d'un coup ne se
   rattrape pas :

     - rien n'est écrit avant la relecture. L'analyse est un rapport ;
       l'écriture est un second geste, sur les lignes cochées seulement.
     - un jeu dont le titre ne correspond pas exactement à une fiche IGDB
       arrive décoché : « Doom » trouve six jeux, on ne les départage pas
       à l'aveugle.
     - les jaquettes se choisissent une par une, comme ailleurs dans la
       page. Aucune image ne part sur le disque sans un clic.

   L'écriture repasse par l'action « enregistrer » d'Apps Script, celle du
   formulaire : la ligne est réécrite en entier, avec les valeurs relues
   ici. C'est le chemin déjà éprouvé — modifier un jeu à la main fait
   exactement la même chose — plutôt qu'une action neuve qui écrirait deux
   cellules mais qu'il faudrait déboguer sur trois cents lignes.
   ======================================================================= */
const IGD = {
  jeton: 0,        // incrémenté à l'annulation : les boucles en vol s'arrêtent
  stop: false,     // « Interrompre » : on s'arrête mais on garde le résultat
  etape: '',
  liste: [],       // les jeux à interroger
  lignes: [],      // un rapport par jeu, une fois l'analyse finie
  file: [],        // les jaquettes à proposer, une par nom de fichier
  fi: 0,
  t0: 0,
  dernier: null,   // dernière réponse d'écriture : le classeur relu
  compte: {dates:0, prix:0, jaquettes:0, detail:0, echecs:0},
  echecs: [],
  opts: {dates:true, prix:true, jaquettes:true, detail:true},
};

const SURETE = {
  sure:     'sûr',
  probable: 'plusieurs fiches',
  douteuse: 'à vérifier',
};

function igdbCorps(){ return $('igdbIn'); }
function igdbEntete(txt){ const b = $('igdbTitre'); if(b) b.textContent = txt; }

function ouvrirIgdb(){
  closeMenu();
  if(!CAN_WRITE){ toast("Passe en mode éditeur pour mettre le journal à jour.", true); return; }
  if(!GAMES.length){ toast("Le journal est vide : rien à mettre à jour.", true); return; }
  IGD.jeton++;
  IGD.stop = false;
  // le script a pu être redéployé depuis la dernière fois : on lui laisse
  // sa chance à chaque ouverture plutôt qu'une seule fois par onglet
  IGD.lignes = []; IGD.file = []; IGD.fi = 0; IGD.dernier = null;
  IGD.compte = {dates:0, prix:0, jaquettes:0, echecs:0};
  IGD.echecs = [];
  const host = $('igdb');
  host.innerHTML = `<div class="sheet igdb-sheet" role="dialog" aria-modal="true" aria-label="Mise à jour depuis IGDB">
    <div class="sheet-tools">
      <span class="grp"><b class="fhead" id="igdbTitre">Mise à jour depuis IGDB</b></span>
      <span class="grp"><button class="sbtn igdb-x" aria-label="Fermer">×</button></span>
    </div>
    <div class="igdb-in" id="igdbIn"></div>
  </div>`;
  host.hidden = false;
  verrouFond();
  host.querySelector('.igdb-x').onclick = fermerIgdb;
  igdbReglages();
}
function fermerIgdb(){
  const host = $('igdb');
  if(host.hidden) return;
  IGD.jeton++;                  // ce qui répondra après nous ne sert plus
  host.hidden = true; host.innerHTML = '';
  verrouFond();
  /* des écritures ont pu passer avant l'interruption : le classeur relu
     qu'elles ont renvoyé est plus à jour que ce que le mur affiche */
  if(IGD.dernier){
    const s = source();
    if(s) cacheStore.set(s.url, IGD.dernier);
    applyData(IGD.dernier, true);
    IGD.dernier = null;
    render();
  }
}

/* ---------- étape 1 : ce qu'on veut mettre à jour ---------- */
/* Toutes les portées possibles : le journal entier, puis chaque onglet qui
   contient quelque chose. La liste est la même où qu'on ouvre la fenêtre —
   avant, seul l'onglet affiché était proposé, si bien que mettre à jour
   « 2024 » obligeait à aller s'y placer d'abord, alors que c'est
   précisément une opération qu'on lance de loin, depuis n'importe où.

   L'onglet courant reste préselectionné : la commodité d'avant est gardée,
   elle n'est simplement plus la seule option. */
function igdbPortees(){
  const portees = [{nom: 'Tout le journal', bucket: 'all', jeux: GAMES.slice()}];
  BUCKETS.forEach(b=>{
    const jeux = GAMES.filter(x => x.bucket === b);
    if(jeux.length) portees.push({nom: `Catégorie « ${b} »`, bucket: b, jeux: jeux});
  });
  return portees;
}
function igdbReglages(){
  IGD.etape = 'reglages';
  igdbEntete('Mise à jour depuis IGDB');
  const portees = igdbPortees();
  igdbCorps().innerHTML = `
    <div class="fgrid">
      <label class="fld full"><u>Catégories</u>
        <select id="igdb_portee">${portees.map((p,i)=>
          `<option value="${i}"${p.bucket === S.bucket ? ' selected' : ''}>${esc(p.nom)} — ${p.jeux.length} jeu${p.jeux.length > 1 ? 'x' : ''}</option>`
        ).join('')}</select></label>
      <label class="fld fcheck">
        <input id="igdb_dates" type="checkbox"${IGD.opts.dates ? ' checked' : ''}>
        <span>Dates de sortie</span></label>
      <label class="fld fcheck">
        <input id="igdb_prix" type="checkbox"${IGD.opts.prix ? ' checked' : ''}>
        <span>Prix de base</span></label>
      <label class="fld fcheck">
        <input id="igdb_jaq" type="checkbox"${IGD.opts.jaquettes ? ' checked' : ''}>
        <span>Jaquettes manquantes</span></label>
      <label class="fld fcheck">
        <input id="igdb_detail" type="checkbox"${IGD.opts.detail ? ' checked' : ''}>
        <span>Plateforme, développeur, genres</span></label>
    </div>
    <div class="frow"><span class="spacer"></span>
      <button class="ghost" id="igdb_annuler">Annuler</button>
      <button class="cta auto" id="igdb_go">Analyser</button></div>`;
  $('igdb_annuler').onclick = fermerIgdb;
  $('igdb_go').onclick = ()=>{
    IGD.opts = {
      dates: $('igdb_dates').checked,
      prix: $('igdb_prix').checked,
      jaquettes: $('igdb_jaq').checked,
      detail: $('igdb_detail').checked,
    };
    if(!IGD.opts.dates && !IGD.opts.prix && !IGD.opts.jaquettes && !IGD.opts.detail){
      toast("Coche au moins une chose à mettre à jour.", true);
      return;
    }
    const p = portees[+$('igdb_portee').value] || portees[0];
    IGD.liste = p.jeux.slice();
    igdbAnalyse();
  };
}

/* ---------- la jauge, commune à l'analyse et à l'écriture ---------- */
function igdbJauge(){
  return `<div class="igdb-jauge"><i id="igdb_barre" style="width:0%"></i></div>
    <p class="igdb-encours">
      <b id="igdb_compteur">0 / 0</b>
      <span id="igdb_quoi"></span>
      <em id="igdb_reste"></em>
    </p>`;
}
/* Le temps restant, à partir de ce qui est déjà passé. Sous deux jeux la
   moyenne ne veut rien dire, et sous cinq secondes l'annoncer est plus
   agité qu'utile. */
function igdbReste(fait, total){
  if(!IGD.t0 || fait < 2) return '';
  const s = Math.round((Date.now() - IGD.t0) / fait * (total - fait) / 1000);
  if(s < 5) return '';
  return s < 90 ? `environ ${s} s` : `environ ${Math.round(s / 60)} min`;
}
function igdbAvance(fait, total, quoi){
  const barre = $('igdb_barre'), compteur = $('igdb_compteur');
  if(!barre || !compteur) return;
  barre.style.width = (total ? Math.round(fait / total * 100) : 100) + '%';
  compteur.textContent = `${fait} / ${total}`;
  $('igdb_quoi').textContent = quoi || '';
  $('igdb_reste').textContent = igdbReste(fait, total);
}

/* ---------- étape 2 : l'analyse ---------- */
async function igdbAnalyse(){
  const jeton = ++IGD.jeton;
  IGD.etape = 'analyse';
  IGD.stop = false;
  IGD.lignes = [];
  IGD.t0 = Date.now();
  igdbEntete('Analyse en cours');
  igdbCorps().innerHTML = `
    ${igdbJauge()}
    <div class="frow"><span class="spacer"></span>
      <button class="ghost" id="igdb_stop">Interrompre</button></div>`;
  $('igdb_stop').onclick = ()=>{ IGD.stop = true; };

  const total = IGD.liste.length;
  for(let i = 0; i < total; i++){
    if(jeton !== IGD.jeton) return;      // la fenêtre a été fermée
    if(IGD.stop) break;                  // interrompu : on garde ce qu'on a
    const g = IGD.liste[i];
    igdbAvance(i, total, g.name);
    let data;
    try{
      data = await apiPatient('/api/jeu/maj', {
        nom: g.name,
        sortie: g.release || '',
        prix: IGD.opts.prix,
        detail: IGD.opts.detail,
        // Flask attend un mot, pas un booléen : « aucune » lui évite de
        // rassembler des propositions dont personne ne veut
        jaquettes: IGD.opts.jaquettes ? 'manquantes' : 'aucune',
      });
    }catch(e){
      data = {etat:'injoignable', raison: raisonReseau(e)};
    }
    if(jeton !== IGD.jeton) return;
    IGD.lignes.push(igdbRapport(g, data));
  }
  if(jeton !== IGD.jeton) return;
  igdbAvance(IGD.lignes.length, total, '');
  igdbRevue();
}

/* Ce qu'on retient d'un jeu : les écarts, et rien d'autre. Une valeur
   identique n'est pas un changement — la liste ne montrerait que du bruit. */
function igdbRapport(g, data){
  const l = {
    g: g,
    etat: data.etat || 'injoignable',
    raison: data.raison || '',
    fiche: data.fiche || null,
    surete: data.surete || '',
    jaquette: data.jaquette || '',
    propositions: data.propositions || [],
    date: null, prix: null, detail: null, coche: false,
  };
  if(l.etat !== 'ok' || !l.fiche) return l;

  if(IGD.opts.dates && l.fiche.iso && l.fiche.iso !== (g.release || '')){
    l.date = {avant: g.release || '', apres: l.fiche.iso};
  }
  if(IGD.opts.prix && data.prix !== null && data.prix !== undefined){
    const av = g.base;
    // le centime d'écart : deux flottants qui valent le même prix ne sont
    // pas forcément égaux au bit près
    if(av === null || av === undefined || Math.abs(av - data.prix) >= 0.005){
      l.prix = {avant: av, apres: data.prix};
    }
  }
  /* Le rattachement à une fiche IGDB, et les trois colonnes qui en
     découlent. Un jeu déjà rattaché à la même fiche et déjà rempli n'est
     pas un écart : ce sont les jeux d'avant cette fonctionnalité qu'on
     cherche ici, ceux qui n'ont encore ni identifiant ni plateforme. */
  if(IGD.opts.detail && data.detail){
    const d = data.detail;
    const change = g.idIgdb !== l.fiche.id
      || (d.plateforme || null)  !== (g.plateforme || null)
      || (d.developpeur || null) !== (g.developpeur || null)
      || (d.genres || null)      !== (g.genres || null);
    if(change) l.detail = d;
  }
  l.coche = igdbAChanger(l) && l.surete !== 'douteuse';
  return l;
}
/* Un jeu a quelque chose à écrire. Rassemblé ici parce que quatre endroits
   posaient la même question, et qu'en oublier un laisserait des lignes
   cochées que l'écriture n'enverrait jamais. */
function igdbAChanger(l){
  return !!(l.date || l.prix || l.detail || l.rattache);
}

/* Les jaquettes à proposer, dédoublonnées par nom de fichier : le même jeu
   rejoué dans deux onglets n'a qu'une seule image sur le disque. */
function igdbFileJaquettes(){
  if(!IGD.opts.jaquettes) return [];
  const file = [], vus = {};
  IGD.lignes.forEach(l=>{
    if(l.etat !== 'ok' || !l.propositions.length) return;
    // déjà illustré : le bouton de la tuile sert à en changer, un par un
    if(l.jaquette !== 'absente') return;
    const cle = cleJaquette(l.g);
    if(!cle || vus[cle]) return;
    vus[cle] = true;
    file.push({nom: l.g.name, jeuId: l.g.id, propositions: l.propositions});
  });
  return file;
}

/* ---------- étape 3 : la relecture ---------- */
function igdbDelta(titre, avant, apres){
  return `<span class="igdb-delta"><u>${titre}</u>
    <span class="igdb-av">${esc(avant)}</span>
    <span class="igdb-fl">→</span>
    <b class="igdb-ap">${esc(apres)}</b></span>`;
}
function igdbLigneHTML(l, i){
  const f = l.fiche;
  const meme = norm(f.titre) === norm(l.g.name);
  return `<label class="igdb-ligne">
    <input type="checkbox" data-i="${i}"${l.coche ? ' checked' : ''}>
    <span class="igdb-corps">
      <b class="igdb-nom">${esc(l.g.name)} <em>${esc(l.g.bucket)}</em></b>
      <span class="igdb-match">${meme ? '' : esc(f.titre) + ' · '}${esc(f.date || 'date inconnue')} <i
        class="igdb-tag ${l.surete}">${esc(SURETE[l.surete] || '')}</i></span>
      ${l.date ? igdbDelta('Date', l.date.avant ? dateFmt(l.date.avant) : 'aucune', dateFmt(l.date.apres)) : ''}
      ${l.prix ? igdbDelta('Prix', money(l.prix.avant), money(l.prix.apres)) : ''}
      ${l.detail ? `<span class="igdb-delta"><u>Fiche</u>
        <b class="igdb-ap">${esc([l.detail.developpeur, l.detail.genres].filter(Boolean).join(' · ') || 'plateforme et genres')}</b></span>` : ''}
    </span>
    ${l.surete === 'sure' ? '' :
      `<button type="button" class="igdb-fiche-btn" data-corr="${i}">Changer de jeu</button>`}
  </label>`;
}
function igdbRevue(){
  IGD.etape = 'revue';
  IGD.file = igdbFileJaquettes();
  const avec  = IGD.lignes.filter(igdbAChanger);
  const rates = IGD.lignes.filter(l => l.etat !== 'ok');
  igdbEntete('Ce qui va changer');

  const nJaq = IGD.file.length;
  igdbCorps().innerHTML = `
    <p class="igdb-info">
      <b>${IGD.lignes.length}</b> jeu${IGD.lignes.length > 1 ? 'x' : ''} analysé${IGD.lignes.length > 1 ? 's' : ''} :
      <b>${avec.length}</b> à corriger${nJaq ? `, <b>${nJaq}</b> jaquette${nJaq > 1 ? 's' : ''} à proposer` : ''}.
      ${avec.length ? `Seules les cellules « Date de sortie », « Prix de base »${
        IGD.opts.detail ? ' et la fiche détaillée (plateforme, développeur, genres)' : ''} sont touchées.` : ''}
    </p>
    ${avec.length
      ? `<div class="igdb-liste">${avec.map(igdbLigneHTML).join('')}</div>`
      : `<p class="igdb-note">Rien à corriger${nJaq ? ' — il reste les jaquettes.' : ' : le journal est déjà à jour.'}</p>`}
    ${rates.length ? `<details class="igdb-repli">
      <summary>${rates.length} jeu${rates.length > 1 ? 'x' : ''} sans réponse d'IGDB</summary>
      ${igdbMotifsHTML(rates)}
      <ul>${rates.map(l=>`<li>${esc(l.g.name)} <i>— ${esc(motifLigne(l))}</i></li>`).join('')}</ul>
    </details>` : ''}
    <div class="frow">
      ${avec.length ? '<button class="ghost" id="igdb_tous">Tout cocher</button><button class="ghost" id="igdb_aucun">Tout décocher</button>' : ''}
      <span class="spacer"></span>
      <button class="ghost" id="igdb_annuler">Annuler</button>
      <button class="cta auto" id="igdb_ok"></button>
    </div>`;

  /* data-i pointe dans `avec`, pas dans IGD.lignes : c'est la liste affichée
     qui est indexée, et elle ne contient que les jeux à corriger */
  igdbCorps().querySelectorAll('.igdb-ligne input').forEach(c=>{
    c.onchange = ()=>{ avec[+c.dataset.i].coche = c.checked; igdbBouton(); };
  });
  const cocher = v => igdbCorps().querySelectorAll('.igdb-ligne input').forEach(c=>{
    c.checked = v; avec[+c.dataset.i].coche = v;
  });
  /* « Changer de jeu » : le bouton vit dans le <label> de la ligne, donc un
     clic cocherait la case en passant — d'où le preventDefault. */
  igdbCorps().querySelectorAll('.igdb-fiche-btn').forEach(b=>{
    b.onclick = e=>{
      e.preventDefault(); e.stopPropagation();
      corrigeFiche(avec[+b.dataset.corr]);
    };
  });
  if($('igdb_tous'))  $('igdb_tous').onclick  = ()=>{ cocher(true);  igdbBouton(); };
  if($('igdb_aucun')) $('igdb_aucun').onclick = ()=>{ cocher(false); igdbBouton(); };
  $('igdb_annuler').onclick = fermerIgdb;
  $('igdb_ok').onclick = ()=>{
    if(IGD.lignes.some(l => l.coche && igdbAChanger(l))) igdbEcriture();
    else if(IGD.file.length) igdbJaquette();
    else fermerIgdb();
  };
  igdbBouton();
}
/* Pourquoi une ligne n'a rien donné. « Aucune fiche trouvée » veut dire
   qu'IGDB a répondu mais ne connaît pas ce titre ; tout le reste est une
   panne de liaison, et c'est le motif exact qui permet d'y remédier. */
function motifLigne(l){
  if(l.etat === 'introuvable') return 'aucune fiche trouvée';
  return l.raison || 'IGDB injoignable';
}
/* Les échecs regroupés par motif. Trente jeux qui échouent pour la même
   raison, c'est un seul problème à régler — la liste nom par nom, elle, ne
   le montre pas. */
function igdbMotifsHTML(rates){
  const compte = new Map();
  rates.forEach(l=>{
    const m = motifLigne(l);
    compte.set(m, (compte.get(m) || 0) + 1);
  });
  if(compte.size < 2 && rates.length < 4) return '';
  const lignes = [...compte.entries()].sort((a,b)=> b[1] - a[1])
    .map(([m,k])=> `<li><b>${k}×</b> ${esc(m)}</li>`).join('');
  return `<ul class="igdb-motifs">${lignes}</ul>`;
}

/* ---------- désigner soi-même la bonne fiche ----------
   Sur un titre que plusieurs jeux portent — « Doom », « God of War »,
   « Tomb Raider » — ou qu'IGDB n'a pas reconnu, le rapprochement
   automatique se trompe. La date de sortie tranche presque toujours (elle
   suffit pour 96 % du journal), mais quand elle ne suffit pas, seul un
   œil humain peut décider. La grille des jaquettes sert déjà exactement à
   ça ailleurs : on la réutilise telle quelle, titres et dates affichés.

   La fiche retenue est celle qui sera écrite : c'est son identifiant qui
   part, et le serveur en tire plateforme, développeur et genres. */
async function corrigeFiche(l, terme){
  const cherche = terme || l.g.name;
  let data;
  try{ data = await api('/api/jeu/suggestions', {nom: cherche}); }
  catch(e){ data = null; }
  const jeux = (data && data.etat === 'ok' && data.jeux) || [];
  if(!jeux.length && !terme){
    toast(`Aucune fiche proposée pour « ${cherche} »`, true);
    return;
  }
  if(!jeux.length) toast(`Rien trouvé pour « ${cherche} »`, true);
  openJaq(l.g.name, jeux, choix=>{
    l.fiche = choix;
    l.surete = 'sure';              // choisi à la main : plus rien à deviner
    l.rattache = true;              // l'identifiant part, options ou pas
    /* on repart du choix : la date suit la fiche, et les trois colonnes
       seront relues côté serveur à partir de l'identifiant */
    l.date = (IGD.opts.dates && choix.iso && choix.iso !== (l.g.release || ''))
      ? {avant: l.g.release || '', apres: choix.iso} : null;
    if(IGD.opts.detail) l.detail = {plateforme: null, developpeur: null, genres: null};
    l.coche = igdbAChanger(l);
    igdbRevue();                    // la liste se redessine avec le nouveau choix
  }, null, {
    titre: `Quel jeu est « ${l.g.name} » ?`,
    terme: cherche,
    surRecherche: t => corrigeFiche(l, t),
  });
}

/* Le bouton principal dit ce qu'il va faire, et il change à chaque case
   décochée : « Écrire 12 lignes », puis « Passer aux jaquettes », puis
   « Fermer » quand il ne reste plus rien. */
function igdbBouton(){
  const b = $('igdb_ok');
  if(!b) return;
  const n = IGD.lignes.filter(l => l.coche && igdbAChanger(l)).length;
  if(n) b.textContent = `Écrire ${n} ligne${n > 1 ? 's' : ''}`;
  else if(IGD.file.length) b.textContent = `Voir les ${IGD.file.length} jaquette${IGD.file.length > 1 ? 's' : ''}`;
  else b.textContent = 'Fermer';
}

/* ---------- étape 4 : l'écriture ---------- */
/* Ce qui part pour un jeu : les deux champs concernés, pas un de plus.
   Le serveur ne touche qu'aux champs présents dans `values` — la note, le
   mois, le temps de jeu, le prix payé et l'avis ne sont donc pas réécrits,
   pas même à l'identique. Ni `periode` ni `review` ici : les omettre est
   justement ce qui dit de ne pas y toucher. */
function igdbCharge(l){
  const values = {};
  if(l.date) values.release = l.date.apres;
  if(l.prix) values.base = l.prix.apres;
  /* Seul l'identifiant part : plateforme, développeur et genres sont
     relus depuis IGDB par le serveur (enrichit_igdb), jamais dictés
     d'ici. Il vient de répondre à l'analyse, donc il les a en cache et
     l'écriture ne lui coûte pas un aller-retour de plus. */
  if(l.detail || l.rattache) values.id_igdb = l.fiche.id;
  return { id: l.g.id, values: values };
}

/* Écriture par paquets : une seule relecture du journal pour vingt jeux au
   lieu d'une par jeu. C'est la relecture qui coûte, pas l'écriture.

   Le repli « un par un » de l'époque Apps Script a disparu : il servait aux
   scripts pas encore redéployés avec l'action « lot ». Flask, lui, sait
   toujours traiter un paquet. */
const IGDB_LOT = 20;

/* Écrit un paquet et renvoie les motifs d'échec, un par jeu. Les compteurs
   sont tenus ici : c'est le seul endroit qui sache exactement lequel des
   jeux est passé et lequel a résisté. */
async function igdbEnvoyerPaquet(paquet){
  const echecs = [], utiles = [];
  paquet.forEach(l=>{
    try{ utiles.push({ligne: l, charge: igdbCharge(l)}); }
    catch(e){ echecs.push(`${l.g.name} — ${e.message || 'erreur inconnue'}`); }
  });
  if(!utiles.length) return echecs;
  const compter = u => {
    if(u.ligne.date) IGD.compte.dates++;
    if(u.ligne.prix) IGD.compte.prix++;
    if(u.ligne.detail || u.ligne.rattache) IGD.compte.detail++;
  };

  try{
    IGD.dernier = await envoyer('PUT', '/api/journal/lot',
                                {modifs: utiles.map(u => u.charge)});
    const refuses = ((IGD.dernier.fait || {}).echecs) || [];
    const rates = {};
    refuses.forEach(e=>{
      rates[e.i] = true;
      echecs.push(`${e.jeu || '?'} — ${e.error}`);
    });
    utiles.forEach((u,k)=>{ if(!rates[k]) compter(u); });
    return echecs;
  }catch(e){
    // panne franche : le paquet entier n'est pas passé, on le dit
    const motif = e.message || 'erreur inconnue';
    return echecs.concat(utiles.map(u => `${u.ligne.g.name} — ${motif}`));
  }
}

async function igdbEcriture(){
  const jeton = ++IGD.jeton;
  IGD.etape = 'ecriture';
  IGD.stop = false;
  IGD.t0 = Date.now();
  IGD.compte.dates = 0; IGD.compte.prix = 0; IGD.compte.detail = 0; IGD.compte.echecs = 0;
  IGD.echecs = [];
  const aFaire = IGD.lignes.filter(l => l.coche && igdbAChanger(l));
  igdbEntete('Écriture dans le classeur');
  igdbCorps().innerHTML = `
    <p class="igdb-info">Seules la date de sortie, le prix de base${
      IGD.opts.detail ? ' et la fiche détaillée' : ''} sont touchés.</p>
    ${igdbJauge()}
    <div class="frow"><span class="spacer"></span>
      <button class="ghost" id="igdb_stop">Interrompre</button></div>`;
  $('igdb_stop').onclick = ()=>{ IGD.stop = true; };

  let i = 0;
  while(i < aFaire.length){
    if(jeton !== IGD.jeton) return;
    if(IGD.stop) break;
    const paquet = aFaire.slice(i, i + IGDB_LOT);
    igdbAvance(i, aFaire.length, paquet[0].g.name
      + (paquet.length > 1 ? ` (+${paquet.length - 1})` : ''));
    const rates = await igdbEnvoyerPaquet(paquet);
    if(jeton !== IGD.jeton) return;
    IGD.echecs = IGD.echecs.concat(rates);
    IGD.compte.echecs += rates.length;
    i += paquet.length;
  }
  if(jeton !== IGD.jeton) return;
  igdbAvance(aFaire.length, aFaire.length, '');

  /* le classeur relu par la dernière écriture remplace ce qu'on affiche :
     une seule fois, à la fin, plutôt qu'un rendu complet par ligne */
  if(IGD.dernier){
    const s = source();
    if(s) cacheStore.set(s.url, IGD.dernier);
    applyData(IGD.dernier, true);
    IGD.dernier = null;
    render();
  }
  if(IGD.file.length) igdbJaquette();
  else igdbFini();
}

/* ---------- étape 5 : les jaquettes, une par une ---------- */
function igdbJaquette(){
  IGD.etape = 'jaquettes';
  if(IGD.fi >= IGD.file.length){ igdbFini(); return; }
  const e = IGD.file[IGD.fi];
  igdbEntete(`Jaquette ${IGD.fi + 1} / ${IGD.file.length}`);
  igdbCorps().innerHTML = `
    <p class="igdb-info">Jaquette de <b>« ${esc(e.nom)} »</b>.</p>
    <div class="jaq-grid">
      ${e.propositions.map((p,i)=>`
        <button class="jaq-item${p.suggere ? ' suggeree' : ''}" data-i="${i}" title="${esc(p.lien || '')}">
          <img src="${esc(p.apercu)}" alt="" loading="lazy" decoding="async">
          <b>${esc(p.titre)}</b>
          <span>${esc(p.date || 'date inconnue')}${p.nature ? ' · ' + esc(p.nature) : ''}</span>
        </button>`).join('')}
    </div>
    <div class="frow">
      <button class="ghost" id="igdb_stop">Arrêter là</button>
      <span class="spacer"></span>
      <button class="ghost" id="igdb_passer">Passer ce jeu</button>
    </div>`;
  $('igdb_stop').onclick = igdbFini;
  $('igdb_passer').onclick = ()=>{ IGD.fi++; igdbJaquette(); };
  igdbCorps().querySelectorAll('.jaq-item').forEach(b=>{
    b.onclick = ()=> igdbPoser(b, e.nom, e.propositions[+b.dataset.i], e.jeuId);
  });
}
async function igdbPoser(btn, nom, choix, jeuId){
  const jeton = ++IGD.jeton;
  igdbCorps().querySelectorAll('.jaq-item').forEach(b=>{ b.disabled = true; });
  btn.classList.add('pris');
  /* Le jeu est relu dans GAMES plutôt que pris dans le rapport : l'écriture
     vient de passer juste avant, et c'est elle qui a pu lui donner son
     identifiant IGDB. Le rapport, lui, date d'avant. */
  const jeu = GAMES.find(x => x.id === jeuId);
  const idIgdb = jeu ? jeu.idIgdb : null;
  const cle = idIgdb ? String(idIgdb) : slug(nom);
  let data;
  try{ data = await api('/api/jaquette/choisir',
    {nom: nom, image: choix.image, id_igdb: idIgdb || null}); }
  catch(e){ data = null; }
  if(jeton !== IGD.jeton) return;       // la fenêtre a été fermée entre-temps
  if(data && data.etat === 'telechargee'){
    IGD.compte.jaquettes++;
    poseJaquette(cle);
  }else{
    toast('Téléchargement impossible' + (data && data.raison ? ' — ' + data.raison : ''), true);
  }
  IGD.fi++;
  igdbJaquette();
}

/* ---------- étape 6 : le compte rendu ---------- */
function igdbFini(){
  IGD.etape = 'fini';
  IGD.jeton++;
  igdbEntete('Mise à jour terminée');
  const c = IGD.compte;
  const plu = n => n > 1 ? 's' : '';
  igdbCorps().innerHTML = `
    <div class="igdb-bilan">
      <span class="igdb-chiffre"><b>${c.dates}</b> <u>date${plu(c.dates)} corrigée${plu(c.dates)}</u></span>
      <span class="igdb-chiffre"><b>${c.prix}</b> <u>prix mis à jour</u></span>
      <span class="igdb-chiffre"><b>${c.jaquettes}</b> <u>jaquette${plu(c.jaquettes)} récupérée${plu(c.jaquettes)}</u></span>
      <span class="igdb-chiffre"><b>${c.detail}</b> <u>fiche${plu(c.detail)} détaillée${plu(c.detail)}</u></span>
    </div>
    ${(!c.dates && !c.prix && !c.jaquettes && !c.detail)
      ? '<p class="igdb-note">Rien à changer : le journal était déjà à jour.</p>' : ''}
    ${c.echecs ? `<div class="ferr">${c.echecs} ligne${c.echecs > 1 ? 's n\'ont' : " n'a"} pas pu être écrite${c.echecs > 1 ? 's' : ''} :<br>${IGD.echecs.map(esc).join('<br>')}</div>` : ''}
    <div class="frow"><span class="spacer"></span>
      <button class="cta auto" id="igdb_fin">Fermer</button></div>`;
  $('igdb_fin').onclick = fermerIgdb;
}

fermeSurFond('igdb', fermerIgdb);
$('igdbBtn').addEventListener('click', ouvrirIgdb);

/* ---------- rendu global ---------- */
/* =======================================================================
   Onglet « Statistiques »

   Quatre lectures de la même question : qu'est-ce qui va avec une bonne
   note ? Deux formes, choisies par la nature de la donnée et pas par goût.

   - Temps de jeu et prix sont des quantités continues. Un nuage de points
     est la seule forme qui n'invente rien : il montre la dispersion, les
     cas isolés, et les paquets. Les mettre en barres obligerait à
     découper en tranches, et le découpage déciderait de la conclusion.
   - Genre et développeur sont des catégories, et un jeu en porte
     plusieurs. Un nuage empilerait des centaines de points sur une
     poignée d'abscisses, illisible. Des barres classées par moyenne
     répondent directement à « lesquels je note le mieux ».

   Chaque moyenne est accompagnée du nombre de jeux derrière elle, et rien
   n'est affiché sous ANALYSE_MINI : une moyenne sur deux jeux n'est pas un
   fait, c'est un hasard avec une décimale.

   Tout est en SVG écrit à la main. Pas de bibliothèque : la page n'a pas
   d'étape de construction, et quatre graphiques ne valent pas 300 Ko.
   ======================================================================= */
const ANALYSE_MINI = 3;      // en dessous, une moyenne ne veut rien dire

/* Les jeux sur lesquels une statistique a un sens : terminés et notés. Un
   jeu en cours ou en wishlist n'a pas de note, et sa présence ferait
   mentir tous les effectifs. */
function jeuxAnalyses(){
  return GAMES.filter(x => !estStatut(x) && x.rating !== null && x.rating !== undefined);
}

/* Coefficient de Pearson : entre -1 et 1. Sans lui, un nuage laisse croire
   ce qu'on veut y voir — c'est le chiffre qui tranche entre « ça monte »
   et « ça ne dit rien ». */
function correlation(paires){
  const n = paires.length;
  if(n < 3) return null;
  const mx = paires.reduce((s,p)=>s+p[0],0)/n;
  const my = paires.reduce((s,p)=>s+p[1],0)/n;
  let num = 0, dx = 0, dy = 0;
  paires.forEach(([a,b])=>{ num += (a-mx)*(b-my); dx += (a-mx)**2; dy += (b-my)**2; });
  const den = Math.sqrt(dx*dy);
  return den ? num/den : null;
}
function litCorrelation(r){
  if(r === null) return 'trop peu de jeux pour en dire quoi que ce soit';
  const f = Math.abs(r);
  const sens = r > 0 ? 'monte avec' : 'baisse quand monte';
  if(f < 0.2) return `aucun lien visible (r = ${fr(r,2)})`;
  if(f < 0.4) return `un lien faible, la note ${sens} (r = ${fr(r,2)})`;
  if(f < 0.6) return `un lien net, la note ${sens} (r = ${fr(r,2)})`;
  return `un lien fort, la note ${sens} (r = ${fr(r,2)})`;
}

/* ---------- le nuage de points ---------- */
const AN_L = 640, AN_H = 360, AN_MG = 46, AN_MB = 34, AN_MT = 12, AN_MR = 12;

function nuageHTML(titre, points, uniteX, fmtX, sous, log){
  if(points.length < 3){
    return carteAnalyse(titre, 'Moins de trois jeux renseignés : rien à tracer.', '');
  }
  const xMax = Math.max(...points.map(p => p.x));
  const py = v => AN_MT + (1 - v/10) * (AN_H - AN_MT - AN_MB);
  const large = AN_L - AN_MG - AN_MR;

  /* Échelle logarithmique quand les valeurs s'étalent sur plusieurs ordres
     de grandeur — c'est le cas du temps de jeu : moitié des jeux sous 12 h,
     et un à 3 581 h. En linéaire, tout se tasserait contre l'axe gauche sur
     moins d'un pour cent de la largeur et le graphique ne dirait plus rien.
     Aucun point n'est écarté pour autant : c'est la règle qui change, pas
     les données. */
  let px, graduations;
  if(log){
    const bas = 1, haut = Math.pow(10, Math.ceil(Math.log10(Math.max(xMax, 10))));
    const l = v => Math.log10(Math.max(v, bas));
    px = v => AN_MG + (l(v) - l(bas)) / (l(haut) - l(bas)) * large;
    graduations = [];
    for(let v = bas; v <= haut; v *= 10) graduations.push(v);
  }else{
    const haut = echelleHaute(xMax);
    px = v => AN_MG + (v / haut) * large;
    graduations = [0,1,2,3,4].map(i => haut/4*i);
  }

  const grilleY = [0,2,4,6,8,10].map(v =>
    `<line class="an-grille" x1="${AN_MG}" y1="${py(v).toFixed(1)}" x2="${AN_L-AN_MR}" y2="${py(v).toFixed(1)}"/>
     <text class="an-axe" x="${AN_MG-8}" y="${(py(v)+3.5).toFixed(1)}" text-anchor="end">${v}</text>`).join('');
  const grilleX = graduations.map(v =>
    `<text class="an-axe" x="${px(v).toFixed(1)}" y="${AN_H-AN_MB+18}" text-anchor="middle">${esc(fmtX(v))}</text>`).join('');

  /* Les points sont tracés du plus grand rayon au plus petit ? Non : dans
     l'ordre reçu, mais semi-transparents. Là où les jeux se tassent, les
     disques s'additionnent et la densité se voit — un aplat opaque ne
     dirait pas si un point en cache deux ou vingt. */
  const disques = points.map(p =>
    `<circle class="an-pt" cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="4.5"
       fill="${noteColor(p.y)}" data-info="${esc(p.nom)} — ${fr(p.y,1)}/10, ${esc(fmtX(p.x))}"/>`).join('');

  const r = correlation(points.map(p => [p.x, p.y]));
  return carteAnalyse(titre,
    `${points.length} jeu${points.length>1?'x':''} · ${litCorrelation(r)}${
      log ? ' · échelle logarithmique' : ''}${sous ? ' · ' + sous : ''}`,
    `<svg class="an-svg" viewBox="0 0 ${AN_L} ${AN_H}" role="img"
          aria-label="${esc(titre)}, ${points.length} jeux">
       ${grilleY}${grilleX}
       <line class="an-cadre" x1="${AN_MG}" y1="${AN_MT}" x2="${AN_MG}" y2="${AN_H-AN_MB}"/>
       <line class="an-cadre" x1="${AN_MG}" y1="${AN_H-AN_MB}" x2="${AN_L-AN_MR}" y2="${AN_H-AN_MB}"/>
       <text class="an-unite" x="${AN_L-AN_MR}" y="${AN_H-4}" text-anchor="end">${esc(uniteX)}</text>
       ${disques}
     </svg>`);
}

/* Un maximum d'axe rond : 47 h devient 50, 1250 € devient 1500. Un axe qui
   s'arrête sur la valeur exacte du plus grand point colle ce point au bord
   et donne des graduations illisibles. */
function echelleHaute(v){
  if(v <= 0) return 1;
  const ordre = Math.pow(10, Math.floor(Math.log10(v)));
  return Math.ceil(v / (ordre/2)) * (ordre/2);
}

/* ---------- les barres classées ---------- */
/* Une barre se déplie sur la liste des jeux qu'elle résume. Une moyenne
   sans ce qu'il y a derrière n'est qu'un chiffre : « Puzzle 7,41 » ne dit
   pas si c'est un genre régulier ou deux chefs-d'œuvre qui rattrapent
   quatre ratages. La liste est là, en un clic, triée par note.

   Repliée par défaut, et une seule ouverte à la fois : vingt genres
   dépliés d'un coup redonneraient le mur de jeux, qui existe déjà. */
function barresHTML(titre, groupes, legende){
  const lignes = Object.entries(groupes)
    .filter(([, jeux]) => jeux.length >= ANALYSE_MINI)
    .map(([nom, jeux]) => ({
      nom: nom,
      n: jeux.length,
      moy: jeux.reduce((s,x)=>s+x.rating,0) / jeux.length,
      jeux: jeux.slice().sort((a,b) => b.rating - a.rating),
    }))
    .sort((a,b) => b.moy - a.moy);

  if(!lignes.length){
    return carteAnalyse(titre,
      `Aucun n'atteint ${ANALYSE_MINI} jeux notés.`, '');
  }
  const corps = lignes.map(l => `
    <div class="an-item">
      <button type="button" class="an-ligne" aria-expanded="false"
        data-info="${esc(l.nom)} — ${fr(l.moy,2)}/10 sur ${l.n} jeu${l.n>1?'x':''}, clique pour voir lesquels">
        <span class="an-nom">${esc(l.nom)}</span>
        <span class="an-piste"><i style="width:${(l.moy*10).toFixed(1)}%;background:${noteColor(l.moy)}"></i></span>
        <span class="an-val">${fr(l.moy,2)}<em>${l.n}</em></span>
      </button>
      <div class="an-jeux" hidden>${l.jeux.map(j => `
        <span class="an-jeu">
          <b>${esc(j.name)}</b>
          <i style="color:${noteColor(j.rating)}">${fr(j.rating,1)}</i>
        </span>`).join('')}</div>
    </div>`).join('');
  return carteAnalyse(titre, legende, `<div class="an-barres">${corps}</div>`);
}

function carteAnalyse(titre, sous, corps){
  return `<article class="an-carte">
    <header class="an-tete"><h3>${esc(titre)}</h3><span>${esc(sous)}</span></header>
    ${corps || '<p class="an-vide">Rien à montrer pour l\'instant.</p>'}
  </article>`;
}

/* Regroupe les JEUX par valeur d'un champ à valeurs multiples
   (« Platform, Puzzle, Adventure ») : un jeu compte dans chacune.
   Les jeux et pas seulement leurs notes, parce que la barre se déplie sur
   la liste — la moyenne se recalcule à partir d'eux. */
function groupePar(jeux, champ){
  const d = {};
  jeux.forEach(x => String(x[champ] || '').split(',').forEach(v => {
    const k = v.trim();
    if(k) (d[k] = d[k] || []).push(x);
  }));
  return d;
}

function renderAnalyse(){
  const hote = document.getElementById('analyse');
  const jeux = jeuxAnalyses();
  if(!jeux.length){
    hote.innerHTML = `<div class="tip" id="anTip"></div>
      <p class="an-rien">Aucun jeu terminé et noté : les statistiques arriveront avec eux.</p>`;
    return;
  }
  const heures = jeux.filter(x => x.hours).map(x => ({x: x.hours, y: x.rating, nom: x.name}));

  /* Le prix demande une précaution : un jeu à 0 € n'est pas un jeu bon
     marché, c'est un jeu qui n'a pas été acheté (offert, bundle, gratuit).
     Le mettre dans le nuage collerait une colonne verticale contre l'axe
     et écraserait les vrais prix. Mais l'écarter en silence cacherait le
     fait le plus intéressant du lot — alors il est dit en toutes lettres
     dans le sous-titre, et il vaut mieux qu'un point de plus. */
  const payants = jeux.filter(x => x.paid > 0);
  const offerts = jeux.filter(x => x.paid === 0);
  const moyenne = l => l.reduce((s,x)=>s+x.rating,0) / l.length;
  const prix = payants.map(x => ({x: x.paid, y: x.rating, nom: x.name}));
  const compare = (offerts.length >= ANALYSE_MINI && payants.length >= ANALYSE_MINI)
    ? `${offerts.length} jeux obtenus sans payer : ${fr(moyenne(offerts),2)} de moyenne, contre ${
        fr(moyenne(payants),2)} pour les payants`
    : '';

  hote.innerHTML = `<div class="tip" id="anTip"></div>
    <div class="an-entete">
      <h2>Statistiques</h2>
      <p>Sur ${jeux.length} jeu${jeux.length>1?'x':''} terminé${jeux.length>1?'s':''} et noté${jeux.length>1?'s':''}.</p>
    </div>
    <div class="an-grille2">
      ${nuageHTML('Note et temps de jeu', heures, 'heures de jeu',
                  v => fr(v,0) + ' h', '', true)}
      ${nuageHTML('Note et prix payé', prix, 'prix payé',
                  v => fr(v,0) + ' €', compare, false)}
      ${barresHTML('Note moyenne par genre', groupePar(jeux, 'genres'), ``)}
      ${barresHTML('Note moyenne par développeur', groupePar(jeux, 'developpeur'), ``)}
    </div>`;
  brancheInfobulleAnalyse();
  brancheDepliage();
}

/* Un seul gestionnaire pour toutes les barres, posé sur la section : elles
   sont redessinées à chaque rendu, et rattacher vingt écouteurs à chaque
   fois ne servirait qu'à les oublier une fois sur deux.

   onclick et non addEventListener : renderAnalyse() rappelle cette
   fonction à chaque rendu. Avec addEventListener les écouteurs
   s'empileraient, et deux d'entre eux s'annuleraient — le premier ouvre la
   liste, le second la voit ouverte et la referme aussitôt. Une affectation
   remplace au lieu d'ajouter. */
function brancheDepliage(){
  const hote = document.getElementById('analyse');
  if(!hote) return;
  hote.onclick = e=>{
    const b = e.target.closest('.an-ligne');
    if(!b) return;
    const liste = b.nextElementSibling;
    const ouvrir = liste.hidden;
    // on referme celle d'avant : deux listes ouvertes noient la comparaison
    hote.querySelectorAll('.an-jeux').forEach(l => { l.hidden = true; });
    hote.querySelectorAll('.an-ligne').forEach(x => x.setAttribute('aria-expanded', 'false'));
    if(ouvrir){
      liste.hidden = false;
      b.setAttribute('aria-expanded', 'true');
    }
  };
}

/* Une seule infobulle pour les quatre graphiques : elle suit le pointeur et
   lit data-info, que le point vienne d'un nuage ou d'une barre. */
function brancheInfobulleAnalyse(){
  const hote = document.getElementById('analyse');
  const tip = document.getElementById('anTip');
  if(!hote || !tip) return;
  hote.onmousemove = e => {
    const cible = e.target.closest('[data-info]');
    if(!cible){ tip.classList.remove('show'); return; }
    tip.textContent = cible.dataset.info;
    const b = hote.getBoundingClientRect();
    tip.style.left = (e.clientX - b.left) + 'px';
    tip.style.top  = (e.clientY - b.top - 12) + 'px';
    tip.classList.add('show');
  };
  hote.onmouseleave = ()=> tip.classList.remove('show');
}

function render(){
  /* La fiche ouverte survit au rendu. render() commençait par closeSheet(),
     si bien qu'un rafraîchissement de fond qui aboutissait pendant qu'on
     lisait une fiche la refermait sous les yeux. On retient plutôt quel jeu
     est affiché, et on va le rechercher dans les données neuves.

     Son identité, c'est le couple (onglet, ligne) — celui-là même qui sert
     déjà à réécrire la bonne cellule du classeur — plus le nom. Le nom
     n'est pas du luxe : quand une ligne est supprimée, les suivantes
     remontent d'un cran, et (onglet, ligne) désignerait alors le voisin. */
  const iAvant = S.open;
  const vu = iAvant !== null ? SHEET_LIST[iAvant] : null;
  const avant = vu ? JSON.stringify(vu) : '';
  const nAvant = SHEET_LIST.length;

  majEntete();
  document.getElementById('addBtn').hidden = !CAN_WRITE;
  renderTabs();

  /* L'onglet des statistiques n'est pas un tiroir : il n'a ni mur, ni tri,
     ni recherche, ni histogramme. Tout ce qui parle d'une liste de jeux est
     donc rangé, et lui seul s'affiche — plutôt que de laisser un bandeau de
     stats et une barre d'outils sans objet flotter au-dessus du vide. */
  const vueStats = S.bucket === 'stats';
  document.getElementById('analyse').hidden = !vueStats;
  document.getElementById('statsWrap').hidden = vueStats;
  document.getElementById('dist').hidden = vueStats;
  document.querySelector('.tools').hidden = vueStats;
  document.getElementById('out').hidden = vueStats;
  if(vueStats){
    document.getElementById('deco').hidden = true;
    renderAnalyse();
    document.getElementById('brand-sub').textContent = '- Statistiques';
    closeSheet();
    return;
  }

  renderSort(); renderStats(); renderDist();
  // reconstruire les tuiles pendant que l'une d'elles voyage vers la fiche
  // casse la transition en cours (voir TRANSITION_EN_COURS) : on la repousse
  if(TRANSITION_EN_COURS) RENDU_MUR_EN_ATTENTE = true;
  else renderWall();
  // prix Steam et suggestions : uniquement quand la wishlist est à l'écran
  if(estWishlistNom(S.bucket)){ majTarifs(); chargeDecouverte(); }
  renderDecouverte();
  document.getElementById('brand-sub').textContent =
    S.bucket==='all' ? "- Tous" : `- ${S.bucket}`;

  if(iAvant === null) return;          // aucune fiche n'était ouverte
  if(!vu){ closeSheet(); return; }     // index sans jeu en face : on ferme
  /* filtered() est relu ici et pas plus haut : renderSort() peut changer le
     tri et renderDist() annuler la tranche de notes, donc l'ordre de la
     liste — et le rang de la fiche dedans. */
  const liste = filtered();
  const i = liste.findIndex(x => x.id === vu.id);
  // plus là : ligne supprimée, ou sortie du filtre affiché
  if(i < 0){ closeSheet(); return; }
  SHEET_LIST = liste;
  S.open = i;
  /* Repeindre seulement si quelque chose a bougé pour ce jeu, pour sa place
     ou pour le total affiché à côté. Repeindre pour rien remettrait la
     fiche tout en haut et volerait le focus à chaque passage du
     rafraîchissement de fond, alors qu'il ne rapporte presque toujours
     exactement les mêmes données. */
  if(JSON.stringify(liste[i]) !== avant || i !== iAvant || liste.length !== nAvant){
    paintSheet();
  }
}

/* ---------- contrôles ---------- */
document.getElementById('q').addEventListener('input',e=>{ S.q=e.target.value; renderWall(); });
document.getElementById('sort').addEventListener('change',e=>{
  S.sort = e.target.value;
  TRI_MEMO[familleTri()] = S.sort;   // retenu pour les onglets de cette famille
  renderWall();
});
window.addEventListener('resize', ()=>{ document.getElementById('tip').classList.remove('show'); });
</script>
