function joueHalo(){
  const tuile = HALO;
  HALO = null;
  if(!tuile || !tuile.isConnected) return;
  tuile.classList.remove('revenu');
  void tuile.offsetWidth;          // sinon l'animation ne repart pas
  tuile.classList.add('revenu');
  setTimeout(()=>{ tuile.classList.remove('revenu'); }, 700);
}

/* Remet le défilement puis le focus. preventScroll est indispensable : sans
   lui, focus() ramène la tuile dans le champ de vision et déplace le mur
   sous les yeux, ce qu'on cherche précisément à éviter. */
function rendreFocus(){
  const tuile = FICHE_RETOUR;
  FICHE_RETOUR = null;
  if(Math.abs(window.scrollY - FICHE_SCROLL) > 1) window.scrollTo(0, FICHE_SCROLL);
  if(!tuile || !tuile.isConnected) return;
  try{ tuile.focus({preventScroll: true}); }catch(err){ tuile.focus(); }
  HALO = tuile;
}

const VT_JAQUETTE = 'jaquette-active';
function nomVT(el, actif){
  if(el) el.style.viewTransitionName = actif ? VT_JAQUETTE : '';
}
function jaquetteFiche(){
  return document.querySelector('#sheet .sheet-cover .cov');
}
function jaquetteTuile(g){
  const tuile = g && TUILES.get(cleTuile(g));
  return (tuile && tuile.isConnected) ? tuile.querySelector('.cov') : null;
}

function ouvreFiche(i, tuile){
  FICHE_RETOUR = tuile || null;
  FICHE_SCROLL = window.scrollY;
  const src = tuile && tuile.querySelector('.cov');
  if(!document.startViewTransition || !src){ openSheet(i); return; }
  nomVT(src, true);
  const vt = document.startViewTransition(()=>{
    nomVT(src, false);           // la tuile rend le nom...
    openSheet(i);
    nomVT(jaquetteFiche(), true);  // ...la fiche le reprend
  });
  vt.finished.catch(()=>{}).then(()=> nomVT(src, false));
}

function fermeFiche(){
  const host = document.getElementById('sheet');
  if(host.hidden) return;
  const g = SHEET_LIST[S.open];
  const src = jaquetteFiche();
  if(!document.startViewTransition || !src || !g){ closeSheet(); joueHalo(); return; }
  nomVT(src, true);
  const vt = document.startViewTransition(()=>{
    nomVT(src, false);
    closeSheet();
    nomVT(jaquetteTuile(g), true);   // la vignette reprend sa place
  });
  vt.finished.catch(()=>{}).then(()=>{
    nomVT(jaquetteTuile(g), false);
    joueHalo();          // sous la photo de la transition, il serait invisible
  });
}

function closeSheet(){
  const host = document.getElementById('sheet');
  if(host.hidden) return;
  host.hidden = true; host.innerHTML = '';
  verrouFond();          // le défilement doit être rendu avant d'être repositionné
  S.open = null;
  rendreFocus();
}
document.getElementById('sheet').addEventListener('click', e=>{
  if(e.target.id === 'sheet') fermeFiche();
});
document.addEventListener('keydown', e=>{
  // la mise à jour depuis IGDB occupe l'écran seule : rien ne s'ouvre
  // par-dessus, donc rien d'autre ne prend Échap tant qu'elle est là
  if(!document.getElementById('igdb').hidden){
    if(e.key === 'Escape') fermerIgdb();
    return;
  }
  // le bilan en image est au-dessus de tout, y compris le choix de jaquette
  if(!document.getElementById('bilan').hidden){
    if(e.key === 'Escape') fermerBilan();
    return;
  }
  if(!document.getElementById('jaq').hidden){
    if(e.key === 'Escape') closeJaq();
    return;
  }
  if(!document.getElementById('form').hidden){
    if(e.key === 'Escape') closeForm();
    return;
  }
  if(document.getElementById('sheet').hidden){
    // rien d'ouvert : Échap enlève la tranche de notes choisie
    const per = document.getElementById('perMenu');
    if(e.key === 'Escape' && S.range
       && document.getElementById('menu').hidden
       && document.getElementById('jnlMenu').hidden
       && (!per || per.hidden)) viderTranche();
    return;
  }
  if(e.key === 'Escape'){ fermeFiche(); }
  else if(e.key === 'ArrowLeft' && S.open > 0){ S.open--; paintSheet(-1); }
  else if(e.key === 'ArrowRight' && S.open < SHEET_LIST.length-1){ S.open++; paintSheet(1); }
});

/* =======================================================================
   Ajouter / modifier / supprimer — tout part vers le Google Sheet.
   La page n'invente rien : elle renvoie au script les colonnes qu'elle a
   elle-même repérées à la lecture, donc elle réécrit exactement là où
   elle avait lu.
   ======================================================================= */
let EDIT = null;

function toast(txt, mauvais){
  const t = $('toast');
  t.textContent = txt;
  t.className = 'toast show' + (mauvais ? ' bad' : '');
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.classList.remove('show'); }, 3000);
}
function isoDate(d){ return /^\d{4}-\d{2}-\d{2}$/.test(d||'') ? d : ''; }
function timeText(h){
  if(h===null||h===undefined) return '';
  const H = Math.floor(h), M = Math.round((h-H)*60);
  return M ? `${H}h${String(M).padStart(2,'0')}` : `${H}h`;
}
function numText(n){ return (n===null||n===undefined||n==='') ? '' : String(n).replace('.',','); }

function formHTML(g){
  // « En cours » et « Wishlist » ont leur case à cocher : ils ne doivent pas
  // traîner aussi dans la liste des années
  const opts = BUCKETS.filter(b=>!estStatutNom(b)).map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('');
  const mois = MONTHS.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
  const avis = g ? g.review.join('\n') : '';
  return `<div class="sheet form-sheet" role="dialog" aria-modal="true">
    <div class="sheet-tools">
      <span class="grp"><b class="fhead">${g ? 'Modifier un jeu' : 'Ajouter un jeu'}</b></span>
      <span class="grp"><button class="sbtn form-x" aria-label="Fermer">×</button></span>
    </div>
    <div class="form-in">
      <div class="fgrid">
        <div class="fld full acw">
          <label for="f_name"><u>Nom du jeu</u></label>
          <input id="f_name" type="text" value="${esc(g?g.name:'')}" autocomplete="off"
                 spellcheck="false" role="combobox" aria-controls="f_ac"
                 aria-autocomplete="list" aria-expanded="false">
          <div class="ac" id="f_ac" role="listbox" aria-label="Jeux trouvés sur IGDB" hidden></div>
        </div>
        <button type="button" class="fpick" id="f_pick" hidden>
          <img id="f_pickimg" alt="" decoding="async">
          <span class="fpick-txt">
            <b id="f_pickt"></b>
            <i id="f_pickd"></i>
            <small>Clique pour changer la jaquette</small>
          </span>
        </button>
        <label class="fld fcheck">
          <input id="f_encours" type="checkbox">
          <span>Jeu en cours</span></label>
        <label class="fld fcheck wish">
          <input id="f_wish" type="checkbox">
          <span>Wishlist</span></label>
        <label class="fld" id="f_bucketwrap"><u>Année</u>
          <select id="f_bucket">${opts}<option value="__new">＋ Ajouter...</option></select></label>
        <label class="fld" id="f_newwrap" hidden><u>Nom du nouvel onglet</u>
          <input id="f_new" type="text" autocomplete="off"></label>
        <label class="fld" id="f_monthwrap"><u>Mois</u>
          <select id="f_month"><option value="">—</option>${mois}</select></label>
        <label class="fld" id="f_ratingwrap"><u>Note sur 10</u>
          <input id="f_rating" type="text" inputmode="decimal" value="${esc(numText(g?g.rating:null))}"></label>
        <label class="fld" id="f_timewrap"><u>Temps de jeu (h)</u>
          <input id="f_time" type="text" value="${esc(timeText(g?g.hours:null))}"></label>
        <label class="fld"><u>Prix de base (€)</u>
          <input id="f_base" type="text" inputmode="decimal" value="${esc(numText(g?g.base:null))}"></label>
        <label class="fld" id="f_paidwrap"><u>Prix payé (€)</u>
          <input id="f_paid" type="text" inputmode="decimal" value="${esc(numText(g?g.paid:null))}"></label>
        <label class="fld full"><u>Date de sortie</u>
          <input id="f_release" type="date" value="${esc(isoDate(g?g.release:''))}"
                 data-orig="${esc(g&&g.release?g.release:'')}"></label>
        <label class="fld full" id="f_reviewwrap"><u>Avis (Commencer par + ou -)</u>
          <span class="ta-wrap"><span class="ta-hl" id="f_review_hl" aria-hidden="true"></span
            ><textarea id="f_review" rows="5">${esc(avis)}</textarea></span></label>
      </div>
      <div class="ferr" id="f_err" hidden></div>
      <div class="frow">
        ${g ? '<button class="ghost danger" id="f_del">Supprimer ce jeu</button>' : ''}
        <span class="spacer"></span>
        <button class="ghost" id="f_cancel">Annuler</button>
        <button class="cta auto" id="f_ok">${g ? 'Enregistrer' : 'Ajouter'}</button>
      </div>
    </div>
  </div>`;
}

/* Les deux cases s'excluent : un jeu qu'on a commencé n'est plus une envie.
   Cocher l'une décoche l'autre, plutôt que d'interdire — on ne se bat pas
   avec un formulaire qui refuse un clic sans rien dire. */
function statutCoche(){ return $('f_encours').checked || $('f_wish').checked; }
function cibleOnglet(){
  if($('f_wish').checked) return ongletWishlist();
  if($('f_encours').checked) return ongletEnCours();
  const b = $('f_bucket').value;
  return b === '__new' ? clean($('f_new').value) : b;
}
function syncOnglet(){
  $('f_newwrap').hidden = statutCoche() || $('f_bucket').value !== '__new';
}
/* Un jeu en cours n'a rien à dire de sa fin : on retire de l'écran l'année,
   le mois, la note, le temps de jeu et l'avis. Décocher les fait revenir,
   c'est le geste qui termine un jeu.
   Un jeu de la wishlist cache la même chose, plus le prix payé : il n'est
   pas acheté, la case n'aurait aucun sens. Le prix de base reste, c'est
   justement ce qu'on veut noter. */
function syncStatut(){
  const sansFin = statutCoche();
  ['f_bucketwrap','f_monthwrap','f_ratingwrap','f_timewrap','f_reviewwrap']
    .forEach(id => { $(id).hidden = sansFin; });
  $('f_paidwrap').hidden = $('f_wish').checked;
  syncOnglet();
}
function formErr(txt){
  const b = $('f_err');
  b.hidden = !txt;
  if(txt) b.textContent = txt;
}
/* Rejoue le texte de l'avis dans le calque colore : une ligne qui commence
   par + passe en vert, par - en rouge, le reste garde la couleur normale.
   Le \n final garde la bonne hauteur quand le texte finit par un retour. */
function majAvis(){
  const ta = $('f_review'), hl = $('f_review_hl');
  if(!ta || !hl) return;
  hl.innerHTML = ta.value.split('\n').map(ligne=>{
    const t = ligne.trimStart();
    const cls = t.startsWith('+') ? 'plus' : (t.startsWith('-') ? 'minus' : '');
    return cls ? `<span class="${cls}">${esc(ligne)}</span>` : esc(ligne);
  }).join('\n') + '\n';
  hl.scrollTop = ta.scrollTop;
}
function openForm(g){
  EDIT = g || null;
  const host = $('form');
  host.innerHTML = formHTML(g);
  host.hidden = false;
  verrouFond();
  const bu = $('f_bucket');
  const enCours = !!(g && estEnCours(g));
  const wish    = !!(g && estWishlist(g));
  $('f_encours').checked = enCours;
  $('f_wish').checked = wish;
  // en ajout — et pour un jeu en cours ou convoité qu'on vient de terminer —
  // on propose toujours l'année la plus récente, pas l'onglet affiché
  const defaut = (g && !enCours && !wish) ? g.bucket : derniereAnnee();
  if(BUCKETS.indexOf(defaut) >= 0) bu.value = defaut;
  /* Mois terminé : pré-rempli au mois courant, et modifiable comme avant.
     Seulement quand ça a un sens, c'est-à-dire pour un jeu qu'on termine
     maintenant — un ajout, ou un jeu en cours / convoité qu'on bascule en
     terminé. Modifier un ancien jeu sans mois n'y touche pas : proposer
     « août » pour une partie finie il y a trois ans écrirait une date
     fausse, et personne ne relit un champ déjà rempli.

     Le garde-fou sur l'année n'est pas décoratif : l'onglet proposé est le
     plus récent du journal, qui n'est pas forcément l'année en cours. Sur
     un journal resté à 2025, le mois d'aujourd'hui ne veut rien dire. */
  const maintenant = new Date();
  const termineMaintenant = !g || enCours || wish;
  const anneeCourante = bu.value === String(maintenant.getFullYear());
  $('f_month').value =
    (g && g.month) ? String(g.month)
    : (termineMaintenant && anneeCourante ? String(maintenant.getMonth() + 1) : '');
  syncStatut();
  $('f_encours').onchange = ()=>{
    if($('f_encours').checked) $('f_wish').checked = false;
    syncStatut();
  };
  $('f_wish').onchange = ()=>{
    if($('f_wish').checked) $('f_encours').checked = false;
    syncStatut();
  };
  bu.onchange = syncOnglet;
  host.querySelector('.form-x').onclick = closeForm;
  $('f_cancel').onclick = closeForm;
  $('f_ok').onclick = submitForm;
  const del = $('f_del');
  if(del) del.onclick = ()=>{
    if(del.classList.contains('armed')) return supprimerJeu(del);
    del.classList.add('armed');
    del.textContent = 'Confirmer la suppression';
    setTimeout(()=>{ if(del.isConnected){ del.classList.remove('armed'); del.textContent = 'Supprimer ce jeu'; } }, 5000);
  };
  const ta = $('f_review');
  ta.addEventListener('input', majAvis);
  ta.addEventListener('scroll', ()=>{ $('f_review_hl').scrollTop = ta.scrollTop; });
  majAvis();
  brancherAuto();          // complétion du nom depuis IGDB (voir plus bas)
  $('f_name').focus();
}
function closeForm(){
  const host = $('form');
  if(host.hidden) return;
  // ce qui est encore en vol ne concerne plus personne : la liste, le prix
  // et la jaquette retenue partent avec le formulaire
  oublieAuto();
  host.hidden = true; host.innerHTML = '';
  EDIT = null;
  verrouFond();
}
$('form').addEventListener('click', e=>{ if(e.target.id === 'form') closeForm(); });

function lireForm(){
  // en cours ou wishlist : note, mois et temps de jeu partent vides, quoi
  // qu'il reste dans les champs cachés — la ligne du classeur doit dire la
  // même chose que l'écran. Le prix payé subit le même sort en wishlist.
  const sansFin = statutCoche();
  const wish = $('f_wish').checked;
  const v = {
    name:     clean($('f_name').value),
    rating:   sansFin ? null : toNum($('f_rating').value),
    month:    sansFin ? null : toNum($('f_month').value),
    hours:    sansFin ? null : toHours($('f_time').value),
    base:     toNum($('f_base').value),
    paid:     wish ? null : toNum($('f_paid').value),
  };
  const rel = $('f_release');
  // si la date d'origine n'était pas lisible par le champ, on n'y touche pas
  if(rel.value || isoDate(rel.dataset.orig) || !rel.dataset.orig) v.release = rel.value || null;
  return v;   // ni support ni année : l'onglet suffit, et le Sheet garde ce qu'il a
}
function chargeUtile(){
  const cible = cibleOnglet();
  if(!cible) throw new Error("Donne un nom au nouvel onglet.");
  // l'onglet n'existe pas encore (« En cours » la première fois, ou un
  // nouvel onglet) : on copie les en-têtes de l'année la plus récente
  const recent = derniereAnnee();
  const modele = COLS[cible] ? cible
    : (EDIT && COLS[EDIT.bucket] ? EDIT.bucket : (COLS[recent] ? recent : BUCKETS[0]));
  const cols = COLS[cible] || COLS[modele];
  if(!cols) throw new Error("Aucun onglet ne sert de modèle : impossible de savoir où écrire.");
  const v = lireForm();
  if(!v.name) throw new Error("Il faut au moins un nom de jeu.");
  return {
    sheet: cible,
    modele: modele || null,
    cols: cols,
    colsFrom: EDIT ? (COLS[EDIT.bucket] || cols) : null,
    from: EDIT ? {sheet: EDIT.bucket, row: EDIT.row, expect: EDIT.name} : null,
    noteCol: EDIT ? EDIT.noteCol : null,
    review: statutCoche() ? '' : clean($('f_review').value),
    values: v,
  };
}
async function submitForm(){
  const btn = $('f_ok'), texte = btn.textContent;
  formErr('');
  let charge;
  try{ charge = chargeUtile(); }
  catch(e){ formErr(e.message); return; }
  /* La jaquette retenue dans le formulaire, relevée avant l'envoi : closeForm()
     l'oublie, et le nom peut avoir été retouché depuis le choix — auquel cas
     elle ne vaut plus, on repart sur une recherche normale. */
  const retenue = (JEU_PICK && JEU_PICK.image
                   && norm(JEU_PICK.nom) === norm(charge.values.name)) ? JEU_PICK : null;
  btn.disabled = true; btn.textContent = 'Enregistrement...';
  try{
    const data = await envoyer('enregistrer', charge);
    const ajout = !charge.from;
    cacheStore.set(source().url, data);
    applyData(data, true);
    // le jeu vient d'atterrir dans un autre onglet (En cours, une autre
    // année...) : on s'y place, sinon il disparaît sous les yeux
    if(S.bucket !== 'all' && S.bucket !== charge.sheet && BUCKETS.indexOf(charge.sheet) >= 0){
      S.bucket = charge.sheet; S.range = null;
    }
    closeForm(); render();
    toast(ajout ? `« ${charge.values.name} » ajouté` : `« ${charge.values.name} » mis à jour`);
    /* Une jaquette désignée dans le formulaire l'emporte, même en
       modification : c'est un geste explicite, pas une récupération
       automatique. Sinon, et seulement à l'ajout, on cherche — modifier un
       jeu ne doit pas écraser une jaquette déposée à la main. */
    if(retenue) poseJaquetteChoisie(charge.values.name, retenue.image);
    else if(ajout) jaquetteAuto(charge.values.name, charge.values.release);
  }catch(e){
    formErr(e.message);
    btn.disabled = false; btn.textContent = texte;
  }
}
async function supprimerJeu(btn){
  if(!EDIT) return;
  const nom = EDIT.name;
  const charge = {
    sheet: EDIT.bucket, row: EDIT.row, expect: EDIT.name,
    cols: COLS[EDIT.bucket] || {},
  };
  formErr('');
  btn.disabled = true; btn.textContent = 'Suppression...';
  try{
    const data = await envoyer('supprimer', charge);
    cacheStore.set(source().url, data);
    applyData(data, true); closeForm(); render();
    toast(`« ${nom} » retiré du journal`);
  }catch(e){
    formErr(e.message);
    btn.disabled = false; btn.classList.remove('armed'); btn.textContent = 'Supprimer ce jeu';
  }
}
document.getElementById('addBtn').addEventListener('click', ()=> openForm(null));

/* =======================================================================
   Jaquette automatique — uniquement à l'ajout d'un jeu.
   C'est Flask qui va la chercher (jaquettes.py) : ni le navigateur ni
   Apps Script ne savent écrire dans static/Cover/. Rien n'atterrit sur le
   disque sans un clic : même quand une seule jaquette est trouvée, elle
   est montrée d'abord. Si la route n'existe pas — vieux serveur, page
   ouverte sans Flask — tout se tait et le jeu garde ses initiales.
   ======================================================================= */
async function api(chemin, corps){
  const r = await fetch(chemin, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(corps),
  });
  if(!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
/* la jaquette est arrivée : on la remet en jeu sous un nouveau numéro */
function poseJaquette(nom){
  const f = slug(nom);
  /* le manifeste est tenu à jour sur place : redemander la liste entière
     pour une seule image serait un aller-retour de plus pour rien. La date
     posée ici n'est pas exactement celle du fichier, mais elle ne sert qu'à
     casser le cache — le prochain manifeste rétablira la vraie. */
  if(f){
    if(!JAQUETTES) JAQUETTES = {};
    JAQUETTES[f] = Date.now();
    retientManifeste();
  }
  renderWall();
  // la fiche ouverte montre la même jaquette en grand : elle aussi
  if(!$('sheet').hidden && S.open !== null) paintSheet();
}
async function jaquetteAuto(nom, sortie, force){
  let data;
  try{ data = await api('/api/jaquette', {nom: nom, sortie: sortie || '', force: !!force}); }
  catch(e){ return; }
  if(data.etat === 'telechargee'){ poseJaquette(nom); toast('Jaquette récupérée'); }
  else if(data.etat === 'deja-la'){ poseJaquette(nom); }
  else if(data.etat === 'choix'){ openJaq(nom, data.propositions || []); }
  else if(data.etat === 'introuvable'){ toast(`Aucune jaquette trouvée pour « ${nom} »`); }
  // le motif exact plutôt qu'un « ça n'a pas marché » : HTTP 403, certificat
  // SSL, délai dépassé... c'est la seule chose qui permette d'y remédier
  else if(data.etat === 'injoignable'){ toast('IGDB injoignable : ' + (data.raison || 'pas de réponse'), true); }
}

/* On montre toujours ce qui a été trouvé, même une seule jaquette : c'est
   le clic qui télécharge. Les aperçus viennent directement d'IGDB, donc
   refuser ne laisse rien derrière — il n'y a rien à supprimer. Quand
   plusieurs fiches portent le même nom, la plus probable (celle dont
   l'année colle à la date de sortie) est en tête, en doré. */
let JAQ_NOM = null, JAQ_SUITE = null;
function jaqHTML(nom, propositions, retenir){
  return `<div class="sheet jaq-sheet" role="dialog" aria-modal="true">
    <div class="sheet-tools">
      <span class="grp"><b class="fhead">Jaquette de « ${esc(nom)} »</b></span>
      <span class="grp"><button class="sbtn jaq-x" aria-label="Fermer">×</button></span>
    </div>
    <div class="jaq-in">
      <div class="jaq-grid">
        ${propositions.map((p,i)=>`
          <button class="jaq-item${p.suggere ? ' suggeree' : ''}" data-i="${i}" title="${esc(p.lien||'')}">
            <img src="${esc(p.apercu)}" alt="" loading="lazy" decoding="async">
            <b>${esc(p.titre)}</b>
            <span>${esc(p.date || 'date inconnue')}${p.nature ? ' · ' + esc(p.nature) : ''}</span>
          </button>`).join('')}
      </div>
      <div class="frow"><span class="spacer"></span>
        <button class="ghost jaq-non">${retenir ? 'Annuler' : "N'en télécharger aucune"}</button></div>
    </div>
  </div>`;
}
/* `suite` transforme la fenêtre en simple sélecteur : au lieu de télécharger,
   le clic rappelle cette fonction avec la fiche choisie. C'est ce que fait le
   formulaire, où le fichier ne peut pas encore être nommé — le nom du jeu
   n'est arrêté qu'à l'enregistrement. */
function openJaq(nom, propositions, suite){
  if(!propositions.length) return;
  JAQ_NOM = nom;
  JAQ_SUITE = suite || null;
  const host = $('jaq');
  host.innerHTML = jaqHTML(nom, propositions, !!suite);
  host.hidden = false;
  verrouFond();
  host.querySelector('.jaq-x').onclick = closeJaq;
  host.querySelector('.jaq-non').onclick = closeJaq;
  host.querySelectorAll('.jaq-item').forEach(b=>{
    b.onclick = ()=> choisirJaq(b, propositions[+b.dataset.i]);
  });
}
function closeJaq(){
  const host = $('jaq');
  if(host.hidden) return;
  host.hidden = true; host.innerHTML = '';
  JAQ_NOM = null; JAQ_SUITE = null;
  verrouFond();
}
async function choisirJaq(btn, choix){
  const nom = JAQ_NOM;
  // mode sélecteur : on rend la main au formulaire, rien ne part sur le disque
  if(JAQ_SUITE){
    const suite = JAQ_SUITE;
    closeJaq();
    suite(choix);
    return;
  }
  const host = $('jaq');
  host.querySelectorAll('.jaq-item').forEach(b=>{ b.disabled = true; });
  btn.classList.add('pris');
  let data;
  try{ data = await api('/api/jaquette/choisir', {nom: nom, image: choix.image}); }
  catch(e){ data = null; }
  if(data && data.etat === 'telechargee'){
    closeJaq(); poseJaquette(nom); toast('Jaquette enregistrée');
  }else{
    closeJaq();
    toast('Téléchargement impossible' + (data && data.raison ? ' — ' + data.raison : ''), true);
  }
}
$('jaq').addEventListener('click', e=>{ if(e.target.id === 'jaq') closeJaq(); });

/* La jaquette désignée dans le formulaire : elle part sur le disque
   maintenant que le jeu existe et que son nom est arrêté. */
async function poseJaquetteChoisie(nom, image){
  let data;
  try{ data = await api('/api/jaquette/choisir', {nom: nom, image: image}); }
  catch(e){ return; }
  if(data.etat === 'telechargee'){ poseJaquette(nom); toast('Jaquette enregistrée'); }
  else toast('Téléchargement impossible' + (data.raison ? ' — ' + data.raison : ''), true);
}

/* =======================================================================
   Complétion du nom depuis IGDB

   Le champ « Nom du jeu » interroge Flask pendant la frappe : IGDB renvoie
   les fiches qui collent, avec leur date de sortie et leur jaquette. Un clic
   remplit la date, va chercher le prix de base et retient la jaquette — qui
   ne part sur le disque qu'à l'enregistrement, pas avant, parce que son nom
   de fichier dépend d'un champ qu'on peut encore retoucher.

   Le prix ne vient pas d'IGDB, qui n'en publie aucun : IGDB donne le lien
   vers la fiche Steam, et c'est Steam qui répond son prix fort en euros. Un
   jeu absent de Steam — exclusivité Nintendo, PlayStation, jeu physique —
   laisse donc la case vide. C'est voulu : rien n'est deviné.

   Deux règles pour ne jamais écraser une saisie : un champ rempli à la main
   ne bouge plus (data-auto le distingue d'un champ rempli par une fiche), et
   toute réponse arrivée après un changement de fiche est jetée — la frappe
   est plus rapide que le réseau, l'inverse serait une loterie.
   ======================================================================= */
const AC = { minuteur:0, jeton:0, jetonPrix:0, jeux:[], i:-1 };
let JEU_PICK = null;   // la fiche IGDB retenue : {nom, titre, image, apercu...}

function oublieAuto(){
  clearTimeout(AC.minuteur);
  AC.jeton++; AC.jetonPrix++;      // ce qui répondra après nous ne sert plus
  AC.jeux = []; AC.i = -1;
  JEU_PICK = null;
}

/* ---------- la liste déroulante ---------- */
function acFerme(){
  const b = $('f_ac'), champ = $('f_name');
  AC.jeux = []; AC.i = -1;
  if(b){ b.hidden = true; b.innerHTML = ''; }
  if(champ) champ.setAttribute('aria-expanded', 'false');
}
function acHTML(jeux){
  return jeux.map((j,i)=>`
    <button type="button" class="ac-item" role="option" aria-selected="false" data-i="${i}">
      ${j.apercu
        ? `<img src="${esc(j.apercu)}" alt="" loading="lazy" decoding="async">`
        : '<span class="ac-vide"></span>'}
      <span class="ac-txt">
        <b>${esc(j.titre)}</b>
        <i>${esc(j.date || 'date inconnue')}${j.nature ? ' · ' + esc(j.nature) : ''}</i>
      </span>
    </button>`).join('');
}
function acOuvre(jeux){
  const b = $('f_ac');
  if(!b) return;
  if(!jeux.length){ acFerme(); return; }
  AC.jeux = jeux; AC.i = -1;
  b.innerHTML = acHTML(jeux);
  b.hidden = false;
  $('f_name').setAttribute('aria-expanded', 'true');
  b.querySelectorAll('.ac-item').forEach(el=>{
    /* mousedown et pas click : sinon le champ perd le focus en premier, la
       liste se referme, et le clic atterrit dans le vide */
    el.addEventListener('mousedown', e=>{ e.preventDefault(); acChoisir(+el.dataset.i); });
  });
}
function acBouge(pas){
  const b = $('f_ac');
  if(!b || b.hidden || !AC.jeux.length) return;
  const n = AC.jeux.length;
  AC.i = AC.i < 0 ? (pas > 0 ? 0 : n - 1) : (AC.i + pas + n) % n;
  b.querySelectorAll('.ac-item').forEach((el,k)=>{
    const on = k === AC.i;
    el.classList.toggle('on', on);
    el.setAttribute('aria-selected', on ? 'true' : 'false');
    if(on) el.scrollIntoView({block:'nearest'});
  });
}
async function acCherche(texte){
  const jeton = ++AC.jeton;
  let data;
  // pas de Flask (page ouverte sans serveur, vieille version) : le champ
  // reste un champ, personne n'est prévenu de rien
  try{ data = await api('/api/jeu/suggestions', {nom: texte}); }
  catch(e){ return; }
  if(jeton !== AC.jeton || !$('f_ac')) return;   // une frappe est passée devant
  if(data.etat === 'ok') acOuvre(data.jeux || []);
  else acFerme();
}
function acFrappe(){
  const champ = $('f_name');
  const texte = clean(champ.value);
  // le nom ne correspond plus à la fiche choisie : sa jaquette non plus
  if(JEU_PICK && norm(texte) !== norm(JEU_PICK.nom)) posePick(null);
  clearTimeout(AC.minuteur);
  AC.jeton++;
  // deux lettres minimum, et un temps de répit : une recherche par caractère
  // ferait huit allers-retours pour « Hollow K »
  if(texte.length < 2){ acFerme(); return; }
  AC.minuteur = setTimeout(()=> acCherche(texte), 250);
}
function acTouche(e){
  const b = $('f_ac');
  const ouvert = b && !b.hidden && AC.jeux.length;
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    if(!ouvert) return;
    e.preventDefault(); acBouge(e.key === 'ArrowDown' ? 1 : -1);
  }else if(e.key === 'Enter'){
    if(!ouvert || AC.i < 0) return;
    e.preventDefault(); acChoisir(AC.i);
  }else if(e.key === 'Escape'){
    if(!ouvert) return;
    // la liste se referme, le formulaire reste ouvert : stopPropagation
    // empêche le gestionnaire global de prendre Échap pour lui
    e.preventDefault(); e.stopPropagation(); acFerme();
  }
}

/* ---------- la fiche retenue et son aperçu ---------- */
function posePick(fiche){
  JEU_PICK = fiche;
  const b = $('f_pick');
  if(!b) return;
  if(!fiche || !fiche.image){ b.hidden = true; return; }
  $('f_pickimg').src = fiche.apercu;
  $('f_pickt').textContent = fiche.titre;
  $('f_pickd').textContent = (fiche.date || 'date inconnue')
    + (fiche.nature ? ' · ' + fiche.nature : '');
  b.hidden = false;
}
/* Un champ rempli par une fiche peut être remplacé par la fiche suivante.
   Un champ rempli à la main, jamais : c'est ce que dit data-auto. */
function acRemplit(champ, valeur){
  if(!champ || !valeur) return;
  if(champ.value && champ.dataset.auto !== '1') return;
  champ.value = valeur;
  champ.dataset.auto = '1';
}
async function acChoisir(i){
  const j = AC.jeux[i];
  if(!j) return;
  acFerme();
  const champ = $('f_name');
  champ.value = j.titre;
  posePick(Object.assign({}, j, {nom: j.titre}));
  acRemplit($('f_release'), j.iso);
  champ.focus();
  acPrix(j);
}
/* `force` : le prix est réécrit même s'il a été saisi à la main. Réservé au
   choix explicite d'une jaquette — voir alignePick(). Renvoie true si la case
   a effectivement changé de valeur, pour que l'appelant sache quoi annoncer. */
async function acPrix(j, force){
  const cible = $('f_base');
  if(!cible || !j.id) return false;
  // un prix saisi ne s'écrase pas
  if(!force && cible.value && cible.dataset.auto !== '1') return false;
  const jeton = ++AC.jetonPrix;
  cible.classList.add('cherche');
  let data;
  try{ data = await api('/api/jeu/prix', {id: j.id}); }
  catch(e){ data = null; }
  // une autre fiche a été choisie depuis, ou le formulaire s'est fermé
  if(jeton !== AC.jetonPrix || $('f_base') !== cible) return false;
  cible.classList.remove('cherche');
  if(data && data.etat === 'ok' && data.prix !== null && data.prix !== undefined){
    const txt = numText(data.prix);
    const change = cible.value !== txt;
    cible.value = txt;
    cible.dataset.auto = '1';

    /* Le prix payé, proposé au moment où l'achat a lieu : à l'ajout d'un
       jeu, ou quand on sort de la wishlist un jeu qu'on vient d'acheter.
       Jamais sur un vieux jeu qu'on retouche — ce que Steam demande
       aujourd'hui n'a rien à voir avec ce qu'on a déboursé il y a trois
       ans, et une somme fausse est pire qu'une case vide.

       C'est « actuel » et non « prix » : promotion comprise, c'est ce
       qu'on paie réellement. Et posé par acRemplit(), donc jamais en
       force, même quand on vient de choisir une jaquette explicitement —
       un montant saisi à la main ne se devine pas. */
    if((!EDIT || estWishlist(EDIT)) && data.actuel !== null && data.actuel !== undefined){
      acRemplit($('f_paid'), numText(data.actuel));
    }
    return change;
  }
  // « inconnu » n'est pas une erreur : le jeu n'est pas sur Steam, la case
  // reste vide et se remplit à la main. Pas de toast pour si peu.
  return false;
}

/* Aligner la date et le prix sur la fiche dont on vient de choisir la
   jaquette. Deux écarts avec la liste déroulante du nom, assumés :

     - on écrase même une valeur saisie à la main. Cliquer une jaquette
       précise est un geste délibéré, et surtout, en modification, les champs
       viennent du classeur : aucun ne porte data-auto, donc la règle
       habituelle ne laisserait jamais rien changer.
     - une valeur absente chez IGDB ne vide rien. Un jeu hors Steam n'a pas
       de prix à donner : ce n'est pas une raison pour effacer le tien.

   Le toast est là parce qu'on vient d'écraser une saisie : il faut le voir. */
async function alignePick(p){
  const champ = $('f_release');
  const change = [];
  if(champ && p.iso && champ.value !== p.iso){
    champ.value = p.iso;
    champ.dataset.auto = '1';
    change.push('date');
  }
  if(await acPrix(p, true)) change.push('prix');
  if(!change.length) return;
  toast(change.length === 2
    ? 'Date et prix alignés sur la fiche choisie'
    : (change[0] === 'date' ? 'Date de sortie alignée sur la fiche choisie'
                            : 'Prix aligné sur la fiche choisie'));
}

/* ---------- changer la jaquette retenue ---------- */
async function changerPick(){
  const nom = clean($('f_name').value);
  if(!nom) return;
  const b = $('f_pick');
  b.classList.add('busy');
  let data;
  // force : le fichier existe peut-être déjà, on veut quand même la liste
  try{ data = await api('/api/jaquette', {nom: nom, sortie: $('f_release').value || '', force: true}); }
  catch(e){ data = null; }
  b.classList.remove('busy');
  if(!data) return;
  if(data.etat === 'choix'){
    openJaq(nom, data.propositions || [], p=>{
      /* la fiche choisie remplace l'ancienne en entier, id et date compris :
         « Resident Evil 4 » de 2005 et celui de 2023 ne partagent que le
         titre, et c'est justement la jaquette qui les distingue */
      posePick({nom: nom, titre: p.titre, date: p.date, nature: p.nature,
                image: p.image, apercu: p.apercu, iso: p.iso,
                id: p.id, lien: p.lien});
      alignePick(p);
    });
  }
  else if(data.etat === 'introuvable'){ toast(`Aucune jaquette trouvée pour « ${nom} »`); }
  else if(data.etat === 'injoignable'){ toast('IGDB injoignable : ' + (data.raison || 'pas de réponse'), true); }
}

function brancherAuto(){
  const champ = $('f_name');
  if(!champ) return;
  champ.addEventListener('input', acFrappe);
  champ.addEventListener('keydown', acTouche);
  champ.addEventListener('blur', ()=> setTimeout(acFerme, 0));
  const pick = $('f_pick');
  if(pick) pick.onclick = changerPick;
  // une valeur retapée à la main n'est plus « remplie automatiquement » :
  // la fiche suivante ne doit pas passer par-dessus
  ['f_release','f_base'].forEach(id=>{
    const ch = $(id);
    if(ch) ch.addEventListener('input', ()=>{ ch.dataset.auto = ''; });
  });
}

/* =======================================================================
   Bilan en image
   L'onglet affiché est redessiné sur un canvas de 1080 px de large, prêt
   à partager. Rien ne sort du navigateur : l'image est composée ici, à
   partir des jeux déjà chargés et des jaquettes déjà servies par Flask
   (même origine, donc le canvas n'est pas « teinté » et toBlob marche).
   ======================================================================= */
const BIL = {
  L: 1080, M: 72,
  texte:'#F2EDE4', doux:'#A79CB4', or:'#E5C46B', bleu:'#8FB8E8',
  trait:'rgba(242,237,228,.13)',
  display:'"Bricolage Grotesque",system-ui,sans-serif',
  corps:'"Karla",system-ui,sans-serif',
  mono:'"Azeret Mono",ui-monospace,monospace',
};
BIL.W = BIL.L - BIL.M*2;

/* Le reste du site écrit "300 h 15" (hoursFmt) : lisible dans une phrase.
   Le bilan, plus dense, resserre en "300h15" — pas d'espace autour du h. */
function bilHeures(h){
  if(h===null||h===undefined) return '—';
  const H = Math.floor(h), Min = Math.round((h-H)*60);
  return Min ? `${H}h${String(Min).padStart(2,'0')}` : `${H}h`;
}

/* --- petits outils de dessin --- */
function bilEcrire(c, t, x, y, o){
  c.save();
  c.font = o.f;
  if('letterSpacing' in c) c.letterSpacing = o.ls || '0px';
  c.fillStyle = o.c || BIL.texte;
  c.textAlign = o.a || 'left';
  c.textBaseline = o.b || 'alphabetic';
  c.fillText(t, x, y);
  c.restore();
}
/* toujours mesurer via save/restore : sinon un letterSpacing posé pour un
   texte reste actif et fausse toutes les mesures suivantes */
function bilLargeur(c, t, f, ls){
  c.save();
  c.font = f;
  if('letterSpacing' in c) c.letterSpacing = ls || '0px';
  const w = c.measureText(t).width;
  c.restore();
  return w;
}
function bilArrondi(c, x, y, w, h, r){
  r = Math.max(0, Math.min(r, w/2, h/2));
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y,   x+w, y+h, r);
  c.arcTo(x+w, y+h, x,   y+h, r);
  c.arcTo(x,   y+h, x,   y,   r);
  c.arcTo(x,   y,   x+w, y,   r);
  c.closePath();
}
function bilTrait(c, x, y, w){
  c.fillStyle = BIL.trait;
  c.fillRect(x, y, w, 1);
}
function bilFilet(c, y){ bilTrait(c, BIL.M, y, BIL.W); }
/* La proportion des jaquettes est réglée une seule fois, dans CONFIG :
   « 3 / 4 » vaut 0,75, donc une jaquette large de 348 px fait 464 px de haut. */
/* noteColor() rend « rgb(r,g,b) » quand il y a une note, et le gris « #6E6480»
   quand il n'y en a pas : les deux formes doivent se lire, sinon un jeu sans
   note repeint sa case d'initiales avec une couleur invalide. */
function bilRVB(couleur){
  const t = String(couleur).trim();
  if(t[0] === '#' && t.length >= 7) return hex2rgb(t);
  const m = t.match(/\d+/g);
  return (m && m.length >= 3) ? m.slice(0,3).map(Number) : [110,100,128];
}
/* Le métal d'une médaille, c'est la bande claire qui traverse : un aplat
   doré ne se lit que comme du jaune. Mêmes arrêts que le CSS de la fiche. */
const BIL_METAL = {
  or:     [[0,'#A9761E'],[.20,'#E7C46B'],[.38,'#FFF6D0'],[.52,'#E9C871'],[.72,'#B8862A'],[1,'#F6E2A4']],
  argent: [[0,'#6E7683'],[.20,'#C8CFD9'],[.38,'#FFFFFF'],[.52,'#CBD2DB'],[.72,'#8A929F'],[1,'#E8EDF3']],
  bronze: [[0,'#7A421F'],[.20,'#C87F4E'],[.38,'#F5C79B'],[.52,'#C9814F'],[.72,'#8E5228'],[1,'#E3A778']],
};
function bilMedaille(c, nom, x, y, w, h){
  const arrets = BIL_METAL[nom];
  if(!arrets) return null;
  const d = c.createLinearGradient(x, y, x + Math.max(40, w), y + h);
  arrets.forEach(([p, col])=> d.addColorStop(p, col));
  return d;
}
function bilRatio(){
  const m = String(CONFIG.coverRatio || '').match(/([\d.]+)\s*\/\s*([\d.]+)/);
  const r = m ? (+m[1]) / (+m[2]) : 0;
  return r > 0 ? r : 3/4;
}
/* Découpe un titre sur au plus maxLignes, en abrégeant la dernière. */
function bilCouper(c, t, largeur, maxLignes, f, ls){
  c.save();
  c.font = f;
  if('letterSpacing' in c) c.letterSpacing = ls || '0px';
  const mots = String(t).split(/\s+/).filter(Boolean);
  const lignes = [];
  let cur = '', i = 0;
  for(; i < mots.length; i++){
    const essai = cur ? cur + ' ' + mots[i] : mots[i];
    if(!cur || c.measureText(essai).width <= largeur){ cur = essai; continue; }
    lignes.push(cur); cur = mots[i];
    if(lignes.length >= maxLignes){ cur = ''; break; }
  }
  if(cur) lignes.push(cur);
  if(lignes.length){
    const trop = i < mots.length;
    let d = lignes[lignes.length-1];
    if(trop || c.measureText(d).width > largeur){
      while(d.length > 1 && c.measureText(d + '…').width > largeur) d = d.slice(0, -1);
      lignes[lignes.length-1] = d.replace(/\s+$/, '') + '…';
    }
  }
  c.restore();
  return lignes.length ? lignes : [''];
}

/* Comme bilCouper, mais sans limite : toutes les lignes sont rendues.
   C'est ce qu'il faut pour un avis, dont on ne veut couper aucun mot. */
function bilLignes(c, t, largeur, f, ls){
  c.save();
  c.font = f;
  if('letterSpacing' in c) c.letterSpacing = ls || '0px';
  const mots = String(t).split(/\s+/).filter(Boolean);
  const out = [];
  let cur = '';
  mots.forEach(m=>{
    const essai = cur ? cur + ' ' + m : m;
    if(!cur || c.measureText(essai).width <= largeur){ cur = essai; return; }
    out.push(cur); cur = m;
  });
  if(cur) out.push(cur);
  c.restore();
  return out.length ? out : [''];
}

/* --- ressources --- */
/* Canvas ne sait dessiner qu'avec les polices déjà chargées : sans ça, la
   première image sort en Arial. On les demande explicitement. */
async function bilPolices(){
  if(!document.fonts || !document.fonts.load) return;
  const l = [
    `800 128px ${BIL.display}`, `700 30px ${BIL.display}`, `500 17px ${BIL.display}`,
    `400 27px ${BIL.corps}`, `400 22px ${BIL.corps}`, `400 18px ${BIL.corps}`,
    `500 44px ${BIL.mono}`, `700 26px ${BIL.mono}`, `500 16px ${BIL.mono}`,
  ];
  try{ await Promise.all(l.map(f => document.fonts.load(f, 'AÉ0123456789'))); }catch(e){}
  try{ await document.fonts.ready; }catch(e){}
}
/* coverURL() porte déjà le paramètre ?v= de cache-buster une fois qu'une
   jaquette a été récupérée automatiquement : le bilan en profite tel quel. */
function bilCover(nom){
  return new Promise(res=>{
    const url = coverURL(nom);
    if(!url) return res(null);
    const im = new Image();
    let fini = false;
    const stop = v => { if(!fini){ fini = true; res(v); } };
    im.onload  = ()=> stop(im);
    im.onerror = ()=> stop(null);
    // une jaquette qui ne répond pas ne doit pas bloquer l'image entière
    setTimeout(()=> stop(null), 8000);
    im.src = url;
  });
}
/* Jaquette recadrée, ou les initiales du jeu comme sur le mur. */
function bilJaquette(c, g, im, x, y, w, h){
  const r = 10;
  c.save();
  bilArrondi(c, x, y, w, h, r);
  c.clip();
  if(im && im.naturalWidth){
    const s = Math.max(w/im.naturalWidth, h/im.naturalHeight);
    const dw = im.naturalWidth*s, dh = im.naturalHeight*s;
    c.drawImage(im, x + (w-dw)/2, y + (h-dh)/2, dw, dh);
  } else {
    const [R,G,B] = bilRVB(noteColor(g.rating));
    const m = (a,b) => Math.round(a*.16 + b*.84);   // même mélange que .cov.ph
    c.fillStyle = `rgb(${m(R,38)},${m(G,31)},${m(B,51)})`;
    c.fillRect(x, y, w, h);
    bilEcrire(c, initials(g.name), x + w/2, y + h/2, {
      f:`800 ${Math.round(w*.34)}px ${BIL.display}`, c:noteColor(g.rating),
      a:'center', b:'middle', ls:'-.04em' });
  }
  c.restore();
  c.save();
  c.strokeStyle = 'rgba(242,237,228,.14)';
  c.lineWidth = 1;
  bilArrondi(c, x+.5, y+.5, w-1, h-1, r);
  c.stroke();
  c.restore();
}
function bilFond(o, H){
  const L = BIL.L;
  const d = o.createLinearGradient(0, 0, 0, H);
  d.addColorStop(0, '#241D31');
  d.addColorStop(.5, '#17131F');
  d.addColorStop(1, '#100D17');
  o.fillStyle = d;
  o.fillRect(0, 0, L, H);
  const h = o.createRadialGradient(L*.84, -40, 0, L*.84, -40, 660);
  h.addColorStop(0, 'rgba(229,196,107,.16)');
  h.addColorStop(1, 'rgba(229,196,107,0)');
  o.fillStyle = h;
  o.fillRect(0, 0, L, 700);
  o.fillStyle = BIL.or;
  o.fillRect(0, 0, L, 7);
}

/* --- composition --- */
/* On dessine sur un brouillon transparent en suivant un curseur vertical,
   puis on recopie le tout sur un canvas exactement à la bonne hauteur.
   C'est ce qui permet d'enchaîner les sections sans calculer la hauteur
   finale à l'avance : une année sans jaquettes sort simplement plus courte. */
async function bilanCanvas(){
  await bilPolices();
  const { L, M, W } = BIL;

  // la wishlist est hors sujet dans un bilan : ces jeux-là ne sont ni faits,
  // ni achetés — ils ne comptent donc dans aucun des chiffres ci-dessous
  const tout    = current().filter(x => !estWishlist(x));
  const jeux    = tout.filter(x => !estEnCours(x));
  const enCours = tout.length - jeux.length;
  const notes   = jeux.filter(x => x.rating !== null);
  const avg  = notes.length ? notes.reduce((s,x)=>s+x.rating, 0)/notes.length : null;
  const base = tout.reduce((s,x)=>s+(x.base||0), 0);
  const paid = tout.reduce((s,x)=>s+(x.paid||0), 0);
  const hrs  = jeux.reduce((s,x)=>s+(x.hours||0), 0);

  // le top 10 complet : les 5 premiers en grand avec jaquette, les 5 suivants
  // en simple liste titre + note juste en dessous
  const classement = notes.slice().sort((a,b)=>b.rating-a.rating);
  const top = classement.slice(0, 5);
  const suivants = classement.slice(5, 10);
  const jaquettes = await Promise.all(top.map(x => bilCover(x.name)));

  const brouillon = document.createElement('canvas');
  brouillon.width = L; brouillon.height = 2600;
  const c = brouillon.getContext('2d');
  let y = 104;

  /* --- en-tête --- */
  const src = source();
  const entete = src && src.nom ? `Journal de ${src.nom}` : 'Journal de jeu';
  bilEcrire(c, entete, M, y, {f:`800 19px ${BIL.display}`, c:BIL.or, ls:'-.02em'});
  y += 30;

  const titre = S.bucket === 'all' ? 'Tout' : String(S.bucket);
  let ts = 130;
  while(ts > 52 && bilLargeur(c, titre, `800 ${ts}px ${BIL.display}`, '-.035em') > W) ts -= 4;
  y += Math.round(ts * .78);
  bilEcrire(c, titre, M, y, {f:`800 ${ts}px ${BIL.display}`, ls:'-.035em'});
  /* les jambages du chiffre descendent sous la ligne de base : sans cette
     marge, le sous-titre vient se coller au titre */
  y += 54;

  const bandeau = ["Résumé gaming"];
  bilEcrire(c, bandeau.join('   ·   '), M, y, {f:`400 27px ${BIL.corps}`, c:BIL.doux});
  y += 42;
  bilFilet(c, y); y += 46;

  /* --- les mieux notés --- */
  if(top.length){
    bilEcrire(c, 'LES MIEUX NOTÉS', M, y, {f:`500 16px ${BIL.mono}`, c:BIL.doux, ls:'.22em'});
    y += 32;
    const n = top.length, ecart = 18;
    const cw = Math.min(200, Math.floor((W - ecart*(n-1)) / n));
    const ch = Math.round(cw * 4/3);
    /* alignées à gauche, sur la même colonne que les titres, les filets et
       les chiffres : une année à deux jeux laisse du vide à droite plutôt
       qu'un bloc centré qui ne s'accroche à rien */
    const x0 = M;
    top.forEach((g,i)=>{
      const x = x0 + i*(cw+ecart);
      bilJaquette(c, g, jaquettes[i], x, y, cw, ch);
      /* le rang est l'information que porte cette section : il est sur la
         jaquette, pas relégué dans la légende */
      const p = 30;
      c.fillStyle = 'rgba(10,8,14,.86)';
      bilArrondi(c, x+9, y+9, p, p, 9); c.fill();
      c.strokeStyle = 'rgba(229,196,107,.5)'; c.lineWidth = 1;
      bilArrondi(c, x+9.5, y+9.5, p-1, p-1, 9); c.stroke();
      bilEcrire(c, String(i+1), x+9+p/2, y+9+p/2+1,
        {f:`700 16px ${BIL.mono}`, c:BIL.or, a:'center', b:'middle'});
    });
    const yb = y + ch + 30;
    top.forEach((g,i)=>{
      const x = x0 + i*(cw+ecart);
      bilEcrire(c, fr(g.rating,1), x, yb, {f:`700 26px ${BIL.mono}`, c:noteColor(g.rating), ls:'-.03em'});
      bilCouper(c, g.name, cw, 2, `500 17px ${BIL.display}`)
        .forEach((l,k)=> bilEcrire(c, l, x, yb + 28 + k*22, {f:`500 17px ${BIL.display}`}));
    });
    y = yb + 28 + 2*22 + 12;

    /* rangs 6 à 10 : plus de jaquette, juste le nom et la note, une ligne
       chacun — le podium a déjà montré la couverture, pas la peine de
       répéter cinq fois le même traitement pour des jeux moins en avant */
    if(suivants.length){
      y += 14;
      suivants.forEach((g,i)=>{
        const rang = i + 6;
        bilEcrire(c, String(rang), M, y, {f:`500 15px ${BIL.mono}`, c:BIL.doux});
        const note = fr(g.rating,1);
        const noteW = bilLargeur(c, note, `700 17px ${BIL.mono}`, '-.02em');
        const titreX = M + 36;
        const dispo = W - 36 - noteW - 16;
        const ligne = bilCouper(c, g.name, dispo, 1, `500 16px ${BIL.display}`)[0];
        bilEcrire(c, ligne, titreX, y, {f:`500 16px ${BIL.display}`});
        bilEcrire(c, note, M+W, y, {f:`700 17px ${BIL.mono}`, c:noteColor(g.rating), a:'right', ls:'-.02em'});
        y += 31;
      });
      y += 15;
    }
    bilFilet(c, y); y += 46;
  }

  /* --- les chiffres, les mêmes qu'en haut de la page --- */
  const cellules = [
    ['Jeux terminés', String(jeux.length), enCours ? `+ ${enCours} en cours` : ''],
    ['Note moyenne', avg !== null ? fr(avg,2) : '—',
      notes.length ? `sur ${notes.length} noté${notes.length>1?'s':''}` : ''],
    ['Temps de jeu', hrs ? bilHeures(hrs) : '—', hrs ? `≈ ${Math.round(hrs/24)} jours` : ''],
    ['Payé', paid ? EUR.format(paid) : '—', base ? `sur ${EUR.format(base)} de prix fort` : ''],
  ];
  const cl = W/4;
  cellules.forEach(([u,b,i2],k)=>{
    const x = M + k*cl;
    bilEcrire(c, u.toUpperCase(), x, y, {f:`500 14px ${BIL.mono}`, c:BIL.doux, ls:'.18em'});
    let f = 42;
    while(f > 22 && bilLargeur(c, b, `500 ${f}px ${BIL.mono}`, '-.03em') > cl - 18) f -= 2;
    bilEcrire(c, b, x, y + 52, {f:`500 ${f}px ${BIL.mono}`, ls:'-.03em'});
    if(i2) bilEcrire(c, i2, x, y + 80, {f:`400 17px ${BIL.corps}`, c:BIL.doux});
  });
  y += 104;
  bilFilet(c, y); y += 46;

  /* --- répartition des notes, le même histogramme que sur la page ---
     Mêmes règles de découpage que renderDist() : un pas de 0,2 sur une
     plage courte, 0,5 sinon, toujours un multiple exact du dixième pour
     que les barres ne sautent pas juste à cause de l'arrondi. */
  if(notes.length >= 3){
    const valeurs = notes.map(x=>x.rating).sort((a,b)=>a-b);
    let lo = Math.floor(valeurs[0]), hi = Math.ceil(valeurs[valeurs.length-1]);
    if(hi - lo < 3){ hi = Math.min(10, lo + 3); lo = Math.max(0, hi - 3); }
    const span = hi - lo;
    const STEP = span <= 4 ? 0.2 : 0.5;
    const nBins = Math.round(span / STEP);
    const bins = new Array(nBins).fill(0);
    valeurs.forEach(r=>{
      const i = Math.floor((r - lo) / STEP);
      bins[Math.max(0, Math.min(nBins-1, i))]++;
    });
    const maxBin = Math.max(...bins) || 1;
    const mid = valeurs.length % 2
      ? valeurs[(valeurs.length-1)/2]
      : (valeurs[valeurs.length/2 - 1] + valeurs[valeurs.length/2]) / 2;
    const pos = v => ((v - lo) / span) * W;

    bilEcrire(c, 'RÉPARTITION DES NOTES', M, y, {f:`500 16px ${BIL.mono}`, c:BIL.doux, ls:'.22em'});
    bilEcrire(c, `moyenne ${fr(avg,2)} · médiane ${fr(mid,2)}`, M+W, y,
      {f:`400 16px ${BIL.corps}`, c:BIL.doux, a:'right'});
    y += 34;

    const HB = 168, sol = y + HB;
    const gap = nBins > 26 ? 3 : (nBins > 14 ? 5 : 8);
    const bw = Math.max(4, (W - gap*(nBins-1)) / nBins);
    bins.forEach((cnt,i)=>{
      if(!cnt) return;
      const a = lo + i*STEP;
      const bh = Math.max(5, (cnt/maxBin)*HB);
      const bx = M + i*(bw+gap);
      c.fillStyle = noteColor(a + STEP/2);
      bilArrondi(c, bx, sol-bh, bw, bh, Math.min(4, bw/2));
      c.fill();
    });
    if(avg !== null){
      const xa = M + pos(avg);
      c.save();
      c.strokeStyle = 'rgba(229,196,107,.55)';
      c.lineWidth = 1;
      c.setLineDash([5,5]);
      c.beginPath(); c.moveTo(Math.round(xa)+.5, y-4); c.lineTo(Math.round(xa)+.5, sol); c.stroke();
      c.restore();
      const flip = xa > W - 90;
      bilEcrire(c, `moy. ${fr(avg,2)}`, xa + (flip ? -8 : 8), y+10,
        {f:`500 15px ${BIL.mono}`, c:BIL.or, a: flip ? 'right' : 'left'});
    }

    y = sol + 1;
    c.fillStyle = 'rgba(242,237,228,.22)';
    c.fillRect(M, y, W, 1);
    y += 24;
    const stepTick = span <= 8 ? 1 : 2;
    const ticks = [];
    for(let t = lo; t <= hi; t += stepTick) ticks.push(t);
    if(ticks[ticks.length-1] !== hi) ticks.push(hi);
    ticks.forEach(t=>{
      const x = M + pos(t);
      const a = (x < M + 14) ? 'left' : (x > M + W - 14 ? 'right' : 'center');
      bilEcrire(c, String(t), x, y, {f:`400 14px ${BIL.mono}`, c:BIL.doux, a});
    });
    y += 40;
    bilFilet(c, y); y += 46;
  }

  /* --- ce qui ressort de l'année --- */
  const faits = [];
  const long = jeux.filter(x=>x.hours).sort((a,b)=>b.hours-a.hours)[0];
  if(long) faits.push(['Le plus long', `${long.name} - ${bilHeures(long.hours)}`]);
  // le jeu le plus vieux joué cette période : celui qui vient le plus du
  // backlog, à l'opposé des sorties de l'année qui composent le reste
  const ancien = jeux.filter(x=>x.release).sort((a,b)=>a.release.localeCompare(b.release))[0];
  if(ancien) faits.push(['Le plus ancien', `${ancien.name} - sorti en ${yearOf(ancien.release)}`]);
  const bas = notes.slice().sort((a,b)=>a.rating-b.rating)[0];
  if(bas && notes.length > 3) faits.push(['La note la plus basse', `${bas.name} - ${fr(bas.rating,1)}`]);

  if(faits.length){
    const cg = 300;
    faits.forEach(([u,v])=>{
      bilEcrire(c, u.toUpperCase(), M, y, {f:`500 14px ${BIL.mono}`, c:BIL.doux, ls:'.18em'});
      bilEcrire(c, bilCouper(c, v, W - cg, 1, `400 22px ${BIL.corps}`)[0],
        M + cg, y, {f:`400 22px ${BIL.corps}`});
      y += 42;
    });
    y += 6;
    bilFilet(c, y); y += 46;
  }

  /* --- pied --- */
  bilEcrire(c, 'ABYSS · JEUX VIDÉOS', M, y, {f:`500 15px ${BIL.mono}`, c:BIL.or, ls:'.22em'});
  bilEcrire(c, new Date().toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'}),
    M+W, y, {f:`400 18px ${BIL.corps}`, c:BIL.doux, a:'right'});
  y += 56;

  const H = Math.min(Math.round(y), brouillon.height);
  const sortie = document.createElement('canvas');
  sortie.width = L; sortie.height = H;
  const o = sortie.getContext('2d');
  bilFond(o, H);
  o.drawImage(brouillon, 0, 0);
  return sortie;
}

/* =======================================================================
   La carte d'un seul jeu — même moteur, une seule fiche.
   C'est l'image qu'on envoie à quelqu'un pour dire « joue à ça » sans lui
   faire ouvrir le journal : jaquette, note, place au classement, et ce
   qu'on en a pensé.
   ======================================================================= */
async function ficheCanvas(g){
  await bilPolices();
  const { L, M, W } = BIL;
  const im = await bilCover(g.name);
  const statut = statutDe(g), wish = estWishlist(g);
  const enCours = !!statut;   // en cours ou convoité : pas de note à afficher

  const brouillon = document.createElement('canvas');
  brouillon.width = L; brouillon.height = 2600;
  const c = brouillon.getContext('2d');
  let y = 104;

  /* --- en-tête ---
     La période (mois/année) figure déjà dans les faits plus bas, sous
     « Terminé » : pas besoin de la répéter ici. */
  const src = source();
  bilEcrire(c, src && src.nom ? `Journal de ${src.nom}` : 'Journal de jeu', M, y,
    {f:`800 19px ${BIL.display}`, c:BIL.or, ls:'-.02em'});
  y += 30;

  /* --- jaquette à gauche, identité à droite --- */
  const cw = 348, ch = Math.round(cw / bilRatio());
  bilJaquette(c, g, im, M, y, cw, ch);

  const rx = M + cw + 44, rw = W - cw - 44;
  let ry = y;

  if(enCours){
    const t = statut.toUpperCase();
    const teinte = wish ? BIL.bleu : BIL.or;
    const tw = bilLargeur(c, t, `500 17px ${BIL.mono}`, '.2em') + 42;
    c.save();
    c.strokeStyle = wish ? 'rgba(143,184,232,.5)' : 'rgba(229,196,107,.5)'; c.lineWidth = 1;
    bilArrondi(c, rx+.5, ry+.5, tw, 42, 21); c.stroke();
    c.restore();
    bilEcrire(c, t, rx+21, ry+27, {f:`500 17px ${BIL.mono}`, c:teinte, ls:'.2em'});
    ry += 72;
  } else {
    bilEcrire(c, g.rating !== null ? fr(g.rating,1) : '—', rx, ry+62,
      {f:`700 80px ${BIL.mono}`, c:noteColor(g.rating), ls:'-.05em'});
    ry += 88;
  }

  /* le titre rétrécit jusqu'à tenir sur trois lignes : « Nier Automata »
     et « The Legend of Zelda: Tears of the Kingdom » doivent tous les deux
     tenir dans la même colonne */
  const r = rangJeu(g), med = medailleDe(r);
  const fTitre = t => `800 ${t}px ${BIL.display}`;
  let ts = 44, lignes = [];
  while(true){
    lignes = bilLignes(c, g.name, rw, fTitre(ts), '-.03em');
    if(lignes.length <= 3 || ts <= 24) break;
    ts -= 3;
  }
  lignes.slice(0, 3).forEach(l=>{
    ry += Math.round(ts * 1.04);
    /* le dégradé est refait pour chaque ligne, sur sa largeur à elle :
       sinon un titre court n'en montrerait que le premier centimètre */
    const w = bilLargeur(c, l, fTitre(ts), '-.03em');
    bilEcrire(c, l, rx, ry, {f:fTitre(ts), ls:'-.03em',
      c: med ? bilMedaille(c, med, rx, ry - ts*.78, w, ts*.86) : BIL.texte});
  });

  if(r){
    ry += 30;
    const t = `${r.rang}${r.rang === 1 ? 'er' : 'e'} sur ${r.total} ${r.ou}`;
    const w = bilLargeur(c, t, `500 15px ${BIL.mono}`, '.1em');
    bilEcrire(c, t, rx, ry, {f:`500 15px ${BIL.mono}`, ls:'.1em',
      c: med ? bilMedaille(c, med, rx, ry - 13, w, 15) : BIL.doux});
  }

  const faits = [
    ['Sortie', dateFmt(g.release)],
    enCours ? null : ['Terminé', g.month ? `${MONTHS[g.month-1]} ${g.year || ''}`.trim()
                                         : String(g.year || g.bucket || '—')],
    (!enCours && g.hours) ? ['Temps de jeu', bilHeures(g.hours)] : null,
    g.base ? ['Prix du jeu', EUR.format(g.base)] : null,
  ].filter(Boolean);

  if(faits.length){
    ry += 34;
    bilTrait(c, rx, ry, rw);
    ry += 12;
    faits.forEach(([u,v])=>{
      ry += 22;
      bilEcrire(c, u.toUpperCase(), rx, ry, {f:`500 13px ${BIL.mono}`, c:BIL.doux, ls:'.16em'});
      bilEcrire(c, bilCouper(c, v, rw - 190, 1, `400 20px ${BIL.corps}`)[0], rx+rw, ry,
        {f:`400 20px ${BIL.corps}`, a:'right'});
      ry += 14;
    });
  }

  /* la colonne la plus haute décide où reprend la page : une fiche sans
     prix est plus courte que sa jaquette, une fiche complète la dépasse */
  y = Math.max(y + ch, ry) + 48;

  /* --- ce que j'en ai pensé --- */
  const points = enCours ? [] : (g.review || []).filter(Boolean);
  if(points.length){
    bilFilet(c, y); y += 46;
    bilEcrire(c, 'AVIS', M, y, {f:`500 16px ${BIL.mono}`, c:BIL.doux, ls:'.22em'});
    y += 42;
    const limite = brouillon.height - 240;
    for(const p of points){
      if(y > limite) break;                      // avis fleuve : on s'arrête avant le bas
      const t = String(p).trim();
      const plus = t.startsWith('+'), moins = t.startsWith('-');
      const signe = plus ? '+' : (moins ? '–' : '·');
      // le point entier prend la couleur, pas seulement son signe
      const coul  = plus ? '#9BE3BE' : (moins ? '#F0A29C' : null);
      const texte = (plus || moins) ? t.slice(1).trim() : t;
      if(!texte) continue;
      const ls = bilLignes(c, texte, W - 40, `400 23px ${BIL.corps}`);
      bilEcrire(c, signe, M+3, y, {f:`700 23px ${BIL.mono}`, c: coul || BIL.doux});
      ls.forEach((l,k)=> bilEcrire(c, l, M+40, y + k*33,
        {f:`400 23px ${BIL.corps}`, c: coul || BIL.texte}));
      y += ls.length*33 + 14;
    }
    y += 4;
  }
  bilFilet(c, y); y += 46;

  /* --- pied --- */
  bilEcrire(c, 'ABYSS · JEUX VIDÉOS', M, y, {f:`500 15px ${BIL.mono}`, c:BIL.or, ls:'.22em'});
  bilEcrire(c, new Date().toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'}),
    M+W, y, {f:`400 18px ${BIL.corps}`, c:BIL.doux, a:'right'});
  y += 56;

  const H = Math.min(Math.round(y), brouillon.height);
  const sortie = document.createElement('canvas');
  sortie.width = L; sortie.height = H;
  const o = sortie.getContext('2d');
  bilFond(o, H);
  o.drawImage(brouillon, 0, 0);
  return sortie;
}

/* --- la fenêtre --- */
/* Une seule fenêtre pour les deux images : le bilan d'un onglet et la carte
   d'un jeu. Elle ne sait rien de ce qu'elle montre, on lui passe le titre,
   le nom du fichier et la fonction qui compose le canvas. */
let BILAN_BLOB = null, BILAN_URL = null, BILAN_JETON = 0;

function libererBilan(){
  if(BILAN_URL){ URL.revokeObjectURL(BILAN_URL); BILAN_URL = null; }
  BILAN_BLOB = null;
}
function ouvrirBilan(){
  if(!current().length){ toast("Cet onglet est vide : rien à mettre en image.", true); return; }
  const nom = S.bucket === 'all' ? 'complet' : S.bucket;
  ouvrirImage({
    titre: `Bilan ${nom}`,
    fichier: 'bilan-' + (slug(nom) || 'journal') + '.png',
    partage: 'Bilan ' + nom,
    composer: bilanCanvas,
  });
}
function partagerJeu(g){
  if(!g) return;
  ouvrirImage({
    titre: `« ${g.name} » en image`,
    fichier: 'jeu-' + (slug(g.name) || 'fiche') + '.png',
    partage: g.name,
    composer: ()=> ficheCanvas(g),
  });
}
function ouvrirImage(opt){
  closeMenu();
  const host = $('bilan');
  host.innerHTML = `<div class="sheet bilan-sheet" role="dialog" aria-modal="true" aria-label="${esc(opt.titre)}">
    <div class="sheet-tools">
      <span class="grp"><b class="fhead">${esc(opt.titre)}</b></span>
      <span class="grp"><button class="sbtn bilan-x" aria-label="Fermer">×</button></span>
    </div>
    <div class="bilan-in">
      <div class="bilan-apercu" id="bilanApercu"><span class="bilan-attente">Composition de l'image...</span></div>
      <div class="bilan-actions">
        <button class="ghost" id="bilanFermer">Fermer</button>
        <button class="ghost" id="bilanPartager" hidden>Partager</button>
        <button class="cta auto" id="bilanTelecharger" disabled>Télécharger</button>
      </div>
    </div>
  </div>`;
  host.hidden = false;
  verrouFond();
  host.querySelector('.bilan-x').onclick = fermerBilan;
  $('bilanFermer').onclick = fermerBilan;
  host.querySelector('.bilan-x').focus();
  composerImage(opt);
}
async function composerImage(opt){
  /* le jeton dit si la fenêtre a été fermée pendant la composition :
     dans ce cas on jette le résultat au lieu d'écrire dans le vide */
  const jeton = ++BILAN_JETON;
  let toile;
  try{
    toile = await opt.composer();
  }catch(e){
    if(jeton !== BILAN_JETON) return;
    const a = $('bilanApercu');
    if(a) a.innerHTML = '<span class="bilan-attente">L\'image n\'a pas pu être composée.</span>';
    return;
  }
  if(jeton !== BILAN_JETON) return;
  const apercu = $('bilanApercu');
  if(!apercu) return;
  apercu.innerHTML = '';
  apercu.appendChild(toile);

  const fichier = opt.fichier;
  toile.toBlob(b=>{
    if(jeton !== BILAN_JETON || !b) return;
    libererBilan();
    BILAN_BLOB = b;
    const dl = $('bilanTelecharger');
    if(dl){
      dl.disabled = false;
      dl.onclick = ()=>{
        // l'adresse n'est libérée qu'à la fermeture, ou au clic suivant :
        // la révoquer aussitôt annulerait le téléchargement en cours
        if(BILAN_URL) URL.revokeObjectURL(BILAN_URL);
        BILAN_URL = URL.createObjectURL(BILAN_BLOB);
        const a = document.createElement('a');
        a.href = BILAN_URL;
        a.download = fichier;
        document.body.appendChild(a);
        a.click();
        a.remove();
      };
    }
    /* partage direct quand le navigateur sait le faire — surtout utile
       depuis le téléphone, où « télécharger » finit dans un dossier perdu */
    try{
      const f = new File([b], fichier, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[f]})){
        const p = $('bilanPartager');
        if(p){
          p.hidden = false;
          p.onclick = ()=> navigator.share({files:[f], title: opt.partage}).catch(()=>{});
        }
      }
    }catch(e){}
  }, 'image/png');
}
function fermerBilan(){
  const host = $('bilan');
  if(host.hidden) return;
  BILAN_JETON++;
  host.hidden = true;
  host.innerHTML = '';
  libererBilan();
  verrouFond();
}
$('bilan').addEventListener('click', e=>{ if(e.target.id === 'bilan') fermerBilan(); });
$('bilanBtn').addEventListener('click', ouvrirBilan);

/* =======================================================================
   Mise à jour depuis IGDB — tout le journal d'un coup

   Le classeur vieillit : une date de sortie saisie de mémoire, un prix noté
   avant une baisse, une jaquette jamais récupérée. Ce module repasse sur
   chaque ligne, demande à Flask ce qu'IGDB en dit (/api/jeu/maj), et montre
   la liste des écarts.

   Trois précautions, parce qu'écrire trois cents lignes d'un coup ne se
   rattrape pas :

     - rien n'est écrit avant la relecture. L'analyse est un rapport ;
       l'écriture est un second geste, sur les lignes cochées seulement.
     - un jeu dont le titre ne correspond pas exactement à une fiche IGDB
       arrive décoché : « Doom » trouve six jeux, on ne les départage pas
       à l'aveugle.
     - les jaquettes se choisissent une par une, comme ailleurs dans la
       page. Aucune image ne part sur le disque sans un clic.

   L'écriture repasse par l'action « enregistrer » d'Apps Script, celle du
   formulaire : la ligne est réécrite en entier, avec les valeurs relues
   ici. C'est le chemin déjà éprouvé — modifier un jeu à la main fait
   exactement la même chose — plutôt qu'une action neuve qui écrirait deux
   cellules mais qu'il faudrait déboguer sur trois cents lignes.
   ======================================================================= */
const IGD = {
  jeton: 0,        // incrémenté à l'annulation : les boucles en vol s'arrêtent
  stop: false,     // « Interrompre » : on s'arrête mais on garde le résultat
  etape: '',
  liste: [],       // les jeux à interroger
  lignes: [],      // un rapport par jeu, une fois l'analyse finie
  file: [],        // les jaquettes à proposer, une par nom de fichier
  fi: 0,
  t0: 0,
  dernier: null,   // dernière réponse d'écriture : le classeur relu
  compte: {dates:0, prix:0, jaquettes:0, echecs:0},
  echecs: [],
  opts: {dates:true, prix:true, jaquettes:true},
};

const SURETE = {
  sure:     'sûr',
  probable: 'plusieurs fiches',
  douteuse: 'à vérifier',
};

function igdbCorps(){ return $('igdbIn'); }
function igdbEntete(txt){ const b = $('igdbTitre'); if(b) b.textContent = txt; }

function ouvrirIgdb(){
  closeMenu();
  if(!CAN_WRITE){ toast("Passe en mode éditeur pour mettre le journal à jour.", true); return; }
  if(!GAMES.length){ toast("Le journal est vide : rien à mettre à jour.", true); return; }
  IGD.jeton++;
  IGD.stop = false;
  // le script a pu être redéployé depuis la dernière fois : on lui laisse
  // sa chance à chaque ouverture plutôt qu'une seule fois par onglet
  IGDB_LOT_OK = true;
  IGD.lignes = []; IGD.file = []; IGD.fi = 0; IGD.dernier = null;
  IGD.compte = {dates:0, prix:0, jaquettes:0, echecs:0};
  IGD.echecs = [];
  const host = $('igdb');
  host.innerHTML = `<div class="sheet igdb-sheet" role="dialog" aria-modal="true" aria-label="Mise à jour depuis IGDB">
    <div class="sheet-tools">
      <span class="grp"><b class="fhead" id="igdbTitre">Mise à jour depuis IGDB</b></span>
      <span class="grp"><button class="sbtn igdb-x" aria-label="Fermer">×</button></span>
    </div>
    <div class="igdb-in" id="igdbIn"></div>
  </div>`;
  host.hidden = false;
  verrouFond();
  host.querySelector('.igdb-x').onclick = fermerIgdb;
  igdbReglages();
}
function fermerIgdb(){
  const host = $('igdb');
  if(host.hidden) return;
  IGD.jeton++;                  // ce qui répondra après nous ne sert plus
  host.hidden = true; host.innerHTML = '';
  verrouFond();
  /* des écritures ont pu passer avant l'interruption : le classeur relu
     qu'elles ont renvoyé est plus à jour que ce que le mur affiche */
  if(IGD.dernier){
    const s = source();
    if(s) cacheStore.set(s.url, IGD.dernier);
    applyData(IGD.dernier, true);
    IGD.dernier = null;
    render();
  }
}

/* ---------- étape 1 : ce qu'on veut mettre à jour ---------- */
/* Toutes les portées possibles : le journal entier, puis chaque onglet qui
   contient quelque chose. La liste est la même où qu'on ouvre la fenêtre —
   avant, seul l'onglet affiché était proposé, si bien que mettre à jour
   « 2024 » obligeait à aller s'y placer d'abord, alors que c'est
   précisément une opération qu'on lance de loin, depuis n'importe où.

   L'onglet courant reste préselectionné : la commodité d'avant est gardée,
   elle n'est simplement plus la seule option. */
function igdbPortees(){
  const portees = [{nom: 'Tout le journal', bucket: 'all', jeux: GAMES.slice()}];
  BUCKETS.forEach(b=>{
    const jeux = GAMES.filter(x => x.bucket === b);
    if(jeux.length) portees.push({nom: `Onglet « ${b} »`, bucket: b, jeux: jeux});
  });
  return portees;
}
function igdbReglages(){
  IGD.etape = 'reglages';
  igdbEntete('Mise à jour depuis IGDB');
  const portees = igdbPortees();
  igdbCorps().innerHTML = `
    <div class="fgrid">
      <label class="fld full"><u>Onglets</u>
        <select id="igdb_portee">${portees.map((p,i)=>
          `<option value="${i}"${p.bucket === S.bucket ? ' selected' : ''}>${esc(p.nom)} — ${p.jeux.length} jeu${p.jeux.length > 1 ? 'x' : ''}</option>`
        ).join('')}</select></label>
      <label class="fld fcheck">
        <input id="igdb_dates" type="checkbox"${IGD.opts.dates ? ' checked' : ''}>
        <span>Dates de sortie</span></label>
      <label class="fld fcheck">
        <input id="igdb_prix" type="checkbox"${IGD.opts.prix ? ' checked' : ''}>
        <span>Prix de base</span></label>
      <label class="fld fcheck">
        <input id="igdb_jaq" type="checkbox"${IGD.opts.jaquettes ? ' checked' : ''}>
        <span>Jaquettes manquantes</span></label>
    </div>
    <div class="frow"><span class="spacer"></span>
      <button class="ghost" id="igdb_annuler">Annuler</button>
      <button class="cta auto" id="igdb_go">Analyser</button></div>`;
  $('igdb_annuler').onclick = fermerIgdb;
  $('igdb_go').onclick = ()=>{
    IGD.opts = {
      dates: $('igdb_dates').checked,
      prix: $('igdb_prix').checked,
      jaquettes: $('igdb_jaq').checked,
    };
    if(!IGD.opts.dates && !IGD.opts.prix && !IGD.opts.jaquettes){
      toast("Coche au moins une chose à mettre à jour.", true);
      return;
    }
    const p = portees[+$('igdb_portee').value] || portees[0];
    IGD.liste = p.jeux.slice();
    igdbAnalyse();
  };
}

/* ---------- la jauge, commune à l'analyse et à l'écriture ---------- */
function igdbJauge(){
  return `<div class="igdb-jauge"><i id="igdb_barre" style="width:0%"></i></div>
    <p class="igdb-encours">
      <b id="igdb_compteur">0 / 0</b>
      <span id="igdb_quoi"></span>
      <em id="igdb_reste"></em>
    </p>`;
}
/* Le temps restant, à partir de ce qui est déjà passé. Sous deux jeux la
   moyenne ne veut rien dire, et sous cinq secondes l'annoncer est plus
   agité qu'utile. */
function igdbReste(fait, total){
  if(!IGD.t0 || fait < 2) return '';
  const s = Math.round((Date.now() - IGD.t0) / fait * (total - fait) / 1000);
  if(s < 5) return '';
  return s < 90 ? `environ ${s} s` : `environ ${Math.round(s / 60)} min`;
}
function igdbAvance(fait, total, quoi){
  const barre = $('igdb_barre'), compteur = $('igdb_compteur');
  if(!barre || !compteur) return;
  barre.style.width = (total ? Math.round(fait / total * 100) : 100) + '%';
  compteur.textContent = `${fait} / ${total}`;
  $('igdb_quoi').textContent = quoi || '';
  $('igdb_reste').textContent = igdbReste(fait, total);
}

/* ---------- étape 2 : l'analyse ---------- */
async function igdbAnalyse(){
  const jeton = ++IGD.jeton;
  IGD.etape = 'analyse';
  IGD.stop = false;
  IGD.lignes = [];
  IGD.t0 = Date.now();
  igdbEntete('Analyse en cours');
  igdbCorps().innerHTML = `
    ${igdbJauge()}
    <div class="frow"><span class="spacer"></span>
      <button class="ghost" id="igdb_stop">Interrompre</button></div>`;
  $('igdb_stop').onclick = ()=>{ IGD.stop = true; };

  const total = IGD.liste.length;
  for(let i = 0; i < total; i++){
    if(jeton !== IGD.jeton) return;      // la fenêtre a été fermée
    if(IGD.stop) break;                  // interrompu : on garde ce qu'on a
    const g = IGD.liste[i];
    igdbAvance(i, total, g.name);
    let data;
    try{
      data = await api('/api/jeu/maj', {
        nom: g.name,
        sortie: g.release || '',
        prix: IGD.opts.prix,
        // Flask attend un mot, pas un booléen : « aucune » lui évite de
        // rassembler des propositions dont personne ne veut
        jaquettes: IGD.opts.jaquettes ? 'manquantes' : 'aucune',
      });
    }catch(e){
      data = {etat:'injoignable', raison:'serveur injoignable'};
    }
    if(jeton !== IGD.jeton) return;
    IGD.lignes.push(igdbRapport(g, data));
  }
  if(jeton !== IGD.jeton) return;
  igdbAvance(IGD.lignes.length, total, '');
  igdbRevue();
}

/* Ce qu'on retient d'un jeu : les écarts, et rien d'autre. Une valeur
   identique n'est pas un changement — la liste ne montrerait que du bruit. */
function igdbRapport(g, data){
  const l = {
    g: g,
    etat: data.etat || 'injoignable',
    raison: data.raison || '',
    fiche: data.fiche || null,
    surete: data.surete || '',
    jaquette: data.jaquette || '',
    propositions: data.propositions || [],
    date: null, prix: null, coche: false,
  };
  if(l.etat !== 'ok' || !l.fiche) return l;

  if(IGD.opts.dates && l.fiche.iso && l.fiche.iso !== (g.release || '')){
    l.date = {avant: g.release || '', apres: l.fiche.iso};
  }
  if(IGD.opts.prix && data.prix !== null && data.prix !== undefined){
    const av = g.base;
    // le centime d'écart : deux flottants qui valent le même prix ne sont
    // pas forcément égaux au bit près
    if(av === null || av === undefined || Math.abs(av - data.prix) >= 0.005){
      l.prix = {avant: av, apres: data.prix};
    }
  }
  l.coche = !!(l.date || l.prix) && l.surete !== 'douteuse';
  return l;
}

/* Les jaquettes à proposer, dédoublonnées par nom de fichier : le même jeu
   rejoué dans deux onglets n'a qu'une seule image sur le disque. */
function igdbFileJaquettes(){
  if(!IGD.opts.jaquettes) return [];
  const file = [], vus = {};
  IGD.lignes.forEach(l=>{
    if(l.etat !== 'ok' || !l.propositions.length) return;
    // déjà illustré : le bouton de la tuile sert à en changer, un par un
    if(l.jaquette !== 'absente') return;
    const cle = slug(l.g.name);
    if(!cle || vus[cle]) return;
    vus[cle] = true;
    file.push({nom: l.g.name, propositions: l.propositions});
  });
  return file;
}

/* ---------- étape 3 : la relecture ---------- */
function igdbDelta(titre, avant, apres){
  return `<span class="igdb-delta"><u>${titre}</u>
    <span class="igdb-av">${esc(avant)}</span>
    <span class="igdb-fl">→</span>
    <b class="igdb-ap">${esc(apres)}</b></span>`;
}
function igdbLigneHTML(l, i){
  const f = l.fiche;
  const meme = norm(f.titre) === norm(l.g.name);
  return `<label class="igdb-ligne">
    <input type="checkbox" data-i="${i}"${l.coche ? ' checked' : ''}>
    <span class="igdb-corps">
      <b class="igdb-nom">${esc(l.g.name)} <em>${esc(l.g.bucket)}</em></b>
      <span class="igdb-match">${meme ? '' : esc(f.titre) + ' · '}${esc(f.date || 'date inconnue')} <i
        class="igdb-tag ${l.surete}">${esc(SURETE[l.surete] || '')}</i></span>
      ${l.date ? igdbDelta('Date', l.date.avant ? dateFmt(l.date.avant) : 'aucune', dateFmt(l.date.apres)) : ''}
      ${l.prix ? igdbDelta('Prix', money(l.prix.avant), money(l.prix.apres)) : ''}
    </span>
  </label>`;
}
function igdbRevue(){
  IGD.etape = 'revue';
  IGD.file = igdbFileJaquettes();
  const avec  = IGD.lignes.filter(l => l.date || l.prix);
  const rates = IGD.lignes.filter(l => l.etat !== 'ok');
  igdbEntete('Ce qui va changer');

  const nJaq = IGD.file.length;
  igdbCorps().innerHTML = `
    <p class="igdb-info">
      <b>${IGD.lignes.length}</b> jeu${IGD.lignes.length > 1 ? 'x' : ''} analysé${IGD.lignes.length > 1 ? 's' : ''} :
      <b>${avec.length}</b> à corriger${nJaq ? `, <b>${nJaq}</b> jaquette${nJaq > 1 ? 's' : ''} à proposer` : ''}.
      ${avec.length ? 'Seules les cellules « Date de sortie » et « Prix de base » sont touchées.' : ''}
    </p>
    ${avec.length
      ? `<div class="igdb-liste">${avec.map(igdbLigneHTML).join('')}</div>`
      : `<p class="igdb-note">Aucune date ni aucun prix à corriger${nJaq ? ' — il reste les jaquettes.' : ' : le journal est déjà à jour.'}</p>`}
    ${rates.length ? `<details class="igdb-repli">
      <summary>${rates.length} jeu${rates.length > 1 ? 'x' : ''} sans réponse d'IGDB</summary>
      <ul>${rates.map(l=>`<li>${esc(l.g.name)} <i>— ${esc(l.etat === 'introuvable' ? 'aucune fiche trouvée' : (l.raison || 'IGDB injoignable'))}</i></li>`).join('')}</ul>
    </details>` : ''}
    <div class="frow">
      ${avec.length ? '<button class="ghost" id="igdb_tous">Tout cocher</button><button class="ghost" id="igdb_aucun">Tout décocher</button>' : ''}
      <span class="spacer"></span>
      <button class="ghost" id="igdb_annuler">Annuler</button>
      <button class="cta auto" id="igdb_ok"></button>
    </div>`;

  /* data-i pointe dans `avec`, pas dans IGD.lignes : c'est la liste affichée
     qui est indexée, et elle ne contient que les jeux à corriger */
  igdbCorps().querySelectorAll('.igdb-ligne input').forEach(c=>{
    c.onchange = ()=>{ avec[+c.dataset.i].coche = c.checked; igdbBouton(); };
  });
  const cocher = v => igdbCorps().querySelectorAll('.igdb-ligne input').forEach(c=>{
    c.checked = v; avec[+c.dataset.i].coche = v;
  });
  if($('igdb_tous'))  $('igdb_tous').onclick  = ()=>{ cocher(true);  igdbBouton(); };
  if($('igdb_aucun')) $('igdb_aucun').onclick = ()=>{ cocher(false); igdbBouton(); };
  $('igdb_annuler').onclick = fermerIgdb;
  $('igdb_ok').onclick = ()=>{
    if(IGD.lignes.some(l => l.coche && (l.date || l.prix))) igdbEcriture();
    else if(IGD.file.length) igdbJaquette();
    else fermerIgdb();
  };
  igdbBouton();
}
/* Le bouton principal dit ce qu'il va faire, et il change à chaque case
   décochée : « Écrire 12 lignes », puis « Passer aux jaquettes », puis
   « Fermer » quand il ne reste plus rien. */
function igdbBouton(){
  const b = $('igdb_ok');
  if(!b) return;
  const n = IGD.lignes.filter(l => l.coche && (l.date || l.prix)).length;
  if(n) b.textContent = `Écrire ${n} ligne${n > 1 ? 's' : ''}`;
  else if(IGD.file.length) b.textContent = `Voir les ${IGD.file.length} jaquette${IGD.file.length > 1 ? 's' : ''}`;
  else b.textContent = 'Fermer';
}

/* ---------- étape 4 : l'écriture ---------- */
/* Ce qui part pour un jeu : les deux cellules concernées, pas une de plus.
   Apps Script laisse une colonne tranquille quand sa valeur est absente de
   `values` (poser_ : « champ non envoyé »), et ne vide une cellule que sur
   un null explicite. La note, le mois, le temps de jeu, le prix payé et
   l'avis ne sont donc pas réécrits — pas même à l'identique, ce qui évite
   au passage tout aller-retour de format sur des colonnes qu'on n'a aucune
   raison de toucher. */
function igdbCharge(l){
  const g = l.g;
  const cols = COLS[g.bucket];
  if(!cols) throw new Error(`onglet « ${g.bucket} » inconnu`);
  const values = {};
  if(l.date) values.release = l.date.apres;
  if(l.prix) values.base = l.prix.apres;
  return {
    sheet: g.bucket,
    modele: g.bucket,
    cols: cols,
    colsFrom: cols,
    from: {sheet: g.bucket, row: g.row, expect: g.name},
    values: values,
    // ni review ni noteCol : l'avis n'est pas concerné, et un `review`
    // absent est justement ce qui dit au script de ne pas y toucher
  };
}

/* Deux façons d'écrire, selon ce que le classeur sait faire :

     - par paquets, via l'action « lot » : une seule relecture du classeur
       pour vingt lignes, au lieu d'une par ligne. C'est la relecture qui
       coûte, pas l'écriture.
     - une ligne à la fois, via « enregistrer », si le script n'a pas
       encore été redéployé avec l'action « lot ».

   La bascule est automatique et silencieuse : un vieux script répond
   « action inconnue », on note qu'il ne sait pas et on continue sans lui.
   Enregistrer un .gs ne suffit pas à le déployer — il faut créer une
   nouvelle version — donc ce cas arrivera, et il ne doit rien casser. */
const IGDB_LOT = 20;
let IGDB_LOT_OK = true;

/* Écrit un paquet et renvoie les motifs d'échec, un par jeu. Les compteurs
   sont tenus ici : c'est le seul endroit qui sache exactement laquelle des
   lignes est passée et laquelle a résisté. */
async function igdbEnvoyerPaquet(paquet){
  const echecs = [], utiles = [];
  paquet.forEach(l=>{
    try{ utiles.push({ligne: l, charge: igdbCharge(l)}); }
    catch(e){ echecs.push(`${l.g.name} — ${e.message || 'erreur inconnue'}`); }
  });
  if(!utiles.length) return echecs;
  const compter = u => {
    if(u.ligne.date) IGD.compte.dates++;
    if(u.ligne.prix) IGD.compte.prix++;
  };

  if(IGDB_LOT_OK){
    try{
      IGD.dernier = await envoyer('lot', {modifs: utiles.map(u => u.charge)});
      const refuses = ((IGD.dernier.fait || {}).echecs) || [];
      const rates = {};
      refuses.forEach(e=>{
        rates[e.i] = true;
        echecs.push(`${e.jeu || '?'} — ${e.error}`);
      });
      utiles.forEach((u,k)=>{ if(!rates[k]) compter(u); });
      return echecs;
    }catch(e){
      const motif = e.message || 'erreur inconnue';
      if(!/action inconnue/i.test(motif)){
        // panne franche : le paquet entier n'est pas passé, on le dit
        return echecs.concat(utiles.map(u => `${u.ligne.g.name} — ${motif}`));
      }
      IGDB_LOT_OK = false;      // script pas encore redéployé : on se rabat
    }
  }
  for(const u of utiles){
    if(IGD.stop) break;
    try{ IGD.dernier = await envoyer('enregistrer', u.charge); compter(u); }
    catch(e){ echecs.push(`${u.ligne.g.name} — ${e.message || 'erreur inconnue'}`); }
  }
  return echecs;
}

async function igdbEcriture(){
  const jeton = ++IGD.jeton;
  IGD.etape = 'ecriture';
  IGD.stop = false;
  IGD.t0 = Date.now();
  IGD.compte.dates = 0; IGD.compte.prix = 0; IGD.compte.echecs = 0;
  IGD.echecs = [];
  const aFaire = IGD.lignes.filter(l => l.coche && (l.date || l.prix));
  igdbEntete('Écriture dans le classeur');
