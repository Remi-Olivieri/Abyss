  return `<div class="sheet-rank${med ? ' medaille ' + med : ''}">`
       + `${r.rang}<sup>${r.rang === 1 ? 'er' : 'e'}</sup> sur ${r.total} ${esc(r.ou)}</div>`;
}

/* ---------- la fiche ----------
   La coquille est montée une fois et gardée : naviguer d'un jeu au suivant
   ne réécrit que le corps et la jaquette. Tout reconstruire relançait
   l'image à chaque flèche — élément recréé, requête, décodage — et la case
   clignotait même quand elle était déjà en cache. */

/* Copier dans le presse-papier. navigator.clipboard n'existe qu'en contexte
   sécurisé : depuis un autre poste du réseau, la page arrive en http et
   l'API est tout simplement absente. D'où le repli sur la vieille méthode —
   un champ hors écran, une sélection, execCommand — qui, elle, marche
   partout où ce hub est consulté. */
async function copier(texte){
  try{
    if(window.isSecureContext && navigator.clipboard){
      await navigator.clipboard.writeText(texte);
      return true;
    }
  }catch(e){}
  try{
    const zone = document.createElement('textarea');
    zone.value = texte;
    zone.setAttribute('readonly', '');
    zone.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0';
    document.body.appendChild(zone);
    zone.select();
    const ok = document.execCommand('copy');
    zone.remove();
    return ok;
  }catch(e){ return false; }
}

const ICONE_COPIE = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="9" y="9" width="12" height="12" rx="2"/>
  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
</svg>`;

/* Le corps de la fiche : tout ce qui change d'un jeu à l'autre, hors
   jaquette et hors barre d'outils. */
function corpsFiche(g){
  const statut = statutDe(g), wish = estWishlist(g);
  // en cours ou convoité : dans les deux cas le jeu n'a pas de fin à raconter
  const enCours = !!statut;
  const plus  = g.review.filter(s=>s.startsWith('+')).map(s=>`<span class="pt plus">${esc(s.slice(1).trim())}</span>`);
  const minus = g.review.filter(s=>s.startsWith('-')).map(s=>`<span class="pt minus">${esc(s.slice(1).trim())}</span>`);
  const other = g.review.filter(s=>!/^[+-]/.test(s)).map(s=>`<span class="pt">${esc(s)}</span>`);
  /* la date de sortie s'affiche désormais à côté du titre (voir sheet-title
     plus bas) plutôt qu'ici : ça libère une case et laisse Terminé / Temps /
     Prix de base / Payé tenir sur une seule ligne. */
  /* Jeu convoité et soldé aujourd'hui : la case de prix montre l'ancien
     barré, celui du jour, et la remise. Le prix barré est celui du
     classeur, pas celui de Steam — c'est le montant qu'on avait noté, donc
     celui auquel on compare. À défaut, le prix fort que Steam annonce. */
  const solde = wish && TARIFS[g.name] && TARIFS[g.name].remise > 0 ? TARIFS[g.name] : null;
  const avant = (g.base === null || g.base === undefined) ? (solde && solde.plein) : g.base;
  const prix = solde
    ? `<s class="fait-avant">${esc(money(avant))}</s>${esc(money(solde.actuel))}`
      + `<span class="fait-solde">−${solde.remise}&#8239;%</span>`
    : '';
  const facts = [
    // ni date de fin ni temps de jeu tant que le jeu n'est pas terminé
    enCours ? null : ['Terminé', g.month?`${MONTHS[g.month-1]} ${g.year||''}`:(g.year||g.bucket)],
    enCours ? null : ['Temps', hoursFmt(g.hours)],
    // le troisième terme, quand il existe, est du HTML déjà échappé
    [solde ? 'Prix' : 'Prix de base', money(g.base), prix],
    // rien n'a été payé pour un jeu de la wishlist : la case dirait « — »
    wish ? null : ['Payé', money(g.paid)]
  ].filter(Boolean);
  const rang = rangJeu(g), med = medailleDe(rang);
  return `${statut
      ? `<span class="sheet-note ${wish ? 'wish' : 'encours'}">${esc(statut)}</span>`
      : `<span class="sheet-note" style="color:${noteColor(g.rating)}">${g.rating!==null?fr(g.rating,1):'—'}</span>`}
    <h3 class="sheet-title${med ? ' medaille ' + med : ''}">${esc(g.name)}<button
        class="titre-copie" type="button" title="Copier le nom du jeu"
        aria-label="Copier le nom du jeu">${ICONE_COPIE}</button>${
      g.release ? `<span class="sheet-release">${dateFmt(g.release)}</span>` : ''}</h3>
    ${rangHTML(rang, med)}
    ${enCours ? '' : (plus.length+minus.length+other.length)
      ? `<div class="pros">${plus.join('')}${minus.join('')}${other.join('')}</div>`
      : `<div class="pros"><span class="pt" style="opacity:.6">Pas d'avis écrit pour ce jeu.</span></div>`}
    <div class="facts">${facts.map(([u,b,brut])=>
      `<div class="fact"><u>${u}</u><b>${brut || esc(b)}</b></div>`).join('')}</div>
    <button type="button" class="detail-btn">Voir plus d'informations</button>`;
}

/* La coquille, montée une seule fois par ouverture. Les gestionnaires posés
   ici relisent S.open au moment du clic au lieu de capturer un rang : c'est
   ce qui permet de ne plus jamais les reposer. */
function monteFiche(host){
  host.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-tools">
      <span class="grp">
        <button class="sbtn wide sheet-edit" hidden>Modifier</button>
        <button class="sbtn sheet-share" title="Mettre ce jeu en image" aria-label="Mettre ce jeu en image">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.6" cy="8.6" r="1.4"/><path d="M21 15.5l-4.5-4.5L5 21.5"/>
          </svg>
        </button>
      </span>
      <span class="grp">
        <button class="sbtn nav-prev" aria-label="Jeu précédent">‹</button>
        <button class="sbtn nav-next" aria-label="Jeu suivant">›</button>
        <button class="sbtn sheet-x" aria-label="Fermer">×</button>
      </span>
    </div>
    <div class="sheet-in">
      <div class="sheet-cover"></div>
      <div class="sheet-body"></div>
    </div>
  </div>`;
  const boite = host.querySelector('.sheet');
  const jeu = ()=> SHEET_LIST[S.open];
  boite.querySelector('.sheet-x').onclick = fermeFiche;
  boite.querySelector('.sheet-edit').onclick = ()=>{ const g = jeu(); if(g) openForm(g); };
  boite.querySelector('.sheet-share').onclick = ()=>{ const g = jeu(); if(g) partagerJeu(g); };
  boite.querySelector('.nav-prev').onclick = ()=>{ if(S.open > 0){ S.open--; paintSheet(-1); } };
  boite.querySelector('.nav-next').onclick = ()=>{
    if(S.open < SHEET_LIST.length - 1){ S.open++; paintSheet(1); }
  };
  boite.addEventListener('keydown', e=> piegeFocus(boite, e));
  /* Le bouton « copier » et « voir plus d'informations » vivent tous deux
     dans le corps, réécrit à chaque jeu : on écoute la boîte plutôt que les
     boutons, une fois pour toutes. */
  boite.addEventListener('click', e=>{
    if(e.target.closest('.titre-copie')){
      const g = jeu();
      if(!g) return;
      copier(g.name).then(ok =>
        toast(ok ? `« ${g.name} » copié` : 'Copie impossible', !ok));
      return;
    }
    if(e.target.closest('.detail-btn')){
      const g = jeu();
      if(g) ouvrirDetail(g);
    }
  });
}

/* ---------- la jaquette de la fiche ----------
   Un seul <img>, gardé d'un jeu au suivant : seul son src change. Le repli
   en initiales est refait ici plutôt que confié à hydrateCovers(), qui
   remplace l'élément — c'est précisément ce qu'on cherche à éviter. */
function coverInitiales(hote, g){
  const d = document.createElement('div');
  d.className = 'cov xl ph';
  d.style.setProperty('--c', noteColor(g.rating));
  d.textContent = initials(g.name);
  d.appendChild(boutonJaquette(g.name, g.release, g.idIgdb));
  hote.replaceChildren(d);
}
function coverFiche(g){
  const hote = document.querySelector('#sheet .sheet-cover');
  if(!hote) return;
  const url = coverURL(cleJaquette(g));
  if(!url){ coverInitiales(hote, g); return; }

  let img = hote.querySelector('img.cov');
  if(!img){
    img = document.createElement('img');
    img.className = 'cov xl';
    img.alt = '';
    img.decoding = 'async';
    // seule image de l'écran quand la fiche s'ouvre, et celle qu'on attend
    img.setAttribute('fetchpriority', 'high');
    /* Écoutes posées une fois, et sans {once} : le même élément servira à
       toutes les jaquettes suivantes. Elles vérifient que la réponse porte
       bien sur l'image demandée — une arrivée en retard, sur un jeu qu'on a
       déjà quitté, ne doit rien changer à l'écran. */
    img.addEventListener('load', ()=>{
      if(img.dataset.url === img.getAttribute('src')) img.classList.remove('chargement');
    });
    img.addEventListener('error', ()=>{
      if(img.dataset.url !== img.getAttribute('src')) return;
      const jeu = SHEET_LIST[S.open];
      if(jeu) coverInitiales(hote, jeu);
    });
    hote.replaceChildren(img);
  }
  if(img.getAttribute('src') === url) return;   // déjà la bonne

  img.dataset.url = url;
  /* Déjà en cache : la bascule tient dans la même image, inutile de faire
     clignoter la case. Un Image() jetable le dit tout de suite — complete
     passe à true sans attendre quand le navigateur l'a déjà. */
  const sonde = new Image();
  sonde.src = url;
  img.classList.toggle('chargement', !sonde.complete);
  img.src = url;
}
function openSheet(i){
  SHEET_LIST = filtered();
  if(!SHEET_LIST[i]) return;
  S.open = i;
  paintSheet();
}
/* Rejoue l'animation de glissement sur la zone de contenu. La classe doit
   être retirée puis reposée après un recalcul forcé : sans ce détour, le
   navigateur ne voit aucun changement et l'animation ne repart pas quand on
   enchaîne les flèches dans le même sens.

   Une simple animation CSS, et pas une View Transition : celle-ci
   photographierait la fiche pour la faire glisser en dehors de sa boîte
   arrondie, alors qu'on veut justement que le contenu défile à l'intérieur
   du cadre, qui lui ne bouge pas. */
function animeFiche(sens){
  if(!sens) return;
  const zone = document.querySelector('#sheet .sheet-in');
  if(!zone) return;
  zone.classList.remove('va-gauche', 'va-droite');
  void zone.offsetWidth;
  zone.classList.add(sens > 0 ? 'va-droite' : 'va-gauche');
}

/* `sens` : +1 vers le jeu suivant, -1 vers le précédent, rien sinon. Les
   repeintures qui ne changent pas de jeu — rafraîchissement de fond, prix
   Steam qui arrivent — n'en passent pas, et n'animent donc rien. */
function paintSheet(sens){
  const host = document.getElementById('sheet');
  const i = S.open, g = SHEET_LIST[i];
  if(!g){ closeSheet(); return; }
  const neuve = !host.querySelector('.sheet');
  if(neuve) monteFiche(host);

  const boite = host.querySelector('.sheet');
  boite.setAttribute('aria-label', g.name);
  boite.querySelector('.sheet-edit').hidden = !CAN_WRITE;
  boite.querySelector('.nav-prev').disabled = i <= 0;
  boite.querySelector('.nav-next').disabled = i >= SHEET_LIST.length - 1;
  coverFiche(g);
  boite.querySelector('.sheet-body').innerHTML = corpsFiche(g);

  /* On ne remonte en haut qu'en changeant de jeu. Quand render() repeint la
     fiche après un rafraîchissement, la lecture en cours ne doit pas
     repartir du titre. */
  const cle = cleTuile(g);
  if(boite.dataset.jeu !== cle){
    boite.scrollTop = 0;
    boite.dataset.jeu = cle;
    animeFiche(sens);
    /* Le retour au mur (focus + halo) vise le jeu qu'on regarde à la
       fermeture, pas celui sur lequel on avait cliqué au départ : sans
       cette mise à jour, feuilleter avec les flèches puis fermer ramenait
       toujours sur la toute première tuile. */
    const tuileActuelle = TUILES.get(cle);
    if(tuileActuelle) FICHE_RETOUR = tuileActuelle;
  }

  host.hidden = false;
  verrouFond();
  // le focus n'entre dans la fiche qu'à son ouverture : le reposer à chaque
  // flèche ferait sauter le lecteur d'écran au bouton de fermeture
  if(neuve) boite.querySelector('.sheet-x').focus();
}
/* ---------- transition tuile → fiche ----------
   La jaquette de la tuile et celle de la fiche portent tour à tour le même
   view-transition-name : le navigateur reconnaît alors le même élément de
   part et d'autre du changement et fait glisser la vignette jusqu'à sa
   grande taille, au lieu d'ouvrir un panneau par-dessus.

   Le nom doit désigner UN SEUL élément à la fois dans toute la page. La
   tuile reste dans le document derrière la fiche : si les deux le portaient
   en même temps, le navigateur abandonnerait l'animation sans rien dire.
   D'où le passage de relais à l'intérieur du callback, et le nettoyage sur
   `finished` — une transition interrompue ne doit pas laisser le nom
   accroché à une tuile, sinon la suivante ne démarre plus.

   startViewTransition n'existe pas partout (Firefox, Safari ancien) : dans
   ce cas la mutation s'exécute telle quelle. Pas d'animation, pas d'erreur,
   exactement le comportement d'avant. */
/* ---------- piège à focus, retour et repère ----------
   Une fiche ouverte occupe tout l'écran : le reste de la page est
   inatteignable à la souris, Tab n'a donc rien à y faire non plus. Il tourne
   en boucle à l'intérieur tant qu'elle est là.

   À la fermeture, trois choses reviennent à leur place : le défilement, le
   focus, et le regard. Le focus revenait jusqu'ici sur <body>, si bien que
   le Tab suivant repartait du haut du document et y ramenait la page —
   punitif sur un mur de deux cents jeux. */
const FOCUSABLES = 'a[href],button:not([disabled]),input:not([disabled]),' +
  'select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
let FICHE_RETOUR = null;   // la tuile d'où l'on vient
let FICHE_SCROLL = 0;      // le défilement au moment de l'ouverture
let HALO = null;           // tuile à souligner une fois la fiche refermée

/* Tab et Maj+Tab rebouclent aux extrémités. offsetParent écarte ce qui est
   masqué — le bouton « Modifier » en lecture seule, par exemple — sans quoi
   la boucle s'arrêterait sur un élément invisible. */
function piegeFocus(boite, e){
  if(e.key !== 'Tab') return;
  const cibles = Array.from(boite.querySelectorAll(FOCUSABLES))
    .filter(el => el.offsetParent !== null);
  if(!cibles.length) return;
  const premier = cibles[0], dernier = cibles[cibles.length - 1];
  const ici = document.activeElement;
  if(e.shiftKey && (ici === premier || !boite.contains(ici))){
    e.preventDefault(); dernier.focus();
  }else if(!e.shiftKey && ici === dernier){
    e.preventDefault(); premier.focus();
  }
}

/* Le halo doré, joué après coup. Vidé dès le premier appel : la fermeture
   animée le déclenche à la fin de la transition, la fermeture sèche tout de
   suite, et il ne doit jouer qu'une fois. */
function joueHalo(){
  const tuile = HALO;
  HALO = null;
  if(!tuile || !tuile.isConnected) return;
  tuile.classList.remove('revenu');
  void tuile.offsetWidth;          // sinon l'animation ne repart pas
  tuile.classList.add('revenu');
  setTimeout(()=>{ tuile.classList.remove('revenu'); }, 700);
}

/* Remet le défilement puis le focus, sur la tuile du jeu qu'on regardait à
   la fermeture — pas forcément celle sur laquelle on avait cliqué, si on a
   feuilleté avec les flèches entre-temps. C'est elle qui décide d'où
   défiler : preventScroll coupe le scroll-into-view par défaut de focus(),
   sinon les deux se disputeraient la position finale. Sans tuile (jeu
   supprimé, filtre changé...), on retombe sur le défilement d'avant. */
function rendreFocus(){
  const tuile = FICHE_RETOUR;
  FICHE_RETOUR = null;
  if(!tuile || !tuile.isConnected){
    if(Math.abs(window.scrollY - FICHE_SCROLL) > 1) window.scrollTo(0, FICHE_SCROLL);
    return;
  }
  tuile.scrollIntoView({block: 'center'});
  try{ tuile.focus({preventScroll: true}); }catch(err){ tuile.focus(); }
  HALO = tuile;
}

const VT_JAQUETTE = 'jaquette-active';
function nomVT(el, actif){
  if(el) el.style.viewTransitionName = actif ? VT_JAQUETTE : '';
}
function jaquetteFiche(){
  return document.querySelector('#sheet .sheet-cover .cov');
}
function jaquetteTuile(g){
  const tuile = g && TUILES.get(cleTuile(g));
  return (tuile && tuile.isConnected) ? tuile.querySelector('.cov') : null;
}

/* Un rafraîchissement de fond qui aboutit pendant la transition reconstruit
   les tuiles (voir render()) — dont celle qui porte le nom de transition,
   si elle bouge de place ou change de contenu. Le navigateur abandonne
   alors l'animation sans le dire : la fiche apparaît d'un coup, comme
   téléportée, au lieu de voir la jaquette voyager jusqu'à sa place.
   TRANSITION_EN_COURS dit à render() de repousser cette reconstruction
   plutôt que de la faire sous les pieds de l'animation. */
let TRANSITION_EN_COURS = false;
let RENDU_MUR_EN_ATTENTE = false;
function finTransition(){
  TRANSITION_EN_COURS = false;
  if(RENDU_MUR_EN_ATTENTE){ RENDU_MUR_EN_ATTENTE = false; renderWall(); }
}
function ouvreFiche(i, tuile){
  FICHE_RETOUR = tuile || null;
  FICHE_SCROLL = window.scrollY;
  const src = tuile && tuile.querySelector('.cov');
  if(!document.startViewTransition || !src){ openSheet(i); return; }
  nomVT(src, true);
  TRANSITION_EN_COURS = true;
  const vt = document.startViewTransition(()=>{
    nomVT(src, false);           // la tuile rend le nom...
    openSheet(i);
    nomVT(jaquetteFiche(), true);  // ...la fiche le reprend
  });
  vt.finished.catch(()=>{}).then(()=>{ nomVT(src, false); finTransition(); });
}

function fermeFiche(){
  const host = document.getElementById('sheet');
  if(host.hidden) return;
  const g = SHEET_LIST[S.open];
  const src = jaquetteFiche();
  if(!document.startViewTransition || !src || !g){ closeSheet(); joueHalo(); return; }
  nomVT(src, true);
  TRANSITION_EN_COURS = true;
  const vt = document.startViewTransition(()=>{
    nomVT(src, false);
    closeSheet();
    nomVT(jaquetteTuile(g), true);   // la vignette reprend sa place
  });
  vt.finished.catch(()=>{}).then(()=>{
    nomVT(jaquetteTuile(g), false);
    joueHalo();          // sous la photo de la transition, il serait invisible
    finTransition();
  });
}

function closeSheet(){
  const host = document.getElementById('sheet');
  if(host.hidden) return;
  host.hidden = true; host.innerHTML = '';
  verrouFond();          // le défilement doit être rendu avant d'être repositionné
  S.open = null;
  rendreFocus();
}
fermeSurFond('sheet', fermeFiche);
document.addEventListener('keydown', e=>{
  /* L'ordre suit la pile : la fenêtre du dessus prend Échap et rend la
     main. Une fenêtre oubliée ici laisserait Échap traverser jusqu'à celle
     du dessous et fermer la mauvaise — c'est ce qui arrivait au détail
     d'un jeu, qui refermait la fiche derrière lui. */
  if(!document.getElementById('zoom').hidden){
    if(e.key === 'Escape') fermerZoom();
    else if(e.key === 'ArrowLeft') zoomBouge(-1);
    else if(e.key === 'ArrowRight') zoomBouge(1);
    return;
  }
  if(!document.getElementById('detail').hidden){
    if(e.key === 'Escape') fermerDetail();
    return;
  }
  if(!document.getElementById('export').hidden){
    if(e.key === 'Escape') fermerExport();
    return;
  }
  if(!document.getElementById('recherche').hidden){
    if(e.key === 'Escape') fermerRecherche();
    return;
  }
  // la mise à jour depuis IGDB occupe l'écran seule : rien ne s'ouvre
  // par-dessus, donc rien d'autre ne prend Échap tant qu'elle est là
  if(!document.getElementById('igdb').hidden){
    if(e.key === 'Escape') fermerIgdb();
    return;
  }
  // le bilan en image est au-dessus de tout, y compris le choix de jaquette
  if(!document.getElementById('bilan').hidden){
    if(e.key === 'Escape') fermerBilan();
    return;
  }
  if(!document.getElementById('jaq').hidden){
    if(e.key === 'Escape') closeJaq();
    return;
  }
  if(!document.getElementById('form').hidden){
    if(e.key === 'Escape') closeForm();
    return;
  }
  if(document.getElementById('sheet').hidden){
    // rien d'ouvert : Échap enlève la tranche de notes choisie
    const per = document.getElementById('perMenu');
    if(e.key === 'Escape' && S.range
       && document.getElementById('menu').hidden
       && document.getElementById('recherche').hidden
       && (!per || per.hidden)) viderTranche();
    return;
  }
  if(e.key === 'Escape'){ fermeFiche(); }
  else if(e.key === 'ArrowLeft' && S.open > 0){ S.open--; paintSheet(-1); }
  else if(e.key === 'ArrowRight' && S.open < SHEET_LIST.length-1){ S.open++; paintSheet(1); }
});

/* =======================================================================
   Ajouter / modifier / supprimer — tout part vers le Google Sheet.
   La page n'invente rien : elle renvoie au script les colonnes qu'elle a
   elle-même repérées à la lecture, donc elle réécrit exactement là où
   elle avait lu.
   ======================================================================= */
let EDIT = null;

function toast(txt, mauvais){
  const t = $('toast');
  t.textContent = txt;
  t.className = 'toast show' + (mauvais ? ' bad' : '');
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.classList.remove('show'); }, 3000);
}
function isoDate(d){ return /^\d{4}-\d{2}-\d{2}$/.test(d||'') ? d : ''; }
function timeText(h){
  if(h===null||h===undefined) return '';
  const H = Math.floor(h), M = Math.round((h-H)*60);
  return M ? `${H}h${String(M).padStart(2,'0')}` : `${H}h`;
}
function numText(n){ return (n===null||n===undefined||n==='') ? '' : String(n).replace('.',','); }

function formHTML(g){
  const mois = MONTHS.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
  const avis = g ? g.review.join('\n') : '';
  return `<div class="sheet form-sheet" role="dialog" aria-modal="true">
    <div class="sheet-tools">
      <span class="grp"><b class="fhead">${g ? 'Modifier un jeu' : 'Ajouter un jeu'}</b></span>
      <span class="grp"><button class="sbtn form-x" aria-label="Fermer">×</button></span>
    </div>
    <div class="form-in">
      <div class="fgrid">
        <div class="fld full acw">
          <label for="f_name"><u>Nom du jeu <span class="req" aria-hidden="true">*</span></u></label>
          <input id="f_name" type="text" value="${esc(g?g.name:'')}" autocomplete="off"
                 spellcheck="false" role="combobox" aria-controls="f_ac"
                 aria-autocomplete="list" aria-expanded="false">
          <div class="ac" id="f_ac" role="listbox" aria-label="Jeux trouvés sur IGDB" hidden></div>
        </div>
        <p class="fld full doublon-avis" id="f_doublon" hidden></p>
        <button type="button" class="fpick" id="f_pick" hidden>
          <img id="f_pickimg" alt="" decoding="async">
          <span class="fpick-txt">
            <b id="f_pickt"></b>
            <i id="f_pickd"></i>
            <small>Clique pour changer le jeu</small>
          </span>
        </button>
        <!-- Dit la règle AVANT d'enregistrer, pas au moment du refus : un
             formulaire qui ne repousse qu'à la fin fait retaper pour rien.
             Et c'est un bouton, pas un simple texte : la fiche retenue
             (#f_pick) porte « changer de jeu », mais elle est cachée tant
             qu'il n'y en a pas — sans ce relais, un jeu que la liste ne
             propose pas n'aurait aucun moyen d'être cherché, et l'ajout
             serait sans issue. -->
        <button type="button" class="fpick-vide" id="f_pickvide" hidden>
          <b>Aucun jeu choisi.</b>
        </button>
        <label class="fld fcheck">
          <input id="f_encours" type="checkbox">
          <span>Jeu en cours</span></label>
        <label class="fld fcheck wish">
          <input id="f_wish" type="checkbox">
          <span>Wishlist</span></label>
        <div class="fld acw" id="f_bucketwrap">
          <label for="f_bucket"><u>Catégorie <span class="req" aria-hidden="true">*</span></u></label>
          <input id="f_bucket" type="text" autocomplete="off" spellcheck="false"
                 role="combobox" aria-controls="f_bucket_ac"
                 aria-autocomplete="list" aria-expanded="false">
          <div class="ac" id="f_bucket_ac" role="listbox" aria-label="Catégories existantes" hidden></div>
        </div>
        <label class="fld" id="f_monthwrap"><u>Mois</u>
          <select id="f_month"><option value="">—</option>${mois}</select></label>
        <label class="fld" id="f_ratingwrap"><u>Note sur 10</u>
          <input id="f_rating" type="text" inputmode="decimal" value="${esc(numText(g?g.rating:null))}"></label>
        <label class="fld" id="f_timewrap"><u>Temps de jeu (h)</u>
          <input id="f_time" type="text" value="${esc(timeText(g?g.hours:null))}"></label>
        <label class="fld"><u>Prix de base (€)</u>
          <input id="f_base" type="text" inputmode="decimal" value="${esc(numText(g?g.base:null))}"></label>
        <label class="fld" id="f_paidwrap"><u>Prix payé (€)</u>
          <input id="f_paid" type="text" inputmode="decimal" value="${esc(numText(g?g.paid:null))}"></label>
        <!-- La date de sortie ne se saisit plus : elle vient de la fiche IGDB
             retenue (voir alignePick) et s'affiche déjà sous le nom du jeu sur
             la fiche. Le champ reste, caché, parce que c'est encore lui qui
             porte la valeur entre le choix d'une jaquette et l'enregistrement. -->
        <input id="f_release" type="hidden" value="${esc(isoDate(g?g.release:''))}"
               data-orig="${esc(g&&g.release?g.release:'')}">
        <label class="fld full" id="f_reviewwrap"><u>Avis (Commencer par + ou -)</u>
          <span class="ta-wrap"><span class="ta-hl" id="f_review_hl" aria-hidden="true"></span
            ><textarea id="f_review" rows="5">${esc(avis)}</textarea></span></label>
      </div>
      <div class="frow">
        ${g ? '<button class="ghost danger" id="f_del">Supprimer ce jeu</button>' : ''}
        <span class="spacer"></span>
        <button class="ghost" id="f_cancel">Annuler</button>
        <button class="cta auto" id="f_ok">${g ? 'Enregistrer' : 'Ajouter'}</button>
      </div>
    </div>
  </div>`;
}

/* Les deux cases s'excluent : un jeu qu'on a commencé n'est plus une envie.
   Cocher l'une décoche l'autre, plutôt que d'interdire — on ne se bat pas
   avec un formulaire qui refuse un clic sans rien dire. */
function statutCoche(){ return $('f_encours').checked || $('f_wish').checked; }
function cibleOnglet(){
  if($('f_wish').checked) return ongletWishlist();
  if($('f_encours').checked) return ongletEnCours();
  return clean($('f_bucket').value);
}

/* ---------- onglet : un champ texte plutôt qu'un menu + un second champ
   qui apparaissait dessous et décalait tout le reste du formulaire. Taper
   un nom crée l'onglet s'il n'existe pas encore ; la liste qui flotte
   au-dessus (comme la recherche du nom du jeu) propose ceux qui existent
   déjà, sans jamais pousser les autres champs. */
const BAC = { onglets: [], i: -1 };
function ongletsExistants(){
  // « En cours » et « Wishlist » ont leur case à cocher : ils ne doivent
  // pas traîner aussi dans cette liste
  return BUCKETS.filter(b => !estStatutNom(b));
}
function bacFerme(){
  const b = $('f_bucket_ac');
  BAC.onglets = []; BAC.i = -1;
  if(b){ b.hidden = true; b.innerHTML = ''; }
  const champ = $('f_bucket');
  if(champ) champ.setAttribute('aria-expanded', 'false');
}
function bacOuvre(onglets){
  const b = $('f_bucket_ac');
  if(!b) return;
  if(!onglets.length){
    const texte = clean($('f_bucket').value);
    b.innerHTML = texte
      ? `<p class="ac-empty">Aucune catégorie ne correspond — valide pour créer « ${esc(texte)} ».</p>`
      : '';
    b.hidden = !texte;
    BAC.onglets = []; BAC.i = -1;
    $('f_bucket').setAttribute('aria-expanded', String(!!texte));
    return;
  }
  BAC.onglets = onglets; BAC.i = -1;
  b.innerHTML = onglets.map((o,i)=>
    `<button type="button" class="ac-item" role="option" aria-selected="false" data-i="${i}">
       <span class="ac-txt"><b>${esc(o)}</b></span></button>`).join('');
  b.hidden = false;
  $('f_bucket').setAttribute('aria-expanded', 'true');
  b.querySelectorAll('.ac-item').forEach(el=>{
    // mousedown et pas click : sinon le champ perd le focus en premier, la
    // liste se referme, et le clic atterrit dans le vide
    el.addEventListener('mousedown', e=>{ e.preventDefault(); bacChoisir(+el.dataset.i); });
  });
}
function bacChoisir(i){
  const o = BAC.onglets[i];
  if(o === undefined) return;
  $('f_bucket').value = o;
  bacFerme();
}
function bacBouge(pas){
  const b = $('f_bucket_ac');
  if(!b || b.hidden || !BAC.onglets.length) return;
  const n = BAC.onglets.length;
  BAC.i = BAC.i < 0 ? (pas > 0 ? 0 : n - 1) : (BAC.i + pas + n) % n;
  b.querySelectorAll('.ac-item').forEach((el,k)=>{
    const on = k === BAC.i;
    el.classList.toggle('on', on);
    el.setAttribute('aria-selected', on ? 'true' : 'false');
    if(on) el.scrollIntoView({block:'nearest'});
  });
}
function bacFrappe(){
  const q = norm($('f_bucket').value);
  const tous = ongletsExistants();
  bacOuvre(q ? tous.filter(o => norm(o).includes(q)) : tous);
}
function bacTouche(e){
  const b = $('f_bucket_ac');
  const ouvert = b && !b.hidden && BAC.onglets.length;
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    ouvert ? bacBouge(e.key === 'ArrowDown' ? 1 : -1) : bacFrappe();
  }else if(e.key === 'Enter'){
    if(!ouvert || BAC.i < 0) return;
    e.preventDefault(); bacChoisir(BAC.i);
  }else if(e.key === 'Escape'){
    if(!b || b.hidden) return;
    // la liste se referme, le formulaire reste ouvert : stopPropagation
    // empêche le gestionnaire global de prendre Échap pour lui
    e.preventDefault(); e.stopPropagation(); bacFerme();
  }
}
function brancherBucket(){
  const champ = $('f_bucket');
  if(!champ) return;
  champ.addEventListener('input', bacFrappe);
  champ.addEventListener('focus', bacFrappe);
  champ.addEventListener('keydown', bacTouche);
  champ.addEventListener('blur', ()=> setTimeout(bacFerme, 0));
}
/* Un jeu en cours n'a rien à dire de sa fin : on retire de l'écran l'année,
   le mois, la note, le temps de jeu et l'avis. Décocher les fait revenir,
   c'est le geste qui termine un jeu.
   Un jeu de la wishlist cache la même chose, plus le prix payé : il n'est
   pas acheté, la case n'aurait aucun sens. Le prix de base reste, c'est
   justement ce qu'on veut noter. */
function syncStatut(){
  const sansFin = statutCoche();
  ['f_bucketwrap','f_monthwrap','f_ratingwrap','f_timewrap','f_reviewwrap']
    .forEach(id => { $(id).hidden = sansFin; });
  $('f_paidwrap').hidden = $('f_wish').checked;
}

/* ---------- doublon ----------
   Le nom seul dit s'il y a doublon ; l'avis flotte pendant la frappe, et
   submitForm() bloque l'ajout une première fois sur ce même repérage — un
   second clic confirme, pour ne pas empêcher un vrai replay d'un jeu déjà
   terminé (voir submitForm et le bouton "Ajouter quand même ?"). */
function trouveDoublon(nom){
  const q = norm(nom);
  if(!q) return null;
  return GAMES.find(g => (!EDIT || g.id !== EDIT.id) && norm(g.name) === q) || null;
}
function majDoublon(){
  const zone = $('f_doublon');
  // le nom a changé : la confirmation « Ajouter quand même ? » ne valait
  // que pour l'ancien, sans quoi un second clic confirmerait le mauvais jeu
  const ok = $('f_ok');
  if(ok && ok.classList.contains('armed')){
    ok.classList.remove('armed');
    ok.textContent = EDIT ? 'Enregistrer' : 'Ajouter';
  }
  if(!zone) return;
  const g = trouveDoublon($('f_name').value);
  if(!g){ zone.hidden = true; return; }
  const ou = estStatut(g) ? g.bucket : (g.year || g.bucket);
  zone.hidden = false;
  zone.innerHTML = `Déjà dans ton journal - <b>${esc(ou)}</b>`
    + (g.rating !== null ? `, noté <b>${fr(g.rating,1)}</b>` : '') + '.';
}
/* ---------- validation ----------
   Un champ en faute s'entoure de rouge, et le premier motif part en toast
   — plus lisible qu'un bloc de texte qui poussait le reste du formulaire.
   L'entourage se dissipe dès que le champ est retouché : pas besoin de
   resoumettre pour voir l'erreur partir. */
const CHAMPS_VALIDES = ['f_bucket','f_name','f_rating','f_time','f_base','f_paid'];
function champErr(id, actif){
  const champ = $(id);
  const wrap = champ && champ.closest('.fld');
  if(wrap) wrap.classList.toggle('err', actif);
}
function razErreurs(){
  CHAMPS_VALIDES.forEach(id => champErr(id, false));
}
/* vide = optionnel, ce n'est pas une erreur ; non vide mais illisible en
   est une — c'était jusque-là avalé en silence et transformé en case vide */
function champInvalide(id, parseur, mini, maxi){
  const brut = clean($(id).value);
  if(!brut) return false;
  const n = parseur(brut);
  if(n === null) return true;
  if(mini !== undefined && n < mini) return true;
  if(maxi !== undefined && n > maxi) return true;
  return false;
}
function validerFormulaire(){
  const sansFin = statutCoche();
  const erreurs = [];
  if(!sansFin && !clean($('f_bucket').value))
    erreurs.push({champ:'f_bucket', message:"Donne un nom à la catégorie."});
  if(!clean($('f_name').value))
    erreurs.push({champ:'f_name', message:'Il faut au moins un nom de jeu.'});
  /* Un ajout passe forcément par une fiche IGDB. C'est ce rattachement qui
     apporte la jaquette, la date de sortie, la plateforme, le développeur
     et les genres : un jeu tapé à la main n'a rien de tout ça et reste un
     trou dans les statistiques — exactement ce qu'un rattrapage entier a
     servi à combler après coup.
     Seulement à l'ajout : une modification doit rester possible sur les
     jeux d'avant, qui n'ont jamais eu de fiche. */
  if(!EDIT && !(JEU_PICK && JEU_PICK.id))
    erreurs.push({champ:'f_name', message:
      "Choisis le jeu dans la liste qui s'ouvre sous le nom."});
  // la note est sur 10 partout dans la page : 85 tapé pour 8,5 doit se
  // voir tout de suite, pas finir en 85/10 dans les stats sans un mot
  if(!sansFin && champInvalide('f_rating', toNum, 0, 10))
    erreurs.push({champ:'f_rating', message:'Note illisible — un nombre entre 0 et 10, par exemple 8.5.'});
  if(!sansFin && champInvalide('f_time', toHours))
    erreurs.push({champ:'f_time', message:'Temps de jeu incorrect.'});
  if(champInvalide('f_base', toNum))
    erreurs.push({champ:'f_base', message:'Prix de base incorrect.'});
  if(!$('f_wish').checked && champInvalide('f_paid', toNum))
    erreurs.push({champ:'f_paid', message:'Prix payé incorrect.'});
  return erreurs;
}
/* Rejoue le texte de l'avis dans le calque colore : une ligne qui commence
   par + passe en vert, par - en rouge, le reste garde la couleur normale.
   Le \n final garde la bonne hauteur quand le texte finit par un retour. */
function majAvis(){
  const ta = $('f_review'), hl = $('f_review_hl');
  if(!ta || !hl) return;
  hl.innerHTML = ta.value.split('\n').map(ligne=>{
    const t = ligne.trimStart();
    const cls = t.startsWith('+') ? 'plus' : (t.startsWith('-') ? 'minus' : '');
    return cls ? `<span class="${cls}">${esc(ligne)}</span>` : esc(ligne);
  }).join('\n') + '\n';
  hl.scrollTop = ta.scrollTop;
}
function openForm(g){
  EDIT = g || null;
  const host = $('form');
  host.innerHTML = formHTML(g);
  host.hidden = false;
  verrouFond();
  const bu = $('f_bucket');
  const enCours = !!(g && estEnCours(g));
  const wish    = !!(g && estWishlist(g));
  $('f_encours').checked = enCours;
  $('f_wish').checked = wish;
  // en ajout — et pour un jeu en cours ou convoité qu'on vient de terminer —
  // on propose toujours l'année la plus récente, pas l'onglet affiché
  const defaut = (g && !enCours && !wish) ? g.bucket : derniereAnnee();
  bu.value = ongletsExistants().indexOf(defaut) >= 0 ? defaut : '';
  /* Mois terminé : pré-rempli au mois courant, et modifiable comme avant.
     Seulement quand ça a un sens, c'est-à-dire pour un jeu qu'on termine
     maintenant — un ajout, ou un jeu en cours / convoité qu'on bascule en
     terminé. Modifier un ancien jeu sans mois n'y touche pas : proposer
     « août » pour une partie finie il y a trois ans écrirait une date
     fausse, et personne ne relit un champ déjà rempli.

     Le garde-fou sur l'année n'est pas décoratif : l'onglet proposé est le
     plus récent du journal, qui n'est pas forcément l'année en cours. Sur
     un journal resté à 2025, le mois d'aujourd'hui ne veut rien dire. */
  const maintenant = new Date();
  const termineMaintenant = !g || enCours || wish;
  const anneeCourante = bu.value === String(maintenant.getFullYear());
  $('f_month').value =
    (g && g.month) ? String(g.month)
    : (termineMaintenant && anneeCourante ? String(maintenant.getMonth() + 1) : '');
  syncStatut();
  $('f_encours').onchange = ()=>{
    if($('f_encours').checked) $('f_wish').checked = false;
    syncStatut();
  };
  $('f_wish').onchange = ()=>{
    if($('f_wish').checked) $('f_encours').checked = false;
    syncStatut();
  };
  host.querySelector('.form-x').onclick = closeForm;
  $('f_cancel').onclick = closeForm;
  $('f_ok').onclick = submitForm;
  const del = $('f_del');
  if(del) del.onclick = ()=>{
    if(del.classList.contains('armed')) return supprimerJeu(del);
    del.classList.add('armed');
    del.textContent = 'Confirmer la suppression';
    setTimeout(()=>{ if(del.isConnected){ del.classList.remove('armed'); del.textContent = 'Supprimer ce jeu'; } }, 5000);
  };
  const ta = $('f_review');
  ta.addEventListener('input', majAvis);
  ta.addEventListener('scroll', ()=>{ $('f_review_hl').scrollTop = ta.scrollTop; });
  majAvis();
  brancherAuto();          // complétion du nom depuis IGDB (voir plus bas)
  brancherBucket();        // liste des onglets existants pendant la frappe
  $('f_name').addEventListener('input', majDoublon);
  majDoublon();
  posePick(null);          // pose aussi le rappel « choisis une fiche »
  // un champ retouché n'est plus en faute : inutile de resoumettre pour
  // voir son entourage rouge partir
  CHAMPS_VALIDES.forEach(id=>{
    const champ = $(id);
    if(champ) champ.addEventListener('input', ()=> champErr(id, false));
  });
  $('f_name').focus();
}
function closeForm(){
  const host = $('form');
  if(host.hidden) return;
  // ce qui est encore en vol ne concerne plus personne : la liste, le prix
  // et la jaquette retenue partent avec le formulaire
  oublieAuto();
  host.hidden = true; host.innerHTML = '';
  EDIT = null;
  verrouFond();
}
fermeSurFond('form', closeForm);

function lireForm(){
  // en cours ou wishlist : note, mois et temps de jeu partent vides, quoi
  // qu'il reste dans les champs cachés — la ligne du classeur doit dire la
  // même chose que l'écran. Le prix payé subit le même sort en wishlist.
  const sansFin = statutCoche();
  const wish = $('f_wish').checked;
  const v = {
    name:     clean($('f_name').value),
    rating:   sansFin ? null : toNum($('f_rating').value),
    month:    sansFin ? null : toNum($('f_month').value),
    hours:    sansFin ? null : toHours($('f_time').value),
    base:     toNum($('f_base').value),
    paid:     wish ? null : toNum($('f_paid').value),
  };
  const rel = $('f_release');
  // si la date d'origine n'était pas lisible par le champ, on n'y touche pas
  if(rel.value || isoDate(rel.dataset.orig) || !rel.dataset.orig) v.release = rel.value || null;
  // absent si aucune fiche IGDB n'a été retenue cette fois : un jeu déjà
  // rattaché garde son rattachement, la clé n'est envoyée que pour en poser
  // un nouveau — c'est elle qui déclenche plateforme/développeur/genres
  // côté serveur (voir enrichit_igdb en Python).
  if(JEU_PICK && JEU_PICK.id) v.id_igdb = JEU_PICK.id;
  return v;   // ni support ni année : l'onglet suffit, et le Sheet garde ce qu'il a
}
/* Un onglet inexistant n'est plus un problème : il n'y a pas d'en-têtes à
   recopier, la période est un simple champ du jeu. Créer « En cours » revient
   à y ranger un premier jeu. */
function chargeUtile(){
  return {
    id: EDIT ? EDIT.id : null,          // null = ajout
    periode: cibleOnglet(),
    review: statutCoche() ? '' : clean($('f_review').value),
    values: lireForm(),
  };
}
async function submitForm(){
  const btn = $('f_ok'), texte = btn.textContent;
  razErreurs();
  const erreurs = validerFormulaire();
  if(erreurs.length){
    erreurs.forEach(er => champErr(er.champ, true));
    toast(erreurs[0].message, true);
    $(erreurs[0].champ).focus();
    return;
  }
  /* Un jeu du même nom existe déjà ailleurs dans le journal : bloqué une
     première fois — c'est l'ajout tapé deux fois par mégarde qu'on veut
     attraper — mais un second clic confirme que c'est voulu, pour ne pas
     empêcher un vrai replay. armé retombe si le nom change entre-temps
     (voir majDoublon), pour ne jamais confirmer le mauvais jeu. */
  const doublon = !EDIT && trouveDoublon($('f_name').value);
  if(doublon && !btn.classList.contains('armed')){
    champErr('f_name', true);
    btn.classList.add('armed');
    btn.textContent = 'Ajouter quand même ?';
    toast(`« ${doublon.name} » est déjà dans ton journal. Reclique pour l'ajouter quand même.`, true);
    setTimeout(()=>{
      if(btn.isConnected && btn.classList.contains('armed')){
        btn.classList.remove('armed'); btn.textContent = texte;
      }
    }, 5000);
    return;
  }
  const charge = chargeUtile();
  /* La jaquette retenue dans le formulaire, relevée avant l'envoi : closeForm()
     l'oublie, et le nom peut avoir été retouché depuis le choix — auquel cas
     elle ne vaut plus, on repart sur une recherche normale. */
  const retenue = (JEU_PICK && JEU_PICK.image
                   && norm(JEU_PICK.nom) === norm(charge.values.name)) ? JEU_PICK : null;
  btn.disabled = true; btn.textContent = 'Enregistrement...';
  try{
    const ajout = !charge.id;
    const data = ajout
      ? await envoyer('POST', '/api/journal/jeu', charge)
      : await envoyer('PUT', '/api/journal/jeu/' + charge.id, charge);
    cacheStore.set(source().url, data);
    applyData(data, true);
    // le jeu vient d'atterrir dans un autre onglet (En cours, une autre
    // année...) : on s'y place, sinon il disparaît sous les yeux
    if(S.bucket !== 'all' && S.bucket !== charge.periode && BUCKETS.indexOf(charge.periode) >= 0){
      S.bucket = charge.periode; S.range = null;
    }
    closeForm(); render();
    toast(ajout ? `« ${charge.values.name} » ajouté` : `« ${charge.values.name} » mis à jour`);
    /* Une jaquette désignée dans le formulaire l'emporte, même en
       modification : c'est un geste explicite, pas une récupération
       automatique. Sinon, et seulement à l'ajout, on cherche — modifier un
       jeu ne doit pas écraser une jaquette déposée à la main. */
    if(retenue) poseJaquetteChoisie(charge.values.name, retenue.image, charge.values.id_igdb);
    else if(ajout) jaquetteAuto(charge.values.name, charge.values.release, false, charge.values.id_igdb);
  }catch(e){
    toast(e.message, true);
    btn.disabled = false; btn.classList.remove('armed'); btn.textContent = texte;
  }
}
async function supprimerJeu(btn){
  if(!EDIT) return;
  const nom = EDIT.name, id = EDIT.id;
  btn.disabled = true; btn.textContent = 'Suppression...';
  try{
    const data = await envoyer('DELETE', '/api/journal/jeu/' + id);
    cacheStore.set(source().url, data);
    applyData(data, true); closeForm(); render();
    toast(`« ${nom} » retiré du journal`);
  }catch(e){
    toast(e.message, true);
    btn.disabled = false; btn.classList.remove('armed'); btn.textContent = 'Supprimer ce jeu';
  }
}
document.getElementById('addBtn').addEventListener('click', ()=> openForm(null));

/* =======================================================================
   Jaquette automatique — uniquement à l'ajout d'un jeu.
   C'est Flask qui va la chercher (jaquettes.py) : ni le navigateur ni
   Apps Script ne savent écrire dans static/Cover/. Rien n'atterrit sur le
   disque sans un clic : même quand une seule jaquette est trouvée, elle
   est montrée d'abord. Si la route n'existe pas — vieux serveur, page
   ouverte sans Flask — tout se tait et le jeu garde ses initiales.
   ======================================================================= */
async function api(chemin, corps){
  const r = await fetch(chemin, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(corps),
  });
  /* Le code de retour est accroché à l'erreur, pas seulement écrit dedans :
     un 503 (nginx qui limite le débit de /api/) et un câble débranché
     appellent deux réactions opposées, et seul l'appelant sait laquelle.
     Sans ce champ les deux se ressemblaient sous un même « serveur
     injoignable » — de quoi chercher la panne chez IGDB pendant des heures
     alors que le refus venait de nginx, trois couches plus tôt. */
  if(!r.ok){
    const err = new Error('http ' + r.status);
    err.statut = r.status;
    throw err;
  }
  return r.json();
}
/* Ce que le navigateur affichera d'un appel qui n'a pas abouti. Nommer qui
   a refusé, toujours : « injoignable » est le seul cas où personne n'a
   répondu, et c'est le seul qui mérite ce mot. */
function raisonReseau(e){
  const s = e && e.statut;
  if(s === 503 || s === 429) return 'trop de requêtes (limite de débit du serveur)';
  if(s) return `refus du serveur (HTTP ${s})`;
  return 'serveur injoignable';
}
/* nginx plafonne le débit de /api/ pour qu'un inconnu ne puisse pas griller
   le quota IGDB depuis internet. Or une mise à jour du classeur, c'est un
   appel par jeu à la file : elle tape dans ce plafond bien avant la fin.
   Un refus de débit n'est pas une panne, il dit « pas tout de suite » —
   alors on patiente et on redemande, plutôt que de faire tomber des
   centaines de jeux d'affilée pendant que tout va bien. */
const ATTENTE_DEBIT = [3000, 6000];
async function apiPatient(chemin, corps){
  for(let essai = 0; ; essai++){
    try{
      return await api(chemin, corps);
    }catch(e){
      if((e.statut === 503 || e.statut === 429) && essai < ATTENTE_DEBIT.length){
        await new Promise(reprend => setTimeout(reprend, ATTENTE_DEBIT[essai]));
        continue;
      }
      throw e;
    }
  }
}
/* la jaquette est arrivée : on la remet en jeu sous un nouveau numéro */
function poseJaquette(cle){
  const f = cle;
  /* le manifeste est tenu à jour sur place : redemander la liste entière
     pour une seule image serait un aller-retour de plus pour rien. La date
     posée ici n'est pas exactement celle du fichier, mais elle ne sert qu'à
     casser le cache — le prochain manifeste rétablira la vraie. */
  if(f){
    if(!JAQUETTES) JAQUETTES = {};
    JAQUETTES[f] = Date.now();
    retientManifeste();
  }
  renderWall();
  // la fiche ouverte montre la même jaquette en grand : elle aussi
  if(!$('sheet').hidden && S.open !== null) paintSheet();
}
/* `idIgdb` est celui du JEU tel qu'il est enregistré, pas celui de la fiche
   qu'IGDB va proposer : c'est lui qui décide du nom du fichier, et la page
   ira le chercher sous ce nom-là. Les faire diverger reviendrait à écrire
   une image que personne ne redemande jamais. */
async function jaquetteAuto(nom, sortie, force, idIgdb){
  const cle = idIgdb ? String(idIgdb) : slug(nom);
  let data;
  try{ data = await api('/api/jaquette',
    {nom: nom, sortie: sortie || '', force: !!force, id_igdb: idIgdb || null}); }
  catch(e){ return; }
  if(data.etat === 'telechargee'){ poseJaquette(cle); toast('Jaquette récupérée'); }
  else if(data.etat === 'deja-la'){ poseJaquette(cle); }
  else if(data.etat === 'choix'){ openJaq(nom, data.propositions || [], null, idIgdb); }
  else if(data.etat === 'introuvable'){ toast(`Aucune jaquette trouvée pour « ${nom} »`); }
  // le motif exact plutôt qu'un « ça n'a pas marché » : HTTP 403, certificat
  // SSL, délai dépassé... c'est la seule chose qui permette d'y remédier
  else if(data.etat === 'injoignable'){ toast('IGDB injoignable : ' + (data.raison || 'pas de réponse'), true); }
}

/* On montre toujours ce qui a été trouvé, même une seule jaquette : c'est
   le clic qui télécharge. Les aperçus viennent directement d'IGDB, donc
   refuser ne laisse rien derrière — il n'y a rien à supprimer. Quand
   plusieurs fiches portent le même nom, la plus probable (celle dont
   l'année colle à la date de sortie) est en tête, en doré. */
let JAQ_NOM = null, JAQ_SUITE = null, JAQ_IGDB = null;
function jaqHTML(nom, propositions, retenir, opts){
  opts = opts || {};
  /* La barre de recherche n'apparaît que pour désigner un jeu : le titre
     du classeur ne trouve pas toujours la bonne fiche — « Getting Over It »
     ne ramène rien, « Getting Over It with Bennett Foddy » tombe dessus du
     premier coup — et sans moyen de reformuler, ces cas-là resteraient
     impossibles à corriger. */
  const barre = opts.terme === undefined ? '' : `
      <div class="jaq-chercher">
        <input type="text" id="jaqTerme" value="${esc(opts.terme)}"
               placeholder="Chercher un autre titre..." autocomplete="off" spellcheck="false">
        <button type="button" class="ghost" id="jaqChercher">Chercher</button>
      </div>`;
  return `<div class="sheet jaq-sheet" role="dialog" aria-modal="true">
    <div class="sheet-tools">
      <span class="grp"><b class="fhead">${opts.titre ? esc(opts.titre) : `Jaquette de « ${esc(nom)} »`}</b></span>
      <span class="grp"><button class="sbtn jaq-x" aria-label="Fermer">×</button></span>
    </div>
    <div class="jaq-in">
      ${barre}
      <div class="jaq-grid">
        ${propositions.map((p,i)=>`
          <button class="jaq-item${p.suggere ? ' suggeree' : ''}" data-i="${i}" title="${esc(p.lien||'')}">
            <img src="${esc(p.apercu)}" alt="" loading="lazy" decoding="async">
            <b>${esc(p.titre)}</b>
            <span>${esc(p.date || 'date inconnue')}${p.nature ? ' · ' + esc(p.nature) : ''}</span>
          </button>`).join('')}
      </div>
      <div class="frow"><span class="spacer"></span>
        <button class="ghost jaq-non">${retenir ? 'Annuler' : "N'en télécharger aucune"}</button></div>
    </div>
  </div>`;
}
/* `suite` transforme la fenêtre en simple sélecteur : au lieu de télécharger,
   le clic rappelle cette fonction avec la fiche choisie. C'est ce que fait le
   formulaire, où le fichier ne peut pas encore être nommé — le nom du jeu
   n'est arrêté qu'à l'enregistrement. */
function openJaq(nom, propositions, suite, idIgdb, opts){
  opts = opts || {};
  if(!propositions.length && opts.terme === undefined) return;
  JAQ_NOM = nom;
  JAQ_IGDB = idIgdb || null;
  JAQ_SUITE = suite || null;
  const host = $('jaq');
  host.innerHTML = jaqHTML(nom, propositions, !!suite, opts);
  host.hidden = false;
  verrouFond();
  host.querySelector('.jaq-x').onclick = closeJaq;
  host.querySelector('.jaq-non').onclick = closeJaq;
  host.querySelectorAll('.jaq-item').forEach(b=>{
    b.onclick = ()=> choisirJaq(b, propositions[+b.dataset.i]);
  });
  const champ = $('jaqTerme');
  if(champ && opts.surRecherche){
    const relance = ()=>{
      const t = clean(champ.value);
      if(t) opts.surRecherche(t);
    };
    $('jaqChercher').onclick = relance;
    champ.addEventListener('keydown', e=>{
      if(e.key !== 'Enter') return;
      // la fenêtre ne doit pas se refermer sur un Entrée de recherche
      e.preventDefault(); e.stopPropagation();
      relance();
    });
    champ.focus();
    champ.select();
  }
}
function closeJaq(){
  const host = $('jaq');
  if(host.hidden) return;
  host.hidden = true; host.innerHTML = '';
  JAQ_NOM = null; JAQ_SUITE = null; JAQ_IGDB = null;
  verrouFond();
}
async function choisirJaq(btn, choix){
  const nom = JAQ_NOM, idIgdb = JAQ_IGDB;
  // mode sélecteur : on rend la main au formulaire, rien ne part sur le disque
  if(JAQ_SUITE){
    const suite = JAQ_SUITE;
    closeJaq();
    suite(choix);
    return;
  }
  const host = $('jaq');
  host.querySelectorAll('.jaq-item').forEach(b=>{ b.disabled = true; });
  btn.classList.add('pris');
  let data;
  try{ data = await api('/api/jaquette/choisir',
    {nom: nom, image: choix.image, id_igdb: idIgdb || null}); }
  catch(e){ data = null; }
  if(data && data.etat === 'telechargee'){
    closeJaq(); poseJaquette(idIgdb ? String(idIgdb) : slug(nom)); toast('Jaquette enregistrée');
  }else{
    closeJaq();
    toast('Téléchargement impossible' + (data && data.raison ? ' — ' + data.raison : ''), true);
  }
}
fermeSurFond('jaq', closeJaq);

/* La jaquette désignée dans le formulaire : elle part sur le disque
   maintenant que le jeu existe et que son nom est arrêté. */
async function poseJaquetteChoisie(nom, image, idIgdb){
  let data;
  try{ data = await api('/api/jaquette/choisir',
    {nom: nom, image: image, id_igdb: idIgdb || null}); }
  catch(e){ return; }
  if(data.etat === 'telechargee'){
    poseJaquette(idIgdb ? String(idIgdb) : slug(nom)); toast('Jaquette enregistrée'); }
  else toast('Téléchargement impossible' + (data.raison ? ' — ' + data.raison : ''), true);
}

/* =======================================================================
   Complétion du nom depuis IGDB

   Le champ « Nom du jeu » interroge Flask pendant la frappe : IGDB renvoie
   les fiches qui collent, avec leur date de sortie et leur jaquette. Un clic
   remplit la date, va chercher le prix de base et retient la jaquette — qui
   ne part sur le disque qu'à l'enregistrement, pas avant, parce que son nom
   de fichier dépend d'un champ qu'on peut encore retoucher.

   Le prix ne vient pas d'IGDB, qui n'en publie aucun : IGDB donne le lien
   vers la fiche Steam, et c'est Steam qui répond son prix fort en euros. Un
   jeu absent de Steam — exclusivité Nintendo, PlayStation, jeu physique —
   laisse donc la case vide. C'est voulu : rien n'est deviné.

   Deux règles pour ne jamais écraser une saisie : un champ rempli à la main
   ne bouge plus (data-auto le distingue d'un champ rempli par une fiche), et
   toute réponse arrivée après un changement de fiche est jetée — la frappe
   est plus rapide que le réseau, l'inverse serait une loterie.
   ======================================================================= */
const AC = { minuteur:0, jeton:0, jetonPrix:0, jeux:[], i:-1 };
let JEU_PICK = null;   // la fiche IGDB retenue : {nom, titre, image, apercu...}

function oublieAuto(){
  clearTimeout(AC.minuteur);
  AC.jeton++; AC.jetonPrix++;      // ce qui répondra après nous ne sert plus
  AC.jeux = []; AC.i = -1;
  JEU_PICK = null;
}

/* ---------- la liste déroulante ---------- */
function acFerme(){
  const b = $('f_ac'), champ = $('f_name');
  AC.jeux = []; AC.i = -1;
  if(b){ b.hidden = true; b.innerHTML = ''; }
  if(champ) champ.setAttribute('aria-expanded', 'false');
}
function acHTML(jeux){
  return jeux.map((j,i)=>`
    <button type="button" class="ac-item" role="option" aria-selected="false" data-i="${i}">
      ${j.apercu
        ? `<img src="${esc(j.apercu)}" alt="" loading="lazy" decoding="async">`
        : '<span class="ac-vide"></span>'}
      <span class="ac-txt">
        <b>${esc(j.titre)}</b>
        <i>${esc(j.date || 'date inconnue')}${j.nature ? ' · ' + esc(j.nature) : ''}</i>
      </span>
    </button>`).join('');
}
function acOuvre(jeux){
  const b = $('f_ac');
  if(!b) return;
  if(!jeux.length){ acFerme(); return; }
  AC.jeux = jeux; AC.i = -1;
  b.innerHTML = acHTML(jeux);
  b.hidden = false;
  $('f_name').setAttribute('aria-expanded', 'true');
  b.querySelectorAll('.ac-item').forEach(el=>{
    /* mousedown et pas click : sinon le champ perd le focus en premier, la
       liste se referme, et le clic atterrit dans le vide */
    el.addEventListener('mousedown', e=>{ e.preventDefault(); acChoisir(+el.dataset.i); });
  });
}
function acBouge(pas){
  const b = $('f_ac');
  if(!b || b.hidden || !AC.jeux.length) return;
  const n = AC.jeux.length;
  AC.i = AC.i < 0 ? (pas > 0 ? 0 : n - 1) : (AC.i + pas + n) % n;
  b.querySelectorAll('.ac-item').forEach((el,k)=>{
    const on = k === AC.i;
    el.classList.toggle('on', on);
    el.setAttribute('aria-selected', on ? 'true' : 'false');
    if(on) el.scrollIntoView({block:'nearest'});
  });
}
async function acCherche(texte){
  const jeton = ++AC.jeton;
  let data;
  // pas de Flask (page ouverte sans serveur, vieille version) : le champ
  // reste un champ, personne n'est prévenu de rien
  try{ data = await api('/api/jeu/suggestions', {nom: texte}); }
  catch(e){ return; }
  if(jeton !== AC.jeton || !$('f_ac')) return;   // une frappe est passée devant
  if(data.etat === 'ok') acOuvre(data.jeux || []);
  else acFerme();
}
function acFrappe(){
  const champ = $('f_name');
  const texte = clean(champ.value);
  // le nom ne correspond plus à la fiche choisie : sa jaquette non plus
  if(JEU_PICK && norm(texte) !== norm(JEU_PICK.nom)) posePick(null);
  clearTimeout(AC.minuteur);
  AC.jeton++;
  // deux lettres minimum, et un temps de répit : une recherche par caractère
  // ferait huit allers-retours pour « Hollow K »
  if(texte.length < 2){ acFerme(); return; }
  AC.minuteur = setTimeout(()=> acCherche(texte), 250);
}
function acTouche(e){
  const b = $('f_ac');
  const ouvert = b && !b.hidden && AC.jeux.length;
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    if(!ouvert) return;
    e.preventDefault(); acBouge(e.key === 'ArrowDown' ? 1 : -1);
  }else if(e.key === 'Enter'){
    if(!ouvert || AC.i < 0) return;
    e.preventDefault(); acChoisir(AC.i);
  }else if(e.key === 'Escape'){
    if(!ouvert) return;
    // la liste se referme, le formulaire reste ouvert : stopPropagation
    // empêche le gestionnaire global de prendre Échap pour lui
    e.preventDefault(); e.stopPropagation(); acFerme();
  }
}

/* ---------- la fiche retenue et son aperçu ---------- */
function posePick(fiche){
  JEU_PICK = fiche;
  const b = $('f_pick');
  if(!b) return;
  /* Le rappel ne s'affiche qu'à l'ajout : les jeux entrés avant cette règle
     n'ont pas de fiche et doivent rester modifiables sans qu'on leur en
     réclame une à chaque ouverture. */
  const vide = $('f_pickvide');
  if(vide) vide.hidden = !!EDIT || !!(fiche && fiche.id);
  if(!fiche || !fiche.image){ b.hidden = true; return; }
  $('f_pickimg').src = fiche.apercu;
  $('f_pickt').textContent = fiche.titre;
  $('f_pickd').textContent = (fiche.date || 'date inconnue')
    + (fiche.nature ? ' · ' + fiche.nature : '');
  b.hidden = false;
}
/* Un champ rempli par une fiche peut être remplacé par la fiche suivante.
   Un champ rempli à la main, jamais : c'est ce que dit data-auto. */
function acRemplit(champ, valeur){
  if(!champ || !valeur) return;
  if(champ.value && champ.dataset.auto !== '1') return;
  champ.value = valeur;
  champ.dataset.auto = '1';
}
async function acChoisir(i){
  const j = AC.jeux[i];
  if(!j) return;
  acFerme();
  const champ = $('f_name');
  champ.value = j.titre;
  posePick(Object.assign({}, j, {nom: j.titre}));
  acRemplit($('f_release'), j.iso);
  champ.focus();
  acPrix(j);
}
/* `force` : le prix est réécrit même s'il a été saisi à la main. Réservé au
   choix explicite d'une jaquette — voir alignePick(). Renvoie true si la case
   a effectivement changé de valeur, pour que l'appelant sache quoi annoncer. */
async function acPrix(j, force){
  const cible = $('f_base');
  if(!cible || !j.id) return false;
  // un prix saisi ne s'écrase pas
  if(!force && cible.value && cible.dataset.auto !== '1') return false;
  const jeton = ++AC.jetonPrix;
  cible.classList.add('cherche');
  let data;
  try{ data = await api('/api/jeu/prix', {id: j.id}); }
  catch(e){ data = null; }
  // une autre fiche a été choisie depuis, ou le formulaire s'est fermé
  if(jeton !== AC.jetonPrix || $('f_base') !== cible) return false;
  cible.classList.remove('cherche');
  if(data && data.etat === 'ok' && data.prix !== null && data.prix !== undefined){
    const txt = numText(data.prix);
    const change = cible.value !== txt;
    cible.value = txt;
    cible.dataset.auto = '1';

    /* Le prix payé, proposé au moment où l'achat a lieu : à l'ajout d'un
       jeu, ou quand on sort de la wishlist un jeu qu'on vient d'acheter.
       Jamais sur un vieux jeu qu'on retouche — ce que Steam demande
       aujourd'hui n'a rien à voir avec ce qu'on a déboursé il y a trois
       ans, et une somme fausse est pire qu'une case vide.

       C'est « actuel » et non « prix » : promotion comprise, c'est ce
       qu'on paie réellement. Et posé par acRemplit(), donc jamais en
       force, même quand on vient de choisir une jaquette explicitement —
       un montant saisi à la main ne se devine pas. */
    if((!EDIT || estWishlist(EDIT)) && data.actuel !== null && data.actuel !== undefined){
      acRemplit($('f_paid'), numText(data.actuel));
    }
    return change;
  }
  // « inconnu » n'est pas une erreur : le jeu n'est pas sur Steam, la case
  // reste vide et se remplit à la main. Pas de toast pour si peu.
  return false;
}

/* Aligner la date et le prix sur la fiche dont on vient de choisir la
   jaquette. Deux écarts avec la liste déroulante du nom, assumés :

     - on écrase même une valeur saisie à la main. Cliquer une jaquette
       précise est un geste délibéré, et surtout, en modification, les champs
       viennent du classeur : aucun ne porte data-auto, donc la règle
       habituelle ne laisserait jamais rien changer.
     - une valeur absente chez IGDB ne vide rien. Un jeu hors Steam n'a pas
       de prix à donner : ce n'est pas une raison pour effacer le tien.

   Le toast est là parce qu'on vient d'écraser une saisie : il faut le voir. */
async function alignePick(p){
  const champ = $('f_release');
  const change = [];
  if(champ && p.iso && champ.value !== p.iso){
    champ.value = p.iso;
    champ.dataset.auto = '1';
    change.push('date');
  }
  if(await acPrix(p, true)) change.push('prix');
  if(!change.length) return;
  toast(change.length === 2
    ? 'Date et prix alignés sur la fiche choisie'
    : (change[0] === 'date' ? 'Date de sortie alignée sur la fiche choisie'
                            : 'Prix aligné sur la fiche choisie'));
}

/* ---------- changer la jaquette retenue ---------- */
async function changerPick(){
  const nom = clean($('f_name').value);
  if(!nom) return;
  const b = $('f_pick');
  b.classList.add('busy');
  let data;
  // force : le fichier existe peut-être déjà, on veut quand même la liste
  try{ data = await api('/api/jaquette', {nom: nom, sortie: $('f_release').value || '', force: true}); }
  catch(e){ data = null; }
  b.classList.remove('busy');
  if(!data) return;
  if(data.etat === 'choix'){
    openJaq(nom, data.propositions || [], p=>{
      /* la fiche choisie remplace l'ancienne en entier, id et date compris :
         « Resident Evil 4 » de 2005 et celui de 2023 ne partagent que le
         titre, et c'est justement la jaquette qui les distingue */
      posePick({nom: nom, titre: p.titre, date: p.date, nature: p.nature,
                image: p.image, apercu: p.apercu, iso: p.iso,
                id: p.id, lien: p.lien});
      alignePick(p);
    });
  }
  else if(data.etat === 'introuvable'){ toast(`Aucune jaquette trouvée pour « ${nom} »`); }
  else if(data.etat === 'injoignable'){ toast('IGDB injoignable : ' + (data.raison || 'pas de réponse'), true); }
}

function brancherAuto(){
  const champ = $('f_name');
  if(!champ) return;
  champ.addEventListener('input', acFrappe);
  champ.addEventListener('keydown', acTouche);
  champ.addEventListener('blur', ()=> setTimeout(acFerme, 0));
  const pick = $('f_pick');
  if(pick) pick.onclick = changerPick;
  const vide = $('f_pickvide');
  if(vide) vide.onclick = ()=>{
    // changerPick se tait quand le nom est vide : ici il faut le dire,
    // sinon le clic n'a l'air de rien faire
    if(!clean($('f_name').value)){
      toast("Tape d'abord le nom du jeu.", true);
      $('f_name').focus();
      return;
    }
    changerPick();
  };
  // une valeur retapée à la main n'est plus « remplie automatiquement » :
  // la fiche suivante ne doit pas passer par-dessus. f_release n'y est pas :
  // lui n'accepte plus la frappe (readonly), donc data-auto ne s'y efface
  // jamais autrement qu'en choisissant une autre fiche.
  ['f_base'].forEach(id=>{
    const ch = $(id);
    if(ch) ch.addEventListener('input', ()=>{ ch.dataset.auto = ''; });
  });
}

/* =======================================================================
   Export du journal
   Tout est déjà en mémoire (GAMES) : pas de requête, juste mettre en
   forme et déclencher un téléchargement. Disponible pour n'importe quel
   journal affiché, comme le bilan en image — c'est déjà ce qu'on regarde,
   pas besoin d'en être le propriétaire pour en garder une copie.
   Nom et catégorie partent toujours ; le reste se choisit dans la fenêtre.
   ======================================================================= */
function telecharge(contenu, type, nom){
  const blob = new Blob([contenu], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nom; a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  // laisse le temps au téléchargement de démarrer avant de libérer l'URL
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}
const CHAMPS_EXPORT = [

function lancerExport(){
  const host = $('export');
  const format = host.querySelector('.export-format-btn.on').dataset.format;
  const categories = new Set(Array.from(host.querySelectorAll('#exportCategories input:checked'))
    .map(c => c.value));

function exporteJSON(jeux, champs){
  const colonnes = ['id','bucket','name', ...champs];
  const sortie = jeux.map(g => {
    const o = {};
    colonnes.forEach(c => { o[c] = g[c]; });
    return o;
  });
  const nom = (source() && source().nom) || 'journal';
  telecharge(JSON.stringify(sortie, null, 2), 'application/json',
             `journal-${slug(nom) || 'jeux'}.json`);
}
/* Une valeur par cellule CSV : guillemets doublés, et la cellule entière
   entre guillemets dès qu'elle contient une virgule, un guillemet ou un
   retour à la ligne — l'avis tient sur plusieurs lignes, entre autres. */
function celluleCSV(v){
  if(v === null || v === undefined) return '';
  const s = String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
const LIBELLES_EXPORT = {bucket:'onglet', name:'nom', rating:'note', month:'mois',
  hours:'heures', base:'prix_base', paid:'prix_payé', release:'sortie', review:'avis'};
function exporteCSV(jeux, champs){
  const colonnes = ['bucket','name', ...champs];
  const entetes = colonnes.map(c => LIBELLES_EXPORT[c] || c);
  const lignes = jeux.map(g => colonnes.map(c =>
    celluleCSV(c === 'review' ? g.review.join('\n') : g[c])).join(','));
  // BOM UTF-8 : sans lui, Excel lit les accents de travers en ouvrant le fichier
  const csv = '\uFEFF' + entetes.join(',') + '\n' + lignes.join('\n');
  const nom = (source() && source().nom) || 'journal';
  telecharge(csv, 'text/csv;charset=utf-8', `journal-${slug(nom) || 'jeux'}.csv`);
}

/* =======================================================================
   Voir plus d'informations
   Plateforme/d\u00E9veloppeur/genres viennent du classeur (d\u00E9j\u00E0 en base) ; le

   jeu \u00E0 l'autre : voir /api/journal/jeu/<id>/detail c\u00F4t\u00E9 Flask.
   ======================================================================= */
let DETAIL_JETON = 0;

function detailHTML(g){
  return `<div class="sheet detail-sheet" role="dialog" aria-modal="true"
      aria-label="Plus d'informations sur ${esc(g.name)}">

async function ouvrirDetail(g){
  const host = $('detail');
  host.innerHTML = detailHTML(g);

/* Un fait par ligne, comme .facts sur la fiche elle-m\u00EAme \u2014 sauf que la
   valeur peut ici tenir sur plusieurs lignes (une longue liste de
   plateformes), d'o\u00F9 une classe \u00E0 soi plut\u00F4t que la r\u00E9utiliser telle

function detailFaitHTML(u, b){

function peintDetail(data, g){
  const zone = document.querySelector('#detail .detail-in');
  if(!zone) return;
  if(!data.ok){
    zone.innerHTML = `<p class="detail-etat">Informations injoignables : ${
      esc(data.message || 'pas de r\u00E9ponse')}</p>`;
    return;
  }
  const hltb = data.hltb || null;
  const rien = !data.plateforme && !data.developpeur && !data.genres && !data.description
    && !(data.images || []).length && !data.trailer && !hltb
    && (data.note_critique === null || data.note_critique === undefined);
  if(rien){
    zone.innerHTML = `<p class="detail-etat">Aucune information trouv\u00E9e pour ce jeu.</p>`;
    return;
  }

  const faits = [
    data.plateforme  ? detailFaitHTML('Plateformes',  data.plateforme)  : '',
    data.developpeur ? detailFaitHTML('D\u00E9veloppeur',  data.developpeur) : '',
    data.genres      ? detailFaitHTML('Genres',       data.genres)      : '',
    (data.note_critique !== null && data.note_critique !== undefined)
      ? detailFaitHTML('Note critique', `${data.note_critique} / 100`) : '',
  ].join('');

  const temps = hltb ? [
    detailTempsHTML('Histoire',           hltb.histoire),
    detailTempsHTML('Histoire + annexes', hltb.extra),
    detailTempsHTML('Complet',            hltb.complet),
  ].join('') : '';

  const media = data.trailer
    ? `<div class="detail-media"><iframe src="${esc(data.trailer)}"
        title="Bande-annonce" loading="lazy" allow="encrypted-media" allowfullscreen></iframe></div>`
    : '';
  /* Chaque vignette porte l'adresse de sa version large : c'est le serveur
     qui compose les deux tailles (voir detail_complet), la page n'a pas à
     connaître la façon dont IGDB nomme ses images. */
  const galerie = (data.images || []).length
    ? `<div class="detail-galerie">${data.images.map((im, i) =>
        `<img src="${esc(im.apercu)}" data-grande="${esc(im.grande)}" data-i="${i}"
           alt="Capture ${i + 1}" loading="lazy">`).join('')}</div>`
    : '';

  /* Les liens de recherche ne vivent plus sur la fiche elle-même : ils
     n'ont d'intérêt qu'ici, où l'on est justement venu chercher plus. Celui
     de HowLongToBeat pointe sur la fiche exacte quand on l'a trouvée,
     plutôt que sur une recherche à refaire à la main. */
  const cherche = encodeURIComponent(g.name);
  const liens = [
    `<a href="https://www.google.com/search?q=${cherche}+jeu" target="_blank" rel="noopener">Chercher sur le web</a>`,
    data.lien ? `<a href="${esc(data.lien)}" target="_blank" rel="noopener">IGDB</a>` : '',
    data.steam ? `<a href="${esc(data.steam)}" target="_blank" rel="noopener">Steam</a>` : '',
    `<a href="${hltb && hltb.lien ? esc(hltb.lien) : `https://howlongtobeat.com/?q=${cherche}`}"
       target="_blank" rel="noopener">HowLongToBeat</a>`,
  ].filter(Boolean).join('');

  zone.innerHTML = `
    ${media}
    ${data.description ? `<p class="detail-desc">${esc(data.description)}</p>` : ''}
    ${faits ? `<div class="detail-faits">${faits}</div>` : ''}
    ${temps ? `<div class="detail-temps-grid"><u>Temps pour finir <span class="detail-source">HowLongToBeat</span></u>
      <div class="detail-temps-row">${temps}</div></div>` : ''}
    ${galerie}
    <div class="links">${liens}</div>`;

  // les captures s'ouvrent en grand : la bande ne sert qu'à choisir laquelle
  const vues = (data.images || []).map(im => im.grande);
  zone.querySelectorAll('.detail-galerie img').forEach(img=>{
    img.onclick = ()=> ouvrirZoom(vues, +img.dataset.i);
  });
