<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feed - Jeux Vidéos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Eczar:wght@500;600;700;800&family=Azeret+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- La feuille de l'Archive, et pas celle d'Abyss : le Social est une salle
     de l'Archive, pas un projet à part. Tout ce qu'une carte affiche - la
     note en couleur, la jaquette, les « + » et les « − » d'un avis - vient
     de là et doit se lire exactement pareil ici. -->
<link rel="stylesheet" href="/static/archive/archive.css">
<link rel="stylesheet" href="/static/archive/social.css">
</head>
<body>
<!-- la neige d'Abyss, derriere tout : voir #neige dans archive.css -->
<canvas id="neige" aria-hidden="true"></canvas>

<header class="top">
  <div class="wrap top-in">
    <!-- Le même en-tête que le journal, aux deux mêmes bouts et dans le même
         ordre : « Retour à Abyss » dehors à gauche, « Suggestion / Bug »
         dehors à droite, et entre les deux ma pastille d'identité, le titre
         et la cloche.
         Le fil est une salle de l'Archive, pas un autre site - on doit
         pouvoir passer de l'une à l'autre sans chercher où sont partis les
         boutons.

         Une seule chose manque par rapport au journal : les deux pastilles
         posées à côté du titre. « Feed » mène ici, et on y est ; et
         « Rechercher un journal » est restée là-bas, avec sa fenêtre. -->
    <a class="entete-action" id="abyssBtn" href="/abyss">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span>Retour à Abyss</span>
    </a>
    <!-- Moi, comme sur le journal, et avec le même menu dessous : « Mon
         journal », « Communauté », et les deux recherches. C'est la seule
         porte de navigation des deux pages, elle doit s'ouvrir pareil des
         deux côtés.

         Ce qui change ici : les deux entrées « Rechercher... » sont de
         vrais liens vers /archive?recherche=..., parce que la fenêtre de
         recherche vit là-bas, avec les journaux qu'elle fouille. Sur le
         journal, elles s'ouvrent sur place. Même liste, même mots, un
         chemin de plus ici - voir monteMenuMoi dans archive-social.js.

         Pas de déclencheur de repli pour qui n'est pas connecté : cette
         page-ci porte son titre en grand juste dessous, et la barre n'a donc
         pas besoin qu'on lui rappelle le nom du site. -->
    <div class="moi-wrap">
      <a class="brand-moi moi-declencheur" id="moiBtn" hidden href="/archive"
         aria-haspopup="true" aria-expanded="false">
        <span class="brand-moi-ava" id="moiAva"></span>
        <b id="moiNom"></b>
        <svg class="moi-chev" width="10" height="10" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="3" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </a>
    </div>
    <!-- Ni titre ni pastille ici. La page porte son titre en grand juste
         dessous, et la recherche est repartie d'où elle vient : la fenêtre
         fouille des journaux, elle vit dans la page des journaux, et son
         bouton est maintenant dans l'en-tête de celle-ci. Elle était ici
         par accident d'histoire - le fil avait pris la place de l'ancien
         bouton « Rechercher », alors la recherche avait pris la sienne -
         et il fallait donc venir sur le fil pour chercher un journal, puis
         en repartir aussitôt. -->
    <!-- La place des onglets du journal, laissée vide : elle pousse la
         cloche à droite comme là-bas, pour que la barre garde les mêmes
         appuis d'une page à l'autre. Un fil n'a pas d'années. -->
    <span class="soc-barre-vide"></span>
    <!-- La cloche, à la place qu'elle occupe sur le journal. Pas d'engrenage
         à côté : son menu ne parle que du classeur - statistiques, export,
         mode éditeur - et aucune de ces lignes n'a de sens ici. -->
    <div class="cloche-wrap">
      <button class="cloche" id="cloche" hidden aria-haspopup="true"
              aria-expanded="false" aria-label="Notifications">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.2 7.5-2.2 7.5h16.4S18 14.5 18 8.5z"/>
          <path d="M13.7 20a2 2 0 0 1-3.4 0"/>
        </svg>
      </button>
    </div>
    <a class="entete-action" id="suggBtn" href="/abyss?suggestion=jeux-videos">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.2A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>
      </svg>
      <span>Suggestion / Bug</span>
    </a>
  </div>
</header>

<main>
  <section class="wrap soc-colonne">
    <!-- Le titre de la page, et il n'est qu'ici : la barre du haut n'écrit
         plus « Social » - un mot qui nommait la salle sans dire ce qu'on y
         trouve. Celui-ci le dit, et assez gros pour qu'on le lise avant la
         première carte. -->
    <h1 class="soc-titre">Feed des jeux terminés</h1>
    <!-- Le fil d'une seule personne. Le bouton montre qui l'on regarde,
         dessiné comme une ligne de la recherche de journal - photo, pseudo,
         bannière en fond - et le panneau dessous liste tout le monde de la
         même façon (voir journalLigne dans archive-recherche.js). Rempli
         par l'annuaire des journaux publics : voir remplisDe plus bas.
         « Tout le monde » est le fil entier, et le seul qui compte comme lu
         pour la pastille. -->
    <div class="soc-filtre" id="feedDeWrap">
      <button type="button" class="rsearch-item soc-de" id="feedDe"
              aria-haspopup="menu" aria-expanded="false"
              aria-label="Afficher le fil de"></button>
      <div class="menu soc-de-menu" id="feedDeMenu" role="menu" hidden></div>
    </div>

    <div class="soc-liste" id="feed"></div>
    <p class="soc-muet soc-vide" id="feedEtat">Chargement du fil…</p>
    <!-- « Voir plus » et non un défilement infini : le fil a une fin, et on
         doit pouvoir la sentir. Une page qui repousse son bas indéfiniment
         ne se quitte jamais franchement. -->
    <p class="soc-plus" id="feedPlusZone" hidden>
      <button type="button" class="cta" id="feedPlus">Voir plus</button>
    </p>
  </section>
</main>

<!-- Les fenêtres que cette page peut ouvrir. Vides dans le balisage : leur
     contenu est monté au moment où on les ouvre.
     « recherche » est celle des deux entrées « Rechercher... » du menu
     d'identité : elles s'ouvrent ici, sur le fil, plutôt que de renvoyer
     sur le journal pour s'y ouvrir - on ne change pas de page pour ouvrir
     une fenêtre. « detail », « studio » et « zoom » sont la fiche d'un
     jeu, les jeux de son développeur et l'agrandissement d'une de ses
     captures, comme sur le journal. -->
<div class="sheet-back" id="recherche" hidden></div>
<div class="sheet-back" id="detail" hidden></div>
<div class="sheet-back" id="studio" hidden></div>
<div class="sheet-back" id="zoom" hidden></div>
<div class="toast" id="toast" hidden></div>

<!-- Les gestes du doigt : la feuille d'une discussion se repousse vers le
     bas, comme toutes les fenêtres de l'Archive. -->
<script src="/static/commun/gestes.js"></script>
<!-- Les zones de texte grandissent en écrivant plutôt que de porter une
     poignée à tirer : une taille de départ, la hauteur du texte ensuite,
     et le défilement dans le champ passé un plafond. Voir
     static/commun/champs.js -- il n'y a rien à brancher, le fichier suffit. -->
<!-- Le canal du hub, monté pour le Yu-Gi-Quiz et partagé avec le Social :
     un jeu terminé apparaît dans le fil et la pastille de la cloche bouge
     sans qu'on recharge. La même version que le lobby du quiz - c'est le
     même serveur en face. Son absence ne casse rien : voir socialTempsReel
     dans archive-social.js. -->
<script src="/static/commun/vendor/socket.io-4.1.2.min.js"></script>
<script src="/static/commun/champs.js"></script>
<script src="/static/commun/suggestion.js"></script>
<!-- Deux fichiers seulement, et c'est tout l'intérêt du découpage de
     l'Archive : archive-noyau.js ne connaît ni classeur ni mur - formats,
     couleur d'une note, manifeste des jaquettes - et archive-social.js
     n'a besoin de rien d'autre. Le journal, lui, charge les onze. -->
<script src="/static/archive/archive-noyau.js"></script>
<!-- La recherche, la même qu'ailleurs : la fenêtre est identique au pixel
     près, ce qu'un résultat déclenche arrive en paramètre (voir
     regleRecherche plus bas). Le fichier porte en plus le dessin d'une
     ligne de résultat IGDB (acHTML) et la teinte d'un avatar sans photo
     (teinteAvatar), dont le fil se sert ailleurs.
     archive-export.js vient pour la fiche d'un jeu - son export à lui ne
     s'active pas ici, faute de bouton (voir la fin du fichier). -->
<script src="/static/archive/archive-recherche.js"></script>
<script src="/static/archive/archive-export.js"></script>
<script src="/static/archive/archive-social.js"></script>
<!-- la couleur du profil : le fil prend la mienne -->
<script src="/static/archive/archive-couleur.js"></script>
<script>
/* =======================================================================
   La page Social - le fil, et rien d'autre.

   Tout ce qui se dessine ici vient de archive-social.js, qui sert aussi la
   page du journal : une carte, une discussion et la cloche doivent être les
   mêmes des deux côtés. Ce qui suit ne fait que trois choses - demander le
   fil, l'empiler, et brancher les clics.
   ======================================================================= */
/* Le bandeau d'information, celui de l'Archive : archive-social.js le
   cherche sous ce nom (voir socialMot) et s'en sert pour dire pourquoi un
   envoi n'est pas parti. Il vit dans archive-formulaire.js, que cette
   page-ci ne charge pas - d'où cette copie, la même à la ligne près. */
function toast(txt, mauvais){
  const t = document.getElementById('toast');
  t.textContent = txt;
  t.className = 'toast show' + (mauvais ? ' bad' : '');
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.classList.remove('show'); }, 3000);
}

const feed = document.getElementById('feed');
const etat = document.getElementById('feedEtat');
const plusZone = document.getElementById('feedPlusZone');
const plus = document.getElementById('feedPlus');
const deBtn = document.getElementById('feedDe');
const deMenu = document.getElementById('feedDeMenu');

/* La barre du haut sans fond ni trait tant qu'on est tout en haut, comme
   sur le journal (voir body.en-haut dans archive.css). Le journal le pose
   dans archive-demarrage.js, que cette page ne charge pas. */
function majEnHaut(){
  document.body.classList.toggle('en-haut', window.scrollY < 8);
}
window.addEventListener('scroll', majEnHaut, {passive: true});
majEnHaut();

/* Le curseur de la page suivante : l'identifiant de la dernière carte
   reçue. Le serveur renvoie `suite: null` quand il n'y a plus rien
   derrière, ce qui fait disparaître le bouton - voir fil() dans social.py. */
let SUITE = null;
let ENCOURS = false;
/* Le premier lot est passé : les suivants descendent dans le passé et ne
   déplacent plus le repère de ce qu'on a vu. */
let SUITE_DEJA = false;
/* Le fil d'une seule personne, par son pseudo ; vide pour tout le monde.
   Pris dans l'adresse (?de=) pour qu'on puisse la copier et la donner, et
   pour qu'un rechargement garde le choix. */
let DE = new URLSearchParams(location.search).get('de') || '';
/* Change à chaque changement de personne : un lot qui revient après coup
   appartient à l'ancien fil et ne doit pas se poser dans le nouveau. */
let TOUR = 0;

function mot(txt){
  etat.textContent = txt;
  etat.hidden = !txt;
}
function motVide(){
  return DE ? DE + " n'a encore terminé aucun jeu dans un journal public."
            : "Personne n'a encore terminé de jeu dans un journal public.";
}
function deCettePersonne(post){
  return !DE || (post.pseudo || '').toLowerCase() === DE.toLowerCase();
}

async function chargeFil(){
  if(ENCOURS) return;
  ENCOURS = true;
  plus.disabled = true;
  const tour = TOUR;
  try{
    const q = new URLSearchParams();
    if(DE) q.set('de', DE);
    if(SUITE) q.set('avant', SUITE);
    const data = await socialAppel('/api/social/feed'
      + (q.toString() ? '?' + q : ''));
    if(tour !== TOUR) return;
    const posts = data.posts || [];
    /* insertAdjacentHTML et non innerHTML += : réécrire tout le fil à
       chaque « Voir plus » recréerait les cartes déjà lues, donc
       relancerait leurs jaquettes et perdrait la position de lecture. */
    feed.insertAdjacentHTML('beforeend',
      posts.map(p => socialCarteHTML(p, true)).join(''));
    SUITE = data.suite;
    plusZone.hidden = !SUITE;
    /* Le fil est lu jusqu'à sa première carte : la pastille du bouton
       « Communauté » s'éteint, et c'est d'ici que repartira le compte à la
       prochaine visite du journal. Seulement sur le premier lot - « Voir
       plus » descend dans le passé, il n'apprend rien de nouveau.
       Et seulement sur le fil entier : celui d'une seule personne ne dit
       rien des jeux que les autres ont terminés entre-temps.
       Voir feedLu dans archive-social.js. */
    if(!SUITE_DEJA && !DE && posts.length) feedLu(posts[0].id);
    SUITE_DEJA = true;
    mot(feed.children.length ? '' : motVide());
  }catch(e){
    if(tour !== TOUR) return;
    mot(e.message || 'Le fil n\'a pas pu être chargé.');
    plusZone.hidden = true;
  }finally{
    if(tour === TOUR){
      ENCOURS = false;
      plus.disabled = false;
    }
  }
}

/* Une autre personne choisie : le fil repart de sa tête. */
function changeDe(pseudo){
  DE = pseudo || '';
  dessineDe();
  TOUR++;
  ENCOURS = false;
  SUITE = null;
  SUITE_DEJA = false;
  feed.innerHTML = '';
  plusZone.hidden = true;
  mot('Chargement du fil…');
  const q = new URLSearchParams(location.search);
  if(DE) q.set('de', DE); else q.delete('de');
  try{ history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); }catch(e){}
  chargeFil();
}

/* ---------- le menu « Tout le monde / une personne » ----------
   Les lignes sont celles de la recherche de journal (journalLigne), dans
   un panneau .menu comme ceux de l'en-tête. Un menu maison et non un
   <select> : une liste native ne sait montrer ni photo ni bannière. */
let PERSONNES = [];
function personne(nom){
  const n = (nom || '').toLowerCase();
  return PERSONNES.find(s => s.nom.toLowerCase() === n);
}
/* « Tout le monde » n'a ni photo ni bannière : un groupe, dans la rondelle
   où les autres ont leur visage. */
const TOUS = `<span class="rsearch-avatar soc-de-tous" aria-hidden="true">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/>
      <circle cx="10" cy="8" r="3.5"/>
      <path d="M20 20v-1.5a3.5 3.5 0 0 0-2.6-3.4M15.5 4.6a3.5 3.5 0 0 1 0 6.8"/>
    </svg>
  </span>
  <span class="rsearch-meta"><b>Tout le monde</b><i>Tous les journaux publics</i></span>`;
const CHEVRON = `<svg class="soc-de-chev" width="12" height="12" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
    stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;

/* La bannière en fond de ligne, posée en JavaScript et non écrite dans le
   HTML - même raison que dans la recherche : esc() n'échappe pas
   l'apostrophe, qui suffirait à sortir d'un url('...'). */
function orne(el, s){
  const b = s && s.banniere;
  el.classList.toggle('rsearch-orne', !!b);
  if(b) el.style.setProperty('--banniere', `url("${b}")`);
  else el.style.removeProperty('--banniere');
}

/* Le bouton : la personne qu'on regarde. Une personne demandée par
   l'adresse et que l'annuaire ne connaît pas garde au moins son pseudo. */
function dessineDe(){
  const s = DE ? (personne(DE) || {nom: DE, jeux: 0}) : null;
  deBtn.innerHTML = (s ? journalLigne(s) : TOUS) + CHEVRON;
  orne(deBtn, s);
}

function deOuvert(){ return !deMenu.hidden; }
function deFerme(){
  if(!deOuvert()) return;
  deMenu.hidden = true;
  deBtn.setAttribute('aria-expanded', 'false');
}
function deOuvre(){
  /* Un seul panneau ouvert à la fois, comme dans l'en-tête. */
  menuMoiFerme();
  socialClocheFerme();
  const lignes = [null, ...PERSONNES];
  deMenu.innerHTML = lignes.map((s, i)=>{
    const on = s ? s.nom.toLowerCase() === DE.toLowerCase() : !DE;
    return `<button type="button" class="rsearch-item${on ? ' on' : ''}" role="menuitemradio"
        aria-checked="${on}" data-i="${i}">
        ${s ? journalLigne(s) : TOUS}
        ${on ? '<span class="tick">✓</span>' : ''}
      </button>`;
  }).join('');
  deMenu.querySelectorAll('.rsearch-item').forEach(b=>{
    const s = lignes[+b.dataset.i];
    orne(b, s);
    b.addEventListener('click', ()=>{
      deFerme();
      // la personne qu'on regarde déjà : rien à recharger
      if(!b.classList.contains('on')) changeDe(s ? s.nom : '');
    });
  });
  deMenu.hidden = false;
  deBtn.setAttribute('aria-expanded', 'true');
  const on = deMenu.querySelector('.on');
  if(on) on.scrollIntoView({block: 'nearest'});
}
deBtn.addEventListener('click', ()=>{ if(deOuvert()) deFerme(); else deOuvre(); });
/* Un clic ailleurs referme. À la capture, et non à la remontée : la
   pastille d'identité et la cloche arrêtent leur clic (stopPropagation),
   et les ouvrir laisserait sinon ce panneau-ci ouvert sous le leur. */
document.addEventListener('click', e=>{
  if(deOuvert() && !e.target.closest('#feedDeWrap')) deFerme();
}, true);
dessineDe();

/* Les personnes, depuis l'annuaire : les journaux publics qui ont au moins
   un jeu terminé - les autres donneraient un fil vide -, par ordre
   alphabétique. Une personne demandée par l'adresse mais absente de la
   liste y est ajoutée quand même, pour que le menu dise ce qu'on regarde. */
function remplisDe(journaux, moi){
  PERSONNES = journaux.filter(j => j.jeux > 0)
    .map(j => ({nom: j.pseudo, jeux: j.jeux, avatar: j.avatar,
                banniere: j.banniere, moi: j.pseudo === moi}))
    .sort((a, b) => a.nom.localeCompare(b.nom, 'fr', {sensitivity: 'base'}));
  if(DE){
    const s = personne(DE);
    if(s) DE = s.nom;
    else PERSONNES.unshift({nom: DE, jeux: 0});
  }
  dessineDe();
}

/* Une seule écoute pour tout le fil : les cartes arrivent par paquets, et
   des écoutes posées carte par carte seraient à reposer à chaque paquet. */
feed.addEventListener('click', e=>{
  // la photo et le pseudo mènent au journal de la personne : on laisse le
  // lien faire son travail plutôt que d'ouvrir la discussion par-dessus
  if(socialVersProfil(e)) return;
  // la jaquette et le titre ouvrent la fiche du jeu, pas la discussion
  if(socialVersJeu(e)) return;
  const jaime = e.target.closest('[data-act="jaime"]');
  if(jaime){ e.stopPropagation(); socialAimer(jaime); return; }
  const carte = e.target.closest('.soc-post');
  if(carte) ouvrirFilSocial(carte.dataset.id);
});
plus.addEventListener('click', chargeFil);

/* ---------- le fil en direct ----------
   Quelqu'un termine un jeu pendant qu'on lit : sa carte se pose en haut,
   sans rechargement. C'est ce qu'on attend d'un fil - l'ouvrir et le laisser
   ouvert doit suffire.

   Branché tout de suite, et pour tout le monde : le fil est public, on n'a
   pas besoin d'un compte pour voir arriver ce que les autres finissent. La
   cloche, elle, ne parle qu'à qui est connecté - c'est le serveur qui en
   décide, en n'envoyant sa pastille qu'au salon de la personne concernée
   (voir _salon_de dans social.py). */
socialTempsReel({
  surJeu: post => {
    /* Le fil d'une seule personne ne prend que ses jeux à elle. Ceux des
       autres ne sont pas lus pour autant : la pastille les annonce, comme
       sur le journal - sauf les miens, je sais ce que je viens de finir. */
    if(!deCettePersonne(post)){
      if(!(MOI.pseudo && post.pseudo === MOI.pseudo))
        socialFeedNeuves(SOC_FEED_NEUVES + 1);
      return;
    }
    /* Le fil entier est lu jusqu'à cette carte ; celui d'une personne
       ne dit rien des autres, le repère ne bouge donc pas. */
    if(!DE) feedLu(post.id);
    /* Déjà là : ça arrive quand on vient de charger une page qui contenait
       déjà ce jeu, ou qu'un même navigateur reçoit deux fois l'événement.
       On ne l'ajoute pas une seconde fois - un doublon dans un fil se voit
       tout de suite, et se corrige mal. */
    if(feed.querySelector(`.soc-post[data-id="${post.id}"]`)) return;
    feed.insertAdjacentHTML('afterbegin', socialCarteHTML(post, true));
    /* Un liseré doré le temps d'une seconde : une carte qui apparaît en
       silence au-dessus de ce qu'on lit passe inaperçue, et le fil semble
       simplement avoir bougé tout seul. */
    const carte = feed.firstElementChild;
    if(carte){
      carte.classList.add('soc-neuve');
      setTimeout(()=> carte.classList.remove('soc-neuve'), 2200);
    }
    // le fil n'est plus vide : le message qui le disait s'en va
    mot('');
  },
  /* Un jeu remis « En cours », rangé en wishlist ou effacé quitte le fil.
     Le laisser à l'écran promettrait une discussion qui n'existe plus. */
  surRetrait: id => {
    const carte = feed.querySelector(`.soc-post[data-id="${id}"]`);
    if(carte) carte.remove();
    if(!feed.children.length && !SUITE) mot(motVide());
  },
});

/* ---------- ce que la recherche déclenche ici ----------
   La fenêtre est la même que sur le journal ; seuls ces trois gestes
   changent, et c'est tout ce qui les sépare.

   Un journal mène à son adresse : d'ici on y va vraiment, il n'y a pas de
   classeur affiché à remplacer. Un jeu ouvre sa fiche sur place, comme
   là-bas. Et aucun journal n'est « celui qu'on regarde » sur cette page,
   donc aucune ligne ne porte de coche. */
regleRecherche({
  surJournal: i => {
    const s = SOURCES[i];
    if(s) location.href = '/archive/' + encodeURIComponent(s.nom);
  },
  surJeu: (id, titre) => { fermerRecherche(); ouvrirDetailIgdb(id, titre); },
  actif: () => -1,
});

/* Échap referme ce qui pend sous un bouton. Cette page n'a ni engrenage
   ni onglets : il n'y a que le menu d'identité, la cloche et le choix de
   la personne sous le titre, et aucun n'est une fenêtre de la pile -
   archive-noyau.js ne les connaît donc pas. */
ECHAP_SANS_FENETRE = function(){
  if(deOuvert()){ deFerme(); deBtn.focus(); return; }
  if(menuMoiOuvert()){ menuMoiFerme(); return; }
  if(socialClocheOuverte()) socialClocheFerme();
};

/* Le bouton « Suggestion / Bug » ouvre son formulaire sur place, comme
   partout ailleurs : voir static/commun/suggestion.js. Sans `estConnecte`, il
   demande lui-même au serveur avant d'ouvrir. */
if(window.Suggestion){
  Suggestion.branche({
    bouton: 'suggBtn',
    projet: 'jeux-videos',
    toast: (txt, mauvais)=> toast(txt, mauvais),
  });
}

/* Qui est là. Une seule requête pour les trois choses que l'en-tête doit
   savoir : si on a un journal (ma pastille, et où elle mène), si on est
   connecté (la cloche), et combien de notifications attendent. C'est
   l'annuaire que le journal demande déjà - voir liste() dans journal.py.

   En cas d'échec la page reste lisible : le fil est public, seul l'en-tête
   restera nu. */
(async ()=>{
  chargeFil();
  chargeManifeste();
  /* La discussion demandée par l'adresse. C'est par là qu'arrive un clic
     sur une notification depuis la page du journal : elle n'ouvre plus la
     discussion sur place - une réponse lue au-dessus de son propre
     classeur, sans le fil autour - elle envoie ici, où cette discussion
     vit, et dit laquelle dans ?fil=.

     Elle n'attend pas /api/journal : ouvrirFilSocial demande sa discussion
     lui-même, et rien dans l'en-tête ne lui est nécessaire. La notification
     s'ouvre donc pendant que le reste de la page se remplit.

     Le paramètre est effacé aussitôt - il a servi. Le garder rouvrirait la
     fenêtre à chaque rechargement, et il partirait dans l'adresse qu'on
     copie pour donner le fil. */
  const filDemande = new URLSearchParams(location.search).get('fil');
  if(filDemande){
    const propre = new URLSearchParams(location.search);
    propre.delete('fil');
    const reste = propre.toString();
    try{ history.replaceState(null, '', location.pathname + (reste ? '?' + reste : '')); }catch(e){}
    ouvrirFilSocial(filDemande);
  }
  try{
    const d = await (await fetch('/api/journal', {credentials: 'same-origin'})).json();
    // le menu « Tout le monde / une personne » sous le titre
    remplisDe(d.journaux || [], d.moi && d.moi.pseudo);
    /* Ma pastille n'apparaît que si j'ai un journal, et elle pointe droit
       dessus : /archive ouvrirait le mien de toute façon, mais l'adresse
       nominative est celle qu'on peut copier et donner. */
    /* SOURCES est ce que la recherche fouille en mode « Un journal ». La
       page du journal le remplit dans chargeAnnuaire() à partir de la même
       réponse ; on en fait autant, avec les seuls champs qu'une ligne de
       résultat affiche - nom, titre, nombre de jeux, avatar, bannière. */
    SOURCES = (d.journaux || []).map(j => ({
      nom: j.pseudo, titre: j.titre, jeux: j.jeux,
      avatar: j.avatar, banniere: j.banniere,
    }));
    if(d.moi){
      /* Ma pastille d'identité : ma photo, mon pseudo, et le chemin de chez
         moi. Sans photo, les initiales sur la teinte tirée du pseudo - la
         même que partout ailleurs, pour qu'on garde sa couleur d'un écran
         à l'autre. */
      /* MOI est déclaré dans archive-noyau.js et sert au-delà de l'en-tête :
         c'est par lui que la fiche d'un jeu sait quel journal lire pour
         décider si « + Wishlist » a lieu d'être (voir mesJeux). */
      appliqueCouleur(d.moi.couleur);
      MOI = {connecte: true, pseudo: d.moi.pseudo, avatar: d.moi.avatar,
             notifs: d.notificationsNeuves || 0};
      const moi = document.getElementById('moiBtn');
      moi.href = '/archive/' + encodeURIComponent(d.moi.pseudo);
      document.getElementById('moiNom').textContent = d.moi.pseudo;
      document.getElementById('moiAva').innerHTML = d.moi.avatar
        ? `<img class="ava" src="${esc(d.moi.avatar)}" alt="" decoding="async">`
        : `<span class="ava ava-vide" style="--h:${teinteAvatar(d.moi.pseudo)}"
            >${esc(initials(d.moi.pseudo))}</span>`;
      moi.hidden = false;
      /* Le menu ne se monte que si la pastille se montre : ici, elle est
         son seul déclencheur. Sans journal à soi, la barre n'a rien à
         déplier - et le fil se lit très bien sans.

         Les deux recherches s'ouvrent ICI, dans la fenêtre de cette page.
         Elles menaient à /archive?recherche=... et la page du journal les
         ouvrait à l'arrivée : on changeait de page pour ouvrir une fenêtre,
         et on se retrouvait ailleurs qu'où l'on était en la refermant. Les
         adresses restent sur les liens, pour le clic du milieu et pour qui
         n'a pas de script - c'est le clic qu'on intercepte, pas le lien. */
      monteMenuMoi(document.querySelector('.moi-wrap'), {
        ici: 'feed',
        surRecherche: mode => ouvrirRecherche({modes: [mode]}),
      });
      menuMoiJournal('/archive/' + encodeURIComponent(d.moi.pseudo));
      /* Le sien d'abord, comme sur le journal : c'est celui qu'on cherche
         le plus souvent, et un journal privé n'est pas dans l'annuaire
         public - il faut l'y mettre nous-mêmes. */
      const i = SOURCES.findIndex(x => x.nom === d.moi.pseudo);
      if(i > 0) SOURCES.unshift(SOURCES.splice(i, 1)[0]);
      else if(i < 0) SOURCES.unshift({nom: d.moi.pseudo});
      Object.assign(SOURCES[0], {moi: true, jeux: d.moi.jeux,
                                 avatar: d.moi.avatar, banniere: d.moi.banniere});
    }
    if(!d.connecte) return;
    const cloche = document.getElementById('cloche');
    cloche.hidden = false;
    monteCloche(cloche);
    socialMajNeuves(d.notificationsNeuves || 0);
  }catch(e){}
})();
</script>
<script src="/static/commun/neige.js" defer></script>
</body>
