<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abyss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Eczar:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style_abyss.css">
</head>
<body>
<canvas id="neige" aria-hidden="true"></canvas>

<div class="enveloppe">

  <div class="barre">
    <button type="button" class="bouton" id="btnSugg">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.2A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>
      </svg>
      Suggestions / Bugs
    </button>
    <span class="barre-espace"></span>
    <div class="compte" id="compte"><!-- rempli par dessineCompte() --></div>
  </div>

  <header class="entete">
    <h1 class="titre">Abyss</h1>
    <p class="sous-titre">Tous mes projets réunis au même endroit.</p>
  </header>

  <main class="grille" id="grille"></main>

  <p class="note-masques" id="noteMasques" hidden></p>
</div>

<!-- ---------- Connexion / inscription ---------- -->
<div class="voile" id="mAuth" hidden>
  <div class="modale" role="dialog" aria-modal="true" aria-labelledby="titreAuth">
    <div class="onglets" role="tablist">
      <button class="onglet actif" id="ongConn" role="tab" aria-selected="true">Connexion</button>
      <button class="onglet" id="ongInsc" role="tab" aria-selected="false">Créer un compte</button>
    </div>

    <h2 class="titre-modale" id="titreAuth">Se connecter</h2>

    <form id="formConn" autocomplete="on">
      <label class="champ">
        <span>Pseudo ou e-mail</span>
        <!-- maxlength passe de 20 à 200 : c'était la longueur d'un pseudo,
             une adresse est plus longue et se serait fait couper en
             silence pendant la frappe. -->
        <input id="cPseudo" name="username" autocomplete="username" required
               maxlength="200" autocapitalize="none" spellcheck="false">
      </label>
      <label class="champ">
        <span>Mot de passe</span>
        <input id="cMdp" name="password" type="password" autocomplete="current-password" required>
      </label>
      <label class="case">
        <input id="cMemo" type="checkbox" checked>
        <span>Rester connecté sur cet appareil</span>
      </label>
      <p class="erreur" id="cErr" hidden></p>
      <button class="valider" type="submit" id="cGo">Se connecter</button>
      <button type="button" class="lien lien-oubli" id="btnOubli">Mot de passe oublié ?</button>
    </form>

    <form id="formInsc" autocomplete="on" hidden>
      <label class="champ">
        <span>Pseudo</span>
        <input id="iPseudo" name="username" autocomplete="username" required
               maxlength="20" autocapitalize="none" spellcheck="false">
        <small>3 à 20 caractères.</small>
      </label>
      <label class="champ">
        <span>Mot de passe</span>
        <input id="iMdp" type="password" autocomplete="new-password" required minlength="8">
        <small>8 caractères au minimum.</small>
      </label>
      <label class="champ">
        <span>Répéter le mot de passe</span>
        <input id="iMdp2" type="password" autocomplete="new-password" required minlength="8">
      </label>
      <label class="champ">
        <span>E-mail <em>(facultatif)</em></span>
        <input id="iMail" type="email" autocomplete="email">
        <small>Sert uniquement à te retrouver si tu perds ton mot de passe.</small>
      </label>
      <p class="avis" id="iAvis" hidden></p>
      <p class="erreur" id="iErr" hidden></p>
      <button class="valider" type="submit" id="iGo">Créer mon compte</button>
    </form>

    <button class="fermer" data-ferme="mAuth" aria-label="Fermer">&#10005;</button>
  </div>
</div>

<!-- ---------- Mot de passe oublié ---------- -->
<div class="voile" id="mOubli" hidden>
  <div class="modale" role="dialog" aria-modal="true" aria-labelledby="titreOubli">
    <h2 class="titre-modale" id="titreOubli">Mot de passe oublié</h2>
    <form id="formOubli">
      <label class="champ">
        <span>Ton adresse e-mail</span>
        <input id="oPseudo" type="email" autocomplete="email" required
               maxlength="200" autocapitalize="none" spellcheck="false">
      </label>
      <p class="explication">Un lien pour choisir un nouveau mot de passe partira
        sur cette adresse. Il est valable une heure. Ton pseudo marche aussi, si
        c'est de lui que tu te souviens.</p>
      <p class="avis" id="oAvis" hidden></p>
      <p class="erreur" id="oErr" hidden></p>
      <button class="valider" type="submit" id="oGo">Envoyer le lien</button>
    </form>
    <button class="fermer" data-ferme="mOubli" aria-label="Fermer">&#10005;</button>
  </div>
</div>

<!-- ---------- Suggestions et bugs ---------- -->
<div class="voile" id="mSugg" hidden>
  <div class="modale" role="dialog" aria-modal="true" aria-labelledby="titreSugg">
    <h2 class="titre-modale" id="titreSugg">Une idée, un bug ?</h2>
    <form id="formSugg">
      <div class="sugg-genres" role="radiogroup" aria-label="Nature du message">
        <label class="sugg-genre">
          <input type="radio" name="genre" value="suggestion" checked>
          <span>Suggestion</span>
        </label>
        <label class="sugg-genre">
          <input type="radio" name="genre" value="bug">
          <span>Bug</span>
        </label>
      </div>
      <label class="champ">
        <span>Le projet concerné</span>
        <select id="sProjet">
          <option value="abyss">Abyss</option>
          <option value="jeux-videos">Archive Jeux Vidéos</option>
          <option value="collection">Collection Yu-Gi-Oh!</option>
          <option value="quiz">Mini-Jeux / Quiz</option>
        </select>
      </label>
      <label class="champ">
        <span>Ton message</span>
        <textarea id="sMessage" rows="4" maxlength="1000" required></textarea>
      </label>
      <p class="explication" id="sCompteur">1000 caractères restants.</p>
      <p class="erreur" id="sErr" hidden></p>
      <button class="valider" type="submit" id="sGo">Envoyer</button>
    </form>
    <button class="fermer" data-ferme="mSugg" aria-label="Fermer">&#10005;</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<!-- le bouton de compte : un seul dessin pour toutes les pages d'Abyss.
     Chargé avant le script de la page, qui l'appelle dès la réponse de
     /api/moi — un defer arriverait peut-être trop tard. -->
<script src="/static/compte.js"></script>
<script>
/* =========================================================
   LA SEULE PARTIE À MODIFIER
   Un projet = un objet. L'`id` sert de clé aux préférences
   d'affichage : ne le renomme pas sans vider la table
   `preference`, sinon les masquages retombent sur du vide.
   Il doit aussi figurer dans PROJETS_CONNUS, côté base.py.
   ========================================================= */
/* le quiz vit sur un autre port, mais sur la MEME machine que ce hub :
   en deduire l'hote plutot que d'ecrire localhost permet d'ouvrir Abyss
   depuis le telephone sans casser le lien. En ligne derriere HTTPS, il
   faudra le monter sur /quiz plutot que d'exposer le port 5000. */
const HOTE = location.hostname || "localhost";

const PROJETS = [
    {
        id: "jeux-videos",
        nom: "Archive Jeux Vidéos",
        texte: "Liste de jeux terminés par année avec notes et temps de jeu.",
        url: "/archive",
        accent: "var(--algue)",
        embleme: "grille"
    },
    {
        id: "collection",
        nom: "Collection Yu-Gi-Oh!",
        texte: "Suivi de collection Yu-Gi-Oh!",
        url: "/collection",
        accent: "var(--luciole)",
        embleme: "pile"
    },
    {
        id: "chainz",
        nom: "L'Atelier Chainz",
        texte: "Le site de mon jeu vidéo Chainz.",
        url: "https://chainz.zdimension.fr",
        accent: "var(--meduse)",
        embleme: "eventail",
        externe: true          // s'ouvre dans un nouvel onglet
    },
    {
        /* Une seule tuile pour tous les quiz du site. Yu-Gi-Quiz avait la
           sienne et pointait droit sur son serveur ; il vit maintenant dans
           cette page-ci, à côté des mini-jeux de jaquettes, chacun sous sa
           catégorie. Une porte pour les jeux, pas une par jeu. */
        id: "quiz",
        nom: "Mini-Jeux / Quiz",
        texte: "Deviner un jeu à sa jaquette, une carte à son artwork.",
        url: "/quiz",
        /* Le bleu et le losange interrogatif étaient ceux de Yu-Gi-Quiz.
           Cette tuile-ci a pris sa place et son rôle : elle en garde le
           visuel, pour qu'on la retrouve là où on la cherchait. */
        accent: "var(--plancton)",
        embleme: "question"
    }
];

/* ---------- Emblèmes ---------- */
const EMBLEMES = {
  pile: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
    <rect x="6" y="14" width="20" height="28" rx="3"/><rect x="14" y="8" width="20" height="28" rx="3"/>
    <rect x="22" y="4" width="20" height="28" rx="3"/></svg>`,
  grille: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
    <rect x="5" y="5" width="15" height="15" rx="2"/><rect x="28" y="5" width="15" height="15" rx="2"/>
    <rect x="5" y="28" width="15" height="15" rx="2"/><path d="M28 35.5h15M35.5 28v15"/></svg>`,
  eventail: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
    <rect x="17" y="8" width="16" height="24" rx="2"/>
    <rect x="17" y="8" width="16" height="24" rx="2" transform="rotate(-22 25 32)"/>
    <rect x="17" y="8" width="16" height="24" rx="2" transform="rotate(22 25 32)"/></svg>`,
  question: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 4 44 24 24 44 4 24z"/><path d="M19.5 19.5a4.5 4.5 0 1 1 5.6 4.4c-.9.3-1.3 1-1.3 1.9v1.4"/>
    <circle cx="23.8" cy="33" r="1.3" fill="currentColor" stroke="none"/></svg>`
};

const echappe = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const el = (id) => document.getElementById(id);

/* =========================================================
   État de la session
   ========================================================= */
/* Une seule source de vérité : ce que le serveur a répondu. Le front ne
   décide jamais tout seul qu'il est connecté — un cookie HttpOnly n'est
   même pas lisible d'ici, et c'est très bien ainsi. */
let MOI = { connecte: false, utilisateur: null, masques: [],
            inscriptions: { ouvertes: true, restantes: null, libre_a: null } };

/* Le cookie de session part tout seul (même origine). `credentials` est
   explicite pour que personne n'ait de doute en relisant. */
async function api(chemin, methode, charge) {
  const options = { method: methode || "GET", credentials: "same-origin" };
  if (charge !== undefined) {
    /* application/json déclenche un pré-vol CORS : un formulaire posté
       depuis un autre site ne peut donc pas atteindre ces routes. C'est la
       protection CSRF, et le serveur refuse tout autre type. */
    options.headers = { "Content-Type": "application/json" };
    options.body = JSON.stringify(charge);
  }
  const r = await fetch(chemin, options);
  let data = null;
  try { data = await r.json(); } catch (e) { /* réponse illisible */ }
  if (!r.ok || !data || data.ok === false) {
    const err = new Error((data && data.message) || `Erreur ${r.status}.`);
    err.code = data && data.erreur;
    throw err;
  }
  return data;
}

function poseEtat(data) {
  MOI = {
    connecte: !!data.connecte,
    utilisateur: data.utilisateur || null,
    masques: Array.isArray(data.masques) ? data.masques : [],
    /* si le serveur n'en dit rien, on suppose ouvert : mieux vaut un
       formulaire qui échoue à l'envoi qu'un formulaire barré à tort */
    inscriptions: data.inscriptions || { ouvertes: true, restantes: null, libre_a: null }
  };
  dessine();
}

/* =========================================================
   Rendu
   ========================================================= */
/* `admin: true` sur un projet le réserve à l'administration : un projet en
   chantier n'a pas à s'afficher chez les autres tant qu'il n'est pas prêt.
   Ce n'est pas une protection — c'est l'API du projet qui refuse — juste de
   quoi ne pas mettre une porte fermée sous les yeux de tout le monde. */
function visibles() {
  const admin = MOI.connecte && MOI.utilisateur && MOI.utilisateur.admin;
  return PROJETS.filter((p) => (!p.admin || admin) && MOI.masques.indexOf(p.id) < 0);
}

function dessineGrille() {
  const liste = visibles();
  el("grille").innerHTML = liste.map((p) => `
  <a class="carte" style="--accent:${p.accent}" href="${echappe(p.url)}"${
      p.externe ? ' target="_blank" rel="noopener noreferrer"' : ""}>
    <div class="bandeau">
      <h2 class="nom">${echappe(p.nom)}</h2>
      <span class="fleche" aria-hidden="true">&#8599;</span>
    </div>
    <div class="illu" aria-hidden="true">${EMBLEMES[p.embleme] || ""}</div>
    <div class="corps"><p class="texte">${echappe(p.texte)}</p></div>
  </a>`).join("");

  /* Tout masquer laisserait une page vide sans explication : on garde une
     porte de sortie visible. */
  if (!liste.length) {
    el("grille").innerHTML =
      `<p class="vide">Tu as masqué tous les projets.
       <a class="lien" href="/abyss/profil">Revoir les réglages</a></p>`;
  }

  const n = MOI.masques.length;
  const note = el("noteMasques");
  note.hidden = !(MOI.connecte && n > 0 && liste.length);
  if (!note.hidden) {
    note.innerHTML = `${n} projet${n > 1 ? "s" : ""} masqué${n > 1 ? "s" : ""} ·
      <a class="lien" href="/abyss/profil">modifier</a>`;
  }
}

function dessineCompte() {
  const zone = el("compte");
  if (!MOI.connecte) {
    zone.innerHTML = `<button class="bouton" id="btnConn">Se connecter</button>`;
    el("btnConn").addEventListener("click", () => ouvreAuth("connexion"));
    return;
  }
  const marque = MOI.utilisateur.avatar
    ? `<img class="avatar-mini" src="${echappe(MOI.utilisateur.avatar)}" alt="">`
    : `<span class="pastille" aria-hidden="true"></span>`;
  zone.innerHTML = `
    <div class="enveloppe-menu">
      <button class="bouton pseudo" id="btnMenu" aria-expanded="false" aria-haspopup="true">
        ${marque}
        ${echappe(MOI.utilisateur.pseudo)}
        <span class="chevron" aria-hidden="true">&#9662;</span>
      </button>
      <div class="menu" id="menuCompte" hidden>
        <a class="entree" href="/abyss/profil">Mon profil</a>
        <!-- réservée à l'admin : l'entrée n'apparaît que pour lui, et
             l'API qu'ouvre la page répond 404 à tous les autres -->
        ${MOI.utilisateur.admin
          ? '<a class="entree" href="/abyss/suggestions">Suggestions</a>'
          + '<a class="entree" href="/abyss/monitoring">Monitoring</a>'
          : ""}
        <hr>
        <button class="entree" id="mnSortie">Se déconnecter</button>
      </div>
    </div>`;
  el("btnMenu").addEventListener("click", (e) => { e.stopPropagation(); basculeMenu(); });
  el("mnSortie").addEventListener("click", sortir);
}

function dessine() { dessineCompte(); dessineGrille(); }

/* =========================================================
   Menu du compte
   ========================================================= */
function basculeMenu() {
  const m = el("menuCompte");
  if (!m) return;
  m.hidden = !m.hidden;
  el("btnMenu").setAttribute("aria-expanded", m.hidden ? "false" : "true");
}
function fermeMenu() {
  const m = el("menuCompte");
  if (m && !m.hidden) { m.hidden = true; el("btnMenu").setAttribute("aria-expanded", "false"); }
}
/* Une sélection de texte commencée dans le menu et relâchée dehors ne doit
   pas le fermer : on ne ferme que si le clic ET le mousedown qui l'a
   précédé visaient tous les deux en dehors du menu. */
let SOURIS_DEHORS = false;
document.addEventListener("mousedown", (e) => {
  SOURIS_DEHORS = !e.target.closest(".enveloppe-menu");
});
document.addEventListener("click", (e) => {
  if (SOURIS_DEHORS && !e.target.closest(".enveloppe-menu")) fermeMenu();
});

/* =========================================================
   Modales
   ========================================================= */
let RENDRE_FOCUS = null;

function ouvre(id, champ) {
  RENDRE_FOCUS = document.activeElement;
  el(id).hidden = false;
  const c = champ && el(champ);
  if (c) c.focus();
}
function ferme(id) {
  el(id).hidden = true;
  if (RENDRE_FOCUS && document.contains(RENDRE_FOCUS)) RENDRE_FOCUS.focus();
  RENDRE_FOCUS = null;
}
function fermeTout() {
  ["mAuth", "mOubli", "mSugg"].forEach((id) => { if (!el(id).hidden) ferme(id); });
}

/* ---------- suggestions et bugs ----------
   Le formulaire demande d'être connecté : une suggestion anonyme ne peut
   pas s'écrire « Pseudo - Message », et surtout on ne saurait à qui
   revenir pour en discuter. Non connecté, le bouton ouvre donc la
   connexion — pas un refus, juste l'étape d'avant. */
const SUGG_MAXI = 1000;
function majCompteurSugg() {
  const reste = SUGG_MAXI - el("sMessage").value.length;
  el("sCompteur").textContent = `${reste} caractère${reste > 1 ? "s" : ""} restant${reste > 1 ? "s" : ""}.`;
}
el("sMessage").addEventListener("input", majCompteurSugg);
el("btnSugg").addEventListener("click", () => {
  if (!MOI.connecte) {
    toast("Connecte-toi pour envoyer une suggestion.");
    ouvre("mAuth", "cPseudo");
    return;
  }
  el("sErr").hidden = true;
  majCompteurSugg();
  ouvre("mSugg", "sMessage");
});
/* Arriver depuis une autre page avec ?suggestion=<projet> ouvre le
   formulaire sur ce projet. L'adresse est nettoyee juste apres : un
   rafraichissement ne doit pas rouvrir la fenetre, et le lien qu'on
   partagerait ne doit pas trainer un formulaire ouvert. */
function suggestionDepuisURL() {
  const projet = new URLSearchParams(location.search).get("suggestion");
  if (!projet) return;
  history.replaceState(null, "", location.pathname);
  if (!el("sProjet").querySelector(`option[value="${CSS.escape(projet)}"]`)) return;
  el("sProjet").value = projet;
  el("btnSugg").click();
}
/* Arriver avec ?connexion ouvre directement la fenetre de connexion.
   Les pages qui exigent un compte renvoient ici pour ca et rien d'autre :
   deposer le visiteur sur le hub a charge de retrouver le bouton, c'etait
   un clic de plus pour la seule chose qu'il venait faire.

   Deja connecte : on ne montre rien. Il n'a rien demande d'autre que
   d'arriver, et une fenetre de connexion par-dessus une session ouverte
   n'aurait aucun sens.

   L'adresse est nettoyee dans les deux cas, comme pour ?suggestion : un
   rafraichissement ne doit pas rouvrir la fenetre, et le lien qu'on
   partagerait ne doit pas trainer un formulaire ouvert. */
function connexionDepuisURL() {
  if (!new URLSearchParams(location.search).has("connexion")) return;
  history.replaceState(null, "", location.pathname);
  if (!MOI.connecte) ouvreAuth("connexion");
}

el("formSugg").addEventListener("submit", async (e) => {
  e.preventDefault();
  const bouton = el("sGo");
  const genre = document.querySelector('#formSugg input[name="genre"]:checked').value;
  el("sErr").hidden = true;
  bouton.disabled = true;
  try {
    await api("/api/suggestion", "POST", {
      projet: el("sProjet").value,
      genre: genre,
      message: el("sMessage").value,
    });
    el("sMessage").value = "";
    majCompteurSugg();
    ferme("mSugg");
    toast(genre === "bug" ? "Bug signalé, merci." : "Suggestion envoyée, merci.");
  } catch (err) {
    erreur("sErr", err.message);
  } finally {
    bouton.disabled = false;
  }
});

document.querySelectorAll("[data-ferme]").forEach((b) => {
  b.addEventListener("click", () => ferme(b.dataset.ferme));
});
/* clic sur le voile, pas sur la boîte */
/* Une sélection de texte commencée dans la boîte et relâchée sur le voile
   ne doit pas fermer la fenêtre : on ne ferme que si le clic ET le
   mousedown qui l'a précédé visaient tous les deux le voile lui-même. */
document.querySelectorAll(".voile").forEach((v) => {
  let surVoile = false;
  v.addEventListener("mousedown", (e) => { surVoile = e.target === v; });
  v.addEventListener("click", (e) => {
    if (surVoile && e.target === v) ferme(v.id);
    surVoile = false;
  });
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { fermeMenu(); fermeTout(); }
});

/* ---------- onglets connexion / inscription ---------- */
function ouvreAuth(quoi) {
  montreOnglet(quoi || "connexion");
  cacheErreurs();
  ouvre("mAuth", quoi === "inscription" ? "iPseudo" : "cPseudo");
}
function montreOnglet(quoi) {
  const conn = quoi === "connexion";
  el("formConn").hidden = !conn;
  el("formInsc").hidden = conn;
  el("ongConn").classList.toggle("actif", conn);
  el("ongInsc").classList.toggle("actif", !conn);
  el("ongConn").setAttribute("aria-selected", conn ? "true" : "false");
  el("ongInsc").setAttribute("aria-selected", conn ? "false" : "true");
  el("titreAuth").textContent = conn ? "Se connecter" : "Créer un compte";
  if (!conn) majInscriptions();
}

/* Quand les places du jour sont prises, on le dit avant que la personne
   remplisse tout le formulaire pour rien. */
function majInscriptions() {
  const ins = MOI.inscriptions || {};
  const avis = el("iAvis");
  avis.hidden = ins.ouvertes !== false;
  if (!avis.hidden) {
    avis.textContent = ins.libre_a
      ? `Les inscriptions du jour sont pleines. Une place se libère ${quand(ins.libre_a)}.`
      : "Les inscriptions sont fermées pour le moment.";
  }
}

/* « le 3 septembre à 20:14 », ou « à 20:14 » si c'est aujourd'hui */
function quand(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "plus tard";
  const heure = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === new Date().toDateString()) return `à ${heure}`;
  return `le ${d.toLocaleDateString("fr-FR", { day: "numeric", month: "long" })} à ${heure}`;
}

el("ongConn").addEventListener("click", () => { cacheErreurs(); montreOnglet("connexion"); el("cPseudo").focus(); });
el("ongInsc").addEventListener("click", () => { cacheErreurs(); montreOnglet("inscription"); el("iPseudo").focus(); });

/* ---------- mot de passe oublié ---------- */
el("btnOubli").addEventListener("click", () => {
  const pseudo = el("cPseudo").value.trim();
  ferme("mAuth");
  cacheErreurs();
  el("oAvis").hidden = true;
  /* on ne reporte que ce qui ressemble a une adresse : recopier un pseudo
     dans un champ type="email" le ferait refuser par le navigateur avant
     meme l'envoi, sans que personne comprenne pourquoi */
  el("oPseudo").value = pseudo.includes("@") ? pseudo : "";
  ouvre("mOubli", "oPseudo");
});

function erreur(id, message) {
  const p = el(id);
  p.textContent = message;
  p.hidden = false;
}
function cacheErreurs() {
  ["cErr", "iErr", "oErr"].forEach((id) => { el(id).hidden = true; });
}

/* =========================================================
   Afficher / masquer un mot de passe
   Un bouton oeil greffe en JS plutot que repete six fois dans le HTML :
   chaque input[type=password] du formulaire en recoit un, sans rien
   changer a la mise en page (.mdp-wrap se contente d'etre positionne).
   ========================================================= */
document.querySelectorAll(".champ input[type=password]").forEach((input) => {
  const wrap = document.createElement("div");
  wrap.className = "mdp-wrap";
  input.replaceWith(wrap);
  wrap.appendChild(input);

  const bouton = document.createElement("button");
  bouton.type = "button";
  bouton.className = "mdp-oeil";
  bouton.setAttribute("aria-pressed", "false");
  bouton.setAttribute("aria-label", "Afficher le mot de passe");
  bouton.innerHTML = `
    <svg class="oeil-ouvert" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1.4 12S5.2 4.8 12 4.8 22.6 12 22.6 12 18.8 19.2 12 19.2 1.4 12 1.4 12Z"/>
      <circle cx="12" cy="12" r="3.15"/>
    </svg>
    <svg class="oeil-barre" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.85 5.15A11.6 11.6 0 0 1 12 4.8c6.8 0 11.4 7.2 11.4 7.2a15.4 15.4 0 0 1-3.35 4.02M6.62 6.63C3.32 8.72 1.4 12 1.4 12s4.6 7.2 11.4 7.2a10.9 10.9 0 0 0 4.4-.92"/>
      <path d="M9.6 9.6a3.15 3.15 0 0 0 4.42 4.42"/>
      <path d="M2 2l20 20"/>
    </svg>`;
  wrap.appendChild(bouton);

  bouton.addEventListener("click", () => {
    const clair = input.type !== "text";
    input.type = clair ? "text" : "password";
    bouton.classList.toggle("on", clair);
    bouton.setAttribute("aria-pressed", String(clair));
    bouton.setAttribute("aria-label", clair ? "Masquer le mot de passe" : "Afficher le mot de passe");
  });
});

/* =========================================================
   Actions
   ========================================================= */
el("formConn").addEventListener("submit", async (e) => {
  e.preventDefault();
  cacheErreurs();
  const bouton = el("cGo");
  bouton.disabled = true;
  try {
    const data = await api("/api/connexion", "POST", {
      pseudo: el("cPseudo").value.trim(),
      mdp: el("cMdp").value,
      memoriser: el("cMemo").checked
    });
    el("cMdp").value = "";
    poseEtat(data);
    ferme("mAuth");
    toast(`Bonjour ${MOI.utilisateur.pseudo}.`);
  } catch (err) {
    erreur("cErr", err.message);
  } finally {
    bouton.disabled = false;
  }
});

el("formInsc").addEventListener("submit", async (e) => {
  e.preventDefault();
  cacheErreurs();
  if (el("iMdp").value !== el("iMdp2").value) {
    erreur("iErr", "Les deux mots de passe ne sont pas identiques.");
    return;
  }
  const bouton = el("iGo");
  bouton.disabled = true;
  try {
    const data = await api("/api/inscription", "POST", {
      pseudo: el("iPseudo").value.trim(),
      mdp: el("iMdp").value,
      email: el("iMail").value.trim()
    });
    el("iMdp").value = el("iMdp2").value = "";
    poseEtat(data);
    ferme("mAuth");
    toast(`Bienvenue dans l'abysse, ${MOI.utilisateur.pseudo}.`);
  } catch (err) {
    erreur("iErr", err.message);
  } finally {
    bouton.disabled = false;
  }
});

el("formOubli").addEventListener("submit", async (e) => {
  e.preventDefault();
  cacheErreurs();
  const bouton = el("oGo");
  bouton.disabled = true;
  try {
    const data = await api("/api/mot-de-passe-oublie", "POST", {
      identifiant: el("oPseudo").value.trim()
    });
    // toujours le meme message, que le pseudo existe ou non : le serveur
    // ne dit jamais lequel des deux cas s'est produit
    el("oAvis").hidden = false;
    el("oAvis").textContent = data.message;
  } catch (err) {
    erreur("oErr", err.message);
  } finally {
    bouton.disabled = false;
  }
});

async function sortir() {
  try {
    await api("/api/deconnexion", "POST", {});
  } catch (err) {
    /* le cookie est peut-être déjà mort : on redescend quand même en
       visiteur plutôt que de rester sur un état de connexion menteur */
  }
  fermeMenu();
  poseEtat({ connecte: false, utilisateur: null, masques: [],
             inscriptions: MOI.inscriptions });
  toast("Déconnecté.");
}

/* ---------- toast ---------- */
let minuteurToast;
function toast(message, mauvais) {
  const t = el("toast");
  t.textContent = message;
  t.className = "toast montre" + (mauvais ? " mauvais" : "");
  t.hidden = false;
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => { t.className = "toast"; t.hidden = true; }, 3600);
}

   Démarrage
   ========================================================= */
(async function () {
  dessine();                       // la grille s'affiche avant la réponse
  try {
    poseEtat(await api("/api/moi"));
  } catch (err) {
    /* API injoignable : le hub reste une grille de liens, comme avant les
       comptes. Mieux vaut un site amputé de sa connexion qu'une page vide. */
  }
  /* après poseEtat : les deux regardent MOI.connecte, et on ne le sait
     qu'une fois /api/moi revenu */
  connexionDepuisURL();
  suggestionDepuisURL();
})();
