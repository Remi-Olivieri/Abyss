<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abyss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Eczar:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style_abyss.css">
</head>
<body>
<canvas id="neige" aria-hidden="true"></canvas>

<div class="enveloppe">

  <header class="entete">
    <h1 class="titre">Abyss</h1>
    <p class="sous-titre">Tous mes projets réunis au même endroit.</p>
  </header>

  <main class="grille" id="grille"></main>
</div>

<script>
/* =========================================================
   LA SEULE PARTIE À MODIFIER
   Un projet = un objet. Le jour du passage en ligne,
   tu remplaces l'url, rien d'autre à toucher.
   ========================================================= */
/* le quiz vit sur un autre port, mais sur la MEME machine que ce hub :
   en deduire l'hote plutot que d'ecrire localhost permet d'ouvrir Abyss
   depuis le telephone (python app.py --reseau) sans casser le lien. */
const HOTE = location.hostname || "localhost";

const PROJETS = [
    {
        nom: "Jeux Vidéos",
        texte: "Ma liste de jeux terminés par année avec notes et temps de jeu.",
        url: "jeux-videos.html",
        accent: "var(--algue)",
        embleme: "grille"
    },
    {
        nom: "Collection Yu-Gi-Oh!",
        texte: "Suivi de ma collection Yu-Gi-Oh!",
        url: "collection-yugioh.html",
        accent: "var(--luciole)",
        embleme: "pile"
    },
    {
        nom: "L'Atelier Chainz",
        texte: "Le site de mon jeu vidéo Chainz.",
        url: "https://chainz.zdimension.fr",
        accent: "var(--meduse)",
        embleme: "eventail",
        externe: true          // s'ouvre dans un nouvel onglet
    },
    {
        nom: "Yu-Gi-Quiz!",
        texte: "Devinez les noms des cartes avec juste les artworks.",
        url: `http://${HOTE}:5000`,
        accent: "var(--plancton)",
        embleme: "question",
        externe: true          // autre serveur, autre port
    }
];

/* ---------- Emblèmes ---------- */
const EMBLEMES = {
  pile: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
    <rect x="6" y="14" width="20" height="28" rx="3"/><rect x="14" y="8" width="20" height="28" rx="3"/>
    <rect x="22" y="4" width="20" height="28" rx="3"/></svg>`,
  grille: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
    <rect x="5" y="5" width="15" height="15" rx="2"/><rect x="28" y="5" width="15" height="15" rx="2"/>
    <rect x="5" y="28" width="15" height="15" rx="2"/><path d="M28 35.5h15M35.5 28v15"/></svg>`,
  eventail: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
    <rect x="17" y="8" width="16" height="24" rx="2"/>
    <rect x="17" y="8" width="16" height="24" rx="2" transform="rotate(-22 25 32)"/>
    <rect x="17" y="8" width="16" height="24" rx="2" transform="rotate(22 25 32)"/></svg>`,
  question: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 4 44 24 24 44 4 24z"/><path d="M19.5 19.5a4.5 4.5 0 1 1 5.6 4.4c-.9.3-1.3 1-1.3 1.9v1.4"/>
    <circle cx="23.8" cy="33" r="1.3" fill="currentColor" stroke="none"/></svg>`
};

const echappe = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

document.getElementById("grille").innerHTML = PROJETS.map((p) => `
  <a class="carte" style="--accent:${p.accent}" href="${echappe(p.url)}"${
      p.externe ? ' target="_blank" rel="noopener noreferrer"' : ""}>
    <div class="bandeau">
      <h2 class="nom">${echappe(p.nom)}</h2>
      <span class="fleche" aria-hidden="true">&#8599;</span>
    </div>
    <div class="illu" aria-hidden="true">${EMBLEMES[p.embleme] || ""}</div>
    <div class="corps"><p class="texte">${echappe(p.texte)}</p></div>
  </a>`).join("");

/* ---------- Neige marine ---------- */
(function () {
  const reduit = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const c = document.getElementById("neige");
  if (reduit || !c.getContext) { c.style.display = "none"; return; }
  const ctx = c.getContext("2d");
  let w = 0, h = 0, grains = [];

  /* halo pré-dessiné : bien plus rapide que shadowBlur sur chaque grain */
  const halo = (function () {
    const t = 40, s = document.createElement("canvas");
    s.width = s.height = t;
    const g = s.getContext("2d");
    const d = g.createRadialGradient(t / 2, t / 2, 0, t / 2, t / 2, t / 2);
    d.addColorStop(0, "rgba(232,247,255,1)");
    d.addColorStop(.16, "rgba(188,230,250,.62)");
    d.addColorStop(.42, "rgba(130,198,232,.2)");
    d.addColorStop(1, "rgba(110,185,225,0)");
    g.fillStyle = d;
    g.fillRect(0, 0, t, t);
    return s;
  })();

  function init() {
    const d = window.devicePixelRatio || 1;
    w = window.innerWidth; h = window.innerHeight;
    c.width = w * d; c.height = h * d;
    c.style.width = w + "px"; c.style.height = h + "px";
    ctx.setTransform(d, 0, 0, d, 0, 0);
    const n = Math.min(210, Math.round((w * h) / 20000));
    grains = Array.from({ length: n }, () => {
      const p = Math.random();            // profondeur : 0 = au loin, 1 = tout près
      return {
      x: Math.random() * w,
      y: Math.random() * h,
        r: .5 + p * 2,                    // les proches sont plus gros
        v: .035 + p * .21,                //  ... et tombent plus vite
        a: .1 + p * .42,                  //  ... et brillent plus fort
        ph: Math.random() * Math.PI * 2,  // phase de scintillement
        sp: .006 + Math.random() * .016,
        d: Math.random() * Math.PI * 2    // phase de dérive latérale
      };
    });
  }

  function boucle() {
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = "lighter";  // les halos s'additionnent
    for (const g of grains) {
      g.y += g.v;
      g.d += .004;
      g.ph += g.sp;
      if (g.y > h + 8) { g.y = -8; g.x = Math.random() * w; }
      const x = g.x + Math.sin(g.d) * 10;
      const taille = g.r * 9;
      ctx.globalAlpha = g.a * (.7 + .3 * Math.sin(g.ph));
      ctx.drawImage(halo, x - taille / 2, g.y - taille / 2, taille, taille);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(boucle);
  }

  init();
  /* init() redimensionne le canvas ET recree tous les grains. Un
     redimensionnement de fenetre emet des dizaines d'evenements : sans
     ce delai, on reconstruit 210 objets a chaque pixel tire a la souris. */
  let redim;
  window.addEventListener("resize", () => {
    clearTimeout(redim);
    redim = setTimeout(init, 150);
  });
  boucle();
})();
</script>
</body>
</html>
