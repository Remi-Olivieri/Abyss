<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suggestions - Abyss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Eczar:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/abyss/abyss.css">
<style>
  /* cette barre-ci porte un retour à gauche en plus du compte à droite */
  .barre{justify-content:space-between}

  /* ---------- en-tête ----------
     Le titre reprend celui d'Abyss en plus petit : on est dans une page du
     hub, pas dans un outil à part. */
  .sug-entete{margin-bottom:30px}
  .sug-titre{
    font-family:"Eczar",Georgia,serif;font-weight:600;
    font-size:clamp(34px,6vw,52px);line-height:1.05;letter-spacing:.06em;
    text-transform:uppercase;margin:0;
    background:linear-gradient(180deg,#EEF7FC 0%,#89B4CE 58%,#2E4E66 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sug-sous{margin:12px 0 0;max-width:60ch;color:var(--brume);font-size:14px;line-height:1.55}
  .sug-sous code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
    padding:1px 6px;border-radius:5px;background:rgba(3,8,15,.7);color:#9FC4DA;
  }

  /* ---------- filtres ----------
     Trois menus déroulants - Type, Importance, Page - au lieu d'une rangée
     de boutons qui s'allongeait d'un bouton par projet. Dans un menu on
     coche autant de valeurs qu'on veut (elles s'additionnent : « Bugs » et
     « Idées » montrent les deux) ; d'un menu à l'autre elles se combinent
     (« Bugs » ET « Urgent » ET « Archive »). Rien de coché dans un menu,
     c'est tout ce menu. */
  .sug-filtres{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:24px}
  .sug-dd{position:relative}
  .sug-dd-btn{
    display:inline-flex;align-items:center;gap:8px;
    font:inherit;font-size:13px;padding:7px 12px 7px 14px;border-radius:999px;
    color:var(--brume);border:1px solid rgba(150,195,220,.16);
    background:rgba(3,8,15,.6);cursor:pointer;white-space:nowrap;
    transition:border-color .2s ease,color .2s ease,background .2s ease;
  }
  .sug-dd-btn:hover{color:var(--os)}
  .sug-dd-btn b{font-weight:500;color:var(--os)}
  .sug-dd-btn svg{opacity:.6;transition:transform .2s ease}
  .sug-dd-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
  /* un menu qui filtre se voit fermé : c'est lui qui explique une liste courte */
  .sug-dd.actif .sug-dd-btn{
    color:var(--os);border-color:rgba(120,200,230,.55);background:rgba(120,200,230,.12);
  }
  .sug-dd-btn:focus-visible{outline:2px solid var(--plancton);outline-offset:2px}
  .sug-dd-panneau{
    position:absolute;top:calc(100% + 6px);left:0;z-index:30;
    min-width:220px;max-height:min(60vh,380px);overflow-y:auto;padding:6px;
    border-radius:12px;background:#0B1624;border:1px solid rgba(150,195,220,.22);
    box-shadow:0 18px 40px rgba(0,0,0,.55);
  }
  .sug-dd-panneau[hidden]{display:none}
  .sug-opt{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
    font-size:13.5px;color:#DCE8F0;cursor:pointer;user-select:none;
  }
  .sug-opt:hover{background:rgba(120,200,230,.08)}
  .sug-opt input{margin:0;accent-color:var(--plancton);width:15px;height:15px;flex:none}
  .sug-opt span{flex:1}
  .sug-opt b{font-weight:500;font-size:12px;color:var(--brume);font-variant-numeric:tabular-nums}
  /* une valeur qui ne donnerait rien avec les autres filtres : lisible, éteinte */
  .sug-opt.zero{opacity:.45}
  /* la pastille de couleur des niveaux, dans leur menu */
  .sug-opt i{
    width:8px;height:8px;border-radius:50%;flex:none;
    background:var(--n,rgba(150,195,220,.35));box-shadow:0 0 8px -1px var(--n,transparent);
  }
  .sug-opt.n1{--n:#FF8A8A}.sug-opt.n2{--n:#F2B25C}.sug-opt.n3{--n:#4FE0AF}
  .sug-dd-pied{
    display:flex;justify-content:flex-end;padding:6px 4px 2px;margin-top:4px;
    border-top:1px solid rgba(150,195,220,.1);
  }
  .sug-lien{
    font:inherit;font-size:12.5px;color:var(--brume);background:none;border:0;
    padding:6px 8px;border-radius:7px;cursor:pointer;
  }
  .sug-lien:hover{color:var(--os);background:rgba(120,200,230,.08)}
  .sug-effacer{margin-left:4px}
  .sug-resume{margin-left:auto;font-size:12.5px;color:var(--brume)}

  /* ---------- une section ---------- */
  .sug-section{margin-bottom:34px}
  .sug-section[hidden]{display:none}
  .sug-section-tete{
    display:flex;align-items:baseline;gap:12px;
    padding-bottom:10px;margin-bottom:14px;
    border-bottom:1px solid transparent;
    border-image:linear-gradient(90deg,rgba(120,200,220,.34),rgba(120,200,220,.02)) 1;
  }
  .sug-section-tete h2{
    font-family:"Eczar",Georgia,serif;font-size:21px;font-weight:600;margin:0;
  }
  .sug-compte{font-size:12.5px;color:var(--brume);margin-left:auto}

  /* ---------- une ligne ----------
     Une carte par ligne du fichier. Le bouton n'apparaît qu'au survol sur
     grand écran : la liste se parcourt d'abord, on n'agit qu'ensuite - mais
     il reste toujours visible au clavier et au toucher, où il n'y a pas de
     survol pour le faire venir. */
  .sug-ligne{
    position:relative;display:flex;align-items:flex-start;gap:14px;
    padding:14px 16px;margin-bottom:8px;border-radius:13px;
    border:1px solid rgba(150,195,220,.14);
    background:linear-gradient(170deg,rgba(19,34,56,.55),rgba(8,15,26,.55));
    transition:border-color .2s ease,transform .15s ease,background .2s ease,
               box-shadow .2s ease;
  }
  .sug-ligne:hover{
    border-color:rgba(150,195,220,.3);
    background:linear-gradient(170deg,rgba(23,41,66,.7),rgba(10,18,31,.7));
  }
  .sug-ligne.part{opacity:0;transform:translateX(26px)}
  @media (prefers-reduced-motion:no-preference){
    .sug-ligne.part{transition:opacity .28s ease,transform .28s ease}
  }

  /* la pastille : ronde pour une envie, carrée pour un bug - reconnaissable
     sans lire, et sans dépendre de la seule couleur */
  .sug-pion{
    flex:none;width:9px;height:9px;margin-top:7px;border-radius:50%;
    background:var(--plancton);box-shadow:0 0 9px var(--plancton);
  }
  .sug-ligne.bug .sug-pion{
    border-radius:2px;background:#E8788C;box-shadow:0 0 9px rgba(232,120,140,.8);
  }

  /* ---------- l'importance ----------
     Trois niveaux et l'absence de niveau - une ligne que personne n'a
     encore jugée n'est pas « peu pressante », elle n'a rien reçu du tout,
     et elle garde donc exactement l'allure d'avant.

     Une ligne classée le dit trois fois : une barre allumée à gauche, sa
     pastille repeinte, et le mot en clair dans la méta. La couleur seule
     ne dirait rien à qui ne la distingue pas - et un rouge et un vert de
     même clarté, c'est précisément la paire qui se confond le plus. */
  .sug-ligne.p1{--n:#FF8A8A;--n-bord:rgba(255,138,138,.45);--n-fond:rgba(232,106,106,.13)}
  .sug-ligne.p2{--n:#F2B25C;--n-bord:rgba(242,178,92,.45);--n-fond:rgba(232,163,74,.13)}
  .sug-ligne.p3{--n:#4FE0AF;--n-bord:rgba(79,224,175,.42);--n-fond:rgba(63,217,164,.11)}

  /* La barre allumée à gauche est une ombre intérieure, pas un élément posé
     sur le bord : une ombre `inset` suit l'arrondi de la carte, alors qu'un
     ::before de 3px ne peut pas porter un coin de 13px - il restait droit et
     dépassait de la courbe. La seconde ombre est son halo, vers l'intérieur. */
  .sug-ligne.p1,.sug-ligne.p2,.sug-ligne.p3{
    --barre:inset 3px 0 0 var(--n),inset 10px 0 16px -10px var(--n);
    box-shadow:var(--barre);
    border-color:var(--n-bord);
    background:
      linear-gradient(100deg,var(--n-fond),rgba(8,15,26,.55) 46%),
      linear-gradient(170deg,rgba(19,34,56,.55),rgba(8,15,26,.55));
  }
  .sug-ligne.p1:hover,.sug-ligne.p2:hover,.sug-ligne.p3:hover{
    border-color:var(--n);
    box-shadow:var(--barre),0 0 26px -12px var(--n);
  }
  .sug-ligne.p1 .sug-pion,.sug-ligne.p2 .sug-pion,.sug-ligne.p3 .sug-pion{
    background:var(--n);box-shadow:0 0 10px var(--n);
  }
  .sug-prio{
    padding:1px 8px;border-radius:999px;font-weight:500;
    color:var(--n);border:1px solid var(--n-bord);background:var(--n-fond);
  }

  /* le sélecteur : trois pastilles chiffrées, au même endroit et sous la
     même règle que Copier et Résolu - on parcourt d'abord, on classe
     ensuite. L'état, lui, reste lisible sans survol grâce à la barre. */
  .sug-niveaux{display:flex;gap:4px;align-items:center}
  .sug-niv{
    font:inherit;font-size:11.5px;line-height:1;width:23px;height:23px;
    padding:0;border-radius:50%;cursor:pointer;
    color:var(--brume);border:1px solid rgba(150,195,220,.2);
    background:rgba(3,8,15,.6);
    opacity:.45;transition:opacity .18s ease,color .2s ease,border-color .2s ease,
                         background .2s ease,box-shadow .2s ease;
  }
  .sug-niv.n1{--n:#FF8A8A}
  .sug-niv.n2{--n:#F2B25C}
  .sug-niv.n3{--n:#4FE0AF}
  .sug-ligne:hover .sug-niv,.sug-niv:focus-visible{opacity:1}
  .sug-niv:hover{color:var(--n);border-color:var(--n);box-shadow:0 0 12px -3px var(--n)}
  .sug-niv[aria-pressed="true"]{
    color:#04101A;font-weight:600;
    background:var(--n);border-color:var(--n);box-shadow:0 0 14px -3px var(--n);
  }
  .sug-niv:focus-visible{outline:2px solid var(--plancton);outline-offset:2px}
  .sug-niv[disabled]{cursor:progress}
  @media (hover:none){ .sug-niv{opacity:1} }

  .sug-corps{flex:1;min-width:0}
  .sug-texte{margin:0;font-size:14.5px;line-height:1.55;word-break:break-word}
  .sug-meta{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    margin-top:7px;font-size:11.5px;color:var(--brume);
  }
  .sug-auteur{color:#9FC4DA}
  .sug-etiq{
    padding:1px 8px;border-radius:999px;
    border:1px solid rgba(150,195,220,.2);
  }
  .sug-ligne.bug .sug-etiq{border-color:rgba(232,120,140,.4);color:#E8A9B6}
  .sug-main{opacity:.55}       /* écrite à la main : pas de compte derrière */

  /* ---------- les actions d'une ligne ----------
     Copier et Résolu étaient deux jumeaux collés : même taille, même gris,
     six pixels d'écart, et tous deux invisibles jusqu'au survol - ils
     apparaissaient sous la souris au moment où elle arrivait, et le clic
     partait sur celui qui se trouvait là. Or ils ne pèsent pas pareil :
     l'un ne touche à rien, l'autre efface la ligne du fichier.

     Trois zones maintenant, de gauche à droite, dans l'ordre du travail :
     classer, copier, puis - loin, derrière un trait - résoudre.

       - toujours visibles, un peu éteints hors survol : un bouton qu'on
         voit avant d'y aller ne se fait pas cliquer par surprise ;
       - Résolu est vert, porte une coche, et se tient à l'écart ;
       - Copier porte l'icône du presse-papiers et reste neutre. */
  .sug-boutons{display:flex;align-items:center;gap:6px;flex:none}
  .sug-fait,.sug-copier{
    display:inline-flex;align-items:center;gap:6px;
    font:inherit;font-size:12.5px;padding:6px 13px;border-radius:999px;
    color:var(--brume);border:1px solid rgba(150,195,220,.2);
    background:rgba(3,8,15,.6);cursor:pointer;white-space:nowrap;
    opacity:.6;transition:opacity .18s ease,color .2s ease,border-color .2s ease,background .2s ease;
  }
  .sug-fait svg,.sug-copier svg{flex:none}
  .sug-ligne:hover .sug-fait,.sug-ligne:hover .sug-copier,
  .sug-fait:focus-visible,.sug-copier:focus-visible{opacity:1}
  /* le trait qui met Résolu à part : un vrai vide, pas un simple écart */
  .sug-sep{
    width:1px;align-self:stretch;margin:2px 10px 2px 8px;
    background:rgba(150,195,220,.16);
  }
  .sug-fait{
    color:#8FE0B0;border-color:rgba(143,224,176,.32);background:rgba(143,224,176,.05);
  }
  .sug-fait:hover{
    color:#B6F0CE;border-color:rgba(143,224,176,.65);background:rgba(143,224,176,.14);
  }
  .sug-copier:hover{
    color:var(--os);border-color:rgba(120,200,230,.55);background:rgba(120,200,230,.1);
  }
  .sug-copier.fait{color:#9FC4DA;border-color:rgba(120,200,230,.5);opacity:1}
  .sug-fait:focus-visible,.sug-copier:focus-visible{outline:2px solid var(--plancton);outline-offset:2px}

  /* Une ligne déjà copiée le garde écrit, tant que la page reste ouverte :
     on copie, on part corriger ailleurs, on revient - et c'est cette carte
     qui dit « c'est moi que tu viens de traiter ». Son Résolu s'allume,
     puisque c'est le geste qui suit. */
  .sug-copiee-marque{
    display:none;padding:1px 8px;border-radius:999px;
    color:#9FC4DA;border:1px solid rgba(120,200,230,.4);background:rgba(120,200,230,.08);
  }
  .sug-ligne.copiee .sug-copiee-marque{display:inline-block}
  .sug-ligne.copiee .sug-fait{opacity:1;border-color:rgba(143,224,176,.6)}

  /* Sans survol, tout reste pleinement visible. */
  @media (hover:none){ .sug-fait,.sug-copier,.sug-niv{opacity:1} }
  /* Sur téléphone, les boutons passent dessous : classer et copier à
     gauche, Résolu poussé tout au bout de la ligne, le pouce loin de l'un
     quand il vise l'autre. */
  @media (max-width:640px){
    .sug-ligne{flex-wrap:wrap}
    .sug-boutons{width:100%;margin-left:23px;margin-top:10px}
    .sug-sep{margin-left:auto;background:none;margin-right:0}
  }

  /* ---------- le toast et son « Annuler » ---------- */
  .toast.montre{pointer-events:auto}
  .toast-action{
    font:inherit;font-size:13px;font-weight:500;margin-left:14px;padding:3px 11px;
    border-radius:999px;cursor:pointer;
    color:var(--os);border:1px solid rgba(120,200,230,.5);background:rgba(120,200,230,.12);
  }
  .toast-action:hover{background:rgba(120,200,230,.24)}

  /* ---------- états ---------- */
  .sug-etat{
    padding:44px 20px;text-align:center;color:var(--brume);font-size:14px;
    border:1px dashed rgba(150,195,220,.18);border-radius:14px;
  }
  .sug-etat b{display:block;font-size:16px;color:var(--os);margin-bottom:6px}
  #gate{max-width:46ch}
</style>
</head>
<body>
<canvas id="neige" aria-hidden="true"></canvas>

<div class="enveloppe">

  <div class="barre">
    <a class="back" href="/abyss" aria-label="Retour à Abyss">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </a>
    <div class="compte" id="compte"><!-- rempli par static/commun/compte.js --></div>
  </div>

  <main id="corps" hidden>
    <header class="sug-entete">
      <h1 class="sug-titre">Suggestions</h1>
    </header>

    <div class="sug-filtres" id="filtres"></div>
    <div id="listes"></div>
  </main>

  <section class="carte-profil" id="gate" hidden>
    <h2>Rien à voir ici</h2>
    <p class="explication">Cette page est réservée à l'administration du site.</p>
    <p><a class="lien" href="/abyss">Retour à Abyss</a></p>
  </section>
</div>

<div class="toast" id="toast" hidden></div>

<!-- le bouton de compte : un seul dessin pour toutes les pages d'Abyss.
     Chargé avant le script de la page, qui l'appelle dès la réponse de
     /api/moi - un defer arriverait peut-être trop tard. -->
<script src="/static/commun/compte.js"></script>
<script>
const el = (id) => document.getElementById(id);
const echappe = (s) => String(s === null || s === undefined ? "" : s)
  .replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;",
                                 '"': "&quot;", "'": "&#39;" }[c]));

let MOI = { connecte: false, utilisateur: null };
let SECTIONS = [];
/* Les lignes copiées depuis l'ouverture de la page, par leur texte exact.
   En mémoire seulement : c'est un repère pour la séance de travail en
   cours, pas un état à garder. */
const COPIEES = new Set();

const ICONE_COPIE = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
const ICONE_COCHE = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
/* Les filtres : une liste de valeurs cochées par menu. Vide = tout. */
const FILTRES = { genre: new Set(), niveau: new Set(), page: new Set() };
let MENU_OUVERT = null;       // la clé du menu déroulé, ou null

/* Les trois niveaux d'importance. 0 n'y est pas : ce n'est pas un quatrième
   niveau mais l'absence de tri, et il n'a donc ni couleur ni nom. */
const NIVEAUX = [
  { n: 1, nom: "Urgent",    titre: "Urgent - à faire d'abord" },
  { n: 2, nom: "Important", titre: "Important - mais ça peut attendre l'urgent" },
  { n: 3, nom: "Plus tard", titre: "Plus tard - quand le reste sera fait" },
];
const niveauDe = (l) => NIVEAUX.find((v) => v.n === l.priorite) || null;
/* Les non classées ferment la marche : elles n'ont pas été jugées moins
   pressantes, on ne sait juste pas encore. */
const rang = (l) => (niveauDe(l) ? l.priorite : 9);

async function api(chemin, methode, charge) {
  const options = { method: methode || "GET", credentials: "same-origin" };
  if (charge !== undefined) {
    options.headers = { "Content-Type": "application/json" };
    options.body = JSON.stringify(charge);
  }
  const r = await fetch(chemin, options);
  let data = null;
  try { data = await r.json(); } catch (e) { /* réponse illisible */ }
  if (!r.ok || !data || data.ok === false) {
    throw new Error((data && data.message) || "Le serveur n'a pas répondu.");
  }
  return data;
}

/* ---------- toast ---------- */
let minuteurToast = null;
function toast(message, mauvais, action) {
  const t = el("toast");
  t.textContent = message;
  /* Une action dans le toast : « Annuler » après un Résolu. Le toast reste
     alors le temps du délai de grâce, pas les 3,6 secondes habituelles. */
  if (action) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "toast-action";
    b.textContent = action.nom;
    b.addEventListener("click", () => {
      action.faire();
      t.className = "toast"; t.hidden = true;
    });
    t.appendChild(b);
  }
  t.className = "toast montre" + (mauvais ? " mauvais" : "");
  t.hidden = false;
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => { t.className = "toast"; t.hidden = true; },
                             action ? GRACE_MS : 3600);
}

/* ---------- menu du compte ----------
   Dessiné par static/commun/compte.js, comme sur les trois autres pages d'Abyss.
   La copie qui vivait ici n'avait ni chevron ni « Monitoring », et son
   pseudo débordait faute du <span> qui le coupe : de quoi croire, en
   arrivant depuis le hub, qu'on avait changé de site.

   Aucun réglage à passer : la page exige un compte, et se déconnecter
   renvoie sur /abyss - le défaut de compte.js. */

/* =========================================================
   La liste
   ========================================================= */
function dateCourte(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleDateString("fr-FR",
    { day: "numeric", month: "short", year: "numeric" });
}

/* Ce que chaque ligne vaut pour chacun des trois menus. La page d'une
   section est son titre : c'est ce qu'on lit, et deux sections n'en ont
   jamais le même. */
const valeurs = (ligne, section) => ({
  genre: ligne.genre === "bug" ? "bug" : "suggestion",
  niveau: String(niveauDe(ligne) ? ligne.priorite : 0),
  page: section.titre,
});

/* Une ligne passe si, dans chaque menu, rien n'est coché ou sa valeur l'est.
   `sauf` ignore un menu : c'est ce qui permet de compter, dans un menu,
   ce que chaque case donnerait avec les AUTRES filtres en place.

   Le filtre s'applique à une ligne, jamais à une section : masquer une
   section entière ferait disparaître son titre et on ne saurait plus d'où
   viennent les lignes restantes. */
function retenue(ligne, section, sauf) {
  const v = valeurs(ligne, section);
  return Object.keys(FILTRES).every((cle) =>
    cle === sauf || !FILTRES[cle].size || FILTRES[cle].has(v[cle]));
}

const CHEVRON = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;

function menus() {
  return [
    { cle: "genre", nom: "Type", options: [
        { v: "suggestion", nom: "Idées" }, { v: "bug", nom: "Bugs" }] },
    { cle: "niveau", nom: "Importance", options: [
        ...NIVEAUX.map((x) => ({ v: String(x.n), nom: x.nom, classe: "n" + x.n })),
        { v: "0", nom: "Non classée" }] },
    { cle: "page", nom: "Page", options: SECTIONS.map((s) => ({ v: s.titre, nom: s.titre })) },
  ];
}

function dessineFiltres() {
  /* Les comptes : pour chaque case, les lignes qu'elle montrerait avec les
     filtres des deux autres menus. Une case à zéro reste cochable mais
     s'éteint - on voit tout de suite qu'elle viderait la liste. */
  const comptes = { genre: {}, niveau: {}, page: {} };
  let visibles = 0, total = 0;
  SECTIONS.forEach((s) => s.lignes.forEach((l) => {
    total++;
    if (retenue(l, s)) visibles++;
    const v = valeurs(l, s);
    Object.keys(comptes).forEach((cle) => {
      if (retenue(l, s, cle)) comptes[cle][v[cle]] = (comptes[cle][v[cle]] || 0) + 1;
    });
  }));
  const actifs = Object.values(FILTRES).some((f) => f.size);

  el("filtres").innerHTML = menus().map((m) => {
    const choisis = m.options.filter((o) => FILTRES[m.cle].has(o.v));
    const resume = !choisis.length ? "Tous"
      : choisis.length === 1 ? choisis[0].nom : `${choisis.length} choisis`;
    const ouvert = MENU_OUVERT === m.cle;
    return `
    <div class="sug-dd${choisis.length ? " actif" : ""}" data-menu="${m.cle}">
      <button type="button" class="sug-dd-btn" aria-haspopup="true" aria-expanded="${ouvert}">
        ${echappe(m.nom)} · <b>${echappe(resume)}</b>${CHEVRON}</button>
      <div class="sug-dd-panneau" ${ouvert ? "" : "hidden"}>
        ${m.options.map((o) => {
          const n = comptes[m.cle][o.v] || 0;
          return `<label class="sug-opt${o.classe ? " " + o.classe : ""}${n ? "" : " zero"}">
            <input type="checkbox" value="${echappe(o.v)}"${FILTRES[m.cle].has(o.v) ? " checked" : ""}>
            ${m.cle === "niveau" ? "<i></i>" : ""}<span>${echappe(o.nom)}</span><b>${n}</b></label>`;
        }).join("")}
        ${choisis.length ? `<div class="sug-dd-pied">
          <button type="button" class="sug-lien" data-vider="${m.cle}">Tout afficher</button></div>` : ""}
      </div>
    </div>`;
  }).join("") + `
    ${actifs ? '<button type="button" class="sug-lien sug-effacer" data-vider="*">Effacer les filtres</button>' : ""}
    <span class="sug-resume">${actifs ? `${visibles} sur ${total}` : `${total} ligne${total > 1 ? "s" : ""}`}</span>`;

  el("filtres").querySelectorAll(".sug-dd").forEach((dd) => {
    const cle = dd.dataset.menu;
    dd.querySelector(".sug-dd-btn").addEventListener("click", () => {
      MENU_OUVERT = MENU_OUVERT === cle ? null : cle;
      dessineFiltres();
    });
    dd.querySelectorAll("input").forEach((c) => {
      c.addEventListener("change", () => {
        if (c.checked) FILTRES[cle].add(c.value); else FILTRES[cle].delete(c.value);
        dessine();               // le menu reste ouvert : on coche souvent deux cases d'affilée
      });
    });
  });
  el("filtres").querySelectorAll("[data-vider]").forEach((b) => {
    b.addEventListener("click", () => {
      const cle = b.dataset.vider;
      (cle === "*" ? Object.keys(FILTRES) : [cle]).forEach((k) => FILTRES[k].clear());
      if (cle === "*") MENU_OUVERT = null;
      dessine();
    });
  });
}

/* Un clic hors des menus, ou Échap, referme celui qui est ouvert. */
document.addEventListener("click", (e) => {
  if (MENU_OUVERT && !e.target.closest(".sug-dd")) { MENU_OUVERT = null; dessineFiltres(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && MENU_OUVERT) { MENU_OUVERT = null; dessineFiltres(); }
});

function dessine() {
  dessineFiltres();
  const zone = el("listes");
  const vides = SECTIONS.every((s) => !s.lignes.length);
  if (vides) {
    zone.innerHTML = `<p class="sug-etat"><b>Rien en attente.</b>
      Tout ce qui a été proposé est fait - ou le fichier est vide.</p>`;
    return;
  }

  let rendues = 0;
  zone.innerHTML = SECTIONS.map((s, si) => {
    /* L'urgent remonte, dans chaque section séparément - classer une ligne
       n'a d'intérêt que si la page s'en sert pour dire par quoi commencer.
       Le fichier, lui, garde l'ordre d'arrivée : c'est un affichage, pas
       une réécriture. À niveau égal l'ordre du fichier tient (le tri de
       JavaScript est stable). */
    const lignes = s.lignes.filter((l) => retenue(l, s))
                           .sort((a, b) => rang(a) - rang(b));
    rendues += lignes.length;
    if (!lignes.length) return "";
    return `
      <section class="sug-section">
        <div class="sug-section-tete">
          <h2>${echappe(s.titre)}</h2>
          <span class="sug-compte">${lignes.length} ligne${lignes.length > 1 ? "s" : ""}</span>
        </div>
        ${lignes.map((l) => {
          const v = niveauDe(l);
          return `
          <article class="sug-ligne${l.genre === "bug" ? " bug" : ""}${v ? " p" + v.n : ""}${COPIEES.has(l.texte) ? " copiee" : ""}"
                   data-s="${si}" data-texte="${echappe(l.texte)}">
            <span class="sug-pion" aria-hidden="true"></span>
            <div class="sug-corps">
              <p class="sug-texte">${echappe(l.message)}</p>
              <div class="sug-meta">
                ${v ? `<span class="sug-prio">${echappe(v.nom)}</span>` : ""}
                <span class="sug-etiq">${l.genre === "bug" ? "Bug" : "Idée"}</span>
                ${l.pseudo ? `<span class="sug-auteur">${echappe(l.pseudo)}</span>` : ""}
                ${l.creeLe ? `<span>${echappe(dateCourte(l.creeLe))}</span>` : ""}
                ${l.duSite ? "" : '<span class="sug-main">écrite à la main</span>'}
                <span class="sug-copiee-marque">copiée</span>
              </div>
            </div>
            <div class="sug-boutons">
              <div class="sug-niveaux" role="group" aria-label="Importance">
                ${NIVEAUX.map((x) => `
                  <button type="button" class="sug-niv n${x.n}" data-n="${x.n}"
                          aria-pressed="${l.priorite === x.n}"
                          title="${echappe(x.titre)}${l.priorite === x.n ? " (cliquer pour retirer)" : ""}"
                          aria-label="${echappe(x.nom)}">${x.n}</button>`).join("")}
              </div>
              <button type="button" class="sug-copier">${ICONE_COPIE}<span>Copier</span></button>
              <span class="sug-sep" aria-hidden="true"></span>
              <button type="button" class="sug-fait">${ICONE_COCHE}<span>Résolu</span></button>
            </div>
          </article>`; }).join("")}
      </section>`;
  }).join("");

  if (!rendues) {
    zone.innerHTML = '<p class="sug-etat"><b>Rien avec ces filtres.</b>Décoche une case, ou efface les filtres.</p>';
    return;
  }
  zone.querySelectorAll(".sug-fait").forEach((b) => {
    b.addEventListener("click", () => resoudre(b));
  });
  zone.querySelectorAll(".sug-copier").forEach((b) => {
    b.addEventListener("click", () => copier(b));
  });
  zone.querySelectorAll(".sug-niv").forEach((b) => {
    b.addEventListener("click", () => classer(b));
  });
}

/* Copier le message seul, pas la ligne entière du fichier : « Jokrem - »
   devant, c'est du bruit dès qu'on colle ailleurs. Le texte copié est celui
   qu'on lit dans la carte, sans surprise.

   navigator.clipboard demande un contexte sécurisé - https ou localhost.
   Les deux sont vrais ici, mais un navigateur peut aussi refuser la
   permission : le repli par <textarea> couvre ce cas plutôt que de laisser
   un bouton qui ne fait rien sans rien dire. */
async function copier(bouton) {
  const carte = bouton.closest(".sug-ligne");
  const texte = carte.querySelector(".sug-texte").textContent;
  let pose = false;
  try {
    await navigator.clipboard.writeText(texte);
    pose = true;
  } catch (e) {
    const zone = document.createElement("textarea");
    zone.value = texte;
    /* hors écran plutôt que hidden : un champ vraiment invisible ne peut
       pas être sélectionné, et la copie ne prendrait rien */
    zone.setAttribute("style", "position:fixed;top:-1000px;opacity:0");
    document.body.appendChild(zone);
    zone.select();
    try { pose = document.execCommand("copy"); } catch (e2) { pose = false; }
    zone.remove();
  }
  if (!pose) { toast("Copie refusée par le navigateur.", true); return; }
  COPIEES.add(carte.dataset.texte);
  carte.classList.add("copiee");
  const mot = bouton.querySelector("span");
  mot.textContent = "Copié";
  bouton.classList.add("fait");
  clearTimeout(bouton._minuteur);
  bouton._minuteur = setTimeout(() => {
    mot.textContent = "Copier";
    bouton.classList.remove("fait");
  }, 1600);
}

/* Classer une ligne. Cliquer le niveau qu'elle porte déjà la déclasse :
   c'est le seul geste possible pour revenir en arrière, et il tombe sous le
   doigt qui vient de se tromper.

   Comme pour « Résolu », on attend le serveur : c'est le fichier qui décide,
   et une couleur posée puis reprise parce que l'écriture a échoué serait
   pire que la demi-seconde d'attente. Le texte de la ligne change avec son
   niveau (la marque [!n] en fait partie) - d'où le renvoi du serveur, qui
   évite de recharger toute la page pour retrouver comment la désigner. */
async function classer(bouton) {
  const carte = bouton.closest(".sug-ligne");
  const section = SECTIONS[+carte.dataset.s];
  const texte = carte.dataset.texte;
  const ligne = section.lignes.find((l) => l.texte === texte);
  if (!ligne) return;
  const voulu = +bouton.dataset.n === ligne.priorite ? 0 : +bouton.dataset.n;

  const boutons = carte.querySelectorAll(".sug-niv");
  boutons.forEach((b) => { b.disabled = true; });
  let reponse;
  try {
    reponse = await api("/api/changement/priorite", "POST",
                        { projet: section.projet, texte: texte, priorite: voulu });
  } catch (err) {
    boutons.forEach((b) => { b.disabled = false; });
    toast(err.message, true);
    return;
  }
  ligne.priorite = voulu;
  // la marque [!n] fait partie du texte : la ligne copiée garde son repère
  if (COPIEES.delete(texte)) COPIEES.add(reponse.texte);
  ligne.texte = reponse.texte;
  dessine();
}

/* ---------- Résolu, avec un délai de grâce ----------
   Résolu efface la ligne du fichier, et il n'y a pas de retour en arrière
   côté serveur. Plutôt qu'une confirmation à chaque fois - un second clic
   qu'on finit par faire les yeux fermés - la ligne quitte l'écran tout de
   suite, et l'écriture ne part qu'après GRACE_MS. D'ici là, « Annuler »
   dans le toast la remet exactement où elle était.

   Si l'écriture échoue au bout du délai, la ligne revient avec le message :
   rien n'a été effacé. Et une page qu'on ferme pendant le délai envoie ce
   qui attend (keepalive) - fermer l'onglet n'est pas annuler. */
const GRACE_MS = 6000;
const EN_ATTENTE = new Map();       // texte -> { section, ligne, rang, minuteur }

function envoieResolu(texte) {
  const a = EN_ATTENTE.get(texte);
  if (!a) return;
  EN_ATTENTE.delete(texte);
  api("/api/changement/resolu", "POST", { projet: a.section.projet, texte: texte })
    .catch((err) => {
      remet(a);
      toast(`Pas retirée : ${err.message}`, true);
    });
}

function remet(a) {
  const lignes = a.section.lignes;
  if (!lignes.some((l) => l.texte === a.ligne.texte)) {
    lignes.splice(Math.min(a.rang, lignes.length), 0, a.ligne);
  }
  dessine();
}

function resoudre(bouton) {
  const carte = bouton.closest(".sug-ligne");
  const section = SECTIONS[+carte.dataset.s];
  const texte = carte.dataset.texte;
  const rang = section.lignes.findIndex((l) => l.texte === texte);
  if (rang < 0 || EN_ATTENTE.has(texte)) return;
  const ligne = section.lignes[rang];

  section.lignes.splice(rang, 1);
  const a = { section, ligne, rang, minuteur: 0 };
  a.minuteur = setTimeout(() => envoieResolu(texte), GRACE_MS);
  EN_ATTENTE.set(texte, a);

  carte.classList.add("part");
  setTimeout(() => { dessine(); }, 280);

  const extrait = ligne.message.length > 48 ? ligne.message.slice(0, 46) + "…" : ligne.message;
  toast(`Résolu : « ${extrait} »`, false, {
    nom: "Annuler",
    faire: () => {
      if (!EN_ATTENTE.has(texte)) return;
      clearTimeout(a.minuteur);
      EN_ATTENTE.delete(texte);
      remet(a);
    },
  });
}

window.addEventListener("pagehide", () => {
  EN_ATTENTE.forEach((a, texte) => {
    clearTimeout(a.minuteur);
    fetch("/api/changement/resolu", {
      method: "POST", credentials: "same-origin", keepalive: true,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ projet: a.section.projet, texte: texte }),
    });
  });
  EN_ATTENTE.clear();
});

(async function () {
  let data;
  try { data = await api("/api/moi"); }
  catch (e) { el("gate").hidden = false; return; }

  MOI = { connecte: !!data.connecte, utilisateur: data.utilisateur };
  Compte.dessine(MOI);
  if (!MOI.connecte || !MOI.utilisateur.admin) { el("gate").hidden = false; return; }

  try {
    const d = await api("/api/changements");
    SECTIONS = d.sections || [];
  } catch (e) {
    el("gate").hidden = false;
    return;
  }
  dessine();
  el("corps").hidden = false;
})();


</script>
<script src="/static/commun/neige.js" defer></script>
