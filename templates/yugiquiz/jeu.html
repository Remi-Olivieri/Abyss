<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yu-Gi-Quiz!</title>
    <!-- le logo du site : voir static/commun/logo/ -->
    <link rel="icon" href="/static/commun/logo/favicon.ico" sizes="32x32">
    <link rel="icon" href="/static/commun/logo/abyss-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/static/commun/logo/abyss-180.png">
<link rel="manifest" href="/static/commun/manifest.webmanifest">
    <link rel="stylesheet" href="/static/yugiquiz/yugiquiz.css">
</head>
<body>
    
    <header>
        <div class="header-content">
            <h1>
                <span class="title-main" id="title-leave" role="button" tabindex="0" aria-label="Quitter la partie">Yu-Gi-Quiz!</span>
            </h1>
        </div>
        <div class="header-info">
            <div id="game-info" class="game-info">
                <span id="info-score-to-win"></span>
                <span id="info-difficulty"></span>
            </div>
            <p id="pseudo" class="user-badge"></p>
        </div>
    </header>
    
    <div id="players-list">
        <div class="players-header">
            <div class="millennium-eye"></div>
            <span>Duellistes</span>
        </div>
        <ul id="players"></ul>
    </div>

    <div class="container" id="main-content">
        
        <div id="timer" class="timer-container">
            <div class="timer-label">Temps Restant</div>
            <div class="timer-bar">
                <div class="timer"></div>
            </div>
        </div>
        
        <div id="card-container">
            <div class="card-frame">
                <div id="card-rotator">
                    <!-- remplacee a chaque carte par une image deja chargee :
                         voir poseCarte -->
                    <img id="card" class="card zoom-effect artwork cachee" alt="" draggable="false">
                    <div class="card__glare mask-image zoom-effect"></div>
                </div>
            </div>
        </div>
        
        <div class="input-section">
            <div class="input-wrapper" style="position: relative;">
                <input type="text" maxlength="80" id="user_answer" class="user-input" placeholder="Entre le nom de la carte..." autocomplete="off"
                       spellcheck="false" role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" aria-label="Nom de la carte">
                <ul id="suggestions" role="listbox" aria-label="Suggestions"></ul>
                <div class="input-glow"></div>
            </div>
            <p id="image_name" class="response"></p>
        </div>
    </div>

    <div id="loading-message">
        <div class="loading-content">
            <div class="millennium-loader">
                <div class="loader-ring"></div>
            </div>
            <div class="loading-text">
                <p>Préparation du Duel...</p>
            </div>
        </div>
    </div>

    <div id="leave-overlay">
        <div class="leave-dialog" role="dialog" aria-modal="true" aria-labelledby="leave-titre">
            <div class="leave-dialog-title" id="leave-titre">Quitter la partie ?</div>
            <p class="leave-dialog-sub">Tu retourneras au lobby. Ton score sera perdu.</p>
            <div class="leave-dialog-btns">
                <button class="leave-confirm-btn" onclick="confirmLeave()">Quitter</button>
                <button class="leave-cancel-btn" onclick="closeLeaveDialog()">Annuler</button>
            </div>
        </div>
    </div>

    <div id="gameover-overlay">
        <div class="leave-dialog" role="dialog" aria-modal="true" aria-labelledby="gameover-titre">
            <div class="leave-dialog-title" id="gameover-titre">Fin de partie !</div>
            <p class="leave-dialog-sub" id="gameover-msg"></p>
            <div class="leave-dialog-btns">
                <button class="leave-confirm-btn" onclick="window.location.href='/yugiquiz'">Retour au lobby</button>
            </div>
        </div>
    </div>

    <!-- le battement de presence : voir static/commun/presence.js -->
    <script src="/static/commun/presence.js"></script>
    <script src="/static/commun/vendor/socket.io-4.1.2.min.js"></script>
    <!-- le piege de focus des dialogues -->
    <script src="/static/yugiquiz/commun.js"></script>
    <script>
        var ROOM_ID = "{{ room_id }}";

        /* Clic droit sur l'artwork : bloque. « Rechercher cette image » donne
           le nom de la carte, c'est-a-dire tout le jeu. Un garde-fou et pas
           une serrure -- l'image reste a portee d'un onglet reseau -- mais
           c'est le geste qui gache une manche sans meme vouloir tricher. */
        document.addEventListener('contextmenu', (e) => {
            if (e.target.closest('#card-container img')) e.preventDefault();
        });

        var pseudo;
        var player_scores = {};
        const socket = io();

        /* Le nom de la carte n'est plus connu d'ici : il arrive dans
           mancheFinie, une fois les reponses closes. La page recevait avant
           celui de la carte en cours ET de la suivante des le debut du tour,
           et decidait elle-meme si la reponse etait bonne -- il n'y avait
           donc rien a deviner, et rien a gagner honnetement. Elle ne connait
           desormais que des jetons opaques (voir jeton_pour cote serveur) :
           meme l'URL de l'image ne dit plus quelle carte c'est. */
        let jetonCourant = '';
        let jetonSuivant = '';
        let aRepondu = false;     // reponse envoyee pour la manche en cours
        let mancheRevelee = false;

        let answerLocked = false;
        let timeleft = 0;

        let timerCompte = null;   // reference du decompte en cours
        let GAME_TIME = 15;
        let SCORE_TO_WIN = 30;
        var gameReady = false;

        /* Le numero de la manche a l'ecran. Une image arrive quand elle
           peut : celle qui finit de charger apres le passage a la carte
           suivante n'a plus rien a afficher, et c'est ce numero qui le dit. */
        let manche = 0;
        /* L'artwork de la carte d'apres, telecharge et decode pendant qu'on
           joue celle-ci : { jeton, image }, image etant une promesse. */
        let suivante = null;

        const DIFFICULTY_LABELS = { '1': 'Facile', '2': 'Normal', '3': 'Difficile', '4': 'Toutes les cartes' };

        const urlImage = (jeton) => `/api/yugiquiz/image/${ROOM_ID}/${jeton}`;

        const answerInput = document.getElementById('user_answer');
        const suggestionsList = document.getElementById('suggestions');

        /* Une image telechargee et decodee hors de la page, qui n'attend plus
           que de prendre la place de la carte (voir poseCarte). Rejetee si
           le serveur la refuse : un jeton perime, une manche deja passee. */
        function prepare(url) {
            return new Promise((ok, ko) => {
                const img = new Image();
                img.onload = () => {
                    /* decode() garantit une premiere frame qui n'est pas
                       vide ; un navigateur qui le refuse a quand meme
                       l'image, on la prend telle quelle */
                    const decode = img.decode ? img.decode().catch(() => {}) : Promise.resolve();
                    decode.then(() => ok(img));
                };
                img.onerror = ko;
                img.src = url;
            });
        }

        /* Met une image prete a la place de la carte.

           La revelation changeait le src de la carte ET sa taille, d'un seul
           geste. La taille s'appliquait tout de suite, l'image seulement a
           l'arrivee de la carte entiere -- qu'on ne peut pas precharger,
           puisque le serveur ne la sert qu'une fois la manche close. Entre
           les deux, le navigateur etirait l'artwork carre a la hauteur de la
           carte, zoom compris : une illustration geante, puis la carte, qui
           rebondissait jusqu'a sa taille. On remplace maintenant l'element
           entier par une image deja la : la premiere frame a la fois la
           bonne image et la bonne taille.

           Le mouvement, lui, reste celui d'avant. L'artwork arrive a
           l'echelle 1 et grossit jusqu'au zoom ; la carte entiere arrive au
           zoom de l'artwork et revient a l'echelle 1, avec le rebond de
           .zoom-effect. Dans les deux cas l'element est pose a l'echelle de
           depart, et la transition part a la frame suivante : il lui faut un
           point de depart. */
        function poseCarte(img, pleine) {
            img.id = 'card';
            img.alt = pleine ? 'La carte' : 'Artwork à deviner';
            img.draggable = false;
            img.className = 'card zoom-effect ' + (pleine ? 'pleine zoomed' : 'artwork');
            document.getElementById('card').replaceWith(img);

            const glare = document.querySelector('.card__glare');
            glare.classList.toggle('zoomed', pleine);
            void img.offsetWidth;
            img.classList.toggle('zoomed', !pleine);
            glare.classList.toggle('zoomed', !pleine);
        }

        /* En attendant l'image d'une nouvelle manche : rien, plutot que la
           carte d'avant -- qui porte son nom en toutes lettres, et qu'on
           prendrait pour l'enigme. */
        function cacheCarte() {
            document.getElementById('card').classList.add('cachee');
        }

        function dezoome() {
            document.getElementById('card').classList.remove('zoomed');
            document.querySelector('.card__glare').classList.remove('zoomed');
        }

        /* Range le jeton de la carte d'apres et commence a la telecharger. */
        function prepareSuivante(jeton) {
            jetonSuivant = jeton || '';
            suivante = jetonSuivant ? { jeton: jetonSuivant, image: prepare(urlImage(jetonSuivant)) } : null;
            if (suivante) suivante.image.catch(() => {});
        }

        /* L'artwork de ce jeton : celui qu'on a deja prepare, sinon un neuf. */
        function imageDe(jeton) {
            return (suivante && suivante.jeton === jeton) ? suivante.image : prepare(urlImage(jeton));
        }

        /* Envoie ce qui est dans le champ, une fois pour la manche. Le serveur
           corrige et ne repond rien : dire ici si c'est juste reviendrait a le
           dire pendant que les autres cherchent encore. */
        function envoieReponse() {
            if (aRepondu || mancheRevelee) return;
            aRepondu = true;
            socket.emit('userAnswer', {
                answer: answerInput.value,
                roomId: ROOM_ID
            });
        }

        /* Fin de manche, annoncee par le serveur : c'est le seul moment ou le
           nom de la carte arrive, avec les reponses de chacun.

           Le nom attend la carte entiere pour sortir avec elle, mais une
           seconde au plus : une image qui traine ne retient pas la reponse. */
        function reveleManche(data) {
            if (mancheRevelee) return;
            mancheRevelee = true;
            const m = manche;

            stopCompte();
            verrouilleChamp();
            document.getElementById('timer').style.display = "none";
            answerInput.style.display = "none";
            answerInput.value = "";

            let dit = false;
            const annonce = () => {
                if (dit || m !== manche) return;
                dit = true;
                const nom = document.getElementById('image_name');
                nom.textContent = data.correct_name || '';
                nom.style.display = "block";
                (data.resultats || []).forEach(afficheReponse);
                if (data.scores) majScores(data.scores);
            };

            (jetonCourant ? prepare(urlImage(jetonCourant) + '/pleine') : Promise.reject())
                .then(img => { if (m === manche) poseCarte(img, true); })
                // pas de carte entiere : l'artwork reste, a sa taille
                .catch(() => { if (m === manche) dezoome(); })
                .finally(annonce);
            setTimeout(annonce, 1000);
        }

        /* La carte suivante, annoncee par le serveur avec ses jetons : celui
           de la carte a deviner, et celui de la prochaine, a precharger. */
        function next(data) {
            manche++;
            const m = manche;
            mancheRevelee = false;
            aRepondu = false;
            unlockAnswer();

            document.querySelectorAll('#players li.answer-locked, #players li.answer-correct, #players li.answer-wrong')
                .forEach(li => li.classList.remove('answer-locked', 'answer-correct', 'answer-wrong'));
            document.querySelectorAll('#players .player-response').forEach(el => el.remove());
            document.getElementById('image_name').style.display = "none";

            jetonCourant = (data && data.jeton) || jetonSuivant;
            const image = imageDe(jetonCourant);
            prepareSuivante(data && data.jeton_suivant);

            /* deja prechargee, l'image passe avant la prochaine frame et
               cacheCarte ne se voit jamais */
            cacheCarte();
            image.then(img => { if (m === manche) poseCarte(img, false); }).catch(() => {});

            autoSubmit();
            answerInput.focus();
        }

        function autoSubmit() {
            autoSubmitWithTime(GAME_TIME);
        }

        function stopCompte() {
            if (timerCompte !== null) { clearInterval(timerCompte); timerCompte = null; }
        }

        function autoSubmitWithTime(remaining) {
            document.getElementById('timer').style.display = "flex";
            answerInput.style.display = "block";

            const timerBar = document.querySelector('.timer');
            timerBar.style.animation = 'none';
            timerBar.offsetHeight;
            timerBar.style.animation = `timerShrink ${remaining}s linear forwards`;

            /* si le serveur envoie nouvelle_image avant la fin du decompte,
               next() rappelle autoSubmit() : sans ce stop on empilait un 2e
               interval qui decrementait le meme timeleft, d'ou un chrono a
               double vitesse */
            stopCompte();
            timeleft = Math.round(remaining);
            /* le decompte n'a plus qu'un role : rendre sa copie a zero. Ce
               n'est plus lui qui decide de la fin de la manche -- c'est le
               serveur, par mancheFinie, sans quoi deux pages mal synchronisees
               n'auraient pas joue la meme partie. */
            timerCompte = setInterval(function(){
                timeleft -= 1;
                if (timeleft <= 0) {
                    stopCompte();
                    envoieReponse();
                    verrouilleChamp();
                }
            }, 1000);
        }

        function startFirstCard() {
            fetch('/api/yugiquiz/moi')
            .then(r => r.json())
            .then(data => {
                pseudo = data.pseudo;
                if (!pseudo) { window.location.href = '/yugiquiz/connexion'; return; }
                document.getElementById('pseudo').textContent = pseudo;

                socket.emit('checkScores', { roomId: ROOM_ID });

                document.getElementById('image_name').style.display = 'none';
                document.getElementById('main-content').style.display = 'flex';
                document.getElementById('loading-message').style.display = 'none';

                Promise.all([
                    fetch('/api/yugiquiz/carte/' + ROOM_ID).then(r => r.json()),
                    fetch('/api/yugiquiz/temps/' + ROOM_ID).then(r => r.json())
                ]).then(([cardData, timeData]) => {
                    jetonCourant = cardData.jeton;
                    GAME_TIME = cardData.time;
                    SCORE_TO_WIN = cardData.score_to_win;
                    manche++;
                    const m = manche;
                    prepareSuivante(cardData.jeton_suivant);
                    if (!jetonCourant) return;

                    /* arriver au milieu d'une revelation : la carte entiere,
                       et l'on attend la suivante plutot que de lancer un
                       decompte deja fini */
                    if (cardData.revele) {
                        verrouilleChamp();
                        document.getElementById('timer').style.display = "none";
                        answerInput.style.display = "none";
                        prepare(urlImage(jetonCourant) + '/pleine')
                            .then(img => { if (m === manche) poseCarte(img, true); })
                            .catch(() => {});
                        return;
                    }
                    imageDe(jetonCourant)
                        .then(img => { if (m === manche) poseCarte(img, false); })
                        .catch(() => {});
                    autoSubmitWithTime(Math.max(0, timeData.rtime));
                    answerInput.focus();
                });
            })
            .catch(() => window.location.href = '/yugiquiz/connexion');
        }

        /* Verrouiller le champ et envoyer la reponse sont deux gestes
           distincts : le decompte qui arrive a zero fait les deux, la fin de
           manche seulement le premier (la reponse est deja partie). C'est
           envoieReponse qui parle au serveur -- il n'existe plus d'evenement
           « je suis verrouille » separe, qu'on pouvait emettre sans jamais
           repondre pour faire tomber la carte au nez des autres. */
        function verrouilleChamp() {
            answerLocked = true;
            answerInput.classList.add('locked');
            answerInput.disabled = true;
            fermeSuggestions();
        }

        function unlockAnswer() {
            answerLocked = false;
            answerInput.classList.remove('locked');
            answerInput.disabled = false;
            const li = document.getElementById(`player-${pseudo}`);
            if (li) li.classList.remove('answer-locked');
        }

        const card = document.getElementById('card-rotator');
        const cardContainer = document.getElementById('card-container');

        /* Les variables du glare etaient posees sur documentElement : comme
           elles heritent, Chrome recalculait le style de TOUTE la page a chaque
           mouvement de souris, puis repeignait un degrade en mix-blend-mode sur
           une image de 70vh. On les pose sur le conteneur (l'heritage suffit
           pour .card__glare) et on ne met a jour qu'une fois par frame. */
        cardContainer.style.setProperty('--pointer-x', '50%');
        cardContainer.style.setProperty('--pointer-y', '50%');
        cardContainer.style.setProperty('--card-opacity', '0');

        let rafPointeur = null;
        let dernierEvt = null;

        function majPointeur() {
            rafPointeur = null;
            const e = dernierEvt;
            if (!e) return;

            const rect = cardContainer.getBoundingClientRect();
            const rect2 = card.getBoundingClientRect();
            const containerX = rect.left + rect.width / 2;
            const containerY = rect.top + rect.height / 2;

            const gmouseX = e.clientX - rect2.left;
            const gmouseY = e.clientY - rect2.top;

            const hauteurFenetre = window.innerHeight;
            const xAxis = (-(e.clientX/hauteurFenetre - containerX/hauteurFenetre) / 5)*500;
            const yAxis = ((e.clientY/hauteurFenetre - containerY/hauteurFenetre) / 8)*500;

            cardContainer.style.setProperty('--pointer-x', gmouseX + 'px');
            cardContainer.style.setProperty('--pointer-y', gmouseY + 'px');
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        }

        cardContainer.addEventListener('mousemove', (e) => {
            dernierEvt = e;
            if (rafPointeur === null) rafPointeur = requestAnimationFrame(majPointeur);
        });

        cardContainer.addEventListener('mouseenter', () => {
            card.style.transition = "none";
            cardContainer.style.setProperty('--card-opacity', '1');
        });

        cardContainer.addEventListener('mouseleave', () => {
            if (rafPointeur !== null) { cancelAnimationFrame(rafPointeur); rafPointeur = null; }
            dernierEvt = null;
            card.style.transition = "all 0.5s cubic-bezier(.53,-0.02,.65,2.06)";
            card.style.transform = 'rotateY(0deg) rotateX(0deg)';
            cardContainer.style.setProperty('--card-opacity', '0');
        });

        socket.on('nouvelle_image', data => {
            next(data);
        });

        function majScores(scores) {
            player_scores = scores || {};
            Object.keys(player_scores).forEach(nom => {
                const li = document.getElementById(`player-${nom}`);
                if (li) li.querySelector('.player-score').textContent = player_scores[nom];
            });
        }

        function afficheReponse(r) {
            const playerLi = document.getElementById(`player-${r.pseudo}`);
            if (!playerLi) return;

            playerLi.classList.remove('answer-locked');
            playerLi.classList.add(r.correct ? 'answer-correct' : 'answer-wrong');

            const old = playerLi.querySelector('.player-response');
            if (old) old.remove();

            const responseEl = document.createElement('span');
            responseEl.classList.add('player-response', 'visible');
            responseEl.classList.add(r.correct ? 'correct' : 'wrong');
            responseEl.textContent = r.answer ? `${r.answer} ${r.correct ? '✓' : '✗'}` : (r.correct ? '✓' : '✗');
            playerLi.appendChild(responseEl);
        }

        socket.on('updateScores', data => {
            player_scores = data.scores;
            socket.emit('checkPlayers', { roomId: ROOM_ID });
        });

        socket.on('updatePlayersList', data => {
            const playersList = document.getElementById('players');
            const scores = data.scores || {};

            data.players.forEach(player => {
                let li = document.getElementById(`player-${player}`);
                if (!li) {
                    li = document.createElement('li');
                    li.id = `player-${player}`;

                    const playerInfo = document.createElement('div');
                    playerInfo.className = 'player-info';

                    const playerName = document.createElement('span');
                    playerName.className = 'player-name';
                    playerName.textContent = player;

                    const playerScore = document.createElement('span');
                    playerScore.className = 'player-score';

                    playerInfo.appendChild(playerName);
                    playerInfo.appendChild(playerScore);
                    li.appendChild(playerInfo);
                    playersList.appendChild(li);
                }

                li.querySelector('.player-score').textContent = scores[player] ?? player_scores[player] ?? 0;
            });

            playersList.querySelectorAll('li').forEach(li => {
                const id = li.id.replace('player-', '');
                if (!data.players.includes(id)) li.remove();
            });
        });

        /* Le serveur diffusait une reponse par joueur, au fil de la manche
           -- et avec elle, pour qui regardait, de quoi deviner la bonne. Il
           n'en diffuse plus qu'une salve, a la fin, avec le nom. */
        socket.on('mancheFinie', data => reveleManche(data));

        socket.on('kicked', () => {
            window.location.href = '/yugiquiz';
        });

        socket.on('gameOver', data => {
            const msg = data.winner === pseudo
                ? `Tu as gagné avec ${data.scores[data.winner]} points !`
                : `${data.winner} a gagné avec ${data.scores[data.winner]} points !`;
            document.getElementById('gameover-msg').textContent = msg;
            ouvreOverlay('gameover-overlay');
        });

        socket.on('connect', () => {
            socket.emit('joinGameRoom', { roomId: ROOM_ID });

            setTimeout(() => {
                if (!gameReady) {
                    window.location.href = '/yugiquiz';
                }
            }, 2000);
        });

        socket.on('gameParams', data => {
            GAME_TIME = data.time;
            SCORE_TO_WIN = data.score_to_win;
            document.getElementById('info-score-to-win').textContent = `🏆 ${SCORE_TO_WIN} pts`;
            document.getElementById('info-difficulty').textContent = DIFFICULTY_LABELS[data.difficulty];

            if (!gameReady) {
                gameReady = true;
                startFirstCard();
            }
        });

        socket.on('roomNotFound', () => {
            window.location.href = '/yugiquiz';
        });

        socket.on('playerLocked', data => {
            const li = document.getElementById(`player-${data.pseudo}`);
            if (li) li.classList.add('answer-locked');
        });

        /* joinGameRoom est deja emis dans socket.on('connect') : le doublon
           declenchait un updatePlayersList diffuse a toute la salle pour rien */

        /* ---- Les suggestions ----

           Les noms de toutes les cartes arrivent une fois, au chargement
           (voir noms_des_cartes cote serveur), et la recherche se fait ici, a
           chaque touche. Elle se faisait au serveur, 180 ms apres la derniere
           touche, plus l'aller-retour : la fleche du bas tombait souvent sur
           une liste pas encore arrivee, et Entree envoyait le debut de nom
           qu'on avait tape. */
        const MAX_SUGGESTIONS = 20;
        let INDEX = [];          // { nom, en, fr_n, en_n }, les plus vues d'abord
        let proposees = [];      // ce que la liste montre, dans l'ordre
        let activeIndex = -1;    // la ligne surlignee, -1 : aucune

        /* La meme forme que normalize() cote serveur : sans casse, accents ni
           ponctuation, ligatures ouvertes (« Chœur » se trouve en tapant
           « choeur »). */
        const LIGATURES = { 'œ': 'oe', 'æ': 'ae', 'ø': 'o', 'ß': 'ss' };
        const norme = (t) => String(t || '').toLowerCase()
            .replace(/[œæøß]/g, (c) => LIGATURES[c])
            .normalize('NFD').replace(/\p{Mn}/gu, '')
            .replace(/[^a-z0-9]+/g, ' ').trim();

        fetch('/api/yugiquiz/noms')
            .then(r => r.ok ? r.json() : [])
            .then(noms => {
                INDEX = noms.map(([fr, en]) => ({ nom: fr, en: en, fr_n: norme(fr), en_n: norme(en) }));
                // on tapait deja : la liste rattrape ce qui est dans le champ
                if (answerInput.value && document.activeElement === answerInput) proposeSuggestions();
            })
            .catch(() => {});

        /* Les cartes dont le nom, francais ou anglais, contient tous les mots
           tapes. Le nom exact d'abord, puis ceux qui commencent par ce qu'on
           a tape, puis ceux ou chaque mot tape commence un mot, puis le
           reste ; a rang egal, les cartes les plus connues. Le serveur
           rendait les vingt-cinq premieres dans l'ordre alphabetique anglais :
           « magicien » ne montrait pas le Magicien Sombre. */
        function cherche(texte) {
            const q = norme(texte);
            if (q.length < 2) return [];
            const mots = q.split(' ');
            const debutDeMot = (s, m) => s.startsWith(m) || s.includes(' ' + m);
            const rangs = [[], [], [], []];
            for (const c of INDEX) {
                let enFrancais = true;
                const trouvee = mots.every(m => {
                    if (c.fr_n.includes(m)) return true;
                    enFrancais = false;
                    return c.en_n.includes(m);
                });
                if (!trouvee) continue;
                let rang = 3;
                if (c.fr_n === q || c.en_n === q) rang = 0;
                else if (c.fr_n.startsWith(q) || c.en_n.startsWith(q)) rang = 1;
                else if (mots.every(m => debutDeMot(c.fr_n, m) || debutDeMot(c.en_n, m))) rang = 2;
                if (rangs[rang].length < MAX_SUGGESTIONS) {
                    rangs[rang].push({ nom: c.nom, en: c.en, parEn: !enFrancais });
                }
            }
            return rangs.flat().slice(0, MAX_SUGGESTIONS);
        }

        function proposeSuggestions() {
            proposees = answerLocked ? [] : cherche(answerInput.value);
            activeIndex = -1;
            suggestionsList.replaceChildren(...proposees.map((s, i) => {
                const li = document.createElement('li');
                li.id = 'suggestion-' + i;
                li.setAttribute('role', 'option');
                li.setAttribute('aria-selected', 'false');
                li.textContent = s.nom;
                /* trouvee par son nom anglais : on le montre, sinon on ne
                   comprend pas ce que cette carte fait dans la liste */
                if (s.parEn && s.en) {
                    const en = document.createElement('span');
                    en.className = 'suggestion-en';
                    en.textContent = s.en;
                    li.appendChild(en);
                }
                li.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    choisit(i, false);
                });
                // la souris et le clavier surlignent la meme ligne
                li.addEventListener('mousemove', () => { if (activeIndex !== i) surligne(i, false); });
                return li;
            }));
            suggestionsList.scrollTop = 0;
            answerInput.setAttribute('aria-expanded', proposees.length ? 'true' : 'false');
            answerInput.removeAttribute('aria-activedescendant');
        }

        function surligne(i, defile = true) {
            activeIndex = i;
            Array.from(suggestionsList.children).forEach((li, j) => {
                li.classList.toggle('active', j === i);
                li.setAttribute('aria-selected', j === i ? 'true' : 'false');
            });
            const li = suggestionsList.children[i];
            if (!li) return;
            answerInput.setAttribute('aria-activedescendant', li.id);
            if (defile) li.scrollIntoView({ block: 'nearest' });
        }

        function fermeSuggestions() {
            proposees = [];
            activeIndex = -1;
            suggestionsList.replaceChildren();
            answerInput.setAttribute('aria-expanded', 'false');
            answerInput.removeAttribute('aria-activedescendant');
        }

        /* Met la suggestion dans le champ ; `envoie` la valide aussitot. */
        function choisit(i, envoie) {
            const s = proposees[i];
            if (!s) return;
            answerInput.value = s.nom;
            fermeSuggestions();
            if (envoie) valide();
            else answerInput.focus();
        }

        /* Rend sa copie : une fois par manche, et pas un champ vide. */
        function valide() {
            if (answerLocked || !answerInput.value.trim()) return;
            envoieReponse();
            verrouilleChamp();
        }

        answerInput.addEventListener('input', proposeSuggestions);

        /* Tout se fait au clavier :
             fleches   parcourent la liste, qui boucle d'un bout a l'autre
             Entree    envoie la ligne surlignee, sinon ce qui est tape
             Tab       complete avec la ligne surlignee (ou la premiere)
                       sans envoyer, pour relire avant de valider
             Echap     ferme la liste
           Les fleches ne faisaient rien : la ligne surlignee n'etait jamais
           deplacee, et Entree n'avait donc jamais de suggestion a prendre. */
        answerInput.addEventListener('keydown', (e) => {
            if (e.isComposing) return;
            const n = proposees.length;
            if (e.key === 'ArrowDown' && n) {
                e.preventDefault();
                surligne((activeIndex + 1) % n);
            } else if (e.key === 'ArrowUp' && n) {
                e.preventDefault();
                surligne(activeIndex <= 0 ? n - 1 : activeIndex - 1);
            } else if (e.key === 'Tab' && n && !e.shiftKey) {
                e.preventDefault();
                choisit(Math.max(activeIndex, 0), false);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (activeIndex >= 0) choisit(activeIndex, true);
                else valide();
            } else if (e.key === 'Escape' && n) {
                // la liste seulement, pas le dialogue de sortie
                e.preventDefault();
                e.stopPropagation();
                fermeSuggestions();
            }
        });

        /* body.overlay-ouvert gele les animations du decor : sinon le
           backdrop-filter du dialogue refloute tout l'ecran a chaque frame.
           Le focus reste dans le dialogue tant qu'il est ouvert (voir
           commun.js), et revient ou il etait en sortant. */
        function ouvreOverlay(id) {
            const el = document.getElementById(id);
            el.classList.add('active');
            document.body.classList.add('overlay-ouvert');
            fermeSuggestions();
            Focus.piege(el);
        }

        function fermeOverlay(id) {
            const el = document.getElementById(id);
            if (!el.classList.contains('active')) return;
            el.classList.remove('active');
            Focus.rend(el);
            if (!document.querySelector('#leave-overlay.active, #gameover-overlay.active')) {
                document.body.classList.remove('overlay-ouvert');
            }
        }

        const titreQuitter = document.getElementById('title-leave');
        titreQuitter.addEventListener('click', () => {
            ouvreOverlay('leave-overlay');
        });
        titreQuitter.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                ouvreOverlay('leave-overlay');
            }
        });

        function closeLeaveDialog() {
            fermeOverlay('leave-overlay');
        }

        function confirmLeave() {
            socket.emit('leaveRoom', { roomId: ROOM_ID });
            socket.once('roomLeft', () => {
                window.location.href = '/yugiquiz';
            });
            setTimeout(() => { window.location.href = '/yugiquiz'; }, 1000);
        }

        /* Taper sans avoir clique dans le champ : le premier caractere y
           ramene le focus, et s'y ecrit. Un clic sur la carte suffisait a le
           perdre, et la frappe partait dans le vide. Seulement quand rien
           d'autre n'a le focus : sur un bouton, Espace doit rester un clic. */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { closeLeaveDialog(); return; }
            if (document.body.classList.contains('overlay-ouvert')) return;
            if (answerLocked || answerInput.style.display === 'none') return;
            const actif = document.activeElement;
            if (actif && actif !== document.body) return;
            if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
            answerInput.focus();
        });

        document.getElementById('leave-overlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('leave-overlay')) closeLeaveDialog();
        });

        document.addEventListener('click', (e) => {
            if (!answerInput.contains(e.target) && !suggestionsList.contains(e.target)) {
                fermeSuggestions();
            }
        });

        /* Sans ca, quitter la page laissait la connexion Socket.IO se faire
           ramasser par le timeout : en transport polling la requete restait en
           l'air cote navigateur ET un thread restait pris cote serveur. */
        window.addEventListener('pagehide', () => {
            stopCompte();
            if (rafPointeur !== null) cancelAnimationFrame(rafPointeur);
            socket.disconnect();
        });
    </script>
</body>
