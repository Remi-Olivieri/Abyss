<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini-Jeux Vidéo</title>
<!-- le logo du site : voir static/commun/logo/ -->
<link rel="icon" href="/static/commun/logo/favicon.ico" sizes="32x32">
<link rel="icon" href="/static/commun/logo/abyss-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/static/commun/logo/abyss-180.png">
<link rel="manifest" href="/static/commun/manifest.webmanifest">
<!-- Cinzel, Cinzel Decorative et Raleway, servies par Abyss : ce sont les
     polices du Yu-Gi-Quiz, et cette page porte désormais le même dessin.
     Elles sont déjà sur le disque (voir static/commun/polices/polices.css,
     écrit pour supprimer la dépendance à fonts.googleapis.com) - une
     connexion de moins vers un second domaine, et du texte qui a sa forme
     sans attendre un serveur étranger.

     Les cinq familles demandées à Google jusqu'ici - Archivo, Eczar,
     Bricolage, Karla, Azeret Mono - ne servent plus : rien dans
     archive.css ne les nomme en dur, tout passe par --display, --body et
     --mono, que static/quiz/quiz.css redéfinit. -->
<link rel="stylesheet" href="/static/commun/polices/polices.css">
<!-- La feuille de l'Archive, et pas celle d'Abyss : les mini-jeux sont une
     pièce du même projet et en portent les couleurs. Jamais les deux à la
     fois - elles définissent toutes deux :root, .menu, .cta et .gate. -->
<link rel="stylesheet" href="/static/archive/archive.css">
<!-- Deux feuilles, et c'est voulu : celle de l'Archive donne la palette, la
     remise à zéro et les composants communs (.top, .wrap, .cta, .sbtn,
     .ac), celle-ci ne fait que s'y poser. Rien n'y est redéfini - ce n'est
     pas une seconde identité, c'est la même avec de quoi tenir un salon de
     jeux plutôt qu'un classeur. -->
<link rel="stylesheet" href="/static/quiz/quiz.css">
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <a class="entete-action" id="abyssBtn" href="/abyss">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span>Retour à Abyss</span>
    </a>
    <div class="qz-marque">
      <b>Mini-Jeux Vidéo</b>
      <span id="marqueSous"></span>
    </div>
    <!-- Le même bouton que sur l'Archive, jusqu'à l'identifiant : au-delà de
         1520 px il sort de la colonne par la droite, comme là-bas. Une idée
         de mini-jeu se note en sortant d'une partie, pas en retrouvant le hub
         puis la bonne ligne d'une liste déroulante.

         Caché tant que la page n'est pas ouverte : le projet est réservé à
         l'administration, et sa destination de suggestion l'est avec lui. -->
    <a class="entete-action" id="suggBtn" href="/abyss?suggestion=quiz" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.2A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>
      </svg>
      <span>Suggestion / Bug</span>
    </a>
  </div>
</header>

<main>
  <div id="corps" hidden>
    <!-- L'entrée est écrite en dur, pas construite en JavaScript : c'est la
         première chose à l'écran, elle n'a pas à attendre le serveur pour
         exister. Elle s'efface dès qu'une partie commence - un titre de
         salon au-dessus d'une jaquette à deviner ne sert plus à rien. -->
    <header class="qz-hero" id="hero">
      <div class="wrap">
        <h1>Mini-Jeux&#8202;/&#8202;Quiz</h1>
      </div>
    </header>

    <div class="wrap qz-corps">
      <div class="qz-nav" id="nav"></div>
      <div id="scene"></div>
    </div>
  </div>
</main>

<!-- Le formulaire de suggestion, ouvert sur place plutôt que sur le hub :
     voir static/commun/suggestion.js. Chargé avant le script de la page, qui le
     branche une fois la session connue - un defer arriverait après lui. -->
<!-- le battement de presence : voir static/commun/presence.js -->
<script src="/static/commun/presence.js"></script>
<!-- Les zones de texte grandissent en écrivant plutôt que de porter une
     poignée à tirer : une taille de départ, la hauteur du texte ensuite,
     et le défilement dans le champ passé un plafond. Voir
     static/commun/champs.js -- il n'y a rien à brancher, le fichier suffit. -->
<script src="/static/commun/champs.js"></script>
<script src="/static/commun/suggestion.js"></script>
<script src="/static/quiz/quiz.js"></script>
</body>
</html>
